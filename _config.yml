# 사이트 설정

# 테마 가져오기
theme: jekyll-theme-chirpy

# 웹페이지 언어 › http://www.lingoes.net/en/translator/langcode.htm
# `_data/locales` 폴더의 파일명과 동일하면 레이아웃 언어도 함께 변경된다.
# 일치하는 파일이 없으면 레이아웃 언어는 기본값인 'en'을 사용한다.
lang: en

# 시간대 변경 › https://zones.arilyn.cc
timezone: Asia/Seoul

# jekyll-seo-tag 설정 › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Heracles.jo # 사이트의 기본 제목

tagline: Notes on Technology, Innovation, and What Comes Next # 부제목으로 표시된다

description: >- # SEO 메타 태그와 Atom 피드에 사용된다
  A personal technology blog exploring IT trends, emerging technologies, developer tools, and ideas shaping the digital future.

# 사이트의 프로토콜과 호스트명을 입력한다.
# 예: 'https://username.github.io', 끝에 '/'를 붙이지 않는다.
url: "https://heracles-jo.github.io"

github:
  username: heracles-jo # GitHub 사용자명으로 변경

twitter:
  username: # Twitter 사용자명으로 변경

social:
  # 전체 이름으로 변경한다.
  # Footer에서 기본 작성자 및 저작권자로 표시된다.
  name: heracles-jo
  email: heracles.jo@gmail.com # 이메일 주소로 변경
  fediverse_handle: # Fediverse 핸들을 입력한다. 예: "@username@domain.com"
  links:
    # 첫 번째 항목은 저작권자 링크로 사용된다.
    - https://github.com/heracles-jo # GitHub 홈페이지로 변경
    # 아래 주석을 해제하면 소셜 링크를 더 추가할 수 있다.
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# 사이트 소유권 확인 설정
webmaster_verifications:
  google: # Google 확인 코드를 입력
  bing: # Bing 확인 코드를 입력
  alexa: # Alexa 확인 코드를 입력
  yandex: # Yandex 확인 코드를 입력
  baidu: # Baidu 확인 코드를 입력
  facebook: # Facebook 확인 코드를 입력

# ↑ --------------------------
# `jekyll-seo-tag` 설정 끝

# 웹 분석 설정
analytics:
  google:
    id: # Google Analytics ID를 입력
  goatcounter:
    id: # GoatCounter ID를 입력
  umami:
    id: # Umami ID를 입력
    domain: # Umami 도메인을 입력
  matomo:
    id: # Matomo ID를 입력
    domain: # Matomo 도메인을 입력
  cloudflare:
    id: # Cloudflare Web Analytics 토큰을 입력
  fathom:
    id: # Fathom Site ID를 입력

# 페이지 조회수 설정
pageviews:
  provider: # 현재는 'goatcounter'만 지원

# 선호 색상 모드 설정
#
# 비워 두면 기본적으로 시스템의 색상 모드 설정을 따른다.
# 또한 사이드바 왼쪽 하단에 다크/라이트 테마 전환 토글이 표시된다.
#
# 사용 가능한 옵션:
#
#     light — 라이트 색상 모드 사용
#     dark — 다크 색상 모드 사용
#
theme_mode: # [light | dark]

# 미디어 리소스용 CDN 엔드포인트
# 이 값이 지정되면 '/'로 시작하는 모든 미디어 리소스
# 경로(사이트 아바타, 게시물 이미지, 오디오, 비디오 파일)에 CDN URL이 추가된다.
#
# 예: 'https://cdn.com'
cdn: "https://chirpy-img.netlify.app"

# 사이드바에 표시되는 아바타. 로컬 또는 CORS 리소스를 지원한다.
avatar: "https://heracles-jo.github.io/assets/img/profile/avatar.png"

# SEO `og:image` 메타 태그에 사용되는 사이트 전체 소셜 미리보기 이미지 URL
# front matter의 `page.image`로 개별 페이지에서 덮어쓸 수 있다.
social_preview_image: # 문자열, 로컬 또는 CORS 리소스

# boolean 타입. 게시물의 TOC 표시 여부를 제어하는 전역 스위치
toc: true

comments:
  # 게시물 댓글 시스템의 전역 스위치. 비워 두면 비활성화된다.
  provider: # [disqus | utterances | giscus]
  # 각 댓글 제공자의 옵션은 다음과 같다.
  disqus:
    shortname: # Disqus shortname을 입력한다. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances 설정 › https://utteranc.es/
  utterances:
    repo: # <gh-username>/<repo>
    issue_term: # < url | pathname | title | ...>
  # Giscus 옵션 › https://giscus.app
  giscus:
    repo: # <gh-username>/<repo>
    repo_id:
    category:
    category_id:
    mapping: # 선택 사항, 기본값은 'pathname'
    strict: # 선택 사항, 기본값은 '0'
    input_position: # 선택 사항, 기본값은 'bottom'
    lang: # 선택 사항, 기본값은 `site.lang` 값
    reactions_enabled: # 선택 사항, 기본값은 `1` 값

# 자체 호스팅 정적 에셋. 선택 사항 › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, 비워 두면 false로 간주
    # Jekyll 환경을 지정한다. 비워 두면 모든 환경에 적용된다.
    # `assets.self_host.enabled`가 'true'일 때만 동작한다.
    env: # [development | production]

pwa:
  enabled: true # PWA 기능(설치 가능) 옵션
  cache:
    enabled: true # PWA 오프라인 캐시 옵션
    # 여기에 정의한 경로는 PWA 캐시에서 제외된다.
    # 일반적으로 현재 사이트와 동일한 도메인명을 공유하는
    # 다른 웹사이트의 `baseurl` 값을 지정한다.
    deny_paths:
      # - "/example"  # `<SITE_URL>/example/*`와 일치하는 URL은 PWA에 캐시되지 않는다.

paginate: 10

# 사이트의 기본 URL 경로
baseurl: ""

# ------------ 아래 옵션은 수정하지 않는 것을 권장한다 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge 옵션 › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # 여기의 빈 문자열은 프로젝트의 모든 파일을 의미한다.
      type: posts
    values:
      layout: post
      comments: true # 게시물 댓글을 활성화한다.
      toc: true # 게시물에 TOC 열을 표시한다.
      # 이 프로젝트의 다른 모든 게시물 링크 코드를 업데이트할 자신이 없다면
      # 아래 매개변수는 수정하지 않는다.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # `site.collections` 참조
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
