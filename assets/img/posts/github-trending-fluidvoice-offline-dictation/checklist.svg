<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="95" fill="#e2e8f0" font-size="42" font-weight="800" font-family="Inter, Pretendard, Arial, sans-serif">deployment checklist</text>
  <rect x="80" y="145" width="1440" height="690" rx="30" fill="#0f172a" stroke="#334155"/>
  <circle cx="140" cy="220" r="14" fill="#22c55e"/><text x="176" y="228" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">짧은 메모, 회의록, 코드 주석 등 실제 입력 시나리오를 먼저 정한다.</text><circle cx="140" cy="332" r="14" fill="#22c55e"/><text x="176" y="340" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">지원 모델별 속도/정확도 차이를 확인한다.</text><circle cx="140" cy="444" r="14" fill="#22c55e"/><text x="176" y="452" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">언어 전환과 커스텀 단축키가 자연스러운지 본다.</text><circle cx="140" cy="556" r="14" fill="#22c55e"/><text x="176" y="564" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">민감한 내용이 기기를 벗어나지 않는지 정책을 점검한다.</text><circle cx="140" cy="668" r="14" fill="#22c55e"/><text x="176" y="676" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">텍스트 교정 부담이 얼마나 줄어드는지 측정한다.</text>
</svg>