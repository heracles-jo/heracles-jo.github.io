<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">text-to-cad 형상 검증 아키텍처</title>
  <desc id="desc">자연어 요구사항에서 에이전트 계획, 정확 CAD 형상, 메시와 도면, 공정별 DFM 검증으로 이어지는 계층</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9fc"/><stop offset="1" stop-color="#e8f1fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#416f9d"/></marker></defs>
  <rect width="1400" height="780" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#132d46">AI CAD 자동화는 네 개의 계약을 통과해야 한다</text>
  <text x="70" y="110" font-family="Arial, sans-serif" font-size="20" fill="#557089">각 계층은 다른 증거와 실패 모드를 가진다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 170)"><rect width="285" height="300" rx="22" fill="#fff" stroke="#5a83aa" stroke-width="3"/><circle cx="45" cy="48" r="23" fill="#3d78ae"/><text x="45" y="56" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="82" y="56" fill="#173b5b" font-size="25" font-weight="800">요구사항 계약</text><text x="30" y="110" fill="#38566f" font-size="19"><tspan x="30" dy="0">자연어·이미지·부품 목록</tspan><tspan x="30" dy="35">단위·치수·공차·재료</tspan><tspan x="30" dy="35">하중·조립·공정 가정</tspan></text><rect x="30" y="235" width="225" height="40" rx="10" fill="#e8f2fb"/><text x="142" y="261" text-anchor="middle" fill="#24577f" font-size="17" font-weight="700">증거: 구조화된 spec</text></g>
    <path d="M355 320h70" stroke="#416f9d" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(430 170)"><rect width="285" height="300" rx="22" fill="#fff" stroke="#5a83aa" stroke-width="3"/><circle cx="45" cy="48" r="23" fill="#3d78ae"/><text x="45" y="56" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="82" y="56" fill="#173b5b" font-size="25" font-weight="800">정확 형상 계약</text><text x="30" y="110" fill="#38566f" font-size="19"><tspan x="30" dy="0">build123d · Open CASCADE</tspan><tspan x="30" dy="35">boolean·fillet·shell·sweep</tspan><tspan x="30" dy="35">valid solid·질량 특성</tspan></text><rect x="30" y="235" width="225" height="40" rx="10" fill="#e8f2fb"/><text x="142" y="261" text-anchor="middle" fill="#24577f" font-size="17" font-weight="700">증거: source + STEP</text></g>
    <path d="M725 320h70" stroke="#416f9d" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(800 170)"><rect width="285" height="300" rx="22" fill="#fff" stroke="#5a83aa" stroke-width="3"/><circle cx="45" cy="48" r="23" fill="#3d78ae"/><text x="45" y="56" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="82" y="56" fill="#173b5b" font-size="25" font-weight="800">변환 계약</text><text x="30" y="110" fill="#38566f" font-size="19"><tspan x="30" dy="0">STL·3MF·GLB·도면</tspan><tspan x="30" dy="35">tolerance·mesh version</tspan><tspan x="30" dy="35">watertight·volume deviation</tspan></text><rect x="30" y="235" width="225" height="40" rx="10" fill="#e8f2fb"/><text x="142" y="261" text-anchor="middle" fill="#24577f" font-size="17" font-weight="700">증거: topology report</text></g>
    <path d="M1095 320h70" stroke="#416f9d" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1170 170)"><rect width="180" height="300" rx="22" fill="#effcf7" stroke="#2b9d73" stroke-width="3"/><circle cx="42" cy="48" r="23" fill="#25a477"/><text x="42" y="56" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="78" y="56" fill="#175b45" font-size="23" font-weight="800">제조</text><text x="22" y="110" fill="#356c5a" font-size="18"><tspan x="22" dy="0">CNC·판금·사출</tspan><tspan x="22" dy="34">3D 프린팅</tspan><tspan x="22" dy="34">공정별 DFM</tspan><tspan x="22" dy="34">사람 승인</tspan></text><rect x="20" y="235" width="140" height="40" rx="10" fill="#d6f4e8"/><text x="90" y="261" text-anchor="middle" fill="#176347" font-size="16" font-weight="700">승인 기록</text></g>
  </g>
  <g transform="translate(80 550)" font-family="Arial, sans-serif"><rect width="1240" height="150" rx="20" fill="#122e49"/><text x="40" y="48" fill="#91dfff" font-size="21" font-weight="700">공통 provenance manifest</text><text x="40" y="87" fill="#fff" font-size="20">prompt/spec hash · source commit · cadgen/kernel version · STEP hash · tessellation tolerance · DFM ruleset · reviewer</text><text x="40" y="122" fill="#b8cada" font-size="18">뷰어의 모양이 아니라 각 단계의 입력·버전·측정값을 연결해야 오류를 되짚을 수 있다.</text></g>
</svg>
