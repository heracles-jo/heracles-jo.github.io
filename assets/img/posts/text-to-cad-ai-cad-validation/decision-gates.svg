<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">AI CAD 자동화 도입 의사결정 게이트</title>
  <desc id="desc">요구사항, 형상, 메시, 제조성, 보안 검증 결과에 따라 확대, 제한 또는 중단을 결정하는 흐름</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172f45"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#80bfe7"/></marker></defs>
  <rect width="1400" height="800" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" fill="#fff" font-family="Arial, sans-serif" font-size="35" font-weight="800">AI CAD PoC: 생성 속도가 아니라 승인 비용으로 결정한다</text>
  <text x="64" y="108" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20">각 게이트는 측정 가능한 증거가 없으면 통과하지 않는다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 170)"><rect width="220" height="150" rx="20" fill="#1c3a55" stroke="#63b2e1" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#8edaff" font-size="21" font-weight="700">GATE 1</text><text x="110" y="78" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">요구사항</text><text x="110" y="112" text-anchor="middle" fill="#c6d7e5" font-size="17">누락·임의 가정 0?</text><text x="110" y="137" text-anchor="middle" fill="#c6d7e5" font-size="17">단위·공차 명시?</text></g>
    <path d="M285 245h58" stroke="#80bfe7" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(350 170)"><rect width="220" height="150" rx="20" fill="#1c3a55" stroke="#63b2e1" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#8edaff" font-size="21" font-weight="700">GATE 2</text><text x="110" y="78" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">정확 형상</text><text x="110" y="112" text-anchor="middle" fill="#c6d7e5" font-size="17">valid solid?</text><text x="110" y="137" text-anchor="middle" fill="#c6d7e5" font-size="17">critical dimension 일치?</text></g>
    <path d="M580 245h58" stroke="#80bfe7" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(645 170)"><rect width="220" height="150" rx="20" fill="#1c3a55" stroke="#63b2e1" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#8edaff" font-size="21" font-weight="700">GATE 3</text><text x="110" y="78" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">메시 변환</text><text x="110" y="112" text-anchor="middle" fill="#c6d7e5" font-size="17">watertight?</text><text x="110" y="137" text-anchor="middle" fill="#c6d7e5" font-size="17">volume 오차 허용?</text></g>
    <path d="M875 245h58" stroke="#80bfe7" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(940 170)"><rect width="220" height="150" rx="20" fill="#1c3a55" stroke="#63b2e1" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#8edaff" font-size="21" font-weight="700">GATE 4</text><text x="110" y="78" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">제조성</text><text x="110" y="112" text-anchor="middle" fill="#c6d7e5" font-size="17">공정별 규칙?</text><text x="110" y="137" text-anchor="middle" fill="#c6d7e5" font-size="17">근거·예외 기록?</text></g>
    <path d="M1170 245h58" stroke="#80bfe7" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(1235 170)"><rect width="120" height="150" rx="20" fill="#1c3a55" stroke="#63b2e1" stroke-width="3"/><text x="60" y="42" text-anchor="middle" fill="#8edaff" font-size="19" font-weight="700">GATE 5</text><text x="60" y="78" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">보안</text><text x="60" y="111" text-anchor="middle" fill="#c6d7e5" font-size="15">digest</text><text x="60" y="135" text-anchor="middle" fill="#c6d7e5" font-size="15">egress</text></g>
  </g>
  <path d="M695 335v80" stroke="#80bfe7" stroke-width="5" marker-end="url(#a)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 455)"><rect width="360" height="210" rx="24" fill="#173a31" stroke="#35c68c" stroke-width="4"/><text x="180" y="58" text-anchor="middle" fill="#80f0c2" font-size="28" font-weight="800">확대</text><text x="35" y="105" fill="#e2fff4" font-size="19"><tspan x="35" dy="0">• 승인 총시간과 수정량 감소</tspan><tspan x="35" dy="34">• 재생성·diff·감사 가능</tspan><tspan x="35" dy="34">• 반복 부품부터 범위 확대</tspan></text></g>
    <g transform="translate(520 455)"><rect width="360" height="210" rx="24" fill="#453b1d" stroke="#e1b943" stroke-width="4"/><text x="180" y="58" text-anchor="middle" fill="#ffe18a" font-size="28" font-weight="800">제한 운영</text><text x="35" y="105" fill="#fff5d1" font-size="19"><tspan x="35" dy="0">• 초안·fixture·시각 검토만</tspan><tspan x="35" dy="34">• 최종 CAD는 사람이 재작성</tspan><tspan x="35" dy="34">• 공정·권한을 allowlist</tspan></text></g>
    <g transform="translate(960 455)"><rect width="360" height="210" rx="24" fill="#48282d" stroke="#ee6978" stroke-width="4"/><text x="180" y="58" text-anchor="middle" fill="#ff9aa6" font-size="28" font-weight="800">중단</text><text x="35" y="105" fill="#ffe4e7" font-size="19"><tspan x="35" dy="0">• critical dimension 임의 결정</tspan><tspan x="35" dy="34">• 메시 결함·규칙 근거 누락</tspan><tspan x="35" dy="34">• 승인물 재현 불가·정보 유출</tspan></text></g>
  </g>
  <text x="700" y="735" text-anchor="middle" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20">핵심 지표: 첫 모델 생성 시간 → 승인 가능한 산출물까지의 총시간</text>
</svg>
