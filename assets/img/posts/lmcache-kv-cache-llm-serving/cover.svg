<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LMCache KV Cache Layer for LLM Serving</title>
  <desc id="desc">A layered architecture diagram showing GPU, CPU, local storage and remote storage as reusable KV cache tiers for LLM inference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="220" fill="#38bdf8" opacity="0.08"/>
  <circle cx="120" cy="560" r="260" fill="#a78bfa" opacity="0.10"/>
  <text x="72" y="92" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">GitHub Trending Analysis</text>
  <text x="72" y="160" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">LMCache</text>
  <text x="72" y="216" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">LLM Serving의 병목을 KV Cache로 줄이는 방법</text>
  <text x="72" y="268" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24">GPU prefill 비용 · 장문 RAG · 에이전트형 멀티턴 워크로드</text>

  <g filter="url(#shadow)">
    <rect x="100" y="350" width="220" height="120" rx="24" fill="#111827" stroke="#22d3ee" stroke-width="3"/>
    <text x="210" y="405" text-anchor="middle" fill="#fff" font-family="Inter, Arial" font-size="30" font-weight="800">GPU</text>
    <text x="210" y="438" text-anchor="middle" fill="#93c5fd" font-family="Inter, Arial" font-size="18">active KV</text>
    <rect x="380" y="350" width="220" height="120" rx="24" fill="#111827" stroke="#60a5fa" stroke-width="3"/>
    <text x="490" y="405" text-anchor="middle" fill="#fff" font-family="Inter, Arial" font-size="30" font-weight="800">CPU DRAM</text>
    <text x="490" y="438" text-anchor="middle" fill="#93c5fd" font-family="Inter, Arial" font-size="18">hot cache</text>
    <rect x="660" y="350" width="220" height="120" rx="24" fill="#111827" stroke="#818cf8" stroke-width="3"/>
    <text x="770" y="405" text-anchor="middle" fill="#fff" font-family="Inter, Arial" font-size="30" font-weight="800">NVMe</text>
    <text x="770" y="438" text-anchor="middle" fill="#c4b5fd" font-family="Inter, Arial" font-size="18">local tier</text>
    <rect x="940" y="350" width="220" height="120" rx="24" fill="#111827" stroke="#a78bfa" stroke-width="3"/>
    <text x="1050" y="405" text-anchor="middle" fill="#fff" font-family="Inter, Arial" font-size="30" font-weight="800">Remote</text>
    <text x="1050" y="438" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Arial" font-size="18">Redis / P2P</text>
  </g>
  <path d="M320 410 H380" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M600 410 H660" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M880 410 H940" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <text x="600" y="555" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial" font-size="24">Prefill once, reuse KV cache across sessions and serving engines</text>
</svg>
