<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Omarchy Layered Architecture</title><desc id="desc">Arch base, Hyprland, Quickshell, Omarchy CLI, application defaults and update channel as one workstation baseline</desc><rect width="1100" height="620" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="800" fill="#0f172a">Omarchy as a workstation product stack</text><g font-family="Arial"><rect x="120" y="445" width="860" height="70" rx="18" fill="#0f172a"/><text x="445" y="489" fill="#fff" font-size="25" font-weight="700">Arch Linux / pacman / systemd</text><rect x="160" y="350" width="780" height="70" rx="18" fill="#1e3a8a"/><text x="420" y="394" fill="#fff" font-size="25" font-weight="700">Hyprland + Wayland Desktop</text><rect x="200" y="255" width="700" height="70" rx="18" fill="#0f766e"/><text x="410" y="299" fill="#fff" font-size="25" font-weight="700">Quickshell Bar / Menu / Hotkeys</text><rect x="240" y="160" width="620" height="70" rx="18" fill="#7c3aed"/><text x="402" y="204" fill="#fff" font-size="25" font-weight="700">Omarchy CLI / Defaults / Update</text><rect x="280" y="95" width="540" height="46" rx="14" fill="#e11d48"/><text x="390" y="126" fill="#fff" font-size="22" font-weight="700">Opinionated Application Set</text></g><g stroke="#64748b" stroke-width="4" stroke-dasharray="8 8"><path d="M550 141 V160"/><path d="M550 230 V255"/><path d="M550 325 V350"/><path d="M550 420 V445"/></g><text x="120" y="560" font-size="22" font-family="Arial" fill="#475569">The important layer is not the distro name, but defaults, commands and updates as one operational unit.</text></svg>
