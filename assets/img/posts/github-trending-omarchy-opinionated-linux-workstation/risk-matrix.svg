<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Omarchy Adoption Risk Matrix</title><desc id="desc">Four decision axes for evaluating Omarchy: personal productivity, team standardization, operational risk, and security compliance</desc><rect width="1100" height="620" fill="#ffffff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="800" fill="#111827">Four decision axes before an Omarchy PoC</text><g font-family="Arial" font-size="22"><rect x="90" y="120" width="430" height="150" rx="22" fill="#dbeafe"/><text x="125" y="166" font-weight="800" fill="#1e3a8a">Personal Productivity</text><text x="125" y="205" fill="#1f2937">Fast setup, consistent UX</text><text x="125" y="238" fill="#1f2937">But highly taste-dependent</text><rect x="580" y="120" width="430" height="150" rx="22" fill="#ccfbf1"/><text x="615" y="166" font-weight="800" fill="#0f766e">Team Standardization</text><text x="615" y="205" fill="#1f2937">Docs, CLI, update pathway</text><text x="615" y="238" fill="#1f2937">Policy layer still required</text><rect x="90" y="330" width="430" height="150" rx="22" fill="#fee2e2"/><text x="125" y="376" font-weight="800" fill="#991b1b">Operational Risk</text><text x="125" y="415" fill="#1f2937">Arch rolling release, drivers</text><text x="125" y="448" fill="#1f2937">Recovery plan must be tested</text><rect x="580" y="330" width="430" height="150" rx="22" fill="#ede9fe"/><text x="615" y="376" font-weight="800" fill="#5b21b6">Security Compliance</text><text x="615" y="415" fill="#1f2937">Package source, permissions</text><text x="615" y="448" fill="#1f2937">MDM and EDR fit checks</text></g><text x="90" y="555" font-size="22" font-family="Arial" fill="#475569">Omarchy is closer to an opinionated desktop baseline than a full enterprise management platform.</text></svg>
