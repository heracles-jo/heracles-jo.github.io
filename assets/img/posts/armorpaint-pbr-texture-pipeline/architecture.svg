<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ArmorPaint PBR 제작 아키텍처</title><desc id="desc">기하 입력, ArmorPaint 작업, 베이킹과 내보내기, 목표 엔진 검수의 데이터 흐름</desc>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">PBR 자산은 네 개의 계약을 통과한다</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(60 132)"><rect width="235" height="420" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="24" y="48" font-size="24" font-weight="700" fill="#075985">1. 기하 입력</text><text x="24" y="95" font-size="19" fill="#0f172a">OBJ · FBX · glTF</text><text x="24" y="132" font-size="19" fill="#0f172a">topology / normal</text><text x="24" y="169" font-size="19" fill="#0f172a">UV set / UDIM</text><rect x="24" y="224" width="187" height="116" rx="12" fill="white"/><text x="42" y="264" font-size="17" fill="#334155">mesh hash</text><text x="42" y="296" font-size="17" fill="#334155">UV version</text><text x="42" y="328" font-size="17" fill="#334155">source owner</text></g>
    <path d="M306 342h54" stroke="#64748b" stroke-width="4"/><path d="m351 331 15 11-15 11" fill="none" stroke="#64748b" stroke-width="4"/>
    <g transform="translate(375 112)"><rect width="290" height="460" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="24" y="48" font-size="24" font-weight="700" fill="#5b21b6">2. ArmorPaint</text><rect x="24" y="82" width="242" height="76" rx="12" fill="white"/><text x="45" y="128" font-size="19" fill="#0f172a">layers · masks</text><rect x="24" y="178" width="242" height="76" rx="12" fill="white"/><text x="45" y="224" font-size="19" fill="#0f172a">material · brush nodes</text><rect x="24" y="274" width="242" height="76" rx="12" fill="white"/><text x="45" y="320" font-size="19" fill="#0f172a">bake parameters</text><text x="24" y="403" font-size="18" fill="#5b21b6">.arm + manifest</text></g>
    <path d="M676 342h54" stroke="#64748b" stroke-width="4"/><path d="m721 331 15 11-15 11" fill="none" stroke="#64748b" stroke-width="4"/>
    <g transform="translate(745 132)"><rect width="395" height="420" rx="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="24" y="48" font-size="24" font-weight="700" fill="#115e59">3. Export → 4. Engine</text><text x="24" y="98" font-size="19" fill="#0f172a">PNG/JPEG/EXR · preset JSON</text><g transform="translate(24 135)"><rect width="105" height="72" rx="10" fill="#ef4444"/><text x="52" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">R · AO</text><rect x="118" width="105" height="72" rx="10" fill="#22c55e"/><text x="170" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">G · Rough</text><rect x="236" width="105" height="72" rx="10" fill="#3b82f6"/><text x="288" y="43" text-anchor="middle" fill="white" font-size="18" font-weight="700">B · Metal</text></g><rect x="24" y="245" width="347" height="120" rx="12" fill="white"/><text x="45" y="282" font-size="18" fill="#0f172a">✓ color-space / tangent</text><text x="45" y="316" font-size="18" fill="#0f172a">✓ seam / mipmap / compression</text><text x="45" y="350" font-size="18" fill="#0f172a">✓ pixel fixture round-trip</text></g>
  </g><path d="M1020 584C870 665 352 665 190 585" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8"/><path d="m194 570-18 18 25 5" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="600" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#92400e">회귀 발견 → manifest와 기준 자산으로 재현</text>
</svg>
