<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ArmorPaint PBR 텍스처 파이프라인</title>
  <desc id="desc">메시와 UV, 페인팅과 베이킹, 엔진 검수로 이어지는 PBR 자산 변환 과정</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="210" fill="#8b5cf6" opacity=".16"/><circle cx="120" cy="560" r="180" fill="#22d3ee" opacity=".12"/>
  <text x="76" y="112" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="25" font-weight="700">OPEN-SOURCE 3D ASSET PIPELINE</text>
  <text x="76" y="180" fill="white" font-family="Arial, sans-serif" font-size="53" font-weight="800">ArmorPaint PBR 텍스처</text>
  <text x="76" y="240" fill="white" font-family="Arial, sans-serif" font-size="53" font-weight="800">파이프라인 도입 기준</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="76" y="330" width="225" height="132" rx="18" fill="#1f2937" stroke="#64748b" stroke-width="2"/><text x="188" y="384" fill="#cbd5e1" font-size="20">MESH · UV</text><text x="188" y="424" fill="white" font-size="26" font-weight="700">입력 계약</text>
    <path d="M316 396h63" stroke="#a5b4fc" stroke-width="5"/><path d="m370 384 16 12-16 12" fill="none" stroke="#a5b4fc" stroke-width="5"/>
    <rect x="400" y="306" width="300" height="180" rx="22" fill="#6d28d9" stroke="#c4b5fd" stroke-width="3"/><text x="550" y="372" fill="#ede9fe" font-size="22">ARMORPAINT</text><text x="550" y="414" fill="white" font-size="28" font-weight="700">PAINT · BAKE</text><text x="550" y="451" fill="#ddd6fe" font-size="19">layers / nodes / masks</text>
    <path d="M715 396h63" stroke="#67e8f9" stroke-width="5"/><path d="m769 384 16 12-16 12" fill="none" stroke="#67e8f9" stroke-width="5"/>
    <rect x="800" y="330" width="324" height="132" rx="18" fill="#0f766e" stroke="#5eead4" stroke-width="2"/><text x="962" y="384" fill="#ccfbf1" font-size="20">ENGINE ROUND-TRIP</text><text x="962" y="424" fill="white" font-size="26" font-weight="700">채널 · 색 공간 검수</text>
  </g>
  <text x="76" y="556" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="23">Substance 대안보다 먼저 확인할 호환성 · GPU · 공급망 경계</text>
