<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ArmorPaint 도입 위험 체크리스트</title><desc id="desc">입력 파일, 제작 환경, 출력 자산, 배포 과정에서 확인할 보안과 운영 통제</desc>
  <rect width="1200" height="700" rx="24" fill="#0f172a"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="white">도구보다 경계를 먼저 검증한다</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="20" fill="#94a3b8">3D 복합 파일과 플러그인, AI 모델, export preset은 서로 다른 공급망이다</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(60 155)"><rect width="250" height="410" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><circle cx="40" cy="44" r="20" fill="#0284c7"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="22" font-weight="700">1</text><text x="75" y="51" fill="#e0f2fe" font-size="23" font-weight="700">입력 격리</text><text x="24" y="108" fill="white" font-size="18">□ file signature</text><text x="24" y="148" fill="white" font-size="18">□ 크기·압축 제한</text><text x="24" y="188" fill="white" font-size="18">□ 외부 경로 차단</text><text x="24" y="228" fill="white" font-size="18">□ preview worker</text><path d="M24 276h202" stroke="#475569"/><text x="24" y="322" fill="#7dd3fc" font-size="17">FBX · BLEND · PSD</text><text x="24" y="355" fill="#7dd3fc" font-size="17">SVG · ZIP · .arm</text></g>
    <g transform="translate(340 155)"><rect width="250" height="410" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/><circle cx="40" cy="44" r="20" fill="#7c3aed"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="22" font-weight="700">2</text><text x="75" y="51" fill="#ede9fe" font-size="23" font-weight="700">실행 통제</text><text x="24" y="108" fill="white" font-size="18">□ plugin allowlist</text><text x="24" y="148" fill="white" font-size="18">□ model digest</text><text x="24" y="188" fill="white" font-size="18">□ GPU/driver pin</text><text x="24" y="228" fill="white" font-size="18">□ network egress</text><path d="M24 276h202" stroke="#475569"/><text x="24" y="322" fill="#c4b5fd" font-size="17">source · weight · C plugin</text><text x="24" y="355" fill="#c4b5fd" font-size="17">각각 라이선스 확인</text></g>
    <g transform="translate(620 155)"><rect width="250" height="410" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="3"/><circle cx="40" cy="44" r="20" fill="#059669"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="22" font-weight="700">3</text><text x="75" y="51" fill="#d1fae5" font-size="23" font-weight="700">출력 검증</text><text x="24" y="108" fill="white" font-size="18">□ RGBA swizzle</text><text x="24" y="148" fill="white" font-size="18">□ sRGB / linear</text><text x="24" y="188" fill="white" font-size="18">□ normal tangent</text><text x="24" y="228" fill="white" font-size="18">□ seam / mipmap</text><path d="M24 276h202" stroke="#475569"/><text x="24" y="322" fill="#6ee7b7" font-size="17">목표 엔진에서</text><text x="24" y="355" fill="#6ee7b7" font-size="17">round-trip 승인</text></g>
    <g transform="translate(900 155)"><rect width="240" height="410" rx="18" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/><circle cx="40" cy="44" r="20" fill="#d97706"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="22" font-weight="700">4</text><text x="75" y="51" fill="#fef3c7" font-size="23" font-weight="700">배포·복구</text><text x="24" y="108" fill="white" font-size="18">□ signed binary</text><text x="24" y="148" fill="white" font-size="18">□ SBOM / build log</text><text x="24" y="188" fill="white" font-size="18">□ autosave restore</text><text x="24" y="228" fill="white" font-size="18">□ rollback package</text><path d="M24 276h192" stroke="#475569"/><text x="24" y="322" fill="#fcd34d" font-size="17">버전 교체 전</text><text x="24" y="355" fill="#fcd34d" font-size="17">기준 자산 회귀 테스트</text></g>
  </g><rect x="60" y="608" width="1080" height="50" rx="12" fill="#334155"/><text x="600" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">합격 조건: 승인되지 않은 입력·플러그인·모델 0개 + 엔진 변환 오류 0개</text>
</svg>
