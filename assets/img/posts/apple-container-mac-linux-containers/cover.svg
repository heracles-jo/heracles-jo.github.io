<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Apple container and per-container Linux VMs on Mac</title>
  <desc id="desc">A visual summary of Apple container running OCI workloads as lightweight per-container Linux virtual machines on Apple silicon Macs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="48%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="210" fill="#60a5fa" opacity="0.12"/>
  <circle cx="170" cy="540" r="260" fill="#2dd4bf" opacity="0.12"/>
  <g transform="translate(95 92)">
    <text x="0" y="0" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">GitHub Trending Analysis</text>
    <text x="0" y="72" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800">Apple container</text>
    <text x="0" y="138" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Mac 컨테이너의 새 기준</text>
    <text x="0" y="200" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="28">OCI 이미지 · Swift · Virtualization.framework · per-container VM</text>
  </g>
  <g transform="translate(650 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="280" rx="28" fill="#f8fafc" opacity="0.96"/>
    <rect x="34" y="42" width="352" height="58" rx="16" fill="#dbeafe"/>
    <text x="58" y="80" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">macOS host</text>
    <g transform="translate(44 130)">
      <rect x="0" y="0" width="96" height="92" rx="18" fill="#0f766e"/>
      <text x="22" y="54" fill="#ecfeff" font-family="Arial" font-size="22" font-weight="700">VM</text>
      <rect x="128" y="0" width="96" height="92" rx="18" fill="#2563eb"/>
      <text x="150" y="54" fill="#eff6ff" font-family="Arial" font-size="22" font-weight="700">VM</text>
      <rect x="256" y="0" width="96" height="92" rx="18" fill="#7c3aed"/>
      <text x="278" y="54" fill="#f5f3ff" font-family="Arial" font-size="22" font-weight="700">VM</text>
      <text x="10" y="126" fill="#334155" font-family="Arial" font-size="20">one Linux VM per container</text>
    </g>
  </g>
  <g transform="translate(98 505)">
    <rect width="1004" height="70" rx="22" fill="#020617" opacity="0.36"/>
    <text x="32" y="45" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">개발자 경험, 보안 격리, Docker Desktop 대체 가능성을 함께 따져봐야 할 시점</text>
  </g>
</svg>
