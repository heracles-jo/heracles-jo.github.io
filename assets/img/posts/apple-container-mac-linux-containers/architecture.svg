<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Shared VM versus per-container VM architecture</title>
  <desc id="desc">Comparison diagram showing conventional shared Linux VM container stacks and Apple's per-container VM model.</desc>
  <rect width="1100" height="560" rx="28" fill="#f8fafc"/>
  <text x="70" y="64" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Mac에서 Linux 컨테이너를 실행하는 두 가지 모델</text>
  <g transform="translate(70 110)">
    <rect width="440" height="360" rx="24" fill="#e2e8f0"/>
    <text x="32" y="48" font-family="Arial" font-size="26" font-weight="800" fill="#334155">전통적 공유 VM 모델</text>
    <rect x="50" y="86" width="340" height="205" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <text x="136" y="126" font-family="Arial" font-size="22" font-weight="700" fill="#475569">Linux VM</text>
    <g fill="#2563eb">
      <rect x="75" y="160" width="75" height="64" rx="12"/>
      <rect x="183" y="160" width="75" height="64" rx="12"/>
      <rect x="291" y="160" width="75" height="64" rx="12"/>
    </g>
    <g font-family="Arial" font-size="18" font-weight="700" fill="#eff6ff">
      <text x="91" y="199">ctr</text><text x="199" y="199">ctr</text><text x="307" y="199">ctr</text>
    </g>
    <text x="48" y="326" font-family="Arial" font-size="20" fill="#475569">장점: 성숙한 생태계, 익숙한 UX</text>
    <text x="48" y="354" font-family="Arial" font-size="20" fill="#475569">주의: 공유 VM 경계, 호스트 마운트 범위</text>
  </g>
  <g transform="translate(590 110)">
    <rect width="440" height="360" rx="24" fill="#dbeafe"/>
    <text x="32" y="48" font-family="Arial" font-size="26" font-weight="800" fill="#1e3a8a">Apple container 모델</text>
    <g>
      <rect x="46" y="95" width="92" height="115" rx="18" fill="#0f766e"/>
      <rect x="174" y="95" width="92" height="115" rx="18" fill="#2563eb"/>
      <rect x="302" y="95" width="92" height="115" rx="18" fill="#7c3aed"/>
      <rect x="68" y="128" width="48" height="42" rx="8" fill="#ecfeff" opacity="0.92"/>
      <rect x="196" y="128" width="48" height="42" rx="8" fill="#eff6ff" opacity="0.92"/>
      <rect x="324" y="128" width="48" height="42" rx="8" fill="#f5f3ff" opacity="0.92"/>
    </g>
    <text x="48" y="252" font-family="Arial" font-size="21" font-weight="700" fill="#1e40af">각 컨테이너가 경량 Linux VM으로 실행</text>
    <text x="48" y="326" font-family="Arial" font-size="20" fill="#1e3a8a">장점: 강한 격리, 필요한 데이터만 마운트</text>
    <text x="48" y="354" font-family="Arial" font-size="20" fill="#1e3a8a">주의: macOS 26·Apple silicon 의존성</text>
  </g>
</svg>
