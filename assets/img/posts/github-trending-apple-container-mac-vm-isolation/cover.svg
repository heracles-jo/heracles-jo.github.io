<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Apple container와 Mac의 경량 VM 기반 컨테이너 실행</title>
  <desc id="desc">Apple silicon Mac에서 OCI 이미지를 컨테이너별 경량 가상 머신으로 실행하는 아키텍처를 설명하는 커버 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="180" fill="#22d3ee" opacity="0.10"/>
  <circle cx="160" cy="520" r="220" fill="#a7f3d0" opacity="0.10"/>
  <text x="72" y="105" fill="#99f6e4" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="28" font-weight="700">GitHub Trending Analysis</text>
  <text x="72" y="178" fill="#ffffff" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="58" font-weight="800">Apple container</text>
  <text x="72" y="238" fill="#dbeafe" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="36" font-weight="700">Mac 컨테이너의 격리 모델을 다시 묻다</text>
  <text x="72" y="300" fill="#cbd5e1" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="24">OCI 이미지 · Apple silicon · lightweight VM per container</text>
  <g filter="url(#shadow)">
    <rect x="675" y="132" width="385" height="330" rx="28" fill="#f8fafc" opacity="0.96"/>
    <rect x="713" y="183" width="310" height="62" rx="16" fill="#0f172a"/>
    <text x="742" y="223" fill="#7dd3fc" font-family="SFMono-Regular, Menlo, monospace" font-size="22">container run nginx</text>
    <rect x="725" y="286" width="118" height="95" rx="16" fill="#ccfbf1" stroke="#14b8a6" stroke-width="3"/>
    <rect x="876" y="286" width="118" height="95" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="750" y="325" fill="#0f172a" font-family="Inter, Arial" font-size="18" font-weight="700">VM</text>
    <text x="742" y="354" fill="#334155" font-family="Inter, Arial" font-size="15">container A</text>
    <text x="901" y="325" fill="#0f172a" font-family="Inter, Arial" font-size="18" font-weight="700">VM</text>
    <text x="893" y="354" fill="#334155" font-family="Inter, Arial" font-size="15">container B</text>
    <path d="M785 276 V251 M935 276 V251" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <text x="758" y="427" fill="#0f172a" font-family="Inter, Arial" font-size="20" font-weight="700">macOS Virtualization + vmnet + XPC</text>
  </g>
  <g transform="translate(72 438)">
    <rect width="490" height="96" rx="18" fill="#0f172a" opacity="0.72"/>
    <text x="28" y="38" fill="#f8fafc" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="22" font-weight="700">오늘의 논지</text>
    <text x="28" y="70" fill="#bae6fd" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="19">Mac 개발 환경은 Docker 대체가 아니라 격리·보안·운영 경계를 재설계하는 국면에 들어섰다.</text>
  </g>
</svg>
