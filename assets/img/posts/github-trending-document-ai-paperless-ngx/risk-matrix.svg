<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Document management risk matrix</title>
  <desc id="desc">A risk matrix for self-hosted document management covering security, backup, OCR quality, licensing and scalability.</desc>
  <rect width="1200" height="760" fill="#fff7ed"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#111827">도입 리스크와 통제 항목</text>
  <text x="70" y="122" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">문서관리 시스템은 기능보다 운영 통제가 먼저 실패한다</text>
  <g transform="translate(90 175)" font-family="Arial, sans-serif">
    <rect width="1020" height="490" rx="28" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <g transform="translate(40 45)">
      <rect width="280" height="160" rx="18" fill="#fee2e2"/>
      <text x="24" y="48" font-size="25" font-weight="800" fill="#991b1b">보안 노출</text>
      <text x="24" y="88" font-size="18" fill="#7f1d1d">인터넷 직접 노출 금지</text>
      <text x="24" y="120" font-size="18" fill="#7f1d1d">VPN·SSO·강한 인증 적용</text>
    </g>
    <g transform="translate(370 45)">
      <rect width="280" height="160" rx="18" fill="#ffedd5"/>
      <text x="24" y="48" font-size="25" font-weight="800" fill="#9a3412">백업 정합성</text>
      <text x="24" y="88" font-size="18" fill="#7c2d12">DB와 파일을 함께 보존</text>
      <text x="24" y="120" font-size="18" fill="#7c2d12">복구 리허설로 검증</text>
    </g>
    <g transform="translate(700 45)">
      <rect width="280" height="160" rx="18" fill="#fef9c3"/>
      <text x="24" y="48" font-size="25" font-weight="800" fill="#854d0e">OCR 품질</text>
      <text x="24" y="88" font-size="18" fill="#713f12">언어팩·스캔 품질 표준화</text>
      <text x="24" y="120" font-size="18" fill="#713f12">검색 실패 유형 기록</text>
    </g>
    <g transform="translate(205 255)">
      <rect width="280" height="160" rx="18" fill="#dcfce7"/>
      <text x="24" y="48" font-size="25" font-weight="800" fill="#166534">라이선스·정책</text>
      <text x="24" y="88" font-size="18" fill="#14532d">GPL-3.0 사용 범위 확인</text>
      <text x="24" y="120" font-size="18" fill="#14532d">외부 OCR 전송 여부 점검</text>
    </g>
    <g transform="translate(535 255)">
      <rect width="280" height="160" rx="18" fill="#dbeafe"/>
      <text x="24" y="48" font-size="25" font-weight="800" fill="#1d4ed8">확장성</text>
      <text x="24" y="88" font-size="18" fill="#1e3a8a">PostgreSQL·스토리지 IOPS</text>
      <text x="24" y="120" font-size="18" fill="#1e3a8a">워커 수와 모니터링 조정</text>
    </g>
  </g>
</svg>
