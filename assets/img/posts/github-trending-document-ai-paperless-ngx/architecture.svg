<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Document AI architecture pipeline</title>
  <desc id="desc">A pipeline diagram showing document ingestion, OCR processing, metadata enrichment, search index, workflow automation and AI integration.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="70" y="80" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#0f172a">문서 AI 운영 파이프라인</text>
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="20" fill="#475569">paperless-ngx를 중심으로 한 수집·처리·검색·워크플로 구조</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 190)">
      <rect width="190" height="150" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="95" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#1e3a8a">수집</text>
      <text x="95" y="90" text-anchor="middle" font-size="17" fill="#1e40af">스캔 / 업로드</text>
      <text x="95" y="118" text-anchor="middle" font-size="17" fill="#1e40af">이메일 / API</text>
    </g>
    <path d="M270 265H350" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(360 190)">
      <rect width="190" height="150" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
      <text x="95" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#115e59">처리</text>
      <text x="95" y="90" text-anchor="middle" font-size="17" fill="#134e4a">OCR / PDF/A</text>
      <text x="95" y="118" text-anchor="middle" font-size="17" fill="#134e4a">원본 보존</text>
    </g>
    <path d="M560 265H640" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(650 190)">
      <rect width="190" height="150" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="95" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#92400e">의미화</text>
      <text x="95" y="90" text-anchor="middle" font-size="17" fill="#92400e">태그 / 발신자</text>
      <text x="95" y="118" text-anchor="middle" font-size="17" fill="#92400e">문서 유형</text>
    </g>
    <path d="M850 265H930" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(940 190)">
      <rect width="190" height="150" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
      <text x="95" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#5b21b6">활용</text>
      <text x="95" y="90" text-anchor="middle" font-size="17" fill="#5b21b6">검색 / 워크플로</text>
      <text x="95" y="118" text-anchor="middle" font-size="17" fill="#5b21b6">RAG 후보</text>
    </g>
    <g transform="translate(130 440)">
      <rect width="940" height="180" rx="24" fill="#0f172a"/>
      <text x="38" y="55" font-size="28" font-weight="800" fill="#e0f2fe">운영 통제면</text>
      <text x="38" y="98" font-size="20" fill="#cbd5e1">• 데이터베이스와 파일 백업을 함께 복구 검증</text>
      <text x="38" y="132" font-size="20" fill="#cbd5e1">• VPN/SSO/리버스 프록시로 민감 문서 접근 제어</text>
      <text x="520" y="98" font-size="20" fill="#cbd5e1">• OCR 실패와 예외 문서 검토 큐 운영</text>
      <text x="520" y="132" font-size="20" fill="#cbd5e1">• 외부 AI/OCR 연동 시 전송 데이터 범위 확인</text>
    </g>
  </g>
</svg>
