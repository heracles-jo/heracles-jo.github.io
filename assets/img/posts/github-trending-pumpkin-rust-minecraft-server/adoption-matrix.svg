<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Minecraft server adoption matrix</title>
  <desc id="desc">Paper, Minestom, Pumpkin을 호환성과 제어 수준 축에서 비교한 의사결정 매트릭스</desc>
  <rect width="1100" height="560" rx="28" fill="#0f172a"/>
  <text x="60" y="66" font-size="34" font-family="Arial, sans-serif" font-weight="800" fill="#f8fafc">Minecraft 서버 플랫폼 선택 매트릭스</text>
  <line x1="150" y1="450" x2="950" y2="450" stroke="#94a3b8" stroke-width="4"/>
  <line x1="150" y1="450" x2="150" y2="120" stroke="#94a3b8" stroke-width="4"/>
  <text x="420" y="510" font-size="24" font-family="Arial, sans-serif" fill="#cbd5e1">바닐라·플러그인 호환성 →</text>
  <text x="34" y="310" font-size="24" font-family="Arial, sans-serif" fill="#cbd5e1" transform="rotate(-90 34 310)">런타임 제어·재설계 수준 →</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <circle cx="780" cy="365" r="58" fill="#facc15" opacity="0.9"/>
    <text x="735" y="372" fill="#422006">Paper</text>
    <circle cx="540" cy="235" r="58" fill="#60a5fa" opacity="0.9"/>
    <text x="485" y="242" fill="#082f49">Minestom</text>
    <circle cx="355" cy="200" r="66" fill="#fb923c" opacity="0.94"/>
    <text x="305" y="207" fill="#431407">Pumpkin</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">
    <text x="670" y="285">성숙한 Java 생태계와 호환성</text>
    <text x="430" y="150">커스텀 게임 서버 프레임워크</text>
    <text x="250" y="106">Rust 기반 재구현, 성능·격리 잠재력</text>
  </g>
  <rect x="165" y="462" width="160" height="42" rx="10" fill="#1e293b"/>
  <text x="188" y="490" font-size="18" font-family="Arial, sans-serif" fill="#cbd5e1">실험/PoC</text>
  <rect x="770" y="462" width="170" height="42" rx="10" fill="#1e293b"/>
  <text x="795" y="490" font-size="18" font-family="Arial, sans-serif" fill="#cbd5e1">상용 운영</text>
</svg>
