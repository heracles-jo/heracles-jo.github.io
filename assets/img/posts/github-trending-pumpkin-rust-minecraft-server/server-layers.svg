<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Pumpkin modular server layers</title>
  <desc id="desc">Pumpkin 서버의 프로토콜, 월드, 데이터, 플러그인 API 모듈이 운영 경계로 나뉘는 구조</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  </defs>
  <rect width="1100" height="520" rx="28" fill="url(#g)"/>
  <text x="60" y="70" font-size="34" font-family="Arial, sans-serif" font-weight="800" fill="#111827">Pumpkin을 운영 관점에서 보면: 모듈형 서버 런타임</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="125" width="210" height="120" rx="20" fill="#fb923c"/>
    <text x="100" y="174" font-size="25" font-weight="700" fill="#fff7ed">Network Protocol</text>
    <text x="100" y="210" font-size="18" fill="#ffedd5">Encryption · Compression · Java/Bedrock</text>
    <rect x="320" y="125" width="210" height="120" rx="20" fill="#22c55e"/>
    <text x="348" y="174" font-size="25" font-weight="700" fill="#f0fdf4">World Runtime</text>
    <text x="348" y="210" font-size="18" fill="#dcfce7">Chunk · Entity · Save/Load</text>
    <rect x="568" y="125" width="210" height="120" rx="20" fill="#3b82f6"/>
    <text x="596" y="174" font-size="25" font-weight="700" fill="#eff6ff">Data & Codegen</text>
    <text x="596" y="210" font-size="18" fill="#dbeafe">Packet · Item · Registry</text>
    <rect x="816" y="125" width="210" height="120" rx="20" fill="#8b5cf6"/>
    <text x="844" y="174" font-size="25" font-weight="700" fill="#f5f3ff">Plugin API</text>
    <text x="844" y="210" font-size="18" fill="#ede9fe">WIT · Wasmtime · Isolation</text>
    <path d="M177 260 V330 H921 V260" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="220" y="342" width="660" height="96" rx="22" fill="#111827"/>
    <text x="270" y="384" font-size="25" font-weight="700" fill="#fff">운영 판단의 핵심</text>
    <text x="270" y="418" font-size="19" fill="#cbd5e1">바닐라 호환성, 플러그인 생태계, 지연시간, 장애 격리, 업그레이드 속도를 함께 검증해야 한다.</text>
  </g>
</svg>
