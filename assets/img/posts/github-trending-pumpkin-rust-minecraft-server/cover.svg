<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pumpkin Rust Minecraft Server Analysis</title>
  <desc id="desc">Rust 기반 Pumpkin 서버가 네트워크 프로토콜, 월드 처리, 플러그인 런타임을 모듈형으로 분리하는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#15151f"/>
      <stop offset="0.52" stop-color="#2b1f12"/>
      <stop offset="1" stop-color="#0f2b24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M0 520 C180 450 300 600 480 510 S800 410 1200 500" fill="none" stroke="#ffad33" stroke-width="6"/>
    <path d="M0 120 C220 220 380 70 600 150 S900 240 1200 130" fill="none" stroke="#39d98a" stroke-width="5"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="90" y="92" width="1020" height="446" rx="34" fill="#1f2937" opacity="0.92"/>
    <rect x="120" y="126" width="960" height="378" rx="24" fill="#111827" stroke="#374151"/>
  </g>
  <g transform="translate(155 168)">
    <text x="0" y="0" fill="#ffb86b" font-family="Arial, sans-serif" font-size="28" font-weight="700">GitHub Trending Snapshot</text>
    <text x="0" y="68" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="800">Pumpkin과 Rust 게임 서버</text>
    <text x="0" y="122" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30">Minecraft 호환 서버를 다시 설계할 때의 성능·운영·생태계 트레이드오프</text>
  </g>
  <g transform="translate(160 340)">
    <rect x="0" y="0" width="210" height="92" rx="16" fill="#f97316" opacity="0.92"/>
    <text x="24" y="38" fill="#fff7ed" font-family="Arial, sans-serif" font-size="24" font-weight="700">Rust Core</text>
    <text x="24" y="68" fill="#ffedd5" font-family="Arial, sans-serif" font-size="18">Tokio · Rayon · WASM</text>
    <path d="M220 46 H310" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="330" y="0" width="230" height="92" rx="16" fill="#16a34a" opacity="0.92"/>
    <text x="354" y="38" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="24" font-weight="700">Protocol / World</text>
    <text x="354" y="68" fill="#dcfce7" font-family="Arial, sans-serif" font-size="18">Java · Bedrock · Chunk</text>
    <path d="M570 46 H660" stroke="#94a3b8" stroke-width="4"/>
    <rect x="680" y="0" width="250" height="92" rx="16" fill="#2563eb" opacity="0.92"/>
    <text x="704" y="38" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Ops Decision</text>
    <text x="704" y="68" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18">Compatibility vs Efficiency</text>
  </g>
</svg>
