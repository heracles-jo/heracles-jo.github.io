<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Kage architecture flow</title>
  <desc id="desc">Architecture diagram showing URL discovery, headless Chrome rendering, DOM snapshot, script removal, asset localization, and offline packaging.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <style>
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}.head{fill:#0f172a}.txt{font-family:Inter,Arial,sans-serif;fill:#0f172a}.small{font-size:18}.mid{font-size:24;font-weight:700}.arrow{stroke:#2563eb;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text x="70" y="70" class="txt" font-size="34" font-weight="800">kage 동작 흐름: 실행되는 웹에서 보존 가능한 문서로</text>
  <g transform="translate(70 125)">
    <rect class="box" width="170" height="170" rx="22"/><rect class="head" width="170" height="46" rx="22"/>
    <text x="85" y="31" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#fff">1. Discover</text>
    <text x="85" y="92" text-anchor="middle" class="txt mid">URL 수집</text><text x="85" y="126" text-anchor="middle" class="txt small">sitemap/link</text>
  </g>
  <path class="arrow" d="M255 210 H330 M315 195 L335 210 L315 225"/>
  <g transform="translate(350 125)">
    <rect class="box" width="190" height="170" rx="22"/><rect class="head" width="190" height="46" rx="22"/>
    <text x="95" y="31" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#fff">2. Render</text>
    <text x="95" y="92" text-anchor="middle" class="txt mid">Headless Chrome</text><text x="95" y="126" text-anchor="middle" class="txt small">동적 페이지 안정화</text>
  </g>
  <path class="arrow" d="M560 210 H635 M620 195 L640 210 L620 225"/>
  <g transform="translate(660 125)">
    <rect class="box" width="190" height="170" rx="22"/><rect class="head" width="190" height="46" rx="22"/>
    <text x="95" y="31" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#fff">3. Freeze</text>
    <text x="95" y="92" text-anchor="middle" class="txt mid">DOM 스냅샷</text><text x="95" y="126" text-anchor="middle" class="txt small">Script 제거</text>
  </g>
  <path class="arrow" d="M870 210 H945 M930 195 L950 210 L930 225"/>
  <g transform="translate(970 125)">
    <rect class="box" width="170" height="170" rx="22"/><rect class="head" width="170" height="46" rx="22"/>
    <text x="85" y="31" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#fff">4. Package</text>
    <text x="85" y="92" text-anchor="middle" class="txt mid">HTML/ZIM</text><text x="85" y="126" text-anchor="middle" class="txt small">오프라인 배포</text>
  </g>
  <rect x="160" y="375" width="880" height="70" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="600" y="419" text-anchor="middle" class="txt" font-size="23" font-weight="700">핵심 판단 기준: 충실도보다 실행 코드 제거와 장기 재현성을 우선할 것인가?</text>
</svg>
