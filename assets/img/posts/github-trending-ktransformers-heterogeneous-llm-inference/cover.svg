<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">KTransformers heterogeneous LLM inference</title>
  <desc id="desc">CPU와 GPU 메모리 계층을 나누어 대형 MoE 모델 추론을 운영하는 구조를 표현한 커버 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="95" r="210" fill="#22d3ee" opacity="0.13"/>
  <circle cx="150" cy="570" r="260" fill="#a78bfa" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="92" y="76" width="1016" height="478" rx="34" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.28"/>
  </g>
  <text x="132" y="150" fill="#67e8f9" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="28" font-weight="700">GitHub Trending Analysis</text>
  <text x="132" y="218" fill="#f8fafc" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="58" font-weight="800">KTransformers</text>
  <text x="132" y="282" fill="#e2e8f0" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="36" font-weight="650">이기종 LLM 추론 운영의 부상</text>
  <text x="132" y="337" fill="#cbd5e1" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="24">GPU만 늘리는 방식에서 CPU·RAM·GPU를 함께 설계하는 MoE 서빙으로</text>
  <g transform="translate(150 390)">
    <rect x="0" y="0" width="220" height="82" rx="18" fill="#0ea5e9" opacity="0.18" stroke="#7dd3fc"/>
    <text x="28" y="35" fill="#e0f2fe" font-family="monospace" font-size="22" font-weight="700">GPU VRAM</text>
    <text x="28" y="62" fill="#bae6fd" font-family="monospace" font-size="16">attention / hot experts</text>
    <rect x="310" y="0" width="220" height="82" rx="18" fill="#14b8a6" opacity="0.18" stroke="#5eead4"/>
    <text x="338" y="35" fill="#ccfbf1" font-family="monospace" font-size="22" font-weight="700">CPU Kernels</text>
    <text x="338" y="62" fill="#99f6e4" font-family="monospace" font-size="16">AMX / AVX512 / AVX2</text>
    <rect x="620" y="0" width="220" height="82" rx="18" fill="#8b5cf6" opacity="0.18" stroke="#c4b5fd"/>
    <text x="648" y="35" fill="#ede9fe" font-family="monospace" font-size="22" font-weight="700">System RAM</text>
    <text x="648" y="62" fill="#ddd6fe" font-family="monospace" font-size="16">cold MoE experts</text>
    <path d="M226 42H300" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
    <path d="M536 42H610" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
  </g>
</svg>
