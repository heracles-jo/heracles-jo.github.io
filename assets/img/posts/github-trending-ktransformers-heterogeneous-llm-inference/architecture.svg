<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">KTransformers architecture map</title>
  <desc id="desc">KTransformers가 SGLang, KT-Kernel, CPU 최적화 커널, GPU 메모리, OpenAI 호환 API 사이에서 동작하는 구조</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1100" height="620" rx="28" fill="#0f172a"/>
  <text x="50" y="70" fill="#f8fafc" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="34" font-weight="800">KTransformers 이기종 추론 경로</text>
  <text x="50" y="108" fill="#cbd5e1" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="18">OpenAI 호환 요청을 SGLang-KT와 KT-Kernel이 받아 CPU/GPU 전문가 배치를 조정한다</text>
  <g font-family="Inter, Apple SD Gothic Neo, Arial">
    <rect x="65" y="180" width="205" height="100" rx="18" fill="url(#panel)"/>
    <text x="92" y="222" fill="#0f172a" font-size="22" font-weight="800">Client / Agent</text>
    <text x="92" y="252" fill="#475569" font-size="16">chat, tool call, RAG</text>
    <rect x="360" y="160" width="250" height="140" rx="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="395" y="205" fill="#0f172a" font-size="23" font-weight="800">SGLang-KT Server</text>
    <text x="395" y="238" fill="#475569" font-size="16">batching · parser · API</text>
    <text x="395" y="266" fill="#475569" font-size="16">OpenAI-compatible endpoint</text>
    <rect x="710" y="150" width="300" height="160" rx="20" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
    <text x="746" y="196" fill="#0f172a" font-size="23" font-weight="800">KT-Kernel Scheduler</text>
    <text x="746" y="230" fill="#475569" font-size="16">expert mask · placement</text>
    <text x="746" y="258" fill="#475569" font-size="16">precision: BF16 / FP8 / INT4</text>
    <rect x="150" y="400" width="250" height="125" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="186" y="446" fill="#0f172a" font-size="23" font-weight="800">GPU</text>
    <text x="186" y="478" fill="#475569" font-size="16">attention, dense layers</text>
    <text x="186" y="506" fill="#475569" font-size="16">hot experts, CUDA/Triton</text>
    <rect x="500" y="400" width="250" height="125" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="536" y="446" fill="#0f172a" font-size="23" font-weight="800">CPU</text>
    <text x="536" y="478" fill="#475569" font-size="16">AMX · AVX512 · AVX2</text>
    <text x="536" y="506" fill="#475569" font-size="16">MoE expert kernels</text>
    <rect x="830" y="400" width="190" height="125" rx="20" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <text x="866" y="446" fill="#0f172a" font-size="23" font-weight="800">RAM</text>
    <text x="866" y="478" fill="#475569" font-size="16">cold weights</text>
    <text x="866" y="506" fill="#475569" font-size="16">NUMA locality</text>
  </g>
  <path d="M270 230 H350" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M610 230 H700" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M835 310 C800 360 720 380 650 400" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M790 310 C690 360 500 365 345 400" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M920 310 V392" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
