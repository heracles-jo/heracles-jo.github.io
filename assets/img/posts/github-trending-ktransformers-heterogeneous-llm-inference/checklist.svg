<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">LLM inference adoption checklist</title>
  <desc id="desc">KTransformers 기반 대형 MoE 추론 PoC에서 확인해야 할 비용, 성능, 보안, 운영 항목 체크리스트</desc>
  <rect width="1100" height="520" rx="30" fill="#f8fafc"/>
  <text x="55" y="72" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="34" font-weight="800" fill="#0f172a">PoC 체크리스트: GPU 부족을 구조로 해결할 수 있는가</text>
  <g font-family="Inter, Apple SD Gothic Neo, Arial" font-size="19">
    <rect x="60" y="125" width="300" height="310" rx="22" fill="#e0f2fe"/>
    <text x="92" y="172" font-size="25" font-weight="800" fill="#075985">성능</text>
    <text x="92" y="218" fill="#0f172a">☑ 토큰/초와 p95 지연</text>
    <text x="92" y="258" fill="#0f172a">☑ prefill/decode 분리 측정</text>
    <text x="92" y="298" fill="#0f172a">☑ 동시성별 VRAM·RAM 사용량</text>
    <text x="92" y="338" fill="#0f172a">☑ 모델별 expert hit pattern</text>
    <rect x="400" y="125" width="300" height="310" rx="22" fill="#dcfce7"/>
    <text x="432" y="172" font-size="25" font-weight="800" fill="#166534">운영</text>
    <text x="432" y="218" fill="#0f172a">☑ 커널·드라이버 버전 고정</text>
    <text x="432" y="258" fill="#0f172a">☑ NUMA·CPU affinity 문서화</text>
    <text x="432" y="298" fill="#0f172a">☑ 롤백 가능한 모델 배포</text>
    <text x="432" y="338" fill="#0f172a">☑ 장애 시 vLLM/SGLang 대체 경로</text>
    <rect x="740" y="125" width="300" height="310" rx="22" fill="#fee2e2"/>
    <text x="772" y="172" font-size="25" font-weight="800" fill="#991b1b">보안·거버넌스</text>
    <text x="772" y="218" fill="#0f172a">☑ API 바인딩과 인증</text>
    <text x="772" y="258" fill="#0f172a">☑ 모델 라이선스·데이터 경계</text>
    <text x="772" y="298" fill="#0f172a">☑ 취약점·이슈 모니터링</text>
    <text x="772" y="338" fill="#0f172a">☑ 로그에 프롬프트 노출 방지</text>
  </g>
  <text x="60" y="480" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="18" fill="#475569">KTransformers는 만능 비용 절감 도구가 아니라 하드웨어 제약을 명시적으로 다루는 추론 설계 옵션이다.</text>
</svg>
