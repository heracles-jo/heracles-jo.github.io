<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">XERJ AI 에이전트 검색 엔진</title>
  <desc id="desc">파일을 반복해서 읽는 에이전트를 로컬 색인과 하이브리드 검색으로 전환할 때의 운영 기준</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset="1" stop-color="#182949"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55d6be"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="210" fill="#355da4" opacity=".2"/><circle cx="90" cy="590" r="210" fill="#168b79" opacity=".16"/>
  <g opacity=".11" stroke="#b4d8ff"><path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/><path d="M120 0V630M320 0V630M520 0V630M720 0V630M920 0V630M1120 0V630"/></g>
  <g transform="translate(770 125)" filter="url(#shadow)">
    <rect width="330" height="355" rx="38" fill="#0c1d33" stroke="#63cfc5" stroke-width="3"/>
    <g fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round">
      <circle cx="135" cy="135" r="73"/><path d="M188 188L267 267"/>
    </g>
    <g fill="#9ec7ff"><rect x="65" y="285" width="200" height="13" rx="6"/><rect x="88" y="316" width="154" height="13" rx="6" opacity=".65"/></g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="80" y="117" fill="#59dec5" font-size="24" font-weight="700" letter-spacing="3">LOCAL RETRIEVAL PLANE</text>
    <text x="78" y="205" fill="#fff" font-size="70" font-weight="800">XERJ</text>
    <text x="80" y="282" fill="#e0edff" font-size="43" font-weight="750">에이전트 검색 엔진</text>
