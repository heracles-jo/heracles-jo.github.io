      <rect x="168" width="140" height="54" rx="27" fill="#183653" stroke="#6ea8ff"/><text x="238" y="35" text-anchor="middle" fill="#d5e6ff" font-size="20" font-weight="700">HYBRID</text>
      <rect x="326" width="184" height="54" rx="27" fill="#453326" stroke="#ffb66f"/><text x="418" y="35" text-anchor="middle" fill="#ffe0bc" font-size="20" font-weight="700">TRUST BOUNDARY</text>
    </g>
