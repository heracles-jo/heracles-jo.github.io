<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터 사용 에이전트 평가 루프</title>
  <desc id="desc">기준선 설정, 반복 실행, 최종 상태 검증, 실패 분류, 개선과 재시험으로 이어지는 평가 흐름</desc>
  <rect width="1200" height="720" rx="28" fill="#08111f"/>
  <text x="60" y="72" fill="#f8fafc" font-size="34" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-weight="800">성공률을 운영 판단으로 바꾸는 평가 루프</text>
  <text x="60" y="110" fill="#94a3b8" font-size="20" font-family="sans-serif">점수만 보지 않고 환경·모델·평가기 실패를 분류한다</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker></defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <circle cx="205" cy="255" r="102" fill="#0c4a6e" stroke="#38bdf8" stroke-width="4"/>
    <text x="205" y="238" text-anchor="middle" fill="#e0f2fe" font-size="24" font-weight="800">1. 기준선</text><text x="205" y="275" text-anchor="middle" fill="#bae6fd" font-size="18">task·image 고정</text><text x="205" y="303" text-anchor="middle" fill="#bae6fd" font-size="18">oracle 검증</text>
    <circle cx="600" cy="210" r="102" fill="#4c1d95" stroke="#a78bfa" stroke-width="4"/>
    <text x="600" y="193" text-anchor="middle" fill="#f3e8ff" font-size="24" font-weight="800">2. 반복 실행</text><text x="600" y="230" text-anchor="middle" fill="#ddd6fe" font-size="18">variant·OS</text><text x="600" y="258" text-anchor="middle" fill="#ddd6fe" font-size="18">동일 조건 비교</text>
    <circle cx="995" cy="255" r="102" fill="#14532d" stroke="#4ade80" stroke-width="4"/>
    <text x="995" y="238" text-anchor="middle" fill="#dcfce7" font-size="24" font-weight="800">3. 결과 판정</text><text x="995" y="275" text-anchor="middle" fill="#bbf7d0" font-size="18">final state</text><text x="995" y="303" text-anchor="middle" fill="#bbf7d0" font-size="18">reward·cost</text>
    <circle cx="800" cy="535" r="112" fill="#7c2d12" stroke="#fb923c" stroke-width="4"/>
    <text x="800" y="505" text-anchor="middle" fill="#fff7ed" font-size="24" font-weight="800">4. 실패 분류</text><text x="800" y="542" text-anchor="middle" fill="#fed7aa" font-size="18">인지·행동·상태</text><text x="800" y="570" text-anchor="middle" fill="#fed7aa" font-size="18">환경·평가기</text>
    <circle cx="400" cy="535" r="112" fill="#713f12" stroke="#facc15" stroke-width="4"/>
    <text x="400" y="505" text-anchor="middle" fill="#fefce8" font-size="24" font-weight="800">5. 제한된 개선</text><text x="400" y="542" text-anchor="middle" fill="#fef08a" font-size="18">한 계층만 변경</text><text x="400" y="570" text-anchor="middle" fill="#fef08a" font-size="18">회귀 태스크 추가</text>
  </g>
  <g stroke="#64748b" stroke-width="6" fill="none" marker-end="url(#arrow)" stroke-linecap="round">
    <path d="M310 230C390 195 445 190 490 198"/>
    <path d="M710 198C785 190 855 205 890 230"/>
    <path d="M965 360C940 425 900 470 872 486"/>
    <path d="M685 560C625 585 570 585 515 560"/>
    <path d="M320 455C260 410 225 365 213 360"/>
  </g>
  <rect x="70" y="650" width="1060" height="42" rx="12" fill="#172033"/>
  <text x="600" y="678" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="sans-serif">중단 조건: 환경 실패가 모델 실패와 분리되지 않거나, 비용 증가를 결과 품질로 설명하지 못할 때</text>
</svg>
