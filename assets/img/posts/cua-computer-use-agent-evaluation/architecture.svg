<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cua 컴퓨터 사용 에이전트 평가 아키텍처</title>
  <desc id="desc">태스크와 변형, 에이전트 어댑터, 격리 데스크톱, 평가기와 증거 저장소의 계층 구조</desc>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="70" fill="#0f172a" font-size="34" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-weight="800">컴퓨터 사용 에이전트 평가 아키텍처</text>
  <text x="60" y="108" fill="#475569" font-size="20" font-family="sans-serif">모델 성능과 실행 환경·평가기 실패를 분리한다</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <rect x="55" y="165" width="245" height="180" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="178" y="210" text-anchor="middle" fill="#075985" font-size="25" font-weight="800">태스크 계층</text>
    <text x="178" y="252" text-anchor="middle" fill="#0f172a" font-size="19">prompt · setup</text>
    <text x="178" y="285" text-anchor="middle" fill="#0f172a" font-size="19">variant · oracle</text>
    <text x="178" y="318" text-anchor="middle" fill="#0f172a" font-size="19">평가 조건</text>

    <rect x="350" y="165" width="245" height="180" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="473" y="210" text-anchor="middle" fill="#5b21b6" font-size="25" font-weight="800">행동 번역</text>
    <text x="473" y="252" text-anchor="middle" fill="#0f172a" font-size="19">agent adapter</text>
    <text x="473" y="285" text-anchor="middle" fill="#0f172a" font-size="19">Cua Driver</text>
    <text x="473" y="318" text-anchor="middle" fill="#0f172a" font-size="19">click · type · scroll</text>

    <rect x="645" y="165" width="245" height="180" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="768" y="210" text-anchor="middle" fill="#166534" font-size="25" font-weight="800">컴퓨터 계층</text>
    <text x="768" y="252" text-anchor="middle" fill="#0f172a" font-size="19">simulated · VM</text>
    <text x="768" y="285" text-anchor="middle" fill="#0f172a" font-size="19">local sandbox · Fleet</text>
    <text x="768" y="318" text-anchor="middle" fill="#0f172a" font-size="19">고정 image digest</text>

    <rect x="940" y="165" width="205" height="180" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="1043" y="210" text-anchor="middle" fill="#9a3412" font-size="25" font-weight="800">판정 계층</text>
    <text x="1043" y="252" text-anchor="middle" fill="#0f172a" font-size="19">final state</text>
    <text x="1043" y="285" text-anchor="middle" fill="#0f172a" font-size="19">evaluator</text>
    <text x="1043" y="318" text-anchor="middle" fill="#0f172a" font-size="19">reward components</text>
  </g>
  <g stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M305 255h35"/><path d="M330 243l14 12-14 12"/>
    <path d="M600 255h35"/><path d="M625 243l14 12-14 12"/>
    <path d="M895 255h35"/><path d="M920 243l14 12-14 12"/>
  </g>
  <rect x="110" y="430" width="980" height="205" rx="24" fill="#0f172a"/>
  <text x="600" y="476" text-anchor="middle" fill="#f8fafc" font-size="27" font-family="sans-serif" font-weight="800">증거와 비교 기준</text>
  <g font-family="sans-serif" font-size="20">
    <rect x="150" y="515" width="190" height="75" rx="16" fill="#1e293b" stroke="#38bdf8"/><text x="245" y="560" text-anchor="middle" fill="#bae6fd">trajectory</text>
    <rect x="385" y="515" width="190" height="75" rx="16" fill="#1e293b" stroke="#a78bfa"/><text x="480" y="548" text-anchor="middle" fill="#ddd6fe">task·image</text><text x="480" y="574" text-anchor="middle" fill="#ddd6fe">version</text>
    <rect x="620" y="515" width="190" height="75" rx="16" fill="#1e293b" stroke="#4ade80"/><text x="715" y="548" text-anchor="middle" fill="#bbf7d0">time·action</text><text x="715" y="574" text-anchor="middle" fill="#bbf7d0">token·cost</text>
    <rect x="855" y="515" width="190" height="75" rx="16" fill="#1e293b" stroke="#fb923c"/><text x="950" y="548" text-anchor="middle" fill="#fed7aa">model·env·eval</text><text x="950" y="574" text-anchor="middle" fill="#fed7aa">failure class</text>
  </g>
  <text x="600" y="680" text-anchor="middle" fill="#475569" font-size="19" font-family="sans-serif">같은 태스크와 환경에서 모델을 비교하고, 실패 원인을 독립 계층으로 되돌린다</text>
</svg>
