<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터 사용 에이전트 평가</title>
  <desc id="desc">격리 데스크톱에서 에이전트의 행동을 기록하고 평가하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#173a5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="150" fill="#38bdf8" opacity=".1"/>
  <circle cx="80" cy="570" r="180" fill="#22c55e" opacity=".08"/>
  <text x="70" y="105" fill="#7dd3fc" font-size="28" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-weight="700">Cua · Computer-Use Agent Evaluation</text>
  <text x="70" y="178" fill="#f8fafc" font-size="52" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-weight="800">컴퓨터 사용 에이전트 평가</text>
  <text x="70" y="232" fill="#cbd5e1" font-size="27" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">클릭 데모가 아니라 재현 가능한 업무 결과를 검증하는 법</text>
  <g filter="url(#shadow)">
    <rect x="70" y="310" width="250" height="150" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="195" y="365" text-anchor="middle" fill="#7dd3fc" font-size="24" font-family="sans-serif" font-weight="700">TASK</text>
    <text x="195" y="405" text-anchor="middle" fill="#e2e8f0" font-size="21" font-family="sans-serif">setup · variant</text>
    <text x="195" y="435" text-anchor="middle" fill="#e2e8f0" font-size="21" font-family="sans-serif">success criteria</text>
    <rect x="475" y="280" width="250" height="210" rx="22" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
    <rect x="510" y="315" width="180" height="110" rx="10" fill="#1e293b" stroke="#64748b"/>
    <circle cx="535" cy="340" r="6" fill="#f87171"/><circle cx="557" cy="340" r="6" fill="#fbbf24"/><circle cx="579" cy="340" r="6" fill="#4ade80"/>
    <path d="M545 385h95M545 405h65" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <text x="600" y="464" text-anchor="middle" fill="#c4b5fd" font-size="23" font-family="sans-serif" font-weight="700">ISOLATED DESKTOP</text>
    <rect x="880" y="310" width="250" height="150" rx="22" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
    <text x="1005" y="365" text-anchor="middle" fill="#86efac" font-size="24" font-family="sans-serif" font-weight="700">EVALUATE</text>
    <text x="1005" y="405" text-anchor="middle" fill="#e2e8f0" font-size="21" font-family="sans-serif">final state · reward</text>
    <text x="1005" y="435" text-anchor="middle" fill="#e2e8f0" font-size="21" font-family="sans-serif">trajectory · cost</text>
  </g>
  <path d="M325 385H450" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/><path d="M435 370l20 15-20 15" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M730 385H855" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/><path d="M840 370l20 15-20 15" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="560" fill="#94a3b8" font-size="22" font-family="sans-serif">Repeatability · Security boundary · Failure diagnosis · PoC metrics</text>
