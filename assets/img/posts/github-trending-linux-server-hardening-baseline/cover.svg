<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Linux server hardening baseline from GitHub Trending</title>
  <desc id="desc">A structured Linux server hardening baseline connecting SSH, patching, firewall, audit, logging, and compliance controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#93c5fd" stroke-width="2">
    <path d="M90 120h1020M90 230h1020M90 340h1020M90 450h1020M90 560h1020"/>
    <path d="M170 70v500M370 70v500M570 70v500M770 70v500M970 70v500"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="145" y="125" width="910" height="380" rx="28" fill="#020617" opacity="0.82" stroke="#38bdf8" stroke-opacity="0.45"/>
    <rect x="190" y="180" width="230" height="90" rx="18" fill="#0f766e"/>
    <rect x="485" y="180" width="230" height="90" rx="18" fill="#1d4ed8"/>
    <rect x="780" y="180" width="230" height="90" rx="18" fill="#7c3aed"/>
    <rect x="190" y="335" width="230" height="90" rx="18" fill="#0369a1"/>
    <rect x="485" y="335" width="230" height="90" rx="18" fill="#15803d"/>
    <rect x="780" y="335" width="230" height="90" rx="18" fill="#be123c"/>
    <g fill="#e5f3ff" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" text-anchor="middle">
      <text x="305" y="218" font-size="27" font-weight="700">SSH</text>
      <text x="305" y="248" font-size="17">keys · MFA · policy</text>
      <text x="600" y="218" font-size="27" font-weight="700">Patch</text>
      <text x="600" y="248" font-size="17">updates · inventory</text>
      <text x="895" y="218" font-size="27" font-weight="700">Firewall</text>
      <text x="895" y="248" font-size="17">UFW · fail2ban</text>
      <text x="305" y="373" font-size="27" font-weight="700">Audit</text>
      <text x="305" y="403" font-size="17">Lynis · OpenSCAP</text>
      <text x="600" y="373" font-size="27" font-weight="700">Logging</text>
      <text x="600" y="403" font-size="17">AIDE · SIEM</text>
      <text x="895" y="373" font-size="27" font-weight="700">Risk</text>
      <text x="895" y="403" font-size="17">change · rollback</text>
    </g>
    <g stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.85">
