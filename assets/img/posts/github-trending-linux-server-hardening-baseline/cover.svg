  <text x="80" y="78" fill="#dbeafe" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="31" font-weight="800">GitHub Trending: Linux Server Hardening</text>
  <text x="80" y="585" fill="#bfdbfe" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="22">From checklist knowledge to an auditable security operations baseline</text>
