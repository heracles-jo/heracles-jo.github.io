<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">scriptc 컴파일 아키텍처</title>
  <desc id="desc">TypeScript frontend, typed IR, LLVM과 C backend, 정적 runtime과 dynamic island의 경계를 보여주는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#67e8f9"/></marker></defs>
  <rect width="1200" height="780" rx="28" fill="#071321"/>
  <text x="58" y="66" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="36" font-weight="850">scriptc는 정적 의미와 동적 runtime의 경계를 분리한다</text>
  <g font-family="system-ui,sans-serif">
    <rect x="55" y="125" width="210" height="120" rx="22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/>
    <text x="160" y="171" text-anchor="middle" fill="#e0f2fe" font-size="26" font-weight="800">TypeScript</text><text x="160" y="207" text-anchor="middle" fill="#bae6fd" font-size="19">source + tsconfig</text>
    <path d="M265 185h66" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
    <rect x="341" y="105" width="225" height="160" rx="22" fill="#13334b" stroke="#22d3ee" stroke-width="3"/>
    <text x="454" y="153" text-anchor="middle" fill="#cffafe" font-size="25" font-weight="800">tsc frontend</text><text x="454" y="191" text-anchor="middle" fill="#e2e8f0" font-size="19">parse · typecheck</text><text x="454" y="222" text-anchor="middle" fill="#e2e8f0" font-size="19">narrowing · lowering</text>
    <path d="M566 185h66" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
    <rect x="642" y="105" width="210" height="160" rx="22" fill="#312e81" stroke="#818cf8" stroke-width="3"/>
    <text x="747" y="153" text-anchor="middle" fill="#e0e7ff" font-size="25" font-weight="800">Typed IR</text><text x="747" y="191" text-anchor="middle" fill="#e2e8f0" font-size="19">concrete types</text><text x="747" y="222" text-anchor="middle" fill="#e2e8f0" font-size="19">validated boundary</text>
    <path d="M852 185h66" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>
    <rect x="928" y="105" width="215" height="160" rx="22" fill="#4c1d71" stroke="#c084fc" stroke-width="3"/>
    <text x="1036" y="153" text-anchor="middle" fill="#f3e8ff" font-size="25" font-weight="800">Backends</text><text x="1036" y="191" text-anchor="middle" fill="#e2e8f0" font-size="19">LLVM IR · C</text><text x="1036" y="222" text-anchor="middle" fill="#e2e8f0" font-size="19">asm · object</text>

    <path d="M1036 265v80" stroke="#d8b4fe" stroke-width="5" marker-end="url(#a)"/>
    <rect x="815" y="360" width="328" height="150" rx="24" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="979" y="405" text-anchor="middle" fill="#dbeafe" font-size="26" font-weight="800">Link plan</text><text x="979" y="442" text-anchor="middle" fill="#e2e8f0" font-size="19">필요한 runtime object만 선택</text><text x="979" y="474" text-anchor="middle" fill="#94a3b8" font-size="18">platform linker · SDK/sysroot</text>
    <path d="M979 510v72" stroke="#60a5fa" stroke-width="5" marker-end="url(#a)"/>
    <rect x="815" y="596" width="328" height="112" rx="24" fill="#103b32" stroke="#4ade80" stroke-width="4"/>
    <text x="979" y="644" text-anchor="middle" fill="#dcfce7" font-size="27" font-weight="850">Native executable / WASI</text><text x="979" y="677" text-anchor="middle" fill="#bbf7d0" font-size="19">정적 tier에는 JS engine 없음</text>

    <rect x="55" y="350" width="650" height="358" rx="28" fill="#101c2d" stroke="#475569" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="86" y="397" fill="#f8fafc" font-size="27" font-weight="800">정적 경계 밖의 코드</text>
    <rect x="86" y="435" width="250" height="110" rx="20" fill="#3f1d36" stroke="#fb7185" stroke-width="3"/>
    <text x="211" y="479" text-anchor="middle" fill="#fecdd3" font-size="24" font-weight="800">명시적 진단</text><text x="211" y="515" text-anchor="middle" fill="#e2e8f0" font-size="18">SC code · rewrite hint</text>
    <text x="366" y="495" fill="#94a3b8" font-size="25" font-weight="800">또는</text>
    <rect x="440" y="435" width="230" height="110" rx="20" fill="#49311a" stroke="#f59e0b" stroke-width="3"/>
    <text x="555" y="479" text-anchor="middle" fill="#fde68a" font-size="24" font-weight="800">--dynamic</text><text x="555" y="515" text-anchor="middle" fill="#e2e8f0" font-size="18">quickjs-ng island</text>
    <path d="M555 545v72" stroke="#fbbf24" stroke-width="5" marker-end="url(#a)"/>
    <rect x="376" y="628" width="294" height="55" rx="18" fill="#2b2538" stroke="#a78bfa" stroke-width="2"/>
    <text x="523" y="663" text-anchor="middle" fill="#ddd6fe" font-size="19" font-weight="700">경계 값은 runtime validation</text>
    <text x="85" y="590" fill="#94a3b8" font-size="19">coverage 결과가 PoC 범위와 rewrite 비용을 결정한다.</text>
  </g>
</svg>