<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Apple Silicon LLM 서버 선택 매트릭스</title><desc id="desc">개인 실험, 팀 로컬 서버, 다중 테넌트 서비스에 따라 OMLX 도입 적합성을 비교하는 표</desc>
  <rect width="1200" height="720" rx="28" fill="#0d1728"/>
  <text x="600" y="62" text-anchor="middle" fill="#f5fbff" font-family="Arial, sans-serif" font-size="35" font-weight="800">어디까지 OMLX에 맡길 것인가</text>
  <g font-family="Arial, sans-serif">
    <g fill="#182943" stroke="#365275" stroke-width="2"><rect x="70" y="110" width="1060" height="95" rx="18"/><rect x="70" y="225" width="1060" height="125" rx="18"/><rect x="70" y="370" width="1060" height="125" rx="18"/><rect x="70" y="515" width="1060" height="125" rx="18"/></g>
    <g font-size="24" font-weight="800"><text x="105" y="168" fill="#89dcff">환경</text><text x="315" y="168" fill="#89dcff">OMLX 적합도</text><text x="530" y="168" fill="#89dcff">먼저 볼 지표</text><text x="840" y="168" fill="#89dcff">중단 조건</text></g>
    <g font-size="22" font-weight="700"><text x="105" y="278" fill="#fff">개인 개발 Mac</text><text x="315" y="278" fill="#64e3b5">높음</text><text x="530" y="278" fill="#e7f2ff">TTFT · memory pressure</text><text x="840" y="278" fill="#ffd6a1">IDE·브라우저 체감 저하</text><text x="105" y="423" fill="#fff">소규모 팀 LAN 서버</text><text x="315" y="423" fill="#f2d67a">조건부</text><text x="530" y="423" fill="#e7f2ff">p95 · 공정성 · 인증</text><text x="840" y="423" fill="#ffd6a1">키 공유·로그 노출</text><text x="105" y="568" fill="#fff">외부 다중 테넌트</text><text x="315" y="568" fill="#ff8d8d">낮음</text><text x="530" y="568" fill="#e7f2ff">격리 · HA · 감사</text><text x="840" y="568" fill="#ffd6a1">테넌트 경계 불명확</text></g>
    <g font-size="17" fill="#aebfd4"><text x="105" y="313">Ollama·mlx-lm과 실제 업무 비교</text><text x="530" y="313">동시성 1·2·4, cold/warm 분리</text><text x="840" y="313">swap·SSD 쓰기가 지속 증가</text><text x="105" y="458">API key와 방화벽을 기본 조건으로</text><text x="530" y="458">취소·재시작·disk full 복구</text><text x="840" y="458">admin과 inference 분리 실패</text><text x="105" y="603">전용 GPU 서버·관리형 API 우선 검토</text><text x="530" y="603">SLO·autoscaling·rollout</text><text x="840" y="603">한 Mac 장애가 전체 장애로 전파</text></g>
  </g>
  <text x="600" y="684" text-anchor="middle" fill="#81a8c9" font-family="Arial, sans-serif" font-size="19">모델 크기보다 성공한 업무당 지연·안정성·운영비로 판단한다</text>
</svg>
