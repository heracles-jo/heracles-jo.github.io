<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">BrewUI 읽기와 변경 경로</title><desc id="desc">SwiftUI 화면에서 JSON API 조회와 직렬화된 brew CLI 명령으로 나뉘는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#6d55c7"/></marker></defs>
<rect width="1200" height="680" rx="24" fill="#f6f4fb"/><text x="60" y="70" fill="#231b32" font-family="-apple-system,'Noto Sans KR',sans-serif" font-size="34" font-weight="800">조회는 API로, 변경은 brew CLI로</text><text x="60" y="108" fill="#5e5569" font-family="-apple-system,'Noto Sans KR',sans-serif" font-size="20">BrewUI는 별도 패키지 엔진이 아니라 Homebrew의 검토 가능한 실행 표면이다</text>
<g font-family="-apple-system,'Noto Sans KR',sans-serif"><rect x="72" y="164" width="1056" height="112" rx="18" fill="#2d2340"/><text x="112" y="208" fill="#fff" font-size="24" font-weight="700">SwiftUI View → ViewModel</text><text x="112" y="244" fill="#d8cee8" font-size="19">검색 · 설치 상태 · Doctor · Console · Configuration</text>
<path d="M600 276v57" stroke="#6d55c7" stroke-width="5" marker-end="url(#a)"/>
<rect x="72" y="346" width="480" height="122" rx="18" fill="#e6e0fa" stroke="#6d55c7" stroke-width="2"/><text x="108" y="390" fill="#302354" font-size="24" font-weight="700">Repository · 읽기 경로</text><text x="108" y="426" fill="#53496a" font-size="18">Formula/Cask 메타데이터 · 설치 상태 parsing</text>
<rect x="648" y="346" width="480" height="122" rx="18" fill="#fff0cf" stroke="#cc8b16" stroke-width="2"/><text x="684" y="390" fill="#5b3a06" font-size="24" font-weight="700">BrewCommandCenter · 변경 경로</text><text x="684" y="426" fill="#6f572c" font-size="18">actor가 install·upgrade·remove를 직렬화</text>
<path d="M312 468v62" stroke="#6d55c7" stroke-width="5" marker-end="url(#a)"/><path d="M888 468v62" stroke="#cc8b16" stroke-width="5" marker-end="url(#a)"/>
<rect x="72" y="542" width="480" height="82" rx="16" fill="#fff" stroke="#9386aa" stroke-width="2"/><text x="312" y="591" text-anchor="middle" fill="#302b38" font-size="22" font-weight="700">formulae.brew.sh JSON API</text>
<rect x="648" y="542" width="480" height="82" rx="16" fill="#17131d"/><text x="888" y="580" text-anchor="middle" fill="#7fe3a1" font-family="ui-monospace,monospace" font-size="21">/bin/zsh → brew CLI</text><text x="888" y="606" text-anchor="middle" fill="#d6cfe0" font-size="16">정확한 명령 · stdout/stderr · 종료 상태</text></g></svg>
