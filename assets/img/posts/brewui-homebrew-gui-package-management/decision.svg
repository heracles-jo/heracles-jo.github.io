<rect x="690" y="258" width="416" height="88" rx="18" fill="#3d3020" stroke="#efad3c" stroke-width="2"/><text x="898" y="296" text-anchor="middle" fill="#ffd17c" font-size="22" font-weight="700">관리형 개발 장비의 표준화</text><text x="898" y="326" text-anchor="middle" fill="#eee0c9" font-size="17">승인·감사·복구 계약이 먼저</text>
<path d="M302 346v64" stroke="#596275" stroke-width="4" marker-end="url(#m)"/><path d="M898 346v64" stroke="#596275" stroke-width="4" marker-end="url(#m)"/>
<rect x="94" y="422" width="416" height="112" rx="18" fill="#192733"/><text x="302" y="458" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">기본 prefix · 공식 Cask · 명령 확인</text><text x="302" y="492" text-anchor="middle" fill="#b7c9d6" font-size="17">환경 차이를 brew.env로 설명 가능한가?</text><text x="302" y="517" text-anchor="middle" fill="#b7c9d6" font-size="17">그렇다면 편의 계층으로 도입</text>
<rect x="690" y="422" width="416" height="112" rx="18" fill="#192733"/><text x="898" y="458" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Brewfile/MDM 기준 상태 유지</text><text x="898" y="492" text-anchor="middle" fill="#b7c9d6" font-size="17">허용 목록 · 로그 · 서명 · 라이선스 검증</text><text x="898" y="517" text-anchor="middle" fill="#b7c9d6" font-size="17">충족할 때만 관측·실행 표면으로 도입</text>
<path d="M302 534v56" stroke="#596275" stroke-width="4" marker-end="url(#m)"/><path d="M898 534v56" stroke="#596275" stroke-width="4" marker-end="url(#m)"/>
