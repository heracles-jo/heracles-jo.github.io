<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">BrewUI 도입 결정 흐름</title><desc id="desc">개인 편의와 조직 통제를 구분해 도입 여부를 판단하는 흐름</desc><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#596275"/></marker></defs><rect width="1200" height="700" rx="24" fill="#111722"/><text x="600" y="62" text-anchor="middle" fill="#fff" font-family="-apple-system,'Noto Sans KR',sans-serif" font-size="34" font-weight="800">BrewUI를 어디까지 맡길 것인가</text><g font-family="-apple-system,'Noto Sans KR',sans-serif"><rect x="390" y="102" width="420" height="78" rx="18" fill="#6d55c7"/><text x="600" y="150" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Homebrew 작업의 목적은?</text><path d="M510 180 302 247" stroke="#596275" stroke-width="4" marker-end="url(#m)"/><path d="M690 180 898 247" stroke="#596275" stroke-width="4" marker-end="url(#m)"/>
