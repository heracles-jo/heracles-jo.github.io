<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MarkItDown 문서 인입 파이프라인 거버넌스</title>
  <desc id="desc">Office, PDF, 이미지, 오디오, 웹 문서를 Markdown 중간표현으로 변환해 LLM과 RAG 파이프라인에 공급하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="0.55" stop-color="#183b57"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#08111f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="180" fill="#5eead4" opacity="0.12"/>
  <circle cx="100" cy="560" r="220" fill="#38bdf8" opacity="0.10"/>
  <text x="72" y="105" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="26" font-weight="700">GitHub Trending Analysis</text>
  <text x="72" y="165" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800">MarkItDown</text>
  <text x="72" y="220" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="32" font-weight="700">문서를 LLM이 읽는 운영 데이터로 바꾸는 조건</text>
  <g transform="translate(84 300)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="116" rx="18" fill="#f8fafc"/>
    <text x="28" y="48" fill="#334155" font-family="Arial, sans-serif" font-size="24" font-weight="700">PDF · Office</text>
    <text x="28" y="82" fill="#64748b" font-family="Arial, sans-serif" font-size="18">원본 파일</text>
    <rect x="275" y="0" width="220" height="116" rx="18" fill="#ecfeff"/>
    <text x="315" y="48" fill="#0f766e" font-family="Arial, sans-serif" font-size="24" font-weight="700">MarkItDown</text>
    <text x="315" y="82" fill="#475569" font-family="Arial, sans-serif" font-size="18">구조 보존 변환</text>
    <rect x="550" y="0" width="220" height="116" rx="18" fill="#f0fdf4"/>
    <text x="590" y="48" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700">Markdown</text>
    <text x="590" y="82" fill="#475569" font-family="Arial, sans-serif" font-size="18">중간표현</text>
    <rect x="825" y="0" width="220" height="116" rx="18" fill="#eff6ff"/>
    <text x="865" y="48" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="24" font-weight="700">RAG · Agent</text>
    <text x="865" y="82" fill="#475569" font-family="Arial, sans-serif" font-size="18">검색·요약·검증</text>
    <path d="M228 58 H267" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M503 58 H542" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M778 58 H817" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="72" y="540" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="22">Security · Quality · Metadata · Chunking · Observability</text>
</svg>
