<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">MarkItDown, Docling, Unstructured, Pandoc 비교</title>
  <desc id="desc">문서 변환 도구를 경량 Markdown 변환, 레이아웃 이해, ETL 워크플로, 범용 마크업 변환 축으로 비교하는 매트릭스</desc>
  <rect width="1100" height="620" fill="#f8fafc" rx="28"/>
  <text x="54" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">문서 변환 도구 선택 매트릭스</text>
  <text x="54" y="110" font-family="Arial, sans-serif" font-size="18" fill="#475569">도구의 우열보다 사용 목적과 운영 경계가 선택을 결정한다.</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="54" y="155" width="992" height="70" rx="12" fill="#0f766e"/>
    <text x="78" y="198" fill="#ffffff" font-weight="700">도구</text><text x="285" y="198" fill="#ffffff" font-weight="700">강점</text><text x="590" y="198" fill="#ffffff" font-weight="700">주의점</text><text x="850" y="198" fill="#ffffff" font-weight="700">적합한 상황</text>
    <g fill="#0f172a">
      <rect x="54" y="240" width="992" height="74" rx="10" fill="#ecfeff"/>
      <text x="78" y="285" font-weight="700">MarkItDown</text><text x="285" y="285">LLM 친화 Markdown</text><text x="590" y="285">고충실도 출판 변환 아님</text><text x="850" y="285">RAG 인입 PoC</text>
      <rect x="54" y="326" width="992" height="74" rx="10" fill="#eef2ff"/>
      <text x="78" y="371" font-weight="700">Docling</text><text x="285" y="371">문서 구조·레이아웃 분석</text><text x="590" y="371">무거운 처리 비용</text><text x="850" y="371">복잡 PDF</text>
      <rect x="54" y="412" width="992" height="74" rx="10" fill="#f0fdf4"/>
      <text x="78" y="457" font-weight="700">Unstructured</text><text x="285" y="457">ETL·partition·chunking</text><text x="590" y="457">상용 플랫폼 경계 확인</text><text x="850" y="457">운영형 ETL</text>
      <rect x="54" y="498" width="992" height="74" rx="10" fill="#fff7ed"/>
      <text x="78" y="543" font-weight="700">Pandoc</text><text x="285" y="543">마크업 형식 변환</text><text x="590" y="543">Office/PDF 의미 추출 한계</text><text x="850" y="543">출판·문서 빌드</text>
    </g>
  </g>
</svg>
