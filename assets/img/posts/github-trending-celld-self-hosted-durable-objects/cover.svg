<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">celld self-hosted Durable Objects architecture</title>
  <desc id="desc">Object storage bucket coordinates distributed Durable Objects across self-hosted worker nodes with per-cell SQLite state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="0.55" stop-color="#15324a"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="110" r="170" fill="#22d3ee" opacity="0.12"/>
  <circle cx="140" cy="530" r="210" fill="#34d399" opacity="0.12"/>
  <text x="72" y="112" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">GitHub Trending Analysis</text>
  <text x="72" y="178" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">celld</text>
  <text x="72" y="238" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">셀프호스팅 Durable Objects와</text>
  <text x="72" y="290" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">상태ful 서버리스의 재구성</text>
  <g filter="url(#shadow)">
    <rect x="74" y="360" width="220" height="112" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="114" y="407" fill="#f8fafc" font-family="Inter, Arial" font-size="24" font-weight="700">Node A</text>
    <text x="114" y="443" fill="#93c5fd" font-family="Inter, Arial" font-size="18">V8 + Workers</text>
    <rect x="490" y="330" width="220" height="150" rx="28" fill="#f59e0b" opacity="0.95"/>
    <text x="545" y="393" fill="#111827" font-family="Inter, Arial" font-size="28" font-weight="800">S3/R2</text>
    <text x="524" y="429" fill="#111827" font-family="Inter, Arial" font-size="19" font-weight="700">leases · state · deploy</text>
    <rect x="906" y="360" width="220" height="112" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="946" y="407" fill="#f8fafc" font-family="Inter, Arial" font-size="24" font-weight="700">Node B</text>
    <text x="946" y="443" fill="#93c5fd" font-family="Inter, Arial" font-size="18">SQLite cells</text>
    <path d="M300 416 C370 380, 420 375, 482 395" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
    <path d="M718 395 C780 375, 830 380, 900 416" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="72" y="556" fill="#cbd5e1" font-family="Inter, Arial" font-size="24">Bucket as coordinator · per-cell SQLite · no central consensus service</text>
</svg>
