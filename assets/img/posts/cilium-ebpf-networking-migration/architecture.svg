<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cilium eBPF 데이터패스 아키텍처</title><desc id="desc">Kubernetes 의도가 Cilium agent를 거쳐 커널 eBPF 정책과 서비스 변환, Hubble 관측으로 연결되는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#34d399"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#071b2a"/>
  <text x="60" y="62" fill="#f0fdfa" font-family="Arial,sans-serif" font-size="30" font-weight="700">의도에서 실제 패킷 판정까지</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#123649" stroke="#38bdf8" stroke-width="2">
      <rect x="55" y="108" width="240" height="88" rx="18"/><rect x="55" y="222" width="240" height="88" rx="18"/><rect x="55" y="336" width="240" height="88" rx="18"/>
    </g>
    <g fill="#e0f2fe" font-size="20"><text x="175" y="145">Service · EndpointSlice</text><text x="175" y="174" font-size="15">backend 의도</text><text x="175" y="258">NetworkPolicy · Label</text><text x="175" y="287" font-size="15">identity와 허용 범위</text><text x="175" y="372">Node · IPAM · Route</text><text x="175" y="401" font-size="15">주소와 전달 경로</text></g>
    <rect x="406" y="182" width="270" height="178" rx="24" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
    <text x="541" y="229" fill="white" font-size="25" font-weight="700">Cilium Agent</text><text x="541" y="265" fill="#ccfbf1" font-size="17">watch · compile · reconcile</text><text x="541" y="298" fill="#ccfbf1" font-size="17">policy revision · identity</text><text x="541" y="331" fill="#ccfbf1" font-size="17">BPF program / map 갱신</text>
    <g fill="#11344a" stroke="#34d399" stroke-width="2"><rect x="790" y="92" width="340" height="92" rx="18"/><rect x="790" y="214" width="340" height="92" rx="18"/><rect x="790" y="336" width="340" height="92" rx="18"/></g>
    <g fill="#d1fae5" font-size="20"><text x="960" y="130">Service Load Balancing</text><text x="960" y="159" font-size="15">ClusterIP · NodePort · NAT · DSR</text><text x="960" y="252">Endpoint Policy</text><text x="960" y="281" font-size="15">L3/L4 identity · L7 redirect</text><text x="960" y="374">Routing · Conntrack</text><text x="960" y="403" font-size="15">overlay/native · state map</text></g>
    <g stroke="#34d399" stroke-width="4" marker-end="url(#a)"><path d="M295 152H385Q405 152 405 190"/><path d="M295 266H385"/><path d="M295 380H385Q405 380 405 342"/><path d="M676 226H766Q786 226 786 145"/><path d="M676 271H786"/><path d="M676 316H766Q786 316 786 380"/></g>
    <rect x="336" y="506" width="530" height="112" rx="22" fill="#172554" stroke="#818cf8" stroke-width="2"/>
    <text x="601" y="548" fill="#e0e7ff" font-size="24" font-weight="700">Hubble · Metrics · Events</text><text x="601" y="583" fill="#c7d2fe" font-size="17">flow verdict를 Kubernetes 의도와 연결해야 진단이 완성된다</text>
    <path d="M960 428V476Q960 488 946 488H601V506" fill="none" stroke="#818cf8" stroke-width="4" marker-end="url(#a)"/>
    <text x="600" y="675" fill="#94a3b8" font-size="17">L7 정책은 필요 시 userspace Envoy proxy 경로를 추가한다.</text>
  </g>
</svg>
