<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cilium eBPF 네트워킹 전환</title>
  <desc id="desc">Kubernetes 서비스, 정책, 관측성을 eBPF 데이터패스에 연결하는 개념도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#123e45"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".18" stroke="#67e8f9" stroke-width="2"><path d="M0 130H1200M0 250H1200M0 370H1200M0 490H1200"/><path d="M180 0V630M420 0V630M660 0V630M900 0V630"/></g>
  <g transform="translate(760 92)">
    <rect x="0" y="0" width="320" height="440" rx="30" fill="#0b2534" stroke="#35d399" stroke-width="3"/>
    <text x="160" y="54" fill="#dffdf3" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">Kubernetes Node</text>
    <g font-family="Arial,sans-serif" text-anchor="middle" font-size="18">
      <rect x="44" y="91" width="232" height="62" rx="14" fill="#173f50" stroke="#67e8f9"/><text x="160" y="129" fill="#ecfeff">Service · Endpoint</text>
      <path d="M160 153V190" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="44" y="194" width="232" height="78" rx="14" fill="#155e59" stroke="#5eead4"/><text x="160" y="226" fill="white">eBPF Datapath</text><text x="160" y="252" fill="#ccfbf1" font-size="15">identity · policy · LB</text>
      <path d="M160 272V309" stroke="#67e8f9" stroke-width="4"/>
      <rect x="44" y="313" width="102" height="62" rx="13" fill="#173f50"/><text x="95" y="350" fill="#ecfeff">Pod A</text>
      <rect x="174" y="313" width="102" height="62" rx="13" fill="#173f50"/><text x="225" y="350" fill="#ecfeff">Pod B</text>
      <rect x="44" y="394" width="232" height="28" rx="14" fill="#123b3c"/><text x="160" y="414" fill="#99f6e4" font-size="14">Hubble flow visibility</text>
    </g>
  </g>
  <g font-family="Arial,sans-serif">
    <text x="82" y="150" fill="#5eead4" font-size="24" font-weight="700">KUBERNETES NETWORKING</text>
    <text x="78" y="225" fill="white" font-size="49" font-weight="800">Cilium eBPF 전환</text>
    <text x="80" y="282" fill="#d1fae5" font-size="27">kube-proxy 대체보다 먼저 볼 운영 경계</text>
    <g transform="translate(82 350)" font-size="20">
      <rect width="180" height="52" rx="26" fill="#0f766e"/><text x="90" y="34" fill="white" text-anchor="middle">서비스 변환</text>
      <rect x="196" width="180" height="52" rx="26" fill="#155e75"/><text x="286" y="34" fill="white" text-anchor="middle">ID 기반 정책</text>
      <rect x="392" width="180" height="52" rx="26" fill="#166534"/><text x="482" y="34" fill="white" text-anchor="middle">Flow 관측</text>
    </g>
    <text x="82" y="500" fill="#a7f3d0" font-size="18">routing · policy convergence · upgrade · rollback</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#67e8f9"/></marker></defs>
</svg>
