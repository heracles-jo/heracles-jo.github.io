<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">AI 동료 도입 의사결정 게이트</title>
  <desc id="desc">관찰 전용, 제한된 쓰기, 예약 실행, 확대 운영 단계별 승격 조건과 중단 조건</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081525"/><stop offset="1" stop-color="#173349"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#72ddc9"/></marker></defs>
  <rect width="1200" height="690" rx="26" fill="url(#bg)"/>
  <text x="60" y="70" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="800">AI 동료는 권한과 관찰성을 함께 승격한다</text>
  <text x="60" y="106" fill="#a9bdcc" font-family="Arial, sans-serif" font-size="19">기능이 동작해도 거부·감사·복구가 검증되지 않으면 다음 단계로 가지 않는다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 165)"><rect width="240" height="250" rx="22" fill="#173a50" stroke="#5f8398"/><circle cx="42" cy="42" r="22" fill="#72ddc9"/><text x="42" y="49" text-anchor="middle" fill="#09202a" font-size="20" font-weight="800">1</text><text x="120" y="88" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">관찰 전용</text><text x="25" y="128" fill="#c5d5df" font-size="17">• 합성 데이터와 전용 계정</text><text x="25" y="160" fill="#c5d5df" font-size="17">• read-only browser·MCP</text><text x="25" y="192" fill="#c5d5df" font-size="17">• actor·initiator 감사</text><text x="25" y="224" fill="#8fe5d4" font-size="16">Gate: Bot 간 canary 0건</text></g>
    <g transform="translate(335 165)"><rect width="240" height="250" rx="22" fill="#173a50" stroke="#5f8398"/><circle cx="42" cy="42" r="22" fill="#72ddc9"/><text x="42" y="49" text-anchor="middle" fill="#09202a" font-size="20" font-weight="800">2</text><text x="120" y="88" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">제한된 쓰기</text><text x="25" y="128" fill="#c5d5df" font-size="17">• 지정 path·API만 허용</text><text x="25" y="160" fill="#c5d5df" font-size="17">• write마다 승인</text><text x="25" y="192" fill="#c5d5df" font-size="17">• 멱등성·결과 조정</text><text x="25" y="224" fill="#8fe5d4" font-size="16">Gate: 승인 우회 0건</text></g>
    <g transform="translate(615 165)"><rect width="240" height="250" rx="22" fill="#173a50" stroke="#5f8398"/><circle cx="42" cy="42" r="22" fill="#72ddc9"/><text x="42" y="49" text-anchor="middle" fill="#09202a" font-size="20" font-weight="800">3</text><text x="120" y="88" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">예약 실행</text><text x="25" y="128" fill="#c5d5df" font-size="17">• unattended 전용 정책</text><text x="25" y="160" fill="#c5d5df" font-size="17">• worker·lease·fatigue</text><text x="25" y="192" fill="#c5d5df" font-size="17">• 동시 실행·비용 상한</text><text x="25" y="224" fill="#8fe5d4" font-size="16">Gate: 중복 부작용 0건</text></g>
    <g transform="translate(895 165)"><rect width="250" height="250" rx="22" fill="#173a50" stroke="#5f8398"/><circle cx="42" cy="42" r="22" fill="#72ddc9"/><text x="42" y="49" text-anchor="middle" fill="#09202a" font-size="20" font-weight="800">4</text><text x="125" y="88" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">확대 운영</text><text x="25" y="128" fill="#c5d5df" font-size="17">• Bot별 container·IAM</text><text x="25" y="160" fill="#c5d5df" font-size="17">• SIEM·백업·RTO/RPO</text><text x="25" y="192" fill="#c5d5df" font-size="17">• 정책 revision·rollback</text><text x="25" y="224" fill="#8fe5d4" font-size="16">Gate: 사고 설명 시간 충족</text></g>
    <path d="M297 290h30" stroke="#72ddc9" stroke-width="5" marker-end="url(#a)"/><path d="M577 290h30" stroke="#72ddc9" stroke-width="5" marker-end="url(#a)"/><path d="M857 290h30" stroke="#72ddc9" stroke-width="5" marker-end="url(#a)"/>
    <rect x="55" y="470" width="1090" height="150" rx="22" fill="#311f2a" stroke="#e47c8c"/>
    <text x="85" y="516" fill="#ffb1bb" font-size="23" font-weight="800">즉시 중단 조건</text>
    <text x="85" y="556" fill="#f0d5d9" font-size="18">• 다른 Bot·사용자의 cookie, file, memory가 노출됨  • 정책 오류가 allow-all로 전환됨</text>
    <text x="85" y="590" fill="#f0d5d9" font-size="18">• 승인 전에 외부 write가 발생함  • routine 중복 실행을 탐지·조정할 수 없음  • 감사 로그로 결과를 연결할 수 없음</text>
    <text x="600" y="657" text-anchor="middle" fill="#a9bdcc" font-size="17">AI 동료의 확장은 권한 확대가 아니라 검증된 경계의 확대여야 한다</text>
  </g>
</svg>
