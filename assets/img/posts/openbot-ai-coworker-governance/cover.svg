<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenBot AI 동료 운영</title>
  <desc id="desc">AI 동료의 작업이 승인, 정책, 감사 게이트를 통과하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#153454"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43d9bd"/><stop offset="1" stop-color="#7aa7ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="100" r="190" fill="#2c6a8f" opacity=".18"/><circle cx="110" cy="570" r="230" fill="#2ed1b4" opacity=".1"/>
  <text x="76" y="118" fill="#8fdccb" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">AI COWORKER GOVERNANCE</text>
  <text x="76" y="205" fill="#fff" font-family="Arial, sans-serif" font-size="58" font-weight="800">OpenBot AI 동료 운영</text>
  <text x="76" y="264" fill="#c8d7e7" font-family="Arial, sans-serif" font-size="28">승인 · 감사 · 격리 설계 기준</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="80" y="350" width="210" height="112" rx="20" fill="#12283f" stroke="#52728f"/>
    <text x="185" y="394" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">AG-UI Bot</text>
    <text x="185" y="430" text-anchor="middle" fill="#9fb5c9" font-size="18">의도와 도구 호출</text>
    <path d="M295 406h80" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <path d="M365 394l18 12-18 12" fill="none" stroke="#7aa7ff" stroke-width="7"/>
    <rect x="385" y="326" width="350" height="160" rx="24" fill="#152f49" stroke="#43d9bd" stroke-width="2"/>
    <text x="560" y="370" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">정책 게이트웨이</text>
    <g font-size="18" text-anchor="middle"><text x="462" y="420" fill="#8fdccb">승인</text><text x="560" y="420" fill="#8fdccb">정책</text><text x="658" y="420" fill="#8fdccb">감사</text></g>
    <path d="M740 406h80" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <path d="M810 394l18 12-18 12" fill="none" stroke="#7aa7ff" stroke-width="7"/>
    <rect x="835" y="350" width="280" height="112" rx="20" fill="#12283f" stroke="#52728f"/>
    <text x="975" y="393" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">격리된 실행</text>
    <text x="975" y="430" text-anchor="middle" fill="#9fb5c9" font-size="18">브라우저 · 파일 · MCP</text>
  </g>
  <rect x="76" y="533" width="1040" height="3" fill="url(#accent)" opacity=".8"/>
  <text x="76" y="575" fill="#9fb5c9" font-family="Arial, sans-serif" font-size="19">사람이 없을 때 더 좁은 권한으로 움직이고, 실행 뒤 근거를 남기는가</text>
</svg>
