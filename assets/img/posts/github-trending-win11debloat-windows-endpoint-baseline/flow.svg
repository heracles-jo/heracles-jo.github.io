<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Windows endpoint baseline delivery flow</title>
  <desc id="desc">A staged Windows endpoint baseline process from inventory and pilot rings to policy tools, Win11Debloat script execution, rollback, and monitoring.</desc>
  <rect width="1100" height="620" rx="28" fill="#f8fafc"/>
  <text x="54" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Windows endpoint baseline delivery flow</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
    <rect x="60" y="125" width="190" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="90" y="168" fill="#1e3a8a">1. Inventory</text><text x="90" y="198" fill="#1e3a8a" font-size="15">앱·정책·사용자군</text>
    <rect x="310" y="125" width="190" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="342" y="168" fill="#075985">2. Pilot ring</text><text x="342" y="198" fill="#075985" font-size="15">소수 장비 검증</text>
    <rect x="560" y="125" width="190" height="100" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <text x="592" y="168" fill="#134e4a">3. Script run</text><text x="592" y="198" fill="#134e4a" font-size="15">Win11Debloat + 로그</text>
    <rect x="810" y="125" width="190" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="842" y="168" fill="#166534">4. Policy lock</text><text x="842" y="198" fill="#166534" font-size="15">Intune/GPO/Autopilot</text>
  </g>
  <g stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M250 175h60"/><path d="M500 175h60"/><path d="M750 175h60"/>
    <path d="M905 225v85H155v60" stroke-dasharray="12 14"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="370" width="285" height="150" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="122" y="415" font-size="23" font-weight="800" fill="#9a3412">Rollback lane</text>
    <text x="122" y="452" font-size="16" fill="#7c2d12">레지스트리 백업, 변경 목록,</text>
    <text x="122" y="478" font-size="16" fill="#7c2d12">Store 재설치 경로, 예외 승인</text>
    <rect x="410" y="370" width="285" height="150" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
    <text x="442" y="415" font-size="23" font-weight="800" fill="#334155">Audit lane</text>
    <text x="442" y="452" font-size="16" fill="#334155">누가·언제·무엇을 바꿨는지</text>
    <text x="442" y="478" font-size="16" fill="#334155">티켓과 커밋으로 추적</text>
    <rect x="730" y="370" width="285" height="150" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="762" y="415" font-size="23" font-weight="800" fill="#991b1b">Exception lane</text>
    <text x="762" y="452" font-size="16" fill="#7f1d1d">부서별 앱 의존성, 드라이버,</text>
    <text x="762" y="478" font-size="16" fill="#7f1d1d">장애·지원 정책 반영</text>
  </g>
</svg>
