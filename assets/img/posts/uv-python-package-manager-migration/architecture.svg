<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">uv 패키지 관리 전환 아키텍처</title>
  <desc id="desc">분산된 pip 도구에서 선언, 해석, 환경, artifact 계약으로 책임을 재구성하는 구조</desc>
  <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">분산된 명령을 네 개의 운영 계약으로 바꾼다</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="120" width="260" height="500" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="185" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#334155">기존 도구 체계</text>
    <g fill="#e2e8f0" stroke="#94a3b8"><rect x="90" y="205" width="190" height="58" rx="12"/><rect x="90" y="285" width="190" height="58" rx="12"/><rect x="90" y="365" width="190" height="58" rx="12"/><rect x="90" y="445" width="190" height="58" rx="12"/><rect x="90" y="525" width="190" height="58" rx="12"/></g>
    <g text-anchor="middle" font-size="20" fill="#334155"><text x="185" y="241">pip / pip-tools</text><text x="185" y="321">virtualenv / pyenv</text><text x="185" y="401">pipx / tools</text><text x="185" y="481">Poetry / publish</text><text x="185" y="561">CI cache scripts</text></g>
    <path d="M340 370 H430" stroke="url(#a)" stroke-width="12" stroke-linecap="round"/><path d="M414 350 L438 370 L414 390" fill="none" stroke="#6366f1" stroke-width="9"/>
    <rect x="465" y="115" width="680" height="520" rx="24" fill="#0f172a"/>
    <g>
      <rect x="505" y="155" width="280" height="190" rx="18" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
      <text x="645" y="197" text-anchor="middle" font-size="24" font-weight="700" fill="#cffafe">1. 선언 계약</text>
      <text x="535" y="238" font-size="18" fill="#e0f2fe">• pyproject.toml</text><text x="535" y="272" font-size="18" fill="#e0f2fe">• dependency groups</text><text x="535" y="306" font-size="18" fill="#e0f2fe">• index · source 정책</text>
      <rect x="825" y="155" width="280" height="190" rx="18" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
      <text x="965" y="197" text-anchor="middle" font-size="24" font-weight="700" fill="#ede9fe">2. 해석 계약</text>
      <text x="855" y="238" font-size="18" fill="#ede9fe">• universal resolution</text><text x="855" y="272" font-size="18" fill="#ede9fe">• marker · Python 범위</text><text x="855" y="306" font-size="18" fill="#ede9fe">• constraint · override</text>
      <rect x="505" y="385" width="280" height="190" rx="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
      <text x="645" y="427" text-anchor="middle" font-size="24" font-weight="700" fill="#dbeafe">3. 환경 계약</text>
      <text x="535" y="468" font-size="18" fill="#dbeafe">• .venv와 exact sync</text><text x="535" y="502" font-size="18" fill="#dbeafe">• uv run --locked</text><text x="535" y="536" font-size="18" fill="#dbeafe">• cache invalidation</text>
      <rect x="825" y="385" width="280" height="190" rx="18" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
      <text x="965" y="427" text-anchor="middle" font-size="24" font-weight="700" fill="#f3e8ff">4. artifact 계약</text>
      <text x="855" y="468" font-size="18" fill="#f3e8ff">• lock · wheel · image</text><text x="855" y="502" font-size="18" fill="#f3e8ff">• SBOM · attestation</text><text x="855" y="536" font-size="18" fill="#f3e8ff">• update · rollback</text>
    </g>
  </g>
  <rect x="55" y="675" width="1090" height="46" rx="12" fill="url(#a)"/>
  <text x="600" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">같은 commit → 같은 dependency graph → 같은 실행 결과 → 검증 가능한 배포 artifact</text>
</svg>
