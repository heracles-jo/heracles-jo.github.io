<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mattermost와 보안형 개발 협업 플랫폼</title>
  <desc id="desc">개발자 협업, 인시던트 대응, 보안 게이트, 자체 호스팅 경계를 하나의 플랫폼으로 연결한 구조도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102a43"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#061226" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="170" fill="#93c5fd" opacity="0.16"/>
  <circle cx="130" cy="540" r="190" fill="#5eead4" opacity="0.14"/>
  <text x="78" y="106" fill="#dbeafe" font-size="30" font-family="Arial, sans-serif" font-weight="700">GitHub Trending Analysis</text>
  <text x="78" y="174" fill="#ffffff" font-size="58" font-family="Arial, sans-serif" font-weight="800">Mattermost</text>
  <text x="78" y="235" fill="#e0f2fe" font-size="38" font-family="Arial, sans-serif" font-weight="700">보안형 개발 협업 플랫폼의 재부상</text>
  <g filter="url(#shadow)">
    <rect x="96" y="310" rx="28" width="1008" height="210" fill="#f8fafc" opacity="0.96"/>
    <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
      <rect x="145" y="365" rx="18" width="190" height="86" fill="#dbeafe"/>
      <text x="240" y="401" font-size="21" fill="#1e3a8a">ChatOps</text>
      <text x="240" y="429" font-size="16" fill="#334155">채널·워크플로</text>
      <rect x="385" y="365" rx="18" width="190" height="86" fill="#ccfbf1"/>
      <text x="480" y="401" font-size="21" fill="#115e59">Incident</text>
      <text x="480" y="429" font-size="16" fill="#334155">대응·온콜</text>
      <rect x="625" y="365" rx="18" width="190" height="86" fill="#ede9fe"/>
      <text x="720" y="401" font-size="21" fill="#5b21b6">Self-hosted</text>
      <text x="720" y="429" font-size="16" fill="#334155">데이터 경계</text>
      <rect x="865" y="365" rx="18" width="190" height="86" fill="#fee2e2"/>
      <text x="960" y="401" font-size="21" fill="#991b1b">Security</text>
      <text x="960" y="429" font-size="16" fill="#334155">ABAC·감사</text>
    </g>
    <path d="M335 408h50M575 408h50M815 408h50" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="78" y="582" fill="#bfdbfe" font-size="24" font-family="Arial, sans-serif">secure collaboration across the software development lifecycle</text>
</svg>
