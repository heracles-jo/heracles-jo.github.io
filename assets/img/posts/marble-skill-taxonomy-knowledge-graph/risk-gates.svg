<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">교육 taxonomy 도입 위험 게이트</title>
  <desc id="desc">데이터 무결성부터 제품 안전성까지 통과해야 하는 다섯 단계 의사결정 흐름</desc>
  <rect width="1200" height="720" rx="24" fill="#111827"/>
  <text x="60" y="70" fill="#f9fafb" font-family="Arial, sans-serif" font-size="34" font-weight="800">Taxonomy를 추천 권위로 쓰기 전 통과해야 할 게이트</text>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#94a3b8"/></marker></defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 145)"><rect width="190" height="270" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/><circle cx="95" cy="55" r="29" fill="#2563eb"/><text x="86" y="64" fill="white" font-size="25" font-weight="700">1</text><text x="30" y="115" fill="#bfdbfe" font-size="23" font-weight="700">데이터 무결성</text><text x="25" y="157" fill="#dbeafe" font-size="17">참조·cycle·ID</text><text x="25" y="187" fill="#dbeafe" font-size="17">checksum·manifest</text><text x="25" y="217" fill="#dbeafe" font-size="17">버전 diff</text></g>
    <g transform="translate(280 145)"><rect width="190" height="270" rx="18" fill="#14332a" stroke="#4ade80" stroke-width="2"/><circle cx="95" cy="55" r="29" fill="#16a34a"/><text x="86" y="64" fill="white" font-size="25" font-weight="700">2</text><text x="30" y="115" fill="#bbf7d0" font-size="23" font-weight="700">교육 타당성</text><text x="25" y="157" fill="#dcfce7" font-size="17">교사 독립 검토</text><text x="25" y="187" fill="#dcfce7" font-size="17">hard/soft 반증</text><text x="25" y="217" fill="#dcfce7" font-size="17">우회 경로</text></g>
    <g transform="translate(500 145)"><rect width="190" height="270" rx="18" fill="#3b2b12" stroke="#fbbf24" stroke-width="2"/><circle cx="95" cy="55" r="29" fill="#d97706"/><text x="86" y="64" fill="white" font-size="25" font-weight="700">3</text><text x="42" y="115" fill="#fde68a" font-size="23" font-weight="700">출처 검증</text><text x="25" y="157" fill="#fef3c7" font-size="17">claim·원문 일치</text><text x="25" y="187" fill="#fef3c7" font-size="17">대상·시점 적합성</text><text x="25" y="217" fill="#fef3c7" font-size="17">AI 추론 분리</text></g>
    <g transform="translate(720 145)"><rect width="190" height="270" rx="18" fill="#40243d" stroke="#f472b6" stroke-width="2"/><circle cx="95" cy="55" r="29" fill="#db2777"/><text x="86" y="64" fill="white" font-size="25" font-weight="700">4</text><text x="42" y="115" fill="#fbcfe8" font-size="23" font-weight="700">권리 경계</text><text x="25" y="157" fill="#fce7f3" font-size="17">ODbL·CC BY-SA</text><text x="25" y="187" fill="#fce7f3" font-size="17">upstream terms</text><text x="25" y="217" fill="#fce7f3" font-size="17">notice·삭제 추적</text></g>
    <g transform="translate(940 145)"><rect width="190" height="270" rx="18" fill="#2e2450" stroke="#a78bfa" stroke-width="2"/><circle cx="95" cy="55" r="29" fill="#7c3aed"/><text x="86" y="64" fill="white" font-size="25" font-weight="700">5</text><text x="42" y="115" fill="#ddd6fe" font-size="23" font-weight="700">제품 안전성</text><text x="25" y="157" fill="#ede9fe" font-size="17">coverage 표시</text><text x="25" y="187" fill="#ede9fe" font-size="17">교사 override</text><text x="25" y="217" fill="#ede9fe" font-size="17">결과 모니터링</text></g>
    <path d="M250 280 H270" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 280 H490" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 280 H710" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><path d="M910 280 H930" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="165" y="495" width="870" height="120" rx="20" fill="#1f2937" stroke="#475569"/><text x="205" y="540" fill="#f8fafc" font-size="24" font-weight="700">중단 원칙</text><text x="205" y="580" fill="#cbd5e1" font-size="20">어느 게이트든 증거가 없으면 다음 단계로 넘기지 않고, 마지막 정상 데이터 버전으로 되돌린다.</text>
  </g>
</svg>
