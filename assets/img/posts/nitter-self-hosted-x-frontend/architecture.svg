<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Nitter 데이터 흐름과 신뢰 경계</title><desc id="desc">브라우저부터 리버스 프록시, Nitter, Valkey, X 비공식 인터페이스까지 데이터 경계를 표현한다.</desc>
<rect width="1200" height="720" rx="24" fill="#f5f8fa"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#102a36">Nitter 데이터 흐름과 신뢰 경계</text>
<g font-family="Arial,sans-serif"><rect x="55" y="150" width="210" height="150" rx="20" fill="#d9f4ec" stroke="#178f74" stroke-width="3"/><text x="160" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#123">사용자 브라우저</text><text x="160" y="250" text-anchor="middle" font-size="18" fill="#345">HTML · RSS 요청</text>
<rect x="335" y="150" width="210" height="150" rx="20" fill="#e6eef9" stroke="#3974b8" stroke-width="3"/><text x="440" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#123">Reverse Proxy</text><text x="440" y="250" text-anchor="middle" font-size="18" fill="#345">TLS · 인증 · 제한</text>
<rect x="615" y="135" width="220" height="180" rx="20" fill="#d9f4ec" stroke="#178f74" stroke-width="4"/><text x="725" y="205" text-anchor="middle" font-size="31" font-weight="800" fill="#123">Nitter</text><text x="725" y="249" text-anchor="middle" font-size="18" fill="#345">변환 · 세션 선택</text>
<rect x="615" y="420" width="220" height="125" rx="20" fill="#fff0d6" stroke="#d88916" stroke-width="3"/><text x="725" y="474" text-anchor="middle" font-size="25" font-weight="700" fill="#123">Valkey Cache</text><text x="725" y="510" text-anchor="middle" font-size="18" fill="#345">응답 · rate 완충</text>
<rect x="920" y="150" width="220" height="150" rx="20" fill="#f8dfe2" stroke="#b84c5a" stroke-width="3"/><text x="1030" y="210" text-anchor="middle" font-size="27" font-weight="800" fill="#123">X 비공식 경로</text><text x="1030" y="250" text-anchor="middle" font-size="18" fill="#633">세션 · 차단 · 변경</text>
<g stroke="#3974b8" stroke-width="5" fill="none"><path d="M265 225h65"/><path d="m320 213 18 12-18 12"/><path d="M545 225h65"/><path d="m600 213 18 12-18 12"/></g><g stroke="#b84c5a" stroke-width="5" fill="none" stroke-dasharray="11 8"><path d="M840 225h75"/><path d="m905 213 18 12-18 12"/></g><g stroke="#d88916" stroke-width="5" fill="none"><path d="M725 320v95"/><path d="m713 405 12 18 12-18"/></g>
<rect x="55" y="610" width="1085" height="66" rx="16" fill="#102a36"/><text x="598" y="652" text-anchor="middle" fill="#fff" font-size="20">X는 사용자의 직접 IP를 덜 보지만 · 인스턴스 운영자는 요청을 볼 수 있고 · 가용성은 X가 통제한다</text></g>
</svg>
