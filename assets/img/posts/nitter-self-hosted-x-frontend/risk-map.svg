<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Nitter 운영 실패 모드 지도</title><desc id="desc">기술 차단, 세션 비밀, 개인정보, 법적 압력이 서비스 가용성과 운영 중단으로 이어지는 관계를 표시한다.</desc><rect width="1200" height="720" rx="24" fill="#0c1d2a"/><text x="60" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="800">Nitter 운영 실패 모드 지도</text>
<g font-family="Arial,sans-serif"><rect x="465" y="270" width="270" height="160" rx="24" fill="#174b51" stroke="#61e0c2" stroke-width="4"/><text x="600" y="335" fill="#fff" font-size="30" text-anchor="middle" font-weight="800">서비스 가용성</text><text x="600" y="380" fill="#c9f4e9" font-size="21" text-anchor="middle">읽기 · RSS · 캐시</text>
<g fill="#162d3e" stroke-width="3"><rect x="70" y="150" width="270" height="130" rx="20" stroke="#f2b253"/><rect x="860" y="150" width="270" height="130" rx="20" stroke="#e77986"/><rect x="70" y="470" width="270" height="130" rx="20" stroke="#6ba6f2"/><rect x="860" y="470" width="270" height="130" rx="20" stroke="#c890f5"/></g>
<text x="205" y="205" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">기술 차단</text><text x="205" y="244" fill="#f8d49e" font-size="18" text-anchor="middle">rate limit · CF · schema</text>
<text x="995" y="205" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">세션 비밀</text><text x="995" y="244" fill="#ffc3c9" font-size="18" text-anchor="middle">만료 · 잠금 · 유출</text>
<text x="205" y="525" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">개인정보</text><text x="205" y="564" fill="#bed8fa" font-size="18" text-anchor="middle">IP · 요청 경로 · 로그</text>
<text x="995" y="525" fill="#fff" font-size="25" text-anchor="middle" font-weight="700">법적·정책 압력</text><text x="995" y="564" fill="#e4c7fa" font-size="18" text-anchor="middle">약관 · 권리 · 중단 요구</text>
