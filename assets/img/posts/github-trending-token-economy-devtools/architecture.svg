<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">AI 코딩 워크플로우의 새로운 계층</title>
<desc id="desc">개발자 요청이 맥락 라우터, 토큰 프록시, LLM, 품질 게이트, CI로 이어지는 구조</desc>
<rect width="1000" height="560" fill="#0b1020" rx="24"/>
<text x="60" y="64" fill="#f8fafc" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="800">AI 코딩 워크플로우의 새로운 계층</text>
<g font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" text-anchor="middle">
  <g transform="translate(80 135)"><rect width="150" height="80" rx="18" fill="#172554" stroke="#60a5fa"/><text x="75" y="48" fill="#dbeafe">개발자 요청</text></g>
  <g transform="translate(270 135)"><rect width="170" height="80" rx="18" fill="#1e1b4b" stroke="#a78bfa"/><text x="85" y="36" fill="#ede9fe">맥락 라우터</text><text x="85" y="61" fill="#c4b5fd" font-size="15">codegraph</text></g>
  <g transform="translate(485 135)"><rect width="170" height="80" rx="18" fill="#312e81" stroke="#818cf8"/><text x="85" y="36" fill="#e0e7ff">토큰 프록시</text><text x="85" y="61" fill="#c7d2fe" font-size="15">rtk / cache</text></g>
  <g transform="translate(700 135)"><rect width="170" height="80" rx="18" fill="#064e3b" stroke="#34d399"/><text x="85" y="48" fill="#d1fae5">LLM 에이전트</text></g>
  <path d="M230 175 H270 M440 175 H485 M655 175 H700" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(205 335)"><rect width="210" height="90" rx="20" fill="#3f1d2e" stroke="#fb7185"/><text x="105" y="39" fill="#ffe4e6">품질 게이트</text><text x="105" y="66" fill="#fecdd3" font-size="15">react-doctor · pyrefly</text></g>
  <g transform="translate(520 335)"><rect width="210" height="90" rx="20" fill="#1f2937" stroke="#fbbf24"/><text x="105" y="39" fill="#fef3c7">테스트 / CI</text><text x="105" y="66" fill="#fde68a" font-size="15">검증 후 배포</text></g>
  <path d="M785 215 C785 280 625 290 625 335" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M415 380 H520" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="500" y="500" fill="#cbd5e1" font-size="18">핵심은 모델 하나가 아니라 맥락 선별, 비용 제어, 자동 검증을 묶은 운영 구조다.</text>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker></defs>
</svg>
