<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell 에이전트 정책 런타임</title>
  <desc id="desc">에이전트와 외부 서비스 사이에 커널 격리, 정책 검사, 자격증명 주입 계층이 놓인 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102d3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#42d6b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="190" fill="#76b900" opacity=".08"/>
  <circle cx="1120" cy="540" r="270" fill="#42d6b5" opacity=".06"/>
  <path d="M0 500 C250 430 410 570 650 500 S980 410 1200 485 V630 H0Z" fill="#07111f" opacity=".72"/>

  <g transform="translate(88 84)">
    <rect width="112" height="34" rx="17" fill="#76b900" opacity=".18"/>
    <text x="56" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b9f26a">AI SECURITY</text>
    <text x="0" y="96" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#f4f8fb">AI 에이전트 정책 런타임</text>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="url(#accent)">OpenShell 격리·자격증명 기준</text>
    <text x="0" y="205" font-family="Arial, sans-serif" font-size="22" fill="#b9c8d5">kernel boundary · L7 egress · credential broker · policy proof</text>
  </g>

  <g transform="translate(120 365)" filter="url(#shadow)">
    <rect width="250" height="126" rx="24" fill="#13283a" stroke="#2c4c60" stroke-width="2"/>
    <circle cx="48" cy="44" r="19" fill="#5b82a4"/>
    <path d="M35 87c4-19 22-28 36-28s32 9 36 28" fill="none" stroke="#9db9ce" stroke-width="8" stroke-linecap="round"/>
    <text x="130" y="54" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f8fb">Agent</text>
    <text x="130" y="85" font-family="Arial, sans-serif" font-size="16" fill="#aebfcd">untrusted workload</text>
  </g>

  <g transform="translate(475 335)" filter="url(#shadow)">
    <path d="M130 0L245 42v90c0 82-48 134-115 163C63 266 15 214 15 132V42Z" fill="#102f2e" stroke="#76b900" stroke-width="4"/>
    <path d="M130 50l55 20v54c0 39-21 68-55 86-34-18-55-47-55-86V70Z" fill="none" stroke="#42d6b5" stroke-width="5"/>
    <path d="M105 126l18 18 37-42" fill="none" stroke="#b9f26a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f4f8fb">Supervisor Policy</text>
  </g>

  <g transform="translate(830 365)" filter="url(#shadow)">
    <rect width="250" height="126" rx="24" fill="#13283a" stroke="#2c4c60" stroke-width="2"/>
    <circle cx="50" cy="47" r="24" fill="none" stroke="#42d6b5" stroke-width="6"/>
    <path d="M50 23v48M26 47h48" stroke="#42d6b5" stroke-width="4" opacity=".55"/>
    <text x="100" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f4f8fb">Approved API</text>
    <text x="100" y="83" font-family="Arial, sans-serif" font-size="16" fill="#aebfcd">credential injected</text>
  </g>

  <path d="M377 428h80" stroke="#76b900" stroke-width="5" stroke-linecap="round"/>
  <path d="M444 416l18 12-18 12" fill="none" stroke="#76b900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M748 428h66" stroke="#42d6b5" stroke-width="5" stroke-linecap="round"/>
  <path d="M801 416l18 12-18 12" fill="none" stroke="#42d6b5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f96a8">heracles-jo.github.io</text>
