<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell 요청 처리 아키텍처</title>
  <desc id="desc">에이전트 요청이 sandbox kernel 경계, supervisor 정책 검사, 승인된 외부 API로 이어지는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 3L0 6Z" fill="#167c6c"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f4f8f8"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#102a35">요청은 sandbox 밖에서 승인되고 자격증명은 마지막에 붙는다</text>
  <text x="60" y="106" font-family="Arial, sans-serif" font-size="18" fill="#536c77">direct egress를 닫고 process identity, destination, API operation을 함께 검사하는 흐름</text>

  <g filter="url(#s)">
    <rect x="55" y="160" width="420" height="480" rx="28" fill="#e8f0f3" stroke="#8da8b4" stroke-width="2"/>
    <text x="85" y="205" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#23404d">UNTRUSTED SANDBOX BOUNDARY</text>
    <rect x="100" y="250" width="330" height="110" rx="20" fill="#fff" stroke="#9db4bf" stroke-width="2"/>
    <text x="265" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#183642">AI agent process</text>
    <text x="265" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#627985">non-root · no capabilities</text>

    <rect x="100" y="410" width="330" height="150" rx="20" fill="#102f2e"/>
    <text x="265" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#dff8ee">Sandbox runtime</text>
    <text x="130" y="494" font-family="Arial, sans-serif" font-size="17" fill="#a9dfcf">• Landlock filesystem</text>
    <text x="130" y="524" font-family="Arial, sans-serif" font-size="17" fill="#a9dfcf">• seccomp TCP / DNS mediation</text>
    <text x="130" y="554" font-family="Arial, sans-serif" font-size="17" fill="#a9dfcf">• executable identity observation</text>
  </g>

  <g filter="url(#s)">
    <rect x="550" y="205" width="270" height="390" rx="28" fill="#fff" stroke="#76b900" stroke-width="3"/>
    <text x="685" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#315207">Trusted supervisor</text>
    <rect x="590" y="292" width="190" height="58" rx="14" fill="#edf7dc"/>
    <text x="685" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#385b0a">Policy decision</text>
    <rect x="590" y="372" width="190" height="58" rx="14" fill="#e3f5f1"/>
    <text x="685" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#126a5c">L7 inspection</text>
    <rect x="590" y="452" width="190" height="58" rx="14" fill="#e7eef8"/>
    <text x="685" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#315b8c">Credential injection</text>
    <text x="685" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7b82">DNS resolution · upstream relay</text>
  </g>

  <g filter="url(#s)">
    <rect x="895" y="175" width="250" height="190" rx="24" fill="#fff" stroke="#58a99a" stroke-width="2"/>
    <text x="1020" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183642">Approved service</text>
    <text x="1020" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#536c77">host + port</text>
    <text x="1020" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#536c77">method + path / tool</text>
    <text x="1020" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#167c6c">scoped credential</text>

    <rect x="895" y="435" width="250" height="150" rx="24" fill="#fff1ef" stroke="#d77d70" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1020" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8f3128">Direct egress</text>
    <text x="1020" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a94a40">DENIED</text>
    <text x="1020" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7f5b58">outer network fence</text>
  </g>

  <path d="M430 485H540" fill="none" stroke="#167c6c" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="485" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#536c77">mTLS sandbox protocol</text>
  <path d="M820 295H885" fill="none" stroke="#167c6c" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="852" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#536c77">allowed</text>
  <path d="M475 590C650 680 820 670 930 585" fill="none" stroke="#c64d43" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="915" y1="575" x2="940" y2="600" stroke="#c64d43" stroke-width="6"/>
  <line x1="940" y1="575" x2="915" y2="600" stroke="#c64d43" stroke-width="6"/>

  <rect x="60" y="680" width="1080" height="44" rx="15" fill="#dfeaec"/>
  <text x="600" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#294955">Gateway: lifecycle · policy/provider state · user authorization · logs</text>
</svg>
