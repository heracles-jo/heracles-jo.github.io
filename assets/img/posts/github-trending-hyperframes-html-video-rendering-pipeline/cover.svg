<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HTML 기반 비디오 렌더링 파이프라인</title>
  <desc id="desc">HTML, CSS, 미디어 자산이 헤드리스 브라우저와 FFmpeg 렌더러를 거쳐 결정적 MP4 산출물로 변환되는 HyperFrames 분석 커버</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="52%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="150" fill="#38bdf8" opacity="0.11"/>
  <circle cx="130" cy="560" r="210" fill="#a78bfa" opacity="0.12"/>
  <g transform="translate(88 82)" filter="url(#shadow)">
    <rect x="0" y="0" width="465" height="360" rx="28" fill="#0f172a" stroke="#334155"/>
    <rect x="0" y="0" width="465" height="58" rx="28" fill="#1e293b"/>
    <circle cx="34" cy="29" r="7" fill="#fb7185"/>
    <circle cx="58" cy="29" r="7" fill="#fbbf24"/>
    <circle cx="82" cy="29" r="7" fill="#34d399"/>
    <text x="34" y="110" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">&lt;div data-composition&gt;</text>
    <text x="58" y="154" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">CSS · GSAP · Lottie</text>
    <text x="58" y="198" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">data-start="1"</text>
    <text x="58" y="242" fill="#bae6fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">track-index="2"</text>
    <text x="34" y="304" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">&lt;/div&gt;</text>
  </g>
  <g transform="translate(607 103)">
    <path d="M0 154h96" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M72 119l49 35-49 35" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(765 82)" filter="url(#shadow)">
    <rect width="330" height="360" rx="30" fill="#020617" stroke="#475569"/>
    <rect x="34" y="38" width="262" height="148" rx="18" fill="#111827" stroke="#334155"/>
    <polygon points="140,78 140,146 199,112" fill="#38bdf8"/>
    <rect x="36" y="228" width="258" height="12" rx="6" fill="#334155"/>
    <rect x="36" y="228" width="176" height="12" rx="6" fill="#a78bfa"/>
    <rect x="36" y="267" width="72" height="46" rx="10" fill="#1e40af"/>
    <rect x="124" y="267" width="72" height="46" rx="10" fill="#0e7490"/>
    <rect x="212" y="267" width="72" height="46" rx="10" fill="#6d28d9"/>
  </g>
  <text x="88" y="505" fill="#ffffff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="48" font-weight="800">HyperFrames와 HTML 네이티브 비디오</text>
  <text x="90" y="556" fill="#cbd5e1" font-family="Inter, Pretendard, Arial, sans-serif" font-size="25">브라우저 렌더링을 CI 가능한 영상 생산 파이프라인으로 바꾸는 흐름</text>
</svg>
