<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">HyperFrames 비디오 렌더링 파이프라인</title>
  <desc id="desc">HTML 조합, 시간 속성, 브라우저 프리뷰, 헤드리스 Chrome 프레임 캡처, FFmpeg 인코딩, CI 검증으로 이어지는 운영 흐름</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="28" fill="#f8fafc"/>
  <text x="54" y="62" font-family="Inter, Pretendard, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">HTML 네이티브 비디오의 운영 파이프라인</text>
  <text x="54" y="98" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" fill="#475569">웹 작성 모델을 유지하되, 산출물은 결정적 MP4와 검증 가능한 빌드 증거로 관리한다.</text>
  <g font-family="Inter, Pretendard, Arial, sans-serif">
    <g transform="translate(54 150)">
      <rect width="160" height="110" rx="18" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="24" y="42" font-size="21" font-weight="700" fill="#075985">HTML/CSS</text>
      <text x="24" y="74" font-size="15" fill="#0f172a">브랜드 토큰</text>
      <text x="24" y="94" font-size="15" fill="#0f172a">미디어 자산</text>
    </g>
    <g transform="translate(264 150)">
      <rect width="160" height="110" rx="18" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="24" y="42" font-size="21" font-weight="700" fill="#5b21b6">타임라인</text>
      <text x="24" y="74" font-size="15" fill="#0f172a">data-start</text>
      <text x="24" y="94" font-size="15" fill="#0f172a">track-index</text>
    </g>
    <g transform="translate(474 150)">
      <rect width="160" height="110" rx="18" fill="#dcfce7" stroke="#22c55e"/>
      <text x="24" y="42" font-size="21" font-weight="700" fill="#166534">브라우저</text>
      <text x="24" y="74" font-size="15" fill="#0f172a">프리뷰</text>
      <text x="24" y="94" font-size="15" fill="#0f172a">seekable animation</text>
    </g>
    <g transform="translate(684 150)">
      <rect width="160" height="110" rx="18" fill="#fff7ed" stroke="#fb923c"/>
      <text x="24" y="42" font-size="21" font-weight="700" fill="#9a3412">렌더러</text>
      <text x="24" y="74" font-size="15" fill="#0f172a">Headless Chrome</text>
      <text x="24" y="94" font-size="15" fill="#0f172a">FFmpeg encode</text>
    </g>
    <g transform="translate(894 150)">
      <rect width="160" height="110" rx="18" fill="#f1f5f9" stroke="#64748b"/>
      <text x="24" y="42" font-size="21" font-weight="700" fill="#334155">운영화</text>
      <text x="24" y="74" font-size="15" fill="#0f172a">CI snapshot</text>
      <text x="24" y="94" font-size="15" fill="#0f172a">MP4 배포</text>
    </g>
    <path d="M224 205h30" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M434 205h30" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M644 205h30" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M854 205h30" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <rect x="54" y="330" width="992" height="112" rx="22" fill="#0f172a"/>
  <text x="86" y="374" font-family="Inter, Pretendard, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">실무 판단의 핵심</text>
  <text x="86" y="410" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17" fill="#cbd5e1">좋은 도구인지를 묻기 전에, 스크립트·소스 자산·렌더 결과·검수 로그를 같은 변경 관리 체계로 묶을 수 있는지를 검증해야 한다.</text>
</svg>
