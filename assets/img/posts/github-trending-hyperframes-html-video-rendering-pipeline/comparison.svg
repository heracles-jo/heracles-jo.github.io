<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">HyperFrames, Remotion, Manim, FFmpeg 비교</title>
  <desc id="desc">프로그램형 비디오 제작 도구를 작성 모델, 검증성, 운영 난이도 관점에서 비교하는 매트릭스</desc>
  <rect width="1100" height="560" rx="28" fill="#ffffff"/>
  <text x="54" y="64" font-family="Inter, Pretendard, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">프로그램형 비디오 도구 선택 매트릭스</text>
  <text x="54" y="100" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18" fill="#475569">렌더링 품질보다 먼저 작성 모델, 팀 역량, CI 검증 가능성을 비교해야 한다.</text>
  <g transform="translate(54 140)" font-family="Inter, Pretendard, Arial, sans-serif">
    <rect width="992" height="56" rx="16" fill="#0f172a"/>
    <text x="28" y="36" font-size="17" font-weight="700" fill="#e2e8f0">도구</text>
    <text x="220" y="36" font-size="17" font-weight="700" fill="#e2e8f0">작성 모델</text>
    <text x="455" y="36" font-size="17" font-weight="700" fill="#e2e8f0">강점</text>
    <text x="745" y="36" font-size="17" font-weight="700" fill="#e2e8f0">주의점</text>
    <g transform="translate(0 76)">
      <rect width="992" height="70" rx="14" fill="#eff6ff"/>
      <text x="28" y="43" font-size="19" font-weight="800" fill="#1d4ed8">HyperFrames</text>
      <text x="220" y="33" font-size="16" fill="#0f172a">HTML + CSS +</text><text x="220" y="55" font-size="16" fill="#0f172a">seekable animation</text>
      <text x="455" y="33" font-size="16" fill="#0f172a">웹 자산 재사용, 결정적 렌더,</text><text x="455" y="55" font-size="16" fill="#0f172a">에이전트/CI 친화성</text>
      <text x="745" y="33" font-size="16" fill="#0f172a">초기 생태계, 브라우저 의존,</text><text x="745" y="55" font-size="16" fill="#0f172a">미디어 저작권 관리 필요</text>
    </g>
    <g transform="translate(0 158)">
      <rect width="992" height="70" rx="14" fill="#f8fafc"/>
      <text x="28" y="43" font-size="19" font-weight="800" fill="#334155">Remotion</text>
      <text x="220" y="43" font-size="16" fill="#0f172a">React 컴포넌트</text>
      <text x="455" y="33" font-size="16" fill="#0f172a">성숙한 React 생태계,</text><text x="455" y="55" font-size="16" fill="#0f172a">Lambda 렌더링 경험</text>
      <text x="745" y="33" font-size="16" fill="#0f172a">React/번들러 역량 필요,</text><text x="745" y="55" font-size="16" fill="#0f172a">라이선스 조건 검토</text>
    </g>
    <g transform="translate(0 240)">
      <rect width="992" height="70" rx="14" fill="#f8fafc"/>
      <text x="28" y="43" font-size="19" font-weight="800" fill="#334155">Manim</text>
      <text x="220" y="43" font-size="16" fill="#0f172a">Python 장면 코드</text>
      <text x="455" y="33" font-size="16" fill="#0f172a">수학·교육 애니메이션,</text><text x="455" y="55" font-size="16" fill="#0f172a">정밀한 장면 제어</text>
      <text x="745" y="33" font-size="16" fill="#0f172a">브랜드/웹 디자인 재사용은</text><text x="745" y="55" font-size="16" fill="#0f172a">별도 추상화 필요</text>
    </g>
    <g transform="translate(0 322)">
      <rect width="992" height="70" rx="14" fill="#f8fafc"/>
      <text x="28" y="43" font-size="19" font-weight="800" fill="#334155">FFmpeg</text>
      <text x="220" y="43" font-size="16" fill="#0f172a">필터 그래프/CLI</text>
      <text x="455" y="33" font-size="16" fill="#0f172a">강력한 인코딩·합성,</text><text x="455" y="55" font-size="16" fill="#0f172a">표준 운영 도구</text>
      <text x="745" y="33" font-size="16" fill="#0f172a">콘텐츠 작성 추상화가 낮아</text><text x="745" y="55" font-size="16" fill="#0f172a">템플릿화 비용이 큼</text>
    </g>
  </g>
</svg>
