<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Coolify 단계적 도입과 중단 기준</title>
  <desc id="desc">개발 환경에서 비핵심 운영과 제한적 프로덕션으로 승격하며 배포, 보안, 복구 증거를 확인하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#172033">배포 성공보다 제어면 상실과 복구를 먼저 시험한다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 110)"><rect width="285" height="150" rx="20" fill="#4f46e5"/><text x="142" y="40" text-anchor="middle" fill="white" font-size="23" font-weight="700">1. 개발·Preview</text><text x="142" y="78" text-anchor="middle" fill="#e0e7ff" font-size="17">build path · cleanup</text><text x="142" y="106" text-anchor="middle" fill="#e0e7ff" font-size="17">SHA · digest · health check</text><text x="142" y="132" text-anchor="middle" fill="#fef3c7" font-size="16">artifact 재현성</text></g>
    <g transform="translate(457 110)"><rect width="285" height="150" rx="20" fill="#2563eb"/><text x="142" y="40" text-anchor="middle" fill="white" font-size="23" font-weight="700">2. 비핵심 운영</text><text x="142" y="78" text-anchor="middle" fill="#dbeafe" font-size="17">patch · proxy · backup</text><text x="142" y="106" text-anchor="middle" fill="#dbeafe" font-size="17">disk · Docker · SSH rotation</text><text x="142" y="132" text-anchor="middle" fill="#fef3c7" font-size="16">당직 runbook 검증</text></g>
    <g transform="translate(845 110)"><rect width="285" height="150" rx="20" fill="#0f766e"/><text x="142" y="40" text-anchor="middle" fill="white" font-size="23" font-weight="700">3. 제한적 Production</text><text x="142" y="78" text-anchor="middle" fill="#ccfbf1" font-size="17">낮은 RTO·RPO 위험</text><text x="142" y="106" text-anchor="middle" fill="#ccfbf1" font-size="17">rollback · restore drill</text><text x="142" y="132" text-anchor="middle" fill="#fef3c7" font-size="16">자동 검증 후 확대</text></g>
    <path d="M355 185h102M742 185h103" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(105 350)"><rect width="990" height="120" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="495" y="38" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="700">승격 게이트</text><text x="495" y="73" text-anchor="middle" fill="#475569" font-size="18">제어면 중단 중 앱 생존 → DB dump + APP_KEY + SSH key 복원 → workload 데이터 복원</text><text x="495" y="101" text-anchor="middle" fill="#475569" font-size="18">API role · IP 제한 → proxy 긴 연결 → image digest → patch와 rollback 시간 측정</text></g>

    <g transform="translate(105 565)"><rect width="460" height="120" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="230" y="38" text-anchor="middle" fill="#991b1b" font-size="23" font-weight="800">중단</text><text x="230" y="72" text-anchor="middle" fill="#7f1d1d" font-size="17">복원 불가 · broad admin · mutable artifact</text><text x="230" y="98" text-anchor="middle" fill="#7f1d1d" font-size="17">관리형 절감액보다 당직 비용이 큼</text></g>
    <g transform="translate(635 565)"><rect width="460" height="120" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="230" y="38" text-anchor="middle" fill="#166534" font-size="23" font-weight="800">승격</text><text x="230" y="72" text-anchor="middle" fill="#14532d" font-size="17">독립 복구 · 최소 권한 · digest 추적</text><text x="230" y="98" text-anchor="middle" fill="#14532d" font-size="17">다른 당직자도 runbook으로 복구</text></g>
    <path d="M420 470v95M780 470v95" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
