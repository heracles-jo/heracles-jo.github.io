<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">C++ 포맷팅 전환 아키텍처</title>
  <desc id="desc">호출부가 프로젝트 포맷 어댑터를 통해 fmt 또는 표준 라이브러리 백엔드로 연결되고 테스트가 출력을 검증하는 구조</desc>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">포맷 문법과 백엔드를 분리하는 전환 구조</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="130" width="270" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="195" y="172" font-size="25" font-weight="700" fill="#1e3a8a">호출부</text><text x="195" y="204" font-size="19" fill="#334155">로그 · CLI · 파일 출력</text>
    <rect x="465" y="120" width="270" height="120" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="4"/><text x="600" y="167" font-size="25" font-weight="700" fill="#164e63">프로젝트 어댑터</text><text x="600" y="201" font-size="19" fill="#334155">format / print / runtime</text>
    <rect x="870" y="80" width="270" height="100" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1005" y="122" font-size="24" font-weight="700" fill="#4c1d95">{fmt} backend</text><text x="1005" y="152" font-size="18" fill="#334155">C++11+ · 확장 API</text>
    <rect x="870" y="220" width="270" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1005" y="262" font-size="24" font-weight="700" fill="#14532d">std backend</text><text x="1005" y="292" font-size="18" fill="#334155">C++20/23 · 표준 라이브러리</text>
    <path d="M330 180h115" stroke="#2563eb" stroke-width="5"/><path d="m435 168 20 12-20 12" fill="none" stroke="#2563eb" stroke-width="5"/>
    <path d="M735 160h115L870 130" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M735 200h115l20 70" fill="none" stroke="#16a34a" stroke-width="5"/>
    <rect x="160" y="410" width="880" height="235" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
    <text x="600" y="460" font-size="26" font-weight="700" fill="#0f172a">동일 corpus로 검증할 계약</text>
    <g text-anchor="start" font-size="21" fill="#334155">
      <text x="220" y="510">• 정수·부동소수점·날짜·range 출력 golden test</text>
      <text x="220" y="550">• compile-time 오류와 runtime format_error 경로</text>
      <text x="220" y="590">• locale · UTF-8 · Windows 콘솔 · 예외 정책</text>
      <text x="220" y="630">• 바이너리 크기 · 빌드 시간 · 처리량 · tail latency</text>
    </g>
    <path d="M600 410V270" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8"/><path d="m588 285 12-20 12 20" fill="none" stroke="#64748b" stroke-width="4"/>
  </g>
</svg>
