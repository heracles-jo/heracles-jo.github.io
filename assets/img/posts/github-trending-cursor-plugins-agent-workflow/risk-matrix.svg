<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Cursor Plugins 도입 판단</title><desc id="desc">도입 판단 매트릭스</desc><rect width="1200" height="760" fill="#f8fafc"/><rect x="50" y="48" width="1100" height="90" rx="24" fill="#0f172a"/><text x="82" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#e0f2fe">Cursor Plugins 도입 판단</text><text x="82" y="120" font-family="Arial,sans-serif" font-size="18" fill="#cbd5e1">장점과 리스크를 함께 보는 실무 검토표</text><g font-family="Arial,sans-serif"><rect x="70" y="165" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="203" font-size="23" font-weight="800" fill="#0f172a">라이선스</text><text x="365" y="200" font-size="18" fill="#166534">사용 조건을 먼저 확인</text><text x="365" y="233" font-size="18" fill="#9f1239">명시 부재 시 기업 사용 보류</text></g><g font-family="Arial,sans-serif"><rect x="70" y="283" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="321" font-size="23" font-weight="800" fill="#0f172a">종속성</text><text x="365" y="318" font-size="18" fill="#166534">IDE 경험과 깊게 통합</text><text x="365" y="351" font-size="18" fill="#9f1239">다중 IDE 조직은 범용 계층 필요</text></g><g font-family="Arial,sans-serif"><rect x="70" y="401" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="439" font-size="23" font-weight="800" fill="#0f172a">권한</text><text x="365" y="436" font-size="18" fill="#166534">자동화 범위 확장 가능</text><text x="365" y="469" font-size="18" fill="#9f1239">위험 명령·비밀 접근 통제 필요</text></g></svg>