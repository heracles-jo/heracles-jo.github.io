<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Model Optimizer 양자화 배포 워크플로</title>
  <desc id="desc">기준 모델, 교정 데이터, 최적화 상태, 배포 체크포인트와 런타임 검증 사이의 경계</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8f3"/><stop offset="1" stop-color="#e7f3eb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#347c42"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#153c20">양자화는 변환이 아니라 모델 릴리스 파이프라인이다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 122)"><rect width="240" height="154" rx="18" fill="#fff" stroke="#76b900" stroke-width="3"/><text x="120" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#183c21">기준 모델</text><text x="24" y="79" font-size="17" fill="#41674a">revision · tokenizer</text><text x="24" y="108" font-size="17" fill="#41674a">BF16/FP16 평가</text><text x="24" y="137" font-size="17" fill="#41674a">prompt 계약</text></g>
    <g transform="translate(360 122)"><rect width="240" height="154" rx="18" fill="#fff" stroke="#76b900" stroke-width="3"/><text x="120" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#183c21">교정 · 학습</text><text x="24" y="79" font-size="17" fill="#41674a">대표 trace · seed</text><text x="24" y="108" font-size="17" fill="#41674a">PTQ · QAT · QAD</text><text x="24" y="137" font-size="17" fill="#41674a">recipe · quantizer state</text></g>
    <g transform="translate(660 122)"><rect width="240" height="154" rx="18" fill="#fff" stroke="#46b88b" stroke-width="3"/><text x="120" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#183c21">배포 checkpoint</text><text x="24" y="79" font-size="17" fill="#41674a">tensor · scale · metadata</text><text x="24" y="108" font-size="17" fill="#41674a">export backend</text><text x="24" y="137" font-size="17" fill="#41674a">artifact digest</text></g>
    <g transform="translate(960 122)"><rect width="180" height="154" rx="18" fill="#fff" stroke="#46b88b" stroke-width="3"/><text x="90" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#183c21">추론 runtime</text><text x="22" y="79" font-size="17" fill="#41674a">TensorRT-LLM</text><text x="22" y="108" font-size="17" fill="#41674a">vLLM · SGLang</text><text x="22" y="137" font-size="17" fill="#41674a">kernel · fallback</text></g>
    <path d="M302 199H350" stroke="#347c42" stroke-width="5" marker-end="url(#arrow)"/><path d="M602 199H650" stroke="#347c42" stroke-width="5" marker-end="url(#arrow)"/><path d="M902 199H950" stroke="#347c42" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="600" y="334" text-anchor="middle" font-size="22" font-weight="700" fill="#285b34">각 화살표는 의미가 바뀔 수 있는 검증 경계다</text>
    <g transform="translate(70 380)"><rect width="1060" height="294" rx="22" fill="#173d24"/><text x="36" y="48" font-size="24" font-weight="700" fill="#a7e86f">릴리스 manifest에 남길 항목</text>
      <g fill="#e8f6eb" font-size="18"><text x="48" y="92">01  base model · tokenizer revision · prompt template</text><text x="48" y="130">02  calibration dataset · sampling seed · 제외 layer와 expert</text><text x="48" y="168">03  ModelOpt version · recipe hash · PTQ/QAT/QAD 상태</text><text x="48" y="206">04  tensor coverage · quantization metadata · checkpoint digest</text><text x="48" y="244">05  runtime/container · GPU/driver · 품질·지연·메모리 평가 결과</text></g>
      <rect x="666" y="72" width="344" height="174" rx="18" fill="#245b36" stroke="#76b900" stroke-width="2"/><text x="838" y="111" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">조용한 실패를 막는 gate</text><text x="695" y="150" font-size="17" fill="#d8f0df">• unquantized fallback 탐지</text><text x="695" y="182" font-size="17" fill="#d8f0df">• 누락 tensor · scale 비교</text><text x="695" y="214" font-size="17" fill="#d8f0df">• reload 후 기능 동등성</text></g>
  </g>
</svg>
