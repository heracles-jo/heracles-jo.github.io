<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">LLM 양자화 배포 의사결정 게이트</title>
  <desc id="desc">품질, artifact, runtime, 성능, 재현성과 공급망을 순서대로 검증하는 체크리스트</desc>
  <rect width="1200" height="760" rx="28" fill="#0d1c14"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#fff">압축률보다 먼저 통과해야 할 6개 게이트</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="19" fill="#a8c9b1">하나라도 실패하면 checkpoint를 승격하지 않고 원인을 분리한다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 150)"><rect width="335" height="160" rx="20" fill="#183624" stroke="#76b900" stroke-width="2"/><circle cx="48" cy="48" r="25" fill="#76b900"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="#102016">1</text><text x="88" y="54" font-size="23" font-weight="700" fill="#fff">품질</text><text x="28" y="96" font-size="17" fill="#cfe6d5">업무 성공률 · 형식 오류 · 거부율</text><text x="28" y="127" font-size="17" fill="#cfe6d5">언어·장문·도구 호출 회귀</text></g>
    <g transform="translate(432 150)"><rect width="335" height="160" rx="20" fill="#183624" stroke="#76b900" stroke-width="2"/><circle cx="48" cy="48" r="25" fill="#76b900"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="#102016">2</text><text x="88" y="54" font-size="23" font-weight="700" fill="#fff">Artifact 완전성</text><text x="28" y="96" font-size="17" fill="#cfe6d5">tensor · expert · scale coverage</text><text x="28" y="127" font-size="17" fill="#cfe6d5">reload와 metadata diff</text></g>
    <g transform="translate(805 150)"><rect width="335" height="160" rx="20" fill="#183624" stroke="#58d0a2" stroke-width="2"/><circle cx="48" cy="48" r="25" fill="#58d0a2"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="#102016">3</text><text x="88" y="54" font-size="23" font-weight="700" fill="#fff">Runtime 계약</text><text x="28" y="96" font-size="17" fill="#cfe6d5">kernel 지원 · load 경고</text><text x="28" y="127" font-size="17" fill="#cfe6d5">고정밀 fallback 없음</text></g>
    <g transform="translate(60 350)"><rect width="335" height="160" rx="20" fill="#183624" stroke="#58d0a2" stroke-width="2"/><circle cx="48" cy="48" r="25" fill="#58d0a2"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="#102016">4</text><text x="88" y="54" font-size="23" font-weight="700" fill="#fff">성능 · 비용</text><text x="28" y="96" font-size="17" fill="#cfe6d5">TTFT · TPOT · p95 · VRAM</text><text x="28" y="127" font-size="17" fill="#cfe6d5">GPU 시간과 전력의 순이익</text></g>
    <g transform="translate(432 350)"><rect width="335" height="160" rx="20" fill="#183624" stroke="#e2c54b" stroke-width="2"/><circle cx="48" cy="48" r="25" fill="#e2c54b"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1a08">5</text><text x="88" y="54" font-size="23" font-weight="700" fill="#fff">재현성 · 업그레이드</text><text x="28" y="96" font-size="17" fill="#cfe6d5">manifest 재생성 · seed 편차</text><text x="28" y="127" font-size="17" fill="#cfe6d5">minor release 회귀 · rollback</text></g>
    <g transform="translate(805 350)"><rect width="335" height="160" rx="20" fill="#183624" stroke="#e2c54b" stroke-width="2"/><circle cx="48" cy="48" r="25" fill="#e2c54b"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1a08">6</text><text x="88" y="54" font-size="23" font-weight="700" fill="#fff">공급망 · 라이선스</text><text x="28" y="96" font-size="17" fill="#cfe6d5">wheel · container · model digest</text><text x="28" y="127" font-size="17" fill="#cfe6d5">SBOM · dataset · 배포 조건</text></g>
    <path d="M120 566H1080" stroke="#315b3d" stroke-width="2"/>
    <rect x="180" y="602" width="840" height="92" rx="46" fill="#76b900"/><text x="600" y="640" text-anchor="middle" font-size="24" font-weight="800" fill="#102016">승격 조건</text><text x="600" y="670" text-anchor="middle" font-size="18" fill="#172c1c">품질 기준 유지 + 실제 workload의 SLO·비용 개선 + 즉시 롤백 가능</text>
  </g>
</svg>
