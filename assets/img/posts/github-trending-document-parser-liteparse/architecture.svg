<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">LiteParse 실무 아키텍처</title><desc id="desc">PDF 파싱과 RAG 데이터 파이프라인</desc><rect width="1200" height="760" fill="#f8fafc"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#0f172a">LiteParse 실무 아키텍처</text><text x="70" y="120" font-family="Arial,sans-serif" font-size="20" fill="#475569">PDF 파싱과 RAG 데이터 파이프라인</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><g font-family="Arial,sans-serif"><path d="M270 265H350" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><g transform="translate(70 190)"><rect width="190" height="150" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="95" y="52" text-anchor="middle" font-size="25" font-weight="800" fill="#1e3a8a">PDF</text><text x="95" y="90" text-anchor="middle" font-size="16" fill="#1e3a8a">문서 입력</text><text x="95" y="118" text-anchor="middle" font-size="16" fill="#1e3a8a">메타데이터</text></g><path d="M560 265H640" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><g transform="translate(360 190)"><rect width="190" height="150" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="95" y="52" text-anchor="middle" font-size="25" font-weight="800" fill="#115e59">Parse</text><text x="95" y="90" text-anchor="middle" font-size="16" fill="#115e59">공간 텍스트</text><text x="95" y="118" text-anchor="middle" font-size="16" fill="#115e59">bounding box</text></g><path d="M850 265H930" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><g transform="translate(650 190)"><rect width="190" height="150" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="95" y="52" text-anchor="middle" font-size="25" font-weight="800" fill="#92400e">Chunk</text><text x="95" y="90" text-anchor="middle" font-size="16" fill="#92400e">Markdown</text><text x="95" y="118" text-anchor="middle" font-size="16" fill="#92400e">분할/정제</text></g><g transform="translate(940 190)"><rect width="190" height="150" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="95" y="52" text-anchor="middle" font-size="25" font-weight="800" fill="#5b21b6">Index</text><text x="95" y="90" text-anchor="middle" font-size="16" fill="#5b21b6">검색/RAG</text><text x="95" y="118" text-anchor="middle" font-size="16" fill="#5b21b6">질의 응답</text></g><g transform="translate(130 440)"><rect width="940" height="180" rx="24" fill="#0f172a"/><text x="38" y="55" font-size="28" font-weight="800" fill="#e0f2fe">운영 통제면</text><text x="38" y="98" font-size="20" fill="#cbd5e1">• 품질 지표와 실패 케이스를 별도로 기록</text><text x="38" y="132" font-size="20" fill="#cbd5e1">• 비용·지연 시간·권한 정책을 함께 검증</text><text x="520" y="98" font-size="20" fill="#cbd5e1">• 기존 도구와 병행하는 fallback 설계</text><text x="520" y="132" font-size="20" fill="#cbd5e1">• 라이선스와 유지보수 상태 확인</text></g></g></svg>