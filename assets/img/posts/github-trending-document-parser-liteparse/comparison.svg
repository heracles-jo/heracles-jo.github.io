<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">LiteParse 도입 판단</title><desc id="desc">도입 판단 매트릭스</desc><rect width="1200" height="760" fill="#f8fafc"/><rect x="50" y="48" width="1100" height="90" rx="24" fill="#0f172a"/><text x="82" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#e0f2fe">LiteParse 도입 판단</text><text x="82" y="120" font-family="Arial,sans-serif" font-size="18" fill="#cbd5e1">장점과 리스크를 함께 보는 실무 검토표</text><g font-family="Arial,sans-serif"><rect x="70" y="165" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="203" font-size="23" font-weight="800" fill="#0f172a">LiteParse</text><text x="365" y="200" font-size="18" fill="#166534">가볍고 빠른 로컬 PDF 파싱</text><text x="365" y="233" font-size="18" fill="#9f1239">복잡한 표·스캔 문서는 한계 가능</text></g><g font-family="Arial,sans-serif"><rect x="70" y="283" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="321" font-size="23" font-weight="800" fill="#0f172a">Python 파서</text><text x="365" y="318" font-size="18" fill="#166534">성숙한 생태계와 유연성</text><text x="365" y="351" font-size="18" fill="#9f1239">통합성과 성능은 별도 검증</text></g><g font-family="Arial,sans-serif"><rect x="70" y="401" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="439" font-size="23" font-weight="800" fill="#0f172a">Cloud Parser</text><text x="365" y="436" font-size="18" fill="#166534">OCR·표·레이아웃 강점</text><text x="365" y="469" font-size="18" fill="#9f1239">비용과 데이터 반출 검토 필요</text></g></svg>