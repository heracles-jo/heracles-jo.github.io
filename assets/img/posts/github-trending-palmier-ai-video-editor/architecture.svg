<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">AI video editing architecture</title>
  <desc id="desc">Architecture diagram showing local editor, MCP agent interface, generative model backend, and operational controls.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#faf5ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1100" height="620" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Palmier Pro AI 영상 편집 아키텍처</text>
  <text x="60" y="108" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="18" fill="#475569">타임라인 편집기, MCP 에이전트, 생성형 영상 백엔드, 운영 통제를 분리해 검증한다.</text>
  <g font-family="Inter, Apple SD Gothic Neo, sans-serif">
    <rect x="60" y="160" width="250" height="300" rx="24" fill="url(#panel)" stroke="#bfdbfe" stroke-width="2"/>
    <text x="90" y="210" font-size="24" font-weight="800" fill="#1e3a8a">Local Editor</text>
    <text x="90" y="246" font-size="17" fill="#334155">Swift macOS 앱</text>
    <text x="90" y="278" font-size="17" fill="#334155">프로젝트·미디어 관리</text>
    <text x="90" y="310" font-size="17" fill="#334155">타임라인·프리뷰</text>
    <text x="90" y="342" font-size="17" fill="#334155">Export / XML 경로</text>
    <rect x="90" y="380" width="190" height="44" rx="12" fill="#dbeafe"/>
    <text x="120" y="408" font-size="17" font-weight="700" fill="#1d4ed8">Human-in-the-loop</text>

    <rect x="425" y="160" width="250" height="300" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="455" y="210" font-size="24" font-weight="800" fill="#9a3412">MCP / Agent</text>
    <text x="455" y="246" font-size="17" fill="#334155">127.0.0.1:19789/mcp</text>
    <text x="455" y="278" font-size="17" fill="#334155">Claude / Codex / Cursor</text>
    <text x="455" y="310" font-size="17" fill="#334155">도구 호출과 편집 요청</text>
    <text x="455" y="342" font-size="17" fill="#334155">권한·감사 범위 필요</text>
    <rect x="455" y="380" width="190" height="44" rx="12" fill="#ffedd5"/>
    <text x="495" y="408" font-size="17" font-weight="700" fill="#c2410c">Automation layer</text>

    <rect x="790" y="160" width="250" height="300" rx="24" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2"/>
    <text x="820" y="210" font-size="24" font-weight="800" fill="#9d174d">GenAI Backend</text>
    <text x="820" y="246" font-size="17" fill="#334155">영상·이미지 모델</text>
    <text x="820" y="278" font-size="17" fill="#334155">프롬프트 보정</text>
    <text x="820" y="310" font-size="17" fill="#334155">결과 클립 삽입</text>
    <text x="820" y="342" font-size="17" fill="#334155">로그인·구독·외부 처리</text>
    <rect x="820" y="380" width="190" height="44" rx="12" fill="#fce7f3"/>
    <text x="858" y="408" font-size="17" font-weight="700" fill="#be185d">Risk boundary</text>
  </g>
  <path d="M 320 300 C 360 300, 380 300, 415 300" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 685 300 C 725 300, 745 300, 780 300" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 780 350 C 680 520, 340 520, 220 460" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <rect x="60" y="505" width="980" height="70" rx="20" fill="#0f172a"/>
  <text x="90" y="548" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="20" fill="#e2e8f0">실무 검증 포인트: 데이터 반출 · 저작권 · 프로젝트 호환성 · 에이전트 권한 · 비용 추적</text>
</svg>
