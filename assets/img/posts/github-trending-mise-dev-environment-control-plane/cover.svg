<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">mise 기반 개발 환경 컨트롤 플레인</title>
  <desc id="desc">런타임 버전, 환경 변수, 태스크 실행, 보안 검증을 하나의 mise.toml 정책 계층으로 묶는 개발 환경 운영 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="170" fill="#22d3ee" opacity="0.18"/>
  <circle cx="160" cy="560" r="230" fill="#a78bfa" opacity="0.16"/>
  <text x="74" y="92" fill="#93c5fd" font-family="Inter, Pretendard, Arial, sans-serif" font-size="28" font-weight="700">GitHub Trending Analysis</text>
  <text x="74" y="158" fill="#fff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="58" font-weight="800">mise</text>
  <text x="210" y="158" fill="#e0f2fe" font-family="Inter, Pretendard, Arial, sans-serif" font-size="42" font-weight="700">개발 환경 컨트롤 플레인</text>
  <text x="76" y="216" fill="#cbd5e1" font-family="Inter, Pretendard, Arial, sans-serif" font-size="26">런타임 · 환경 변수 · 태스크 · 공급망 검증을 하나의 정책 파일로 운영하기</text>
  <g filter="url(#shadow)">
    <rect x="82" y="286" width="290" height="184" rx="24" fill="url(#card)" stroke="#60a5fa" stroke-opacity="0.45"/>
    <text x="116" y="340" fill="#bfdbfe" font-family="Inter, Pretendard, Arial" font-size="24" font-weight="700">[tools]</text>
    <text x="116" y="386" fill="#fff" font-family="Inter, Pretendard, Arial" font-size="21">node = 24</text>
    <text x="116" y="423" fill="#fff" font-family="Inter, Pretendard, Arial" font-size="21">python = 3.12</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="454" y="248" width="292" height="260" rx="28" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
    <text x="512" y="328" fill="#fff" font-family="Inter, Pretendard, Arial" font-size="42" font-weight="800">mise.toml</text>
    <text x="505" y="380" fill="#c4b5fd" font-family="Inter, Pretendard, Arial" font-size="22">project policy</text>
    <path d="M505 418h190" stroke="#475569" stroke-width="2"/>
    <text x="504" y="460" fill="#e2e8f0" font-family="Inter, Pretendard, Arial" font-size="19">version · env · task · lock</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="824" y="286" width="290" height="184" rx="24" fill="url(#card)" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="858" y="340" fill="#bbf7d0" font-family="Inter, Pretendard, Arial" font-size="24" font-weight="700">[tasks]</text>
    <text x="858" y="386" fill="#fff" font-family="Inter, Pretendard, Arial" font-size="21">build / test / lint</text>
    <text x="858" y="423" fill="#fff" font-family="Inter, Pretendard, Arial" font-size="21">CI와 로컬 동일 실행</text>
  </g>
  <path d="M372 378 C410 378 416 378 454 378" stroke="#93c5fd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M746 378 C786 378 786 378 824 378" stroke="#86efac" stroke-width="5" fill="none"/>
  <g transform="translate(75 548)">
    <rect width="1050" height="42" rx="21" fill="#020617" opacity="0.58"/>
    <text x="26" y="28" fill="#cbd5e1" font-family="Inter, Pretendard, Arial" font-size="18">확인 시점 스냅샷: GitHub Trending daily/weekly, README, docs, release, repository metadata</text>
  </g>
</svg>
