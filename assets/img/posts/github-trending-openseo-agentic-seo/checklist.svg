<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">OpenSEO 도입 체크리스트</title>
  <desc id="desc">셀프호스팅 SEO 도구 도입 전 비용, 보안, 운영, 데이터 품질, AI 에이전트 통제 항목을 점검하는 체크리스트</desc>
  <rect width="1100" height="620" fill="#0f172a"/>
  <circle cx="970" cy="90" r="160" fill="#14b8a6" opacity="0.16"/>
  <circle cx="130" cy="520" r="190" fill="#38bdf8" opacity="0.14"/>
  <text x="70" y="74" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="34" font-weight="800" fill="#e2e8f0">PoC 전에 반드시 확인할 5가지</text>
  <g font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="22" fill="#e2e8f0">
    <g transform="translate(85 135)"><rect width="930" height="72" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/><circle cx="38" cy="36" r="16" fill="#22c55e"/><path d="M30 36 l6 7 l12 -16" stroke="#052e16" stroke-width="4" fill="none" stroke-linecap="round"/><text x="78" y="44">DataForSEO 예산 한도와 캐시 TTL을 먼저 설계한다</text></g>
    <g transform="translate(85 225)"><rect width="930" height="72" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/><circle cx="38" cy="36" r="16" fill="#22c55e"/><path d="M30 36 l6 7 l12 -16" stroke="#052e16" stroke-width="4" fill="none" stroke-linecap="round"/><text x="78" y="44">Cloudflare Access, Docker 프록시 등 인증 경계를 확정한다</text></g>
    <g transform="translate(85 315)"><rect width="930" height="72" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/><circle cx="38" cy="36" r="16" fill="#22c55e"/><path d="M30 36 l6 7 l12 -16" stroke="#052e16" stroke-width="4" fill="none" stroke-linecap="round"/><text x="78" y="44">MCP 호출 로그와 에이전트 권한을 감사 가능하게 남긴다</text></g>
    <g transform="translate(85 405)"><rect width="930" height="72" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/><circle cx="38" cy="36" r="16" fill="#22c55e"/><path d="M30 36 l6 7 l12 -16" stroke="#052e16" stroke-width="4" fill="none" stroke-linecap="round"/><text x="78" y="44">기존 Semrush/Ahrefs 리포트와 지표 정의 차이를 비교한다</text></g>
    <g transform="translate(85 495)"><rect width="930" height="72" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/><circle cx="38" cy="36" r="16" fill="#22c55e"/><path d="M30 36 l6 7 l12 -16" stroke="#052e16" stroke-width="4" fill="none" stroke-linecap="round"/><text x="78" y="44">릴리스·이슈·API 변경을 운영 지표로 모니터링한다</text></g>
  </g>
</svg>
