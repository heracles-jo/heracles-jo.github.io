<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Terraform IaC execution architecture</title>
  <desc id="desc">Terraform 실행 구조를 코드, 상태, 플랜, 프로바이더, 클라우드 API 단계로 나타낸 다이어그램</desc>
  <rect width="1100" height="560" rx="28" fill="#f8fafc"/>
  <text x="55" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">선언형 IaC 실행 구조</text>
  <text x="55" y="92" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">코드 리뷰 가능한 선언 → 상태 비교 → 실행 계획 → Provider API 호출</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#64748b"/></marker></defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 160)"><rect width="170" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="31" y="46" font-size="23" font-weight="700" fill="#4c1d95">HCL 코드</text><text x="24" y="78" font-size="15" fill="#5b21b6">모듈 · 변수 · 정책</text></g>
    <g transform="translate(285 160)"><rect width="170" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="37" y="46" font-size="23" font-weight="700" fill="#075985">State</text><text x="20" y="78" font-size="15" fill="#0369a1">원격 상태 · 락 · 이력</text></g>
    <g transform="translate(515 160)"><rect width="170" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="40" y="46" font-size="23" font-weight="700" fill="#166534">Plan</text><text x="27" y="78" font-size="15" fill="#15803d">변경점 · 의존 그래프</text></g>
    <g transform="translate(745 160)"><rect width="170" height="110" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="25" y="46" font-size="23" font-weight="700" fill="#9a3412">Provider</text><text x="24" y="78" font-size="15" fill="#c2410c">AWS · Azure · SaaS</text></g>
    <g transform="translate(905 365)"><rect width="140" height="82" rx="16" fill="#111827"/><text x="28" y="35" font-size="20" font-weight="700" fill="#fff">Cloud</text><text x="22" y="60" font-size="14" fill="#cbd5e1">실제 리소스</text></g>
    <path d="M225 215 H285" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><path d="M455 215 H515" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><path d="M685 215 H745" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><path d="M830 270 C840 335 880 390 905 405" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="70" y="350" width="710" height="120" rx="20" fill="#fff" stroke="#cbd5e1"/>
    <text x="95" y="388" font-size="22" font-weight="700" fill="#111827">운영 통제 지점</text>
    <text x="95" y="424" font-size="17" fill="#334155">① PR에서 plan 검토 ② backend 권한 분리 ③ provider 버전 고정 ④ drift 탐지 ⑤ apply 승인·감사 로그</text>
  </g>
</svg>
