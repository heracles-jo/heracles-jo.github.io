  <circle cx="650" cy="245" r="86" fill="#be123c" opacity="0.95"/><text x="603" y="238" fill="white">3. 리뷰</text><text x="592" y="266" fill="white">승인 흐름</text>
  <circle cx="870" cy="245" r="86" fill="#047857" opacity="0.95"/><text x="821" y="238" fill="white">4. 평가</text><text x="810" y="266" fill="white">회귀 테스트</text>
</g>
<path d="M296 245h48M516 245h48M736 245h48" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<g font-family="Arial, sans-serif" font-size="18" fill="#e5e7eb">
  <rect x="135" y="390" width="240" height="86" rx="18" fill="#111827" stroke="#38bdf8"/><text x="164" y="424" font-weight="700">운영 모니터링</text><text x="164" y="453" fill="#cbd5e1">로그·DLP·이상 질의 감지</text>
