<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">AI prompt governance operating loop</title><desc id="desc">A governance operating loop for system prompts with inventory, classification, review, evaluation, monitoring, and incident response.</desc>
<rect width="1100" height="560" rx="30" fill="#0b1220"/>
<text x="55" y="68" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#e5e7eb">시스템 프롬프트 운영 루프</text>
<text x="55" y="105" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">숨기는 것보다 중요한 것은 변경·평가·권한·사고대응을 운영 절차로 만드는 일이다.</text>
<g font-family="Arial, sans-serif" font-size="18" font-weight="700">
  <circle cx="210" cy="245" r="86" fill="#1d4ed8" opacity="0.95"/><text x="160" y="238" fill="white">1. 자산</text><text x="146" y="266" fill="white">인벤토리</text>
