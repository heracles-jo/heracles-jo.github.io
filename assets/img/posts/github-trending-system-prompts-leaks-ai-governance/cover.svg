    <rect x="142" y="148" width="410" height="310" rx="24" fill="#020617" opacity="0.72" stroke="#64748b"/>
    <text x="170" y="195" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">SYSTEM PROMPT</text>
    <text x="170" y="238" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">policy: hidden</text>
    <text x="170" y="274" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">tools: restricted</text>
    <text x="170" y="310" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">leak surface: prompt</text>
    <text x="170" y="346" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">leak surface: logs</text>
    <text x="170" y="382" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">control: evals + DLP</text>
    <rect x="648" y="140" width="332" height="76" rx="20" fill="#0f172a" stroke="#38bdf8"/>
    <text x="684" y="188" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="27" font-weight="700">제품 정책 자산</text>
    <rect x="648" y="262" width="332" height="76" rx="20" fill="#0f172a" stroke="#a78bfa"/>
    <text x="682" y="310" fill="#ede9fe" font-family="Arial, sans-serif" font-size="27" font-weight="700">보안·컴플라이언스</text>
    <rect x="648" y="384" width="332" height="76" rx="20" fill="#0f172a" stroke="#fbbf24"/>
