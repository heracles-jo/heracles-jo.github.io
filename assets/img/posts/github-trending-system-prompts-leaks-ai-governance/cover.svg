    <path d="M572 300 C610 300 610 178 648 178" stroke="#67e8f9" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M572 300 C610 300 610 300 648 300" stroke="#c4b5fd" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M572 300 C610 300 610 422 648 422" stroke="#fde68a" stroke-width="5" fill="none" stroke-linecap="round"/>
