<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Design context comparison</title><desc id="desc">Comparison between prompt-only visual guidance, token-only systems, and DESIGN.md.</desc><rect width="1100" height="620" fill="#ffffff"/><text x="60" y="76" font-family="Inter, Arial" font-size="34" font-weight="800" fill="#111827">시각 컨텍스트 전달 방식 비교</text><g font-family="Inter, Arial"><rect x="60" y="125" width="300" height="385" rx="28" fill="#fee2e2"/><text x="95" y="180" font-size="28" font-weight="800" fill="#7f1d1d">프롬프트만 사용</text><text x="95" y="240" font-size="21" fill="#991b1b">• 빠르게 시작 가능</text><text x="95" y="280" font-size="21" fill="#991b1b">• 세션마다 품질 변동</text><text x="95" y="320" font-size="21" fill="#991b1b">• 리뷰·감사 추적 약함</text><rect x="400" y="125" width="300" height="385" rx="28" fill="#e0f2fe"/><text x="435" y="180" font-size="28" font-weight="800" fill="#0c4a6e">토큰만 관리</text><text x="435" y="240" font-size="21" fill="#075985">• 값은 명확함</text><text x="435" y="280" font-size="21" fill="#075985">• 의도와 예외 설명 부족</text><text x="435" y="320" font-size="21" fill="#075985">• 에이전트 해석 여지 큼</text><rect x="740" y="125" width="300" height="385" rx="28" fill="#dcfce7"/><text x="775" y="180" font-size="28" font-weight="800" fill="#14532d">DESIGN.md</text><text x="775" y="240" font-size="21" fill="#166534">• 값과 이유를 함께 보존</text><text x="775" y="280" font-size="21" fill="#166534">• lint/diff로 CI 편입</text><text x="775" y="320" font-size="21" fill="#166534">• 도구 간 공통 컨텍스트</text></g><text x="80" y="570" font-family="Inter, Arial" font-size="22" fill="#475569">핵심은 “AI가 잘 맞히게 하는 것”이 아니라 “반복 가능한 UI 변경 통제면을 만드는 것”이다.</text></svg>