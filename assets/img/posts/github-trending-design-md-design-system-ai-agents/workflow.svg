<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">DESIGN.md workflow</title><desc id="desc">Workflow from design tokens and rationale to lint, diff, export and AI-assisted implementation.</desc><rect width="1100" height="560" fill="#f8fafc"/><text x="55" y="70" font-family="Inter, Arial" font-size="34" font-weight="800" fill="#0f172a">DESIGN.md 실무 흐름</text><g font-family="Inter, Arial" font-size="22" font-weight="700"><rect x="60" y="130" width="220" height="105" rx="22" fill="#dbeafe"/><text x="94" y="175" fill="#1e3a8a">YAML tokens</text><text x="94" y="207" font-size="17" font-weight="500" fill="#1e40af">색상·타이포·간격</text><rect x="330" y="130" width="220" height="105" rx="22" fill="#dcfce7"/><text x="365" y="175" fill="#14532d">Markdown rationale</text><text x="365" y="207" font-size="17" font-weight="500" fill="#166534">브랜드 의도·사용 맥락</text><rect x="600" y="130" width="220" height="105" rx="22" fill="#fef3c7"/><text x="646" y="175" fill="#78350f">lint / diff</text><text x="646" y="207" font-size="17" font-weight="500" fill="#92400e">대비·참조·회귀 점검</text><rect x="870" y="130" width="170" height="105" rx="22" fill="#ede9fe"/><text x="907" y="175" fill="#4c1d95">export</text><text x="907" y="207" font-size="17" font-weight="500" fill="#5b21b6">CSS vars 등</text></g><g stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round"><path d="M280 182h50"/><path d="M550 182h50"/><path d="M820 182h50"/></g><rect x="160" y="330" width="780" height="120" rx="28" fill="#0f172a"/><text x="205" y="382" font-family="Inter, Arial" font-size="28" font-weight="800" fill="#ccfbf1">AI 코딩 도구의 시각 컨텍스트를 파일로 버전 관리</text><text x="205" y="422" font-family="Inter, Arial" font-size="22" fill="#99f6e4">프롬프트 기억에 의존하지 않고 PR, CI, 리뷰 프로세스에 편입</text></svg>