<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GeoLibre cloud-native GIS architecture</title>
  <desc id="desc">Cloud-native GIS platform combining browser, desktop, mobile and Jupyter workflows with local-first geospatial analysis.</desc>
  <defs>
