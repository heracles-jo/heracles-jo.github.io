<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Tailcat 연결 아키텍처</title><desc id="desc">서버 토큰 전달, DERP discovery, WireGuard handshake, 직접 UDP 전환 순서</desc><rect width="1200" height="720" rx="28" fill="#081927"/><text x="60" y="72" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Tailcat: control plane을 대역 외 토큰으로 치환</text>
<g font-family="Arial" text-anchor="middle"><rect x="60" y="130" width="260" height="100" rx="16" fill="#123348" stroke="#34d399" stroke-width="3"/><text x="190" y="173" fill="#fff" font-size="24" font-weight="700">Server</text><text x="190" y="205" fill="#6ee7b7" font-size="17">WireGuard key 생성</text><rect x="470" y="130" width="260" height="100" rx="16" fill="#123348" stroke="#67e8f9" stroke-width="3"/><text x="600" y="173" fill="#fff" font-size="24" font-weight="700">Out-of-band</text><text x="600" y="205" fill="#a5f3fc" font-size="17">tc token 전달</text><rect x="880" y="130" width="260" height="100" rx="16" fill="#123348" stroke="#34d399" stroke-width="3"/><text x="1010" y="173" fill="#fff" font-size="24" font-weight="700">Client</text><text x="1010" y="205" fill="#6ee7b7" font-size="17">token parse</text>
<path d="M320 180h135M730 180h135" stroke="#fbbf24" stroke-width="4" marker-end="url(#a)"/>
<rect x="350" y="320" width="500" height="120" rx="22" fill="#172554" stroke="#818cf8" stroke-width="3"/><text x="600" y="370" fill="#fff" font-size="27" font-weight="700">DERP bootstrap / rendezvous</text><text x="600" y="406" fill="#c7d2fe" font-size="18">Meow discovery · relay fallback</text><path d="M190 240v140h145M1010 240v140H865" fill="none" stroke="#818cf8" stroke-width="4"/>
<rect x="215" y="545" width="770" height="105" rx="52" fill="#064e3b" stroke="#34d399" stroke-width="4"/><text x="600" y="590" fill="#ecfdf5" font-size="26" font-weight="700">WireGuard tunnel</text><text x="600" y="622" fill="#a7f3d0" font-size="18">UDP hole punching 성공 → direct P2P · 실패 → DERP 유지</text><path d="M600 440v90" stroke="#34d399" stroke-width="5"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#fbbf24"/></marker></defs>
</svg>
