<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Tailcat 권한과 운영 위험 지도</title><desc id="desc">ephemeral key, saved key, allow client, no-auth SSH의 수명과 위험 비교</desc><rect width="1200" height="700" rx="28" fill="#101827"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">연결 수명이 길어질수록 제어 평면의 빈자리가 커진다</text><line x1="120" y1="590" x2="1100" y2="590" stroke="#64748b" stroke-width="3"/><line x1="120" y1="590" x2="120" y2="130" stroke="#64748b" stroke-width="3"/><text x="610" y="650" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="21">지속 시간 · 공유 범위 →</text><text transform="translate(45 390) rotate(-90)" fill="#cbd5e1" font-family="Arial" font-size="21">권한·운영 위험 →</text><g font-family="Arial"><circle cx="260" cy="500" r="70" fill="#065f46" stroke="#34d399" stroke-width="4"/><text x="260" y="493" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">ephemeral</text><text x="260" y="520" text-anchor="middle" fill="#a7f3d0" font-size="16">종료 시 폐기</text><circle cx="510" cy="415" r="82" fill="#164e63" stroke="#22d3ee" stroke-width="4"/><text x="510" y="405" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">+ --allow</text><text x="510" y="434" text-anchor="middle" fill="#a5f3fc" font-size="16">client key 제한</text><circle cx="750" cy="325" r="88" fill="#78350f" stroke="#fbbf24" stroke-width="4"/><text x="750" y="316" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">saved key</text><text x="750" y="345" text-anchor="middle" fill="#fde68a" font-size="16">과거 token 재사용</text><circle cx="980" cy="215" r="100" fill="#7f1d1d" stroke="#fb7185" stroke-width="4"/><text x="980" y="198" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">no-auth SSH</text><text x="980" y="228" text-anchor="middle" fill="#fecdd3" font-size="16">token 소지자 접근</text><text x="980" y="253" text-anchor="middle" fill="#fecdd3" font-size="16">지속 운영 금지</text></g><text x="155" y="110" fill="#94a3b8" font-family="Arial" font-size="18">암호화 ≠ 사용자 인가 · token 전달 채널과 키 폐기 절차를 함께 설계</text></svg>
