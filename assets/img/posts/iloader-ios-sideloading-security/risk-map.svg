<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">iOS 사이드로딩 자산별 위험 지도</title>
  <desc id="desc">Apple 계정, 인증서, 페어링 파일, IPA의 영향도와 보호 및 중단 조건 비교</desc>
  <rect width="1200" height="700" rx="24" fill="#fff7ed"/>
  <g font-family="Arial,sans-serif">
    <text x="58" y="66" font-size="32" font-weight="700" fill="#431407">무엇을 보호해야 하는가</text>
    <text x="58" y="104" font-size="17" fill="#7c2d12">파일 종류보다 유출·변경 시 영향 반경으로 우선순위를 정한다</text>
    <g transform="translate(55 145)">
      <rect width="1090" height="470" rx="22" fill="#fff" stroke="#fed7aa" stroke-width="2"/>
      <g font-size="17" font-weight="700" fill="#7c2d12" text-anchor="middle">
        <text x="140" y="42">자산</text><text x="390" y="42">실패·유출 영향</text><text x="710" y="42">최소 통제</text><text x="970" y="42">즉시 중단 조건</text>
      </g>
      <path d="M20 62H1070M260 20V450M535 20V450M875 20V450" stroke="#fed7aa"/>
      <g font-size="16" fill="#431407">
        <rect x="25" y="80" width="210" height="70" rx="14" fill="#fee2e2"/><text x="130" y="110" text-anchor="middle" font-weight="700">Apple 계정 세션</text><text x="130" y="134" text-anchor="middle">영향도: 매우 높음</text>
        <text x="285" y="107">계정 잠금·자격 증명 노출</text><text x="285" y="133">조직 인증서까지 연쇄 변경</text>
        <text x="560" y="107">전용 계정·2FA·복구 수단</text><text x="560" y="133">주/조직 계정과 분리</text>
        <text x="900" y="107">비밀번호·세션이 로그나</text><text x="900" y="133">비공식 앱에 노출됨</text>

        <rect x="25" y="175" width="210" height="70" rx="14" fill="#ffedd5"/><text x="130" y="205" text-anchor="middle" font-weight="700">인증서 · App ID</text><text x="130" y="229" text-anchor="middle">영향도: 높음</text>
        <text x="285" y="202">기존 앱 서명 무효화</text><text x="285" y="228">기기·도구 간 충돌</text>
        <text x="560" y="202">변경 전 상태·소유자 기록</text><text x="560" y="228">폐기 영향 범위 확인</text>
        <text x="900" y="202">공유 팀 자산을 개인이</text><text x="900" y="228">임의로 폐기할 수 있음</text>

        <rect x="25" y="270" width="210" height="70" rx="14" fill="#fef3c7"/><text x="130" y="300" text-anchor="middle" font-weight="700">pairing 파일</text><text x="130" y="324" text-anchor="middle">영향도: 높음</text>
        <text x="285" y="297">기기 신뢰 채널 노출</text><text x="285" y="323">장기 사본의 추적 불가</text>
        <text x="560" y="297">암호화 저장·최소 수명</text><text x="560" y="323">전달 후 불필요 사본 삭제</text>
        <text x="900" y="297">채팅·공개 이슈·일반</text><text x="900" y="323">클라우드에 평문 업로드</text>

        <rect x="25" y="365" width="210" height="70" rx="14" fill="#dcfce7"/><text x="130" y="395" text-anchor="middle" font-weight="700">IPA · 설치 기록</text><text x="130" y="419" text-anchor="middle">영향도: 앱별 상이</text>
        <text x="285" y="392">악성 코드·과도한 권한</text><text x="285" y="418">버전 재현 불가</text>
        <text x="560" y="392">원본 URL·해시·권한 검토</text><text x="560" y="418">비주력 기기에서 검증</text>
        <text x="900" y="392">출처·해시·소유권을</text><text x="900" y="418">설명할 수 없음</text>
      </g>
    </g>
    <text x="58" y="660" font-size="18" font-weight="700" fill="#9a3412">결정 원칙: 편의 기능이 신뢰 자산의 수명과 영향 반경을 숨기면 팀 표준으로 올리지 않는다.</text>
  </g>
</svg>
