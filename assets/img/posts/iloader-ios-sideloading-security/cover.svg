<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">iOS 사이드로딩 운영과 iLoader 보안 기준</title>
  <desc id="desc">Apple 계정, 개발 인증서, 기기 페어링을 거쳐 iPhone에 앱을 설치하는 신뢰 경계</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#a5b4fc"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".13" stroke="#c4b5fd"><path d="M0 130H1200M0 260H1200M0 390H1200M0 520H1200"/><path d="M160 0V630M400 0V630M640 0V630M880 0V630"/></g>
  <g font-family="Arial,sans-serif">
    <text x="76" y="145" fill="#a5b4fc" font-size="24" font-weight="700">MOBILE SECURITY · TRUST LIFECYCLE</text>
    <text x="72" y="220" fill="#fff" font-size="51" font-weight="800">iOS 사이드로딩 운영</text>
    <text x="75" y="278" fill="#e0e7ff" font-size="28">iLoader 인증서·페어링 보안 기준</text>
    <g transform="translate(75 355)" font-size="19" text-anchor="middle">
      <rect width="168" height="52" rx="26" fill="#4338ca"/><text x="84" y="34" fill="#fff">전용 계정</text>
      <rect x="185" width="168" height="52" rx="26" fill="#6d28d9"/><text x="269" y="34" fill="#fff">서명 자산</text>
      <rect x="370" width="168" height="52" rx="26" fill="#7c3aed"/><text x="454" y="34" fill="#fff">기기 페어링</text>
    </g>
    <text x="76" y="492" fill="#c7d2fe" font-size="19">provisioning · pairing record · Developer Mode · recovery</text>
  </g>
  <g transform="translate(770 92)" font-family="Arial,sans-serif" text-anchor="middle">
    <rect width="310" height="450" rx="34" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
    <rect x="75" y="22" width="160" height="20" rx="10" fill="#334155"/>
    <rect x="35" y="72" width="240" height="72" rx="16" fill="#312e81" stroke="#a5b4fc"/>
    <text x="155" y="103" fill="#fff" font-size="20">Apple Account</text><text x="155" y="128" fill="#c7d2fe" font-size="14">session · App ID</text>
    <path d="M155 145V184" stroke="#a5b4fc" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="35" y="190" width="240" height="76" rx="16" fill="#4c1d95" stroke="#c4b5fd"/>
    <text x="155" y="220" fill="#fff" font-size="20">iLoader</text><text x="155" y="246" fill="#ddd6fe" font-size="14">sign · pair · install</text>
    <path d="M155 267V306" stroke="#a5b4fc" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="35" y="312" width="240" height="76" rx="16" fill="#3730a3" stroke="#a5b4fc"/>
    <text x="155" y="342" fill="#fff" font-size="20">iPhone · SideStore</text><text x="155" y="368" fill="#e0e7ff" font-size="14">profile · pairing · app</text>
    <rect x="55" y="412" width="200" height="10" rx="5" fill="#6366f1"/>
  </g>
</svg>
