<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenBao 도입 결정 게이트</title>
  <desc id="desc">인벤토리, 호환성, 장애 시험, 복구 시험을 거쳐 전환 또는 보류를 결정하는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#67e8f9"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="#081424"/>
  <text x="62" y="70" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="36" font-weight="800">OpenBao 전환은 네 개의 검증 게이트를 통과해야 한다</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(62 125)"><rect width="235" height="215" rx="24" fill="#123044" stroke="#38bdf8" stroke-width="3"/><circle cx="42" cy="44" r="22" fill="#0369a1"/><text x="35" y="53" fill="#fff" font-size="24" font-weight="800">1</text><text x="78" y="53" fill="#bae6fd" font-size="25" font-weight="750">인벤토리</text><text x="28" y="100" fill="#e2e8f0" font-size="20">mount · auth · policy</text><text x="28" y="135" fill="#e2e8f0" font-size="20">plugin · seal · client</text><text x="28" y="176" fill="#94a3b8" font-size="18">누락되면 전환 금지</text></g>
    <g transform="translate(340 125)"><rect width="235" height="215" rx="24" fill="#153646" stroke="#2dd4bf" stroke-width="3"/><circle cx="42" cy="44" r="22" fill="#0f766e"/><text x="35" y="53" fill="#fff" font-size="24" font-weight="800">2</text><text x="78" y="53" fill="#99f6e4" font-size="25" font-weight="750">호환성</text><text x="28" y="100" fill="#e2e8f0" font-size="20">로그인 · API · renew</text><text x="28" y="135" fill="#e2e8f0" font-size="20">dynamic secret · PKI</text><text x="28" y="176" fill="#94a3b8" font-size="18">실제 client로 회귀 시험</text></g>
    <g transform="translate(618 125)"><rect width="235" height="215" rx="24" fill="#2c2946" stroke="#a78bfa" stroke-width="3"/><circle cx="42" cy="44" r="22" fill="#6d28d9"/><text x="35" y="53" fill="#fff" font-size="24" font-weight="800">3</text><text x="78" y="53" fill="#ddd6fe" font-size="25" font-weight="750">장애 주입</text><text x="28" y="100" fill="#e2e8f0" font-size="20">active · quorum · KMS</text><text x="28" y="135" fill="#e2e8f0" font-size="20">IdP · DB · audit sink</text><text x="28" y="176" fill="#94a3b8" font-size="18">fail-open 여부 확인</text></g>
    <g transform="translate(896 125)"><rect width="235" height="215" rx="24" fill="#3a2938" stroke="#fb7185" stroke-width="3"/><circle cx="42" cy="44" r="22" fill="#be123c"/><text x="35" y="53" fill="#fff" font-size="24" font-weight="800">4</text><text x="78" y="53" fill="#fecdd3" font-size="25" font-weight="750">복구</text><text x="28" y="100" fill="#e2e8f0" font-size="20">snapshot · seal · TLS</text><text x="28" y="135" fill="#e2e8f0" font-size="20">RTO · RPO · rollback</text><text x="28" y="176" fill="#94a3b8" font-size="18">빈 환경에서 재현</text></g>
    <path d="M297 232h35M575 232h35M853 232h35" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/>

    <rect x="125" y="455" width="410" height="170" rx="28" fill="#103b32" stroke="#4ade80" stroke-width="4"/>
    <text x="176" y="510" fill="#bbf7d0" font-size="30" font-weight="800">전환 진행</text>
    <text x="176" y="553" fill="#dcfce7" font-size="21">측정 가능한 SLO와 rollback이 있고</text><text x="176" y="587" fill="#dcfce7" font-size="21">소유 팀이 운영 책임을 수락한다.</text>

    <rect x="665" y="455" width="410" height="170" rx="28" fill="#3f292b" stroke="#f97316" stroke-width="4"/>
    <text x="716" y="510" fill="#fed7aa" font-size="30" font-weight="800">보류 또는 대안</text>
    <text x="716" y="553" fill="#ffedd5" font-size="21">관리형 secret manager·SOPS 등으로</text><text x="716" y="587" fill="#ffedd5" font-size="21">운영 범위를 줄이고 기반부터 보강한다.</text>

    <path d="M1014 340v62H330v45" stroke="#4ade80" stroke-width="5" fill="none" marker-end="url(#a)"/>
    <path d="M1014 340v107H870" stroke="#f97316" stroke-width="5" fill="none" marker-end="url(#a)"/>
    <text x="62" y="700" fill="#94a3b8" font-size="20">중단 조건 예: 지원되지 않는 플러그인, 불완전한 snapshot 복구, lease 만료 시 애플리케이션 장애, audit 누락 미탐지</text>
  </g>
</svg>
