<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TileLang 커널 컴파일 아키텍처</title>
  <desc id="desc">Python DSL, compiler passes, target dialect, artifact와 runtime 검증의 계층</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="800">TileLang 커널이 실행 artifact가 되기까지</text>
  <text x="70" y="108" fill="#475569" font-family="Arial, sans-serif" font-size="22">같은 source보다 계층별 계약과 target별 승인 범위를 추적한다</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="160" width="220" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="180" y="200" text-anchor="middle" fill="#075985" font-size="25" font-weight="700">Python Tile DSL</text>
    <text x="180" y="237" text-anchor="middle" fill="#334155" font-size="18">Kernel · copy · gemm</text>
    <text x="180" y="267" text-anchor="middle" fill="#334155" font-size="18">memory scope · pipeline</text>

    <rect x="350" y="160" width="300" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="500" y="200" text-anchor="middle" fill="#5b21b6" font-size="25" font-weight="700">Compiler / TVM IR</text>
    <text x="500" y="237" text-anchor="middle" fill="#334155" font-size="18">layout inference · scheduling</text>
    <text x="500" y="267" text-anchor="middle" fill="#334155" font-size="18">lowering · code generation</text>

    <rect x="710" y="145" width="420" height="160" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="920" y="181" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">Target Dialects</text>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <rect x="750" y="205" width="95" height="48" rx="12" fill="#bae6fd"/><text x="797" y="235" fill="#075985">CUDA</text>
      <rect x="860" y="205" width="95" height="48" rx="12" fill="#ddd6fe"/><text x="907" y="235" fill="#5b21b6">ROCm</text>
      <rect x="970" y="205" width="95" height="48" rx="12" fill="#bbf7d0"/><text x="1017" y="235" fill="#166534">Metal</text>
      <text x="920" y="282" fill="#475569" font-size="17">Ascend · LLVM CPU · experimental backends</text>
    </g>

    <path d="M300 225H338" stroke="#64748b" stroke-width="5"/><path d="M330 215l14 10-14 10" fill="none" stroke="#64748b" stroke-width="5"/>
    <path d="M660 225H698" stroke="#64748b" stroke-width="5"/><path d="M690 215l14 10-14 10" fill="none" stroke="#64748b" stroke-width="5"/>

    <rect x="180" y="375" width="840" height="112" rx="18" fill="#0f172a"/>
    <text x="600" y="414" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">JIT / Native Compiler / Immutable Cache</text>
    <text x="600" y="452" text-anchor="middle" fill="#cbd5e1" font-size="19">compiler version · target architecture · flags · hash · launch wrapper</text>
    <path d="M600 305V363" stroke="#64748b" stroke-width="5"/><path d="M590 355l10 14 10-14" fill="none" stroke="#64748b" stroke-width="5"/>

    <rect x="70" y="565" width="245" height="92" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="192" y="602" text-anchor="middle" fill="#166534" font-size="23" font-weight="700">Correctness</text>
    <text x="192" y="632" text-anchor="middle" fill="#334155" font-size="17">reference · boundary input</text>
    <rect x="340" y="565" width="245" height="92" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="462" y="602" text-anchor="middle" fill="#92400e" font-size="23" font-weight="700">Performance</text>
    <text x="462" y="632" text-anchor="middle" fill="#334155" font-size="17">real shapes · p95 · cold compile</text>
    <rect x="610" y="565" width="245" height="92" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="732" y="602" text-anchor="middle" fill="#991b1b" font-size="23" font-weight="700">Regression</text>
    <text x="732" y="632" text-anchor="middle" fill="#334155" font-size="17">compiler · driver · fallback</text>
    <rect x="880" y="565" width="250" height="92" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="1005" y="602" text-anchor="middle" fill="#3730a3" font-size="23" font-weight="700">Supply Chain</text>
    <text x="1005" y="632" text-anchor="middle" fill="#334155" font-size="17">wheel · submodule · cache</text>
    <path d="M600 487V535H192V553M600 535H462V553M600 535H732V553M600 535H1005V553" fill="none" stroke="#64748b" stroke-width="4"/>
  </g>
</svg>
