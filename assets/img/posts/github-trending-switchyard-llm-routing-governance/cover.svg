<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Switchyard LLM routing governance</title>
  <desc id="desc">LLM 애플리케이션 트래픽을 여러 모델과 공급자로 라우팅하고 비용, 지연, 품질을 통제하는 운영 계층을 표현한 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="52%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#1f5f5b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ee8c8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="170" fill="#38bdf8" opacity="0.10"/>
  <circle cx="120" cy="560" r="210" fill="#34d399" opacity="0.12"/>
  <text x="80" y="112" fill="#d1fae5" font-family="Inter, Arial, sans-serif" font-size="26" letter-spacing="4">GITHUB TRENDING ANALYSIS</text>
  <text x="80" y="184" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">LLM 라우팅 게이트웨이</text>
  <text x="80" y="250" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">운영 거버넌스</text>
  <text x="84" y="305" fill="#c7d2fe" font-family="Inter, Arial, sans-serif" font-size="25">NVIDIA-NeMo/Switchyard · protocol translation · stage routing</text>
  <g filter="url(#shadow)">
    <rect x="110" y="390" width="220" height="92" rx="20" fill="#0f172a" stroke="#94a3b8"/>
    <text x="150" y="430" fill="#e5e7eb" font-family="Inter, Arial" font-size="24" font-weight="700">LLM App</text>
    <text x="150" y="462" fill="#93c5fd" font-family="Inter, Arial" font-size="17">OpenAI / Anthropic API</text>
    <rect x="490" y="330" width="250" height="180" rx="28" fill="#022c22" stroke="url(#accent)" stroke-width="3"/>
    <text x="535" y="390" fill="#ecfeff" font-family="Inter, Arial" font-size="34" font-weight="800">Switchyard</text>
    <text x="536" y="430" fill="#a7f3d0" font-family="Inter, Arial" font-size="19">route · translate · measure</text>
    <text x="536" y="463" fill="#bae6fd" font-family="Inter, Arial" font-size="17">Rust proxy + libsy</text>
    <rect x="910" y="275" width="190" height="70" rx="16" fill="#0f172a" stroke="#38bdf8"/>
    <text x="948" y="319" fill="#e0f2fe" font-family="Inter, Arial" font-size="20">Capable model</text>
    <rect x="910" y="395" width="190" height="70" rx="16" fill="#0f172a" stroke="#34d399"/>
    <text x="950" y="439" fill="#dcfce7" font-family="Inter, Arial" font-size="20">Efficient model</text>
    <rect x="910" y="515" width="190" height="70" rx="16" fill="#0f172a" stroke="#fbbf24"/>
    <text x="947" y="559" fill="#fef3c7" font-family="Inter, Arial" font-size="20">Fallback tier</text>
  </g>
  <path d="M330 436 H490" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round"/>
  <path d="M740 405 C810 350 840 310 910 310" stroke="#7dd3fc" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M740 430 H910" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M740 455 C812 505 840 550 910 550" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="80" y="568" fill="#e2e8f0" font-family="Inter, Arial" font-size="22">비용 절감이 아니라 품질·지연·보안·관찰 가능성을 함께 설계하는 LLM 트래픽 제어면</text>
</svg>
