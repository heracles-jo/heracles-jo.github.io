<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Instatic operating pipeline</title>
  <desc id="desc">Instatic connects authoring canvas, content store, plugin sandbox and static publisher into one deployment pipeline.</desc>
  <defs>
    <style>
      .label{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:24px;fill:#0f172a}.small{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#475569}.note{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{stroke:#2563eb;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1100" height="520" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="900" fill="#1e293b">Instatic 운영 파이프라인: 편집기는 런타임이 아니라 발행 도구로 남는다</text>
  <g filter="url(#s)">
    <rect class="box" x="50" y="120" width="210" height="150" rx="22"/>
    <text class="label" x="78" y="166">Visual Editor</text>
    <text class="small" x="78" y="202">canvas, breakpoints</text>
    <text class="small" x="78" y="228">site shell, modules</text>
    <rect class="box" x="315" y="120" width="210" height="150" rx="22"/>
    <text class="label" x="343" y="166">Content Store</text>
    <text class="small" x="343" y="202">SQLite/Postgres</text>
    <text class="small" x="343" y="228">media, forms, auth</text>
    <rect class="box" x="580" y="120" width="210" height="150" rx="22"/>
    <text class="label" x="608" y="166">Plugin Layer</text>
    <text class="small" x="608" y="202">Bun Worker</text>
    <text class="small" x="608" y="228">QuickJS sandbox</text>
    <rect class="box" x="845" y="120" width="210" height="150" rx="22"/>
    <text class="label" x="873" y="166">Publisher</text>
    <text class="small" x="873" y="202">static HTML/CSS</text>
    <text class="small" x="873" y="228">no editor runtime</text>
  </g>
  <path class="arrow" d="M260 195 H315"/><path class="arrow" d="M525 195 H580"/><path class="arrow" d="M790 195 H845"/>
  <path class="arrow" d="M950 285 C950 375 150 375 150 285" stroke="#0f766e"/>
  <text class="note" x="374" y="402">운영 포인트: DB/업로드 백업, 공개 origin, 비밀 키, 플러그인 권한, 발행 산출물 검증</text>
  <rect x="120" y="432" width="860" height="42" rx="21" fill="#dbeafe"/>
  <text x="158" y="459" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1e40af">정적 산출물을 목표로 하면서도 콘텐츠·권한·확장성을 한 서버에 묶는 절충안</text>
</svg>
