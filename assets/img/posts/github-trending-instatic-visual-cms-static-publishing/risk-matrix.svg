<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">CMS adoption risk matrix</title>
  <desc id="desc">A matrix comparing visual CMS adoption benefits and operational risks across publishing, governance and extensibility.</desc>
  <defs><style>.h{font-family:Inter,Arial,sans-serif;font-weight:900;fill:#0f172a}.t{font-family:Inter,Arial,sans-serif;fill:#334155}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:2}.good{fill:#dcfce7}.warn{fill:#fef3c7}.risk{fill:#fee2e2}</style></defs>
  <rect width="1100" height="560" fill="#f1f5f9"/>
  <text x="54" y="62" class="h" font-size="32">도입 판단 매트릭스: 비주얼 CMS의 편의성과 정적 배포의 운영성</text>
  <g transform="translate(60 120)">
    <rect width="980" height="360" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="980" height="70" rx="24" fill="#1e293b"/>
    <text x="35" y="44" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff">판단 축</text>
    <text x="300" y="44" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff">기대 효과</text>
    <text x="640" y="44" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff">검증해야 할 리스크</text>
    <g transform="translate(0 70)">
      <rect class="good" width="980" height="72"/><text class="h" x="35" y="45" font-size="19">발행 성능</text><text class="t" x="300" y="33" font-size="17">깨끗한 HTML/CSS 산출물</text><text class="t" x="300" y="56" font-size="17">런타임 의존 감소</text><text class="t" x="640" y="45" font-size="17">빌드 검증, 캐시 무효화, SEO 메타 확인</text>
      <rect class="warn" y="72" width="980" height="72"/><text class="h" x="35" y="117" font-size="19">콘텐츠 운영</text><text class="t" x="300" y="105" font-size="17">편집자 경험과 권한 통합</text><text class="t" x="300" y="128" font-size="17">폼·미디어·데이터 내장</text><text class="t" x="640" y="117" font-size="17">백업, 감사 로그, 롤백, 협업 충돌</text>
      <rect class="warn" y="144" width="980" height="72"/><text class="h" x="35" y="189" font-size="19">확장성</text><text class="t" x="300" y="177" font-size="17">플러그인으로 기능 추가</text><text class="t" x="300" y="200" font-size="17">네트워크 권한 모델 제공</text><text class="t" x="640" y="189" font-size="17">sandbox escape, supply chain, 권한 승인 UX</text>
      <rect class="risk" y="216" width="980" height="72"/><text class="h" x="35" y="261" font-size="19">성숙도</text><text class="t" x="300" y="249" font-size="17">빠른 릴리스와 활발한 개선</text><text class="t" x="300" y="272" font-size="17">초기 시장 피드백 반영</text><text class="t" x="640" y="261" font-size="17">pre-1.0, 장기 지원 부재, 마이그레이션 비용</text>
    </g>
  </g>
  <text x="80" y="522" class="t" font-size="17">권장 접근: 공개 마케팅 사이트나 소규모 콘텐츠 허브부터 PoC하고, 업무 핵심 CMS 대체는 데이터·보안·복구 검증 후 단계적으로 판단한다.</text>
</svg>
