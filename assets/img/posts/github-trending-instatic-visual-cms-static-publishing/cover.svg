<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Instatic visual CMS to static publishing pipeline</title>
  <desc id="desc">A visual CMS canvas, Bun server, content database and static HTML publishing pipeline for operations analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#172033"/>
      <stop offset="1" stop-color="#263b5e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="120" r="210" fill="#38bdf8" opacity="0.16"/>
  <circle cx="130" cy="570" r="260" fill="#a78bfa" opacity="0.14"/>
  <text x="78" y="90" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">GitHub Trending Analysis</text>
  <text x="78" y="152" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">Instatic</text>
  <text x="78" y="206" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="650">비주얼 CMS가 다시 정적 배포를 선택하는 이유</text>
  <text x="80" y="258" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">Visual editor · Bun server · SQLite/Postgres · Static HTML/CSS</text>

  <g transform="translate(95 325)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="150" rx="24" fill="#0ea5e9" opacity="0.95"/>
    <text x="28" y="48" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Canvas Editor</text>
    <rect x="28" y="75" width="190" height="18" rx="9" fill="#bae6fd" opacity="0.9"/>
    <rect x="28" y="105" width="140" height="18" rx="9" fill="#e0f2fe" opacity="0.82"/>
  </g>
  <path d="M370 400 H485" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round"/>
  <path d="M468 380 L496 400 L468 420" fill="none" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(505 310)" filter="url(#shadow)">
    <rect width="235" height="180" rx="26" fill="url(#panel)"/>
    <text x="30" y="47" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">One Bun Server</text>
    <text x="30" y="82" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17">auth · media · forms</text>
    <text x="30" y="110" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17">plugins · publisher</text>
    <rect x="32" y="132" width="70" height="18" rx="9" fill="#22c55e" opacity="0.75"/>
    <rect x="114" y="132" width="70" height="18" rx="9" fill="#f59e0b" opacity="0.75"/>
  </g>
  <path d="M760 400 H880" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round"/>
  <path d="M862 380 L890 400 L862 420" fill="none" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(900 325)" filter="url(#shadow)">
    <rect width="230" height="150" rx="24" fill="#14b8a6" opacity="0.98"/>
    <text x="28" y="48" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Static Output</text>
    <text x="28" y="86" fill="#ccfbf1" font-family="Inter, Arial, sans-serif" font-size="18">semantic HTML</text>
    <text x="28" y="116" fill="#ccfbf1" font-family="Inter, Arial, sans-serif" font-size="18">compact CSS</text>
  </g>
</svg>
