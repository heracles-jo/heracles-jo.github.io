<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Bit Pirate 운영 아키텍처</title>
  <desc id="desc">브라우저 또는 시리얼 터미널에서 명령을 입력하면 ESP32 펌웨어가 프로토콜 모드와 GPIO, 외부 무선 모듈을 통해 대상 장비를 분석하는 흐름</desc>
  <defs><style>.box{fill:#0f172a;stroke:#38bdf8;stroke-width:3}.risk{fill:#2a1620;stroke:#fb7185;stroke-width:3}.txt{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}.small{font:500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}.arrow{fill:none;stroke:#22d3ee;stroke-width:5;marker-end:url(#m)}.d{stroke-dasharray:10 10}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#22d3ee"/></marker></defs>
  <rect width="1100" height="620" fill="#07111f"/>
  <text x="50" y="64" class="txt">웹 기반 하드웨어 프로토콜 워크벤치의 실행 경계</text>
  <rect x="55" y="120" width="230" height="130" rx="18" class="box"/><text x="96" y="165" class="txt">Operator</text><text x="86" y="200" class="small">Web Serial CLI</text><text x="91" y="226" class="small">USB Serial / Wi‑Fi</text>
  <rect x="405" y="105" width="270" height="160" rx="18" class="box"/><text x="454" y="153" class="txt">ESP32 Firmware</text><text x="440" y="190" class="small">mode parser · scripts</text><text x="433" y="218" class="small">LittleFS · assistant · GPIO</text>
  <rect x="810" y="95" width="235" height="80" rx="18" class="box"/><text x="865" y="145" class="txt">I2C / SPI</text>
  <rect x="810" y="205" width="235" height="80" rx="18" class="box"/><text x="850" y="255" class="txt">UART / CAN</text>
  <rect x="810" y="315" width="235" height="80" rx="18" class="box"/><text x="845" y="365" class="txt">RFID / Sub‑GHz</text>
  <rect x="810" y="425" width="235" height="80" rx="18" class="box"/><text x="862" y="475" class="txt">Wi‑Fi / BLE</text>
  <rect x="405" y="370" width="270" height="120" rx="18" class="risk"/><text x="450" y="415" class="txt">Control Plane</text><text x="428" y="450" class="small">authorized lab · logs</text><text x="428" y="478" class="small">voltage · RF policy</text>
  <path d="M285 185 H400" class="arrow"/><path d="M675 185 C725 150 755 135 805 135" class="arrow"/><path d="M675 198 C735 210 755 235 805 245" class="arrow"/><path d="M675 212 C735 250 760 330 805 355" class="arrow"/><path d="M675 226 C735 300 760 430 805 465" class="arrow"/><path d="M540 265 V365" class="arrow d"/>
