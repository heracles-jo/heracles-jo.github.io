<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TimesFM time series foundation model analysis</title>
  <desc id="desc">A dashboard style illustration showing a time series foundation model turning many business signals into probabilistic forecasts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#12315f"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.13" stroke="#e0f2fe" stroke-width="1">
    <path d="M80 80H1120M80 170H1120M80 260H1120M80 350H1120M80 440H1120M80 530H1120"/>
    <path d="M140 60V560M300 60V560M460 60V560M620 60V560M780 60V560M940 60V560M1100 60V560"/>
