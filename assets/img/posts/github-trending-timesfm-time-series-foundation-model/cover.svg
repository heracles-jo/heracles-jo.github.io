    <text x="135" y="175" fill="#dbeafe" font-family="Arial, sans-serif" font-size="56" font-weight="700">TimesFM</text>
    <text x="135" y="224" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="25">Time Series Foundation Model · Forecasting Operations</text>
    <path d="M135 405 C190 365 225 446 280 403 S380 315 435 355 S525 462 585 352 S680 270 745 322 S835 436 910 305 S1015 255 1060 285" fill="none" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/>
    <path d="M585 352 C680 290 760 302 850 330 C930 355 1000 350 1060 285" fill="none" stroke="#93c5fd" stroke-width="54" stroke-linecap="round" opacity="0.18"/>
    <g font-family="Arial, sans-serif" font-size="21" fill="#e0f2fe">
