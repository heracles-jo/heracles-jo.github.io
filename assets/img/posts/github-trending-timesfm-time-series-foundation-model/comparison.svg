<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Tool comparison matrix for forecasting</title>
  <desc id="desc">A comparison matrix positioning TimesFM, Chronos, Prophet, and classical ML forecasting approaches.</desc>
  <rect width="1100" height="520" rx="26" fill="#0f172a"/>
  <text x="52" y="62" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="31" font-weight="700">시계열 예측 도구 선택 기준</text>
  <g font-family="Arial, sans-serif" font-size="19">
    <rect x="55" y="105" width="990" height="335" rx="18" fill="#111827" stroke="#334155"/>
    <g fill="#93c5fd" font-weight="700"><text x="95" y="155">도구</text><text x="290" y="155">강점</text><text x="570" y="155">주의점</text><text x="830" y="155">적합한 PoC</text></g>
    <g stroke="#334155"><path d="M55 180H1045M55 245H1045M55 310H1045M55 375H1045"/><path d="M245 105V440M525 105V440M790 105V440"/></g>
    <g fill="#e5e7eb">
      <text x="95" y="220">TimesFM</text><text x="290" y="210">범용 사전학습, quantile</text><text x="290" y="235">긴 context와 빠른 PoC</text><text x="570" y="220">도메인 보정·데이터 품질 필요</text><text x="830" y="220">다수 SKU/지표 baseline</text>
      <text x="95" y="285">Chronos</text><text x="290" y="275">LLM식 토큰화 기반 접근</text><text x="290" y="300">활발한 Python 생태계</text><text x="570" y="285">모델 크기·추론비용 검증</text><text x="830" y="285">확률 예측 비교 실험</text>
      <text x="95" y="350">Prophet</text><text x="290" y="340">해석성, 휴일·계절성</text><text x="290" y="365">운영 검증 이력</text><text x="570" y="350">복잡 패턴에서 한계</text><text x="830" y="350">설명 가능한 업무 예측</text>
      <text x="95" y="415">ARIMA/GBM</text><text x="290" y="405">통제성, 저비용, 특성공학</text><text x="570" y="405">스케일링과 유지보수 부담</text><text x="830" y="405">고정된 핵심 지표</text>
    </g>
  </g>
  <text x="55" y="480" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Foundation model은 대체재가 아니라 baseline 작성 속도와 불확실성 표현을 바꾸는 선택지로 평가해야 한다.</text>
</svg>
