<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Forecasting stack with TimesFM</title>
  <desc id="desc">Architecture diagram for a forecasting stack: data sources, feature quality checks, TimesFM inference, calibration, and business operations.</desc>
  <rect width="1100" height="560" rx="28" fill="#f8fafc"/>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#94a3b8" flood-opacity="0.35"/></filter>
  </defs>
  <text x="54" y="62" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">TimesFM 기반 예측 운영 아키텍처</text>
  <g font-family="Arial, sans-serif" font-size="19" text-anchor="middle">
    <g filter="url(#s)">
      <rect x="55" y="125" width="180" height="110" rx="18" fill="#dbeafe"/><text x="145" y="172" fill="#1e3a8a">업무 시계열</text><text x="145" y="202" fill="#1e40af">수요·트래픽·센서</text>
      <rect x="55" y="315" width="180" height="110" rx="18" fill="#e0f2fe"/><text x="145" y="362" fill="#075985">외생 변수</text><text x="145" y="392" fill="#0369a1">캠페인·휴일·가격</text>
      <rect x="315" y="220" width="190" height="120" rx="18" fill="#fef3c7"/><text x="410" y="267" fill="#92400e">품질 게이트</text><text x="410" y="297" fill="#92400e">결측·드리프트·누수</text>
      <rect x="585" y="205" width="210" height="150" rx="22" fill="#dcfce7"/><text x="690" y="260" fill="#166534" font-weight="700">TimesFM 2.5</text><text x="690" y="294" fill="#15803d">zero-shot / LoRA</text><text x="690" y="324" fill="#15803d">quantile forecast</text>
      <rect x="875" y="125" width="170" height="110" rx="18" fill="#ede9fe"/><text x="960" y="172" fill="#5b21b6">보정·앙상블</text><text x="960" y="202" fill="#6d28d9">Prophet·ARIMA</text>
      <rect x="875" y="315" width="170" height="110" rx="18" fill="#fee2e2"/><text x="960" y="362" fill="#991b1b">운영 의사결정</text><text x="960" y="392" fill="#b91c1c">재고·인력·SLO</text>
    </g>
    <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
      <path d="M235 180 C270 180 280 250 315 265"/><path d="M235 370 C270 370 280 310 315 295"/><path d="M505 280 H585"/><path d="M795 255 C835 235 840 185 875 180"/><path d="M795 305 C835 325 840 365 875 370"/>
    </g>
  </g>
  <text x="55" y="510" font-family="Arial, sans-serif" font-size="18" fill="#475569">핵심은 모델 호출이 아니라 데이터 품질, 예측구간 보정, 업무 피드백 루프를 함께 운영하는 것이다.</text>
</svg>
