<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CubeSandbox와 MicroVM 기반 AI 샌드박스 인프라</title>
  <desc id="desc">KVM MicroVM, eBPF 네트워크 격리, L7 egress 프록시, Copy-on-Write 스냅샷이 AI 코드 실행 샌드박스 운영 평면을 구성하는 모습</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#12355b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#e2e8f0" stroke-width="1">
    <path d="M0 110H1200M0 220H1200M0 330H1200M0 440H1200M0 550H1200"/>
    <path d="M120 0V630M300 0V630M480 0V630M660 0V630M840 0V630M1020 0V630"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="84" y="80" rx="34" width="1032" height="470" fill="#0f172a" opacity="0.82" stroke="#5eead4" stroke-opacity="0.32"/>
  </g>
  <text x="120" y="155" fill="#ccfbf1" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="700">GitHub Trending Analysis</text>
  <text x="120" y="218" fill="#ffffff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="55" font-weight="800">CubeSandbox</text>
  <text x="120" y="278" fill="#dbeafe" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="700">AI 코드 실행을 위한 MicroVM 샌드박스</text>
  <text x="120" y="337" fill="#bae6fd" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24">KVM · RustVMM · eBPF · L7 Egress · CoW Snapshot</text>
  <g transform="translate(750 150)">
    <polygon points="120,0 240,70 120,140 0,70" fill="url(#cube)" opacity="0.95"/>
    <polygon points="0,70 120,140 120,280 0,210" fill="#0891b2" opacity="0.9"/>
    <polygon points="240,70 120,140 120,280 240,210" fill="#14b8a6" opacity="0.9"/>
    <polygon points="120,44 194,88 120,132 46,88" fill="#0f172a" opacity="0.8"/>
    <rect x="72" y="162" width="96" height="70" rx="12" fill="#0f172a" opacity="0.75"/>
    <text x="120" y="204" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="20" font-weight="700">MicroVM</text>
  </g>
  <g font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#e2e8f0">
    <rect x="120" y="402" width="190" height="54" rx="17" fill="#1e293b" stroke="#38bdf8"/>
    <text x="215" y="436" text-anchor="middle">격리 실행</text>
    <rect x="330" y="402" width="190" height="54" rx="17" fill="#1e293b" stroke="#34d399"/>
    <text x="425" y="436" text-anchor="middle">고밀도 배치</text>
    <rect x="540" y="402" width="190" height="54" rx="17" fill="#1e293b" stroke="#fbbf24"/>
    <text x="635" y="436" text-anchor="middle">출구 통제</text>
  </g>
</svg>
