<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">FFmpeg 에이전트 위험 매트릭스</title><desc id="desc">영향과 탐지 난이도로 분류한 운영 위험</desc><rect width="1200" height="700" fill="#08111f"/><text x="70" y="65" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="38" font-weight="800">실행 성공보다 먼저 볼 운영 위험</text><g font-family="system-ui,sans-serif"><text x="34" y="370" fill="#94a3b8" font-size="22" transform="rotate(-90 34 370)">영향도 높음 ↑</text><text x="465" y="668" fill="#94a3b8" font-size="22">탐지 어려움 →</text><rect x="120" y="110" width="960" height="500" rx="20" fill="#0c192a" stroke="#334155"/><path d="M600 110v500M120 360h960" stroke="#475569" stroke-width="2"/>
<rect x="145" y="135" width="420" height="190" rx="16" fill="#3b2415" stroke="#f59e0b"/><text x="175" y="180" fill="#fde68a" font-size="25" font-weight="700">높은 영향 · 비교적 쉬운 탐지</text><text x="175" y="225" fill="#fcd34d" font-size="21">• 원본 덮어쓰기</text><text x="175" y="260" fill="#fcd34d" font-size="21">• 코덱·크기 규격 실패</text><text x="175" y="295" fill="#fcd34d" font-size="21">→ 경로 격리와 납품 게이트</text>
<rect x="635" y="135" width="420" height="190" rx="16" fill="#3b171c" stroke="#ef4444"/><text x="665" y="180" fill="#fecaca" font-size="25" font-weight="700">높은 영향 · 어려운 탐지</text><text x="665" y="225" fill="#fca5a5" font-size="21">• A/V 동기화 누적</text><text x="665" y="260" fill="#fca5a5" font-size="21">• 의미 손상·권리 위험</text><text x="665" y="295" fill="#fca5a5" font-size="21">→ 기준 신호와 사람 승인</text>
<rect x="145" y="395" width="420" height="180" rx="16" fill="#153027" stroke="#22c55e"/><text x="175" y="440" fill="#bbf7d0" font-size="25" font-weight="700">낮은 영향 · 쉬운 탐지</text><text x="175" y="485" fill="#86efac" font-size="21">• 알 수 없는 옵션</text><text x="175" y="520" fill="#86efac" font-size="21">• 누락된 의존성</text><text x="175" y="555" fill="#86efac" font-size="21">→ 계약·doctor·CI</text>
<rect x="635" y="395" width="420" height="180" rx="16" fill="#162840" stroke="#38bdf8"/><text x="665" y="440" fill="#bae6fd" font-size="25" font-weight="700">낮은 영향 · 어려운 탐지</text><text x="665" y="485" fill="#7dd3fc" font-size="21">• 색 태그·폰트 드리프트</text><text x="665" y="520" fill="#7dd3fc" font-size="21">• 미측정을 성공으로 오인</text><text x="665" y="555" fill="#7dd3fc" font-size="21">→ 런타임 핀과 명시적 unknown</text></g></svg>
