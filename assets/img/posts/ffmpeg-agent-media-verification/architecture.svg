<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">FFmpeg 에이전트 실행 계약 아키텍처</title><desc id="desc">사용자 의도에서 계획, 계약, 실행, 검증, 승인으로 이어지는 흐름</desc>
<rect width="1200" height="680" fill="#08111f"/><text x="70" y="70" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="38" font-weight="800">자연어 편집을 검증 가능한 산출물로 바꾸는 계층</text>
<g font-family="system-ui,sans-serif"><rect x="70" y="120" width="250" height="130" rx="20" fill="#162238" stroke="#64748b"/><text x="105" y="170" fill="#cbd5e1" font-size="25" font-weight="700">1. 계획</text><text x="105" y="207" fill="#94a3b8" font-size="20">의도·컷·포맷 결정</text>
<rect x="360" y="120" width="250" height="130" rx="20" fill="#102d3f" stroke="#38bdf8"/><text x="395" y="170" fill="#bae6fd" font-size="25" font-weight="700">2. 계약</text><text x="395" y="207" fill="#7dd3fc" font-size="20">스키마·버전·종료 코드</text>
<rect x="650" y="120" width="250" height="130" rx="20" fill="#24311b" stroke="#84cc16"/><text x="685" y="170" fill="#d9f99d" font-size="25" font-weight="700">3. 실행</text><text x="685" y="207" fill="#bef264" font-size="20">FFmpeg·ffprobe·격리</text>
<rect x="940" y="120" width="190" height="130" rx="20" fill="#173426" stroke="#22c55e"/><text x="974" y="170" fill="#bbf7d0" font-size="25" font-weight="700">4. 검증</text><text x="974" y="207" fill="#86efac" font-size="20">규격·품질 신호</text>
<path d="M320 185h40m250 0h40m250 0h40" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker></defs>
<rect x="120" y="330" width="960" height="250" rx="24" fill="#0c192a" stroke="#31455d"/><text x="165" y="385" fill="#e2e8f0" font-size="26" font-weight="700">검증 결과 문서</text><text x="165" y="435" fill="#7dd3fc" font-family="monospace" font-size="22">status · exit_code · error.reason · commands</text><text x="165" y="478" fill="#86efac" font-family="monospace" font-size="22">verification[] · verified · source_carry · diagnostics</text>
<rect x="750" y="385" width="270" height="130" rx="18" fill="#251c39" stroke="#a78bfa"/><text x="790" y="430" fill="#ddd6fe" font-size="24" font-weight="700">사람 승인 경계</text><text x="790" y="470" fill="#c4b5fd" font-size="19">의미·표현·권리 검토</text><text x="790" y="500" fill="#c4b5fd" font-size="19">게시 권한은 별도 분리</text>
<text x="70" y="640" fill="#94a3b8" font-size="21">종료 코드 0은 실행 완료일 뿐이다. 배포 가능 여부는 명시된 검증과 사람 승인으로 결정한다.</text></g></svg>
