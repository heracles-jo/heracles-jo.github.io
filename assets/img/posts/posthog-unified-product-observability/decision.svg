<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Product observability platform decision matrix</title><desc id="d">A matrix compares managed PostHog, hobby self hosting, specialist tools and warehouse centered analytics.</desc><rect width="1200" height="675" fill="#0b1220"/><g font-family="system-ui,sans-serif"><text x="60" y="68" fill="#f8fafc" font-size="34" font-weight="750">제품 관측성 선택은 기능 수보다 운영 경계다</text><text x="60" y="105" fill="#94a3b8" font-size="19">문맥 연결 속도, 데이터 통제, 운영 부담을 함께 비교한다</text><g transform="translate(70 165)"><rect width="1060" height="385" rx="22" fill="#111c2e" stroke="#334155"/><g stroke="#334155"><path d="M265 0v385M530 0v385M795 0v385M0 95h1060M0 190h1060M0 285h1060"/></g><g font-size="19"><g fill="#fdba74" font-weight="700"><text x="24" y="55">PostHog Cloud</text><text x="24" y="150">Hobby self-host</text><text x="24" y="245">전문 도구 조합</text><text x="24" y="340">Warehouse 중심</text></g><g fill="#e2e8f0"><text x="290" y="40">문맥 연결</text><text x="290" y="68" fill="#86efac">빠름</text><text x="555" y="40">데이터 통제</text><text x="555" y="68">정책·계약 의존</text><text x="820" y="40">운영 부담</text><text x="820" y="68" fill="#86efac">낮음</text><text x="290" y="135">통합 가능</text><text x="555" y="135" fill="#86efac">직접 통제</text><text x="820" y="135" fill="#fca5a5">확장 시 큼</text><text x="290" y="230" fill="#fbbf24">별도 통합 필요</text><text x="555" y="230">영역별 분산</text><text x="820" y="230">중간~높음</text><text x="290" y="325" fill="#fbbf24">실시간 UX 구축</text><text x="555" y="325" fill="#86efac">강한 감사 통제</text><text x="820" y="325" fill="#fca5a5">플랫폼 역량 필요</text></g></g></g><rect x="145" y="585" width="910" height="52" rx="14" fill="#3b2418"/><text x="600" y="618" text-anchor="middle" fill="#ffedd5" font-size="20">PoC 기준: 장애 한 건의 조사 시간 ↓  +  불필요한 사용자 데이터 ↓</text></g></svg>