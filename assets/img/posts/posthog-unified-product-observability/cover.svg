<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">PostHog unified product observability</title><desc id="d">Product analytics, replay, feature flags, errors and LLM traces converge into one user context.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#130d22"/><stop offset="1" stop-color="#3b1737"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><circle cx="1020" cy="115" r="200" fill="#f97316" opacity=".09"/><g font-family="system-ui,sans-serif"><text x="70" y="105" fill="#fb923c" font-size="22" font-weight="700">PRODUCT OBSERVABILITY</text><text x="70" y="172" fill="#fff7ed" font-size="46" font-weight="800">PostHog 통합 관측성</text><text x="70" y="226" fill="#fed7aa" font-size="28">문맥 연결의 속도와 데이터 집중의 대가</text><g transform="translate(100 330)"><g fill="#2b1834" stroke="#f97316"><rect width="170" height="88" rx="16"/><rect x="205" width="170" height="88" rx="16"/><rect x="410" width="170" height="88" rx="16"/><rect x="615" width="170" height="88" rx="16"/><rect x="820" width="170" height="88" rx="16"/></g><g fill="#ffedd5" font-size="18" text-anchor="middle"><text x="85" y="53">Analytics</text><text x="290" y="53">Replay</text><text x="495" y="53">Feature Flag</text><text x="700" y="53">Error</text><text x="905" y="53">LLM Trace</text></g><path d="M85 105C250 190 740 190 905 105" fill="none" stroke="#fdba74" stroke-width="4"/><circle cx="495" cy="190" r="58" fill="#7c2d12" stroke="#fb923c" stroke-width="3"/><text x="495" y="184" text-anchor="middle" fill="#fff7ed" font-size="17">Person</text><text x="495" y="207" text-anchor="middle" fill="#fff7ed" font-size="17">Context</text></g><text x="70" y="620" fill="#d6d3d1" font-size="20">Identity mapping · Privacy boundary · Cost control · Failure isolation</text></g></svg>