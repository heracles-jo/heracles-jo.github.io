<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Unified product observability data flow</title><desc id="d">Client, backend and LLM data pass privacy controls before joining a shared PostHog context and role based views.</desc><rect width="1200" height="675" fill="#0c111c"/><g font-family="system-ui,sans-serif"><text x="60" y="68" fill="#f8fafc" font-size="34" font-weight="750">통합 전에 수집 경계부터 설계한다</text><text x="60" y="105" fill="#94a3b8" font-size="19">SDK별 데이터가 privacy gate를 통과한 뒤에만 공통 문맥으로 연결된다</text><g fill="#172033" stroke="#475569"><rect x="60" y="180" width="210" height="82" rx="16"/><rect x="60" y="305" width="210" height="82" rx="16"/><rect x="60" y="430" width="210" height="82" rx="16"/></g><g fill="#e2e8f0" font-size="20" text-anchor="middle"><text x="165" y="229">Web / Mobile SDK</text><text x="165" y="354">Backend / Error</text><text x="165" y="479">LLM Trace / Eval</text></g><rect x="365" y="235" width="235" height="225" rx="24" fill="#3a1d28" stroke="#fb7185" stroke-width="3"/><text x="482" y="285" text-anchor="middle" fill="#fecdd3" font-size="24" font-weight="700">Privacy Gate</text><g fill="#ffe4e6" font-size="17"><text x="405" y="330">Mask / Allowlist</text><text x="405" y="365">Sampling / Retention</text><text x="405" y="400">Region / Consent</text><text x="405" y="435">Deletion policy</text></g><rect x="690" y="215" width="260" height="265" rx="28" fill="#3b2418" stroke="#fb923c" stroke-width="3"/><text x="820" y="270" text-anchor="middle" fill="#fed7aa" font-size="25" font-weight="700">Shared Context</text><g fill="#ffedd5" font-size="18" text-anchor="middle"><text x="820" y="315">Person · Session</text><text x="820" y="350">Request · Trace</text><text x="820" y="385">Flag · Release</text><text x="820" y="420">Event · Replay</text></g><g fill="#172033" stroke="#475569"><rect x="1010" y="205" width="150" height="72" rx="14"/><rect x="1010" y="315" width="150" height="72" rx="14"/><rect x="1010" y="425" width="150" height="72" rx="14"/></g><g fill="#e2e8f0" font-size="17" text-anchor="middle"><text x="1085" y="247">Product</text><text x="1085" y="357">Engineering</text><text x="1085" y="467">AI / Support</text></g><g stroke="#fb923c" stroke-width="4" fill="none"><path d="M270 221H365"/><path d="M270 346H365"/><path d="M270 471H365"/><path d="M600 347H690"/><path d="M950 241H1010"/><path d="M950 351H1010"/><path d="M950 461H1010"/></g><text x="60" y="620" fill="#fda4af" font-size="19">금지 데이터는 저장 후 삭제가 아니라 수집 전에 차단한다.</text></g></svg>