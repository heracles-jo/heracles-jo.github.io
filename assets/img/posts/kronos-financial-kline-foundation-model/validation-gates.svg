<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kronos 금융 모델 검증 게이트</title><desc id="desc">데이터 시간 경계부터 실행 권한까지 통과해야 하는 다섯 단계 검증 게이트</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091729"/><stop offset="1" stop-color="#172d4a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#8fb7dc"/></marker></defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="600" y="62" text-anchor="middle" fill="#fff" font-size="36" font-weight="800">금융 시계열 모델의 production 승격 게이트</text>
    <text x="600" y="102" text-anchor="middle" fill="#a9c1db" font-size="20">한 단계라도 증거가 없으면 다음 단계로 이동하지 않는다</text>
    <g stroke="#8fb7dc" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M218 320H270"/><path d="M438 320H490"/><path d="M658 320H710"/><path d="M878 320H930"/></g>
    <g>
      <rect x="50" y="190" width="168" height="260" rx="22" fill="#12385a" stroke="#5ab4ff" stroke-width="3"/><circle cx="134" cy="242" r="29" fill="#5ab4ff"/><text x="134" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#071426">1</text><text x="134" y="300" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">시간 경계</text><text x="72" y="342" fill="#c9def0" font-size="17">• 학습 cutoff</text><text x="72" y="375" fill="#c9def0" font-size="17">• purge·embargo</text><text x="72" y="408" fill="#c9def0" font-size="17">• 미래 누수 없음</text>
      <rect x="270" y="190" width="168" height="260" rx="22" fill="#17493f" stroke="#55ddb6" stroke-width="3"/><circle cx="354" cy="242" r="29" fill="#55ddb6"/><text x="354" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#071426">2</text><text x="354" y="300" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">계보</text><text x="292" y="342" fill="#d2f6ec" font-size="17">• checkpoint hash</text><text x="292" y="375" fill="#d2f6ec" font-size="17">• code commit</text><text x="292" y="408" fill="#d2f6ec" font-size="17">• data snapshot</text>
      <rect x="490" y="190" width="168" height="260" rx="22" fill="#493873" stroke="#b49cff" stroke-width="3"/><circle cx="574" cy="242" r="29" fill="#b49cff"/><text x="574" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#071426">3</text><text x="574" y="300" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">통계 검증</text><text x="512" y="342" fill="#e3dcff" font-size="17">• 단순 baseline</text><text x="512" y="375" fill="#e3dcff" font-size="17">• regime slice</text><text x="512" y="408" fill="#e3dcff" font-size="17">• seed 안정성</text>
      <rect x="710" y="190" width="168" height="260" rx="22" fill="#68441d" stroke="#ffb85c" stroke-width="3"/><circle cx="794" cy="242" r="29" fill="#ffb85c"/><text x="794" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#071426">4</text><text x="794" y="300" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">비용</text><text x="732" y="342" fill="#ffe5c0" font-size="17">• spread</text><text x="732" y="375" fill="#ffe5c0" font-size="17">• slippage</text><text x="732" y="408" fill="#ffe5c0" font-size="17">• market impact</text>
      <rect x="930" y="190" width="220" height="260" rx="22" fill="#632d3a" stroke="#ff8394" stroke-width="3"/><circle cx="1040" cy="242" r="29" fill="#ff8394"/><text x="1040" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#071426">5</text><text x="1040" y="300" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">실행 권한</text><text x="960" y="342" fill="#ffd5db" font-size="17">• risk engine 분리</text><text x="960" y="375" fill="#ffd5db" font-size="17">• fail-closed</text><text x="960" y="408" fill="#ffd5db" font-size="17">• 주문 감사 로그</text>
    </g>
    <rect x="120" y="525" width="960" height="130" rx="22" fill="#071426" stroke="#466b91" stroke-width="2"/>
    <text x="600" y="571" text-anchor="middle" fill="#ff9cab" font-size="24" font-weight="800">중단 조건</text>
    <text x="600" y="610" text-anchor="middle" fill="#d7e4f1" font-size="19">비용 후 우위 소멸 · 특정 기간에만 유효 · checkpoint 계보 불명 · sampling에 순위 과민</text>
    <text x="600" y="696" text-anchor="middle" fill="#68e1c2" font-size="22" font-weight="800">수익률 그래프는 마지막 증거이지 첫 번째 증거가 아니다</text>
  </g>
</svg>
