<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kronos 금융 K선 모델 아키텍처</title><desc id="desc">시장 데이터 수집, 정규화, 계층형 토큰화, 자기회귀 생성, 검증, 의사결정 계층의 분리</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#e9f1fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42658f"/></marker></defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="600" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#102a43">Kronos는 모델이 아니라 검증 가능한 예측 파이프라인이어야 한다</text>
    <text x="600" y="94" text-anchor="middle" font-size="19" fill="#526b84">각 계층의 입력·버전·실패 상태를 독립적으로 기록한다</text>
    <g stroke="#42658f" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M230 275H315"/><path d="M485 275H570"/><path d="M740 275H825"/><path d="M995 275H1080"/></g>
    <g>
      <rect x="45" y="175" width="185" height="200" rx="20" fill="#fff" stroke="#42658f" stroke-width="3"/><text x="137" y="218" text-anchor="middle" font-size="23" font-weight="800" fill="#173f67">1. 시장 데이터</text><text x="68" y="260" font-size="18" fill="#40576f">• OHLCVA</text><text x="68" y="294" font-size="18" fill="#40576f">• 거래소·시간대</text><text x="68" y="328" font-size="18" fill="#40576f">• 기업행동·결측</text>
      <rect x="315" y="175" width="170" height="200" rx="20" fill="#fff" stroke="#35a58b" stroke-width="3"/><text x="400" y="218" text-anchor="middle" font-size="23" font-weight="800" fill="#176454">2. 전처리</text><text x="338" y="260" font-size="18" fill="#40576f">• 과거만 정규화</text><text x="338" y="294" font-size="18" fill="#40576f">• 이상 구간 분리</text><text x="338" y="328" font-size="18" fill="#40576f">• snapshot hash</text>
      <rect x="570" y="175" width="170" height="200" rx="20" fill="#fff" stroke="#7c62c7" stroke-width="3"/><text x="655" y="218" text-anchor="middle" font-size="23" font-weight="800" fill="#59429d">3. 토큰화</text><text x="593" y="260" font-size="18" fill="#40576f">• coarse token</text><text x="593" y="294" font-size="18" fill="#40576f">• fine token</text><text x="593" y="328" font-size="18" fill="#40576f">• BSQ code</text>
      <rect x="825" y="175" width="170" height="200" rx="20" fill="#fff" stroke="#dd8b32" stroke-width="3"/><text x="910" y="218" text-anchor="middle" font-size="23" font-weight="800" fill="#9b5a17">4. 경로 생성</text><text x="848" y="260" font-size="18" fill="#40576f">• autoregressive</text><text x="848" y="294" font-size="18" fill="#40576f">• T / top-p / N</text><text x="848" y="328" font-size="18" fill="#40576f">• 확률 경로</text>
      <rect x="1080" y="175" width="90" height="200" rx="20" fill="#fff" stroke="#d55364" stroke-width="3"/><text x="1125" y="214" text-anchor="middle" font-size="20" font-weight="800" fill="#9e3342">5.</text><text x="1125" y="244" text-anchor="middle" font-size="20" font-weight="800" fill="#9e3342">신호</text><text x="1125" y="282" text-anchor="middle" font-size="16" fill="#40576f">순위</text><text x="1125" y="312" text-anchor="middle" font-size="16" fill="#40576f">변동성</text><text x="1125" y="342" text-anchor="middle" font-size="16" fill="#40576f">합성값</text>
    </g>
    <path d="M1125 375V446H600" fill="none" stroke="#d55364" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="150" y="460" width="900" height="210" rx="24" fill="#102a43"/>
    <text x="600" y="505" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">모델 밖의 검증·의사결정 계층</text>
    <g font-size="19"><rect x="190" y="540" width="175" height="82" rx="14" fill="#173f67"/><text x="277" y="573" text-anchor="middle" fill="#fff" font-weight="700">OOS 통계 검증</text><text x="277" y="601" text-anchor="middle" fill="#b9d4ec">IC · RankIC · tail</text><rect x="405" y="540" width="175" height="82" rx="14" fill="#176454"/><text x="492" y="573" text-anchor="middle" fill="#fff" font-weight="700">비용 스트레스</text><text x="492" y="601" text-anchor="middle" fill="#c2f2e7">turnover · slippage</text><rect x="620" y="540" width="175" height="82" rx="14" fill="#59429d"/><text x="707" y="573" text-anchor="middle" fill="#fff" font-weight="700">리스크 엔진</text><text x="707" y="601" text-anchor="middle" fill="#ddd3ff">limit · exposure</text><rect x="835" y="540" width="175" height="82" rx="14" fill="#9e3342"/><text x="922" y="573" text-anchor="middle" fill="#fff" font-weight="700">격리된 실행</text><text x="922" y="601" text-anchor="middle" fill="#ffd3d8">approval · audit</text></g>
    <text x="600" y="715" text-anchor="middle" font-size="20" font-weight="700" fill="#9e3342">예측 모델에 브로커 자격증명과 주문 권한을 직접 주지 않는다</text>
  </g>
</svg>
