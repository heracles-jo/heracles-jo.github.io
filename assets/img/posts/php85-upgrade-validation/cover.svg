<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PHP 8.5 업그레이드 검증</title>
  <desc id="desc">PHP 애플리케이션, Composer, 확장 모듈, FPM과 OPcache를 검증하는 기술 블로그 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="180" fill="#8b5cf6" opacity=".16"/>
  <circle cx="1070" cy="530" r="250" fill="#38bdf8" opacity=".10"/>
  <text x="82" y="105" fill="#a5b4fc" font-family="system-ui,sans-serif" font-size="28" font-weight="700">RUNTIME MIGRATION</text>
  <text x="82" y="190" fill="#ffffff" font-family="system-ui,sans-serif" font-size="64" font-weight="800">PHP 8.5 업그레이드</text>
  <text x="82" y="252" fill="#dbeafe" font-family="system-ui,sans-serif" font-size="34" font-weight="600">비호환 변경 · 확장 모듈 · FPM 검증</text>
  <g filter="url(#shadow)">
    <rect x="82" y="330" width="208" height="112" rx="20" fill="#4f46e5"/>
    <rect x="332" y="330" width="208" height="112" rx="20" fill="#2563eb"/>
    <rect x="582" y="330" width="208" height="112" rx="20" fill="#0891b2"/>
    <rect x="832" y="330" width="208" height="112" rx="20" fill="#0f766e"/>
  </g>
  <g fill="#fff" font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="186" y="377" font-size="25" font-weight="700">Composer</text><text x="186" y="410" font-size="18">의존성 계약</text>
    <text x="436" y="377" font-size="25" font-weight="700">Extensions</text><text x="436" y="410" font-size="18">ABI · 네이티브</text>
    <text x="686" y="377" font-size="25" font-weight="700">FPM</text><text x="686" y="410" font-size="18">Worker · Drain</text>
    <text x="936" y="377" font-size="25" font-weight="700">OPcache</text><text x="936" y="410" font-size="18">설정 · Warm-up</text>
  </g>
  <path d="M290 386h42m208 0h42m208 0h42" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round"/>
  <text x="82" y="540" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="25">기능 채택보다 먼저, 패치 가능한 런타임을 만든다</text>
  <text x="1118" y="580" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="20" text-anchor="end">heracles.jo</text>
</svg>
