<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PHP 8.5 업그레이드 검증 아키텍처</title>
  <desc id="desc">소스 코드부터 Composer, 확장 모듈, FPM, OPcache와 관측성까지 이어지는 검증 계층</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="70" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#0f172a">PHP 8.5 전환은 실행 그래프 전체를 바꾼다</text>
  <g font-family="system-ui,sans-serif">
    <rect x="60" y="125" width="220" height="120" rx="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
    <text x="170" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#312e81">Application</text><text x="170" y="205" text-anchor="middle" font-size="18" fill="#4338ca">문법 · 오류 · 직렬화</text>
    <rect x="360" y="125" width="220" height="120" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="470" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">Composer</text><text x="470" y="205" text-anchor="middle" font-size="18" fill="#1d4ed8">Lock · Platform Check</text>
    <rect x="660" y="125" width="220" height="120" rx="18" fill="#cffafe" stroke="#06b6d4" stroke-width="3"/>
    <text x="770" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#164e63">Extensions</text><text x="770" y="205" text-anchor="middle" font-size="18" fill="#0e7490">ABI · ICU · OpenSSL</text>
    <rect x="960" y="125" width="180" height="120" rx="18" fill="#ccfbf1" stroke="#14b8a6" stroke-width="3"/>
    <text x="1050" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#134e4a">PHP 8.5.12</text><text x="1050" y="205" text-anchor="middle" font-size="18" fill="#0f766e">Exact Binary</text>
    <path d="M280 185h80M580 185h80M880 185h80" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="110" y="335" width="260" height="130" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="240" y="382" text-anchor="middle" font-size="27" font-weight="700" fill="#7c2d12">CLI · Worker</text><text x="240" y="417" text-anchor="middle" font-size="18" fill="#9a3412">Batch · Queue · Signal</text>
    <rect x="470" y="335" width="260" height="130" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="600" y="382" text-anchor="middle" font-size="27" font-weight="700" fill="#78350f">PHP-FPM</text><text x="600" y="417" text-anchor="middle" font-size="18" fill="#92400e">Pool · Reload · Drain</text>
    <rect x="830" y="335" width="260" height="130" rx="18" fill="#f3e8ff" stroke="#a855f7" stroke-width="3"/>
    <text x="960" y="382" text-anchor="middle" font-size="27" font-weight="700" fill="#581c87">OPcache</text><text x="960" y="417" text-anchor="middle" font-size="18" fill="#7e22ce">INI · Cache · Warm-up</text>
    <path d="M1050 245v45H240v45M1050 290H600v45M1050 290H960v45" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="110" y="565" width="980" height="120" rx="22" fill="#0f172a"/>
    <text x="160" y="612" font-size="26" font-weight="700" fill="#fff">검증 증거</text>
    <text x="160" y="650" font-size="20" fill="#cbd5e1">응답·예외 diff  ·  deprecation rate  ·  p95/p99  ·  extension inventory  ·  SBOM/digest  ·  rollback rehearsal</text>
    <path d="M240 465v100M600 465v100M960 465v100" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
