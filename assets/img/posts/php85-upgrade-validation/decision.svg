<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PHP 8.5 업그레이드 의사결정 흐름</title>
  <desc id="desc">정적 검사, 이중 런타임 비교, 카나리, 전체 배포와 롤백 훈련을 거치는 검증 단계</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="70" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#0f172a">기능 채택 전에 통과해야 할 PHP 8.5 배포 게이트</text>
  <g font-family="system-ui,sans-serif">
    <g fill="#eef2ff" stroke="#6366f1" stroke-width="3">
      <rect x="70" y="135" width="260" height="130" rx="20"/><rect x="470" y="135" width="260" height="130" rx="20"/><rect x="870" y="135" width="260" height="130" rx="20"/>
    </g>
    <g text-anchor="middle" fill="#312e81">
      <text x="200" y="182" font-size="25" font-weight="700">1. Inventory</text><text x="200" y="217" font-size="18">Composer · 확장 · INI</text><text x="200" y="242" font-size="18">현재 기준선 저장</text>
      <text x="600" y="182" font-size="25" font-weight="700">2. Dual Runtime</text><text x="600" y="217" font-size="18">8.4 vs 8.5.12</text><text x="600" y="242" font-size="18">응답·예외·payload diff</text>
      <text x="1000" y="182" font-size="25" font-weight="700">3. Failure Corpus</text><text x="1000" y="217" font-size="18">PDO · Session · Cast</text><text x="1000" y="242" font-size="18">오염 입력과 복구 경로</text>
    </g>
    <path d="M330 200h140M730 200h140" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>

    <g fill="#ecfeff" stroke="#0891b2" stroke-width="3">
      <rect x="70" y="390" width="260" height="130" rx="20"/><rect x="470" y="390" width="260" height="130" rx="20"/><rect x="870" y="390" width="260" height="130" rx="20"/>
    </g>
    <g text-anchor="middle" fill="#164e63">
      <text x="200" y="437" font-size="25" font-weight="700">6. Rollback</text><text x="200" y="472" font-size="18">검증된 digest 복귀</text><text x="200" y="497" font-size="18">queue·session 역호환</text>
      <text x="600" y="437" font-size="25" font-weight="700">5. Full Rollout</text><text x="600" y="472" font-size="18">FPM drain · 관측</text><text x="600" y="497" font-size="18">패치 시간 기록</text>
      <text x="1000" y="437" font-size="25" font-weight="700">4. Canary</text><text x="1000" y="472" font-size="18">읽기 경로 → 상태 변경</text><text x="1000" y="497" font-size="18">warning · p99 · memory</text>
    </g>
    <path d="M1000 265v125M870 455H730M470 455H330" stroke="#475569" stroke-width="4" marker-end="url(#a)" fill="none"/>

    <rect x="150" y="610" width="900" height="88" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="600" y="646" text-anchor="middle" font-size="24" font-weight="700" fill="#7f1d1d">중단 조건</text>
    <text x="600" y="678" text-anchor="middle" font-size="19" fill="#991b1b">의미가 달라진 응답 · 필수 확장 미지원 · 로그 폭주 · 롤백 불가 · exact artifact 추적 실패</text>
    <path d="M200 520v90" stroke="#ef4444" stroke-width="4" marker-end="url(#a)"/>
  </g>
</svg>
