<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ComfyUI 재현성 아키텍처</title>
  <desc id="desc">워크플로 그래프, 커스텀 노드, 모델 저장소, 런타임과 검증 산출물을 계층으로 나눈 구조</desc>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">워크플로 하나를 재현하는 데 필요한 다섯 계층</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 120)"><rect width="205" height="470" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="102" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">그래프</text><text x="25" y="105" font-size="20" fill="#1e3a8a">• workflow JSON</text><text x="25" y="145" font-size="20" fill="#1e3a8a">• seed · prompt</text><text x="25" y="185" font-size="20" fill="#1e3a8a">• node 연결</text><text x="25" y="225" font-size="20" fill="#1e3a8a">• 입력 asset</text></g>
    <g transform="translate(285 120)"><rect width="205" height="470" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="102" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#4c1d95">노드 코드</text><text x="25" y="105" font-size="20" fill="#4c1d95">• 저장소 commit</text><text x="25" y="145" font-size="20" fill="#4c1d95">• requirements</text><text x="25" y="185" font-size="20" fill="#4c1d95">• install script</text><text x="25" y="225" font-size="20" fill="#4c1d95">• frontend/API</text></g>
    <g transform="translate(510 120)"><rect width="205" height="470" rx="20" fill="#cffafe" stroke="#0891b2" stroke-width="3"/><text x="102" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#164e63">모델</text><text x="25" y="105" font-size="20" fill="#164e63">• checkpoint</text><text x="25" y="145" font-size="20" fill="#164e63">• VAE · LoRA</text><text x="25" y="185" font-size="20" fill="#164e63">• SHA-256</text><text x="25" y="225" font-size="20" fill="#164e63">• 라이선스</text></g>
    <g transform="translate(735 120)"><rect width="205" height="470" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="102" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#14532d">런타임</text><text x="25" y="105" font-size="20" fill="#14532d">• core/frontend</text><text x="25" y="145" font-size="20" fill="#14532d">• PyTorch</text><text x="25" y="185" font-size="20" fill="#14532d">• driver/backend</text><text x="25" y="225" font-size="20" fill="#14532d">• 실행 옵션</text></g>
    <g transform="translate(960 120)"><rect width="180" height="470" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="90" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#7c2d12">검증</text><text x="22" y="105" font-size="19" fill="#7c2d12">• 품질 fixture</text><text x="22" y="145" font-size="19" fill="#7c2d12">• VRAM/시간</text><text x="22" y="185" font-size="19" fill="#7c2d12">• egress log</text><text x="22" y="225" font-size="19" fill="#7c2d12">• rollback</text></g>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none"><path d="M265 355h20"/><path d="M490 355h20"/><path d="M715 355h20"/><path d="M940 355h20"/></g>
  <rect x="160" y="630" width="880" height="54" rx="27" fill="#0f172a"/><text x="600" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">workflow JSON + manifest + immutable artifact = 재현 가능한 실행 계약</text>
</svg>
