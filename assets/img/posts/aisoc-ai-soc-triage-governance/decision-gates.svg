<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AiSOC 운영 승격 의사결정 게이트</title>
  <desc id="desc">데이터, 탐지, AI 근거, 승인, 실행 검증, 복구를 순서대로 통과하는 의사결정 흐름</desc>
  <rect width="1200" height="760" fill="#0b1220"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="800">자동 대응보다 먼저 통과해야 할 6개 게이트</text>
  <text x="60" y="110" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">어느 단계든 실패하면 shadow mode 또는 preview로 돌아간다.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(65 165)"><circle cx="55" cy="55" r="52" fill="#082f49" stroke="#38bdf8" stroke-width="4"/><text x="55" y="63" text-anchor="middle" fill="#bae6fd" font-size="30" font-weight="800">1</text><text x="130" y="42" fill="#f8fafc" font-size="23" font-weight="700">데이터 완전성</text><text x="130" y="74" fill="#94a3b8" font-size="17">actor · time · event id · cursor gap</text></g>
    <g transform="translate(620 165)"><circle cx="55" cy="55" r="52" fill="#052e16" stroke="#4ade80" stroke-width="4"/><text x="55" y="63" text-anchor="middle" fill="#bbf7d0" font-size="30" font-weight="800">2</text><text x="130" y="42" fill="#f8fafc" font-size="23" font-weight="700">탐지·상관 재현성</text><text x="130" y="74" fill="#94a3b8" font-size="17">rule fire · false merge · suppression</text></g>
    <g transform="translate(65 325)"><circle cx="55" cy="55" r="52" fill="#422006" stroke="#fbbf24" stroke-width="4"/><text x="55" y="63" text-anchor="middle" fill="#fde68a" font-size="30" font-weight="800">3</text><text x="130" y="42" fill="#f8fafc" font-size="23" font-weight="700">AI 근거 계약</text><text x="130" y="74" fill="#94a3b8" font-size="17">citation · unsupported claim · abstain</text></g>
    <g transform="translate(620 325)"><circle cx="55" cy="55" r="52" fill="#3b0764" stroke="#c084fc" stroke-width="4"/><text x="55" y="63" text-anchor="middle" fill="#e9d5ff" font-size="30" font-weight="800">4</text><text x="130" y="42" fill="#f8fafc" font-size="23" font-weight="700">권한·승인</text><text x="130" y="74" fill="#94a3b8" font-size="17">tier · separation of duties · timeout</text></g>
    <g transform="translate(65 485)"><circle cx="55" cy="55" r="52" fill="#4c0519" stroke="#fb7185" stroke-width="4"/><text x="55" y="63" text-anchor="middle" fill="#fecdd3" font-size="30" font-weight="800">5</text><text x="130" y="42" fill="#f8fafc" font-size="23" font-weight="700">실행·사후 확인</text><text x="130" y="74" fill="#94a3b8" font-size="17">idempotency · read-back · rollback</text></g>
    <g transform="translate(620 485)"><circle cx="55" cy="55" r="52" fill="#172554" stroke="#818cf8" stroke-width="4"/><text x="55" y="63" text-anchor="middle" fill="#c7d2fe" font-size="30" font-weight="800">6</text><text x="130" y="42" fill="#f8fafc" font-size="23" font-weight="700">복구·업그레이드</text><text x="130" y="74" fill="#94a3b8" font-size="17">backup · migration · replay · rollback</text></g>
    <path d="M120 285v30M675 285v30M120 445v30M675 445v30" stroke="#475569" stroke-width="4" stroke-dasharray="7 7"/>
    <rect x="270" y="655" width="660" height="64" rx="18" fill="#111827" stroke="#34d399" stroke-width="3"/>
    <text x="600" y="695" text-anchor="middle" fill="#a7f3d0" font-size="22" font-weight="700">전부 통과한 뒤에도 고위험 대응은 단계적으로 자동화한다</text>
  </g>
</svg>
