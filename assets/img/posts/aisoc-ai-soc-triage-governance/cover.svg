    <path d="M198 43h55" stroke="#38bdf8" stroke-width="5" marker-end="url(#a)"/>
    <rect x="260" y="0" width="190" height="86" rx="18" fill="#0b2033" stroke="#34d399" stroke-width="2"/><text x="355" y="36" text-anchor="middle" fill="#a7f3d0" font-family="Arial" font-size="20" font-weight="700">DETECT</text><text x="355" y="64" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">RULE · CORRELATE</text>
    <path d="M458 43h55" stroke="#34d399" stroke-width="5"/>
    <rect x="520" y="0" width="190" height="86" rx="18" fill="#0b2033" stroke="#fbbf24" stroke-width="2"/><text x="615" y="36" text-anchor="middle" fill="#fde68a" font-family="Arial" font-size="20" font-weight="700">AI INVESTIGATE</text><text x="615" y="64" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">EVIDENCE LEDGER</text>
    <path d="M718 43h55" stroke="#fbbf24" stroke-width="5"/>
    <rect x="780" y="0" width="250" height="86" rx="18" fill="#0b2033" stroke="#fb7185" stroke-width="2"/><text x="905" y="36" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="20" font-weight="700">APPROVE &amp; VERIFY</text><text x="905" y="64" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">HUMAN · ROLLBACK</text>
