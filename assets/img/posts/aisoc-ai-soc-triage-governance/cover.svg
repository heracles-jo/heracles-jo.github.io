    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="190" fill="#0f766e" opacity=".18"/><circle cx="150" cy="580" r="230" fill="#0369a1" opacity=".14"/>
  <text x="78" y="120" fill="#67e8f9" font-family="Arial, sans-serif" font-size="25" font-weight="700">SECURITY OPERATIONS · INCIDENT TRIAGE · SOAR</text>
  <text x="78" y="210" fill="#f8fafc" font-family="Arial, sans-serif" font-size="64" font-weight="800">AI SOC 자동화</text>
  <text x="78" y="282" fill="#d5f5f2" font-family="Arial, sans-serif" font-size="38" font-weight="700">트리아지·대응 승인 검증 기준</text>
  <g transform="translate(82 360)">
