<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AiSOC 텔레메트리부터 승인 대응까지의 아키텍처</title>
  <desc id="desc">수집, 정규화, 탐지, 사건 상관, AI 조사, 증거 원장, 사람 승인, 대응 검증의 흐름</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="36" font-weight="800">AI SOC는 모델이 아니라 경계의 연결이다</text>
  <text x="60" y="108" fill="#475569" font-family="Arial, sans-serif" font-size="20">각 단계의 입력·상태·권한·실행 결과를 분리해야 조사와 대응을 재현할 수 있다.</text>
