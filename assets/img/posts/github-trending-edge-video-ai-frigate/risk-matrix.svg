<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Edge video AI risk matrix</title><desc id="desc">Risk matrix for privacy, false positives, storage, network, and model drift.</desc><rect width="1100" height="500" fill="#0f172a"/><style>.t{font-family:Arial,sans-serif;fill:#e2e8f0}.h{font-size:31px;font-weight:700}.s{font-size:22px}.cell{rx:16;stroke:#334155;stroke-width:2}</style><text x="55" y="60" class="t h">엣지 비디오 AI 운영 리스크 매트릭스</text><g transform="translate(60 105)"><rect class="cell" width="300" height="115" fill="#164e63"/><text x="26" y="48" class="t s">개인정보/촬영 고지</text><text x="26" y="82" class="t" font-size="18">마스킹·접근통제·감사로그</text><rect class="cell" x="370" width="300" height="115" fill="#7c2d12"/><text x="396" y="48" class="t s">오탐/미탐</text><text x="396" y="82" class="t" font-size="18">알림 정책과 휴먼 리뷰</text><rect class="cell" x="740" width="300" height="115" fill="#713f12"/><text x="766" y="48" class="t s">저장소 폭증</text><text x="766" y="82" class="t" font-size="18">보존기간·이벤트 기반 녹화</text><rect class="cell" y="155" width="300" height="115" fill="#14532d"/><text x="26" y="203" class="t s">네트워크 지연</text><text x="26" y="237" class="t" font-size="18">카메라 VLAN·대역폭 예산</text><rect class="cell" x="370" y="155" width="300" height="115" fill="#581c87"/><text x="396" y="203" class="t s">모델 드리프트</text><text x="396" y="237" class="t" font-size="18">현장 데이터 재검증</text><rect class="cell" x="740" y="155" width="300" height="115" fill="#1e3a8a"/><text x="766" y="203" class="t s">장애 대응</text><text x="766" y="237" class="t" font-size="18">헬스체크·백업·복구훈련</text></g><text x="60" y="450" class="t" font-size="20">Frigate 같은 로컬 NVR은 프라이버시 장점이 있지만, 운영 책임도 함께 로컬로 이동한다.</text></svg>