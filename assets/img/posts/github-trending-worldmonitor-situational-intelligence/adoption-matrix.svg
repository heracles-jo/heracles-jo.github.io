<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Adoption risk matrix for open-source intelligence dashboard</title>
  <desc id="desc">A 2x2 matrix compares exploration, controlled pilot, risky automation, and operational system of record.</desc>
  <rect width="1100" height="560" rx="30" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">도입 판단 매트릭스</text>
  <text x="60" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">데이터 신뢰성과 운영 통제 수준에 따라 PoC 범위를 다르게 잡아야 한다</text>
  <line x1="180" y1="460" x2="970" y2="460" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="180" y1="460" x2="180" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker></defs>
  <text x="420" y="510" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">데이터 신뢰성·출처 검증 수준 →</text>
  <text x="48" y="310" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155" transform="rotate(-90 48 310)">운영 통제·감사 가능성 →</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="205" y="295" width="340" height="140" rx="20" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="230" y="333" font-size="22" font-weight="800" fill="#1d4ed8">탐색형 데모</text>
    <text x="230" y="366" font-size="15" fill="#334155">공개 데이터 흐름과 UI 적합성 확인</text>
    <text x="230" y="392" font-size="15" fill="#334155">의사결정 자동화 금지, 출처 확인 수동</text>
    <rect x="585" y="295" width="340" height="140" rx="20" fill="#dcfce7" stroke="#4ade80"/>
    <text x="610" y="333" font-size="22" font-weight="800" fill="#166534">통제된 PoC</text>
    <text x="610" y="366" font-size="15" fill="#334155">허용 출처·캐시·알림 기준을 명문화</text>
    <text x="610" y="392" font-size="15" fill="#334155">보안·법무·운영팀이 함께 리뷰</text>
    <rect x="205" y="135" width="340" height="140" rx="20" fill="#fee2e2" stroke="#f87171"/>
    <text x="230" y="173" font-size="22" font-weight="800" fill="#991b1b">위험한 자동화</text>
    <text x="230" y="206" font-size="15" fill="#334155">불완전한 출처를 근거로 자동 알림 남발</text>
    <text x="230" y="232" font-size="15" fill="#334155">오탐·편향·평판 리스크가 빠르게 커짐</text>
    <rect x="585" y="135" width="340" height="140" rx="20" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="610" y="173" font-size="22" font-weight="800" fill="#92400e">운영 시스템 후보</text>
    <text x="610" y="206" font-size="15" fill="#334155">SLO, 감사 로그, 책임 경계, 재현성 확보</text>
    <text x="610" y="232" font-size="15" fill="#334155">SOC·리스크·공급망 모니터링과 연동</text>
  </g>
</svg>
