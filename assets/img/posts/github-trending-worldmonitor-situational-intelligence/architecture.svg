<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Situational intelligence pipeline architecture</title>
  <desc id="desc">External feeds flow through collectors, normalization, scoring, cache, map panels, and operator review.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1100" height="620" rx="28" fill="#f8fafc"/>
  <text x="58" y="62" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">실시간 상황 인텔리전스 파이프라인</text>
  <text x="58" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">뉴스·위성·항공·시장·기후·보안 신호를 하나의 운영 화면으로 만들 때 필요한 계층</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(56 160)">
      <rect width="170" height="120" rx="18" fill="url(#panel)" stroke="#93c5fd"/>
      <text x="22" y="38" font-size="18" font-weight="800" fill="#1e3a8a">1. 외부 신호</text>
      <text x="22" y="68" font-size="14" fill="#334155">RSS · API · ADS-B</text><text x="22" y="91" font-size="14" fill="#334155">시장 · 기후 · 사건</text>
    </g>
    <g transform="translate(286 160)">
      <rect width="170" height="120" rx="18" fill="#eef2ff" stroke="#a5b4fc"/>
      <text x="22" y="38" font-size="18" font-weight="800" fill="#3730a3">2. 수집/정규화</text>
      <text x="22" y="68" font-size="14" fill="#334155">스키마 매핑</text><text x="22" y="91" font-size="14" fill="#334155">중복 제거·좌표화</text>
    </g>
    <g transform="translate(516 160)">
      <rect width="170" height="120" rx="18" fill="#fef9c3" stroke="#fde047"/>
      <text x="22" y="38" font-size="18" font-weight="800" fill="#854d0e">3. 점수/상관</text>
      <text x="22" y="68" font-size="14" fill="#334155">CII · market composite</text><text x="22" y="91" font-size="14" fill="#334155">이상 징후 결합</text>
    </g>
    <g transform="translate(746 160)">
      <rect width="170" height="120" rx="18" fill="#dcfce7" stroke="#86efac"/>
      <text x="22" y="38" font-size="18" font-weight="800" fill="#166534">4. 캐시/서빙</text>
      <text x="22" y="68" font-size="14" fill="#334155">Redis · Edge Function</text><text x="22" y="91" font-size="14" fill="#334155">Circuit breaker</text>
    </g>
    <g transform="translate(516 370)">
      <rect width="170" height="120" rx="18" fill="#fff7ed" stroke="#fdba74"/>
      <text x="22" y="38" font-size="18" font-weight="800" fill="#9a3412">5. 지도/패널</text>
      <text x="22" y="68" font-size="14" fill="#334155">3D globe · deck.gl</text><text x="22" y="91" font-size="14" fill="#334155">상황판·알림</text>
    </g>
    <g transform="translate(746 370)">
      <rect width="170" height="120" rx="18" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="22" y="38" font-size="18" font-weight="800" fill="#991b1b">6. 운영 판단</text>
      <text x="22" y="68" font-size="14" fill="#334155">출처 검증</text><text x="22" y="91" font-size="14" fill="#334155">플레이북·감사 로그</text>
    </g>
  </g>
  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M226 220H282"/><path d="M456 220H512"/><path d="M686 220H742"/><path d="M831 281v83"/><path d="M746 430H690"/>
  </g>
  <rect x="64" y="380" width="330" height="96" rx="18" fill="#0f172a" opacity="0.95"/>
  <text x="90" y="416" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#e0f2fe">핵심 운영 질문</text>
  <text x="90" y="446" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">이 신호는 신뢰 가능한가? 얼마나 최신인가?</text>
  <text x="90" y="469" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">자동 점수는 누구의 의사결정을 보조하는가?</text>
</svg>
