<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Database schema governance risk matrix</title><desc id="desc">Risk matrix for browser ERD adoption: SQL dialect fidelity, privacy, source of truth, licensing, and workflow drift.</desc><rect width="1100" height="520" rx="24" fill="#0f172a"/><text x="60" y="72" font-family="Arial" font-size="34" font-weight="800" fill="#fff">도입 전 점검해야 할 리스크</text><g font-family="Arial" font-size="18"><rect x="80" y="130" width="300" height="105" rx="18" fill="#fee2e2"/><text x="110" y="170" font-weight="800" fill="#991b1b">SQL 방언 충실도</text><text x="110" y="202" fill="#450a0a">파서가 놓친 제약 조건과 인덱스</text><rect x="420" y="130" width="300" height="105" rx="18" fill="#ffedd5"/><text x="450" y="170" font-weight="800" fill="#9a3412">Source of truth 충돌</text><text x="450" y="202" fill="#431407">그림과 migration의 불일치</text><rect x="760" y="130" width="260" height="105" rx="18" fill="#fef9c3"/><text x="790" y="170" font-weight="800" fill="#854d0e">라이선스</text><text x="790" y="202" fill="#422006">AGPL-3.0 배포 경계 검토</text><rect x="80" y="275" width="300" height="105" rx="18" fill="#dcfce7"/><text x="110" y="315" font-weight="800" fill="#166534">데이터 노출</text><text x="110" y="347" fill="#052e16">스키마·샘플 데이터 반출 통제</text><rect x="420" y="275" width="300" height="105" rx="18" fill="#dbeafe"/><text x="450" y="315" font-weight="800" fill="#1d4ed8">리뷰 병목</text><text x="450" y="347" fill="#0f172a">DBA·플랫폼 승인 기준 필요</text><rect x="760" y="275" width="260" height="105" rx="18" fill="#e0e7ff"/><text x="790" y="315" font-weight="800" fill="#3730a3">자동 생성 SQL</text><text x="790" y="347" fill="#111827">성능·락 영향 별도 검증</text></g><text x="80" y="455" font-family="Arial" font-size="22" fill="#bae6fd">핵심 판단: 시각화 도구는 설계를 빠르게 하지만, 운영 DB 변경의 통제 지점을 대신하지 않는다.</text></svg>