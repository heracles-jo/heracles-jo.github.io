<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Schema design workflow</title><desc id="desc">SQL import, visual modeling, review, migration, and documentation workflow around database schema design.</desc><rect width="1100" height="520" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="60" y="70" font-size="34" font-weight="800" fill="#0f172a">브라우저 ERD가 들어가는 위치</text><text x="60" y="105" font-size="18" fill="#475569">drawDB는 운영 DB를 대체하지 않고 스키마 변경 논의의 앞단을 시각화한다.</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker></defs><g font-family="Arial" font-size="20" font-weight="700"><rect x="70" y="180" width="170" height="90" rx="16" fill="#dbeafe" stroke="#2563eb"/><text x="103" y="232" fill="#0f172a">DDL / SQL</text><rect x="300" y="180" width="170" height="90" rx="16" fill="#ccfbf1" stroke="#0f766e"/><text x="330" y="222" fill="#0f172a">시각 모델</text><text x="340" y="248" fill="#0f172a" font-size="16">ERD 편집</text><rect x="530" y="180" width="170" height="90" rx="16" fill="#fef3c7" stroke="#d97706"/><text x="565" y="222" fill="#0f172a">리뷰</text><text x="552" y="248" fill="#0f172a" font-size="16">도메인 합의</text><rect x="760" y="180" width="170" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed"/><text x="803" y="222" fill="#0f172a">마이그레이션</text><text x="805" y="248" fill="#0f172a" font-size="16">검증/배포</text><path d="M240 225 H300" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/><path d="M470 225 H530" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/><path d="M700 225 H760" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/></g><g font-family="Arial" font-size="17" fill="#334155"><rect x="110" y="345" width="880" height="94" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="145" y="385">운영 원칙: 실제 변경은 Flyway·Liquibase·Prisma·Rails migration 같은 버전 관리 파이프라인에서 실행한다.</text><text x="145" y="418">ERD는 설계 검토, 커뮤니케이션, 영향 범위 파악을 빠르게 만드는 보조 계층으로 두는 것이 안전하다.</text></g></svg>