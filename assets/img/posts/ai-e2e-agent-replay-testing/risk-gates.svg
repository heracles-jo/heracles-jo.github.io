<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AI E2E 테스트 PoC 위험 게이트</title>
  <desc id="desc">정확성, 재생 안정성, 비용, 보안, 운영성 순서의 채택 판단 게이트</desc>
  <rect width="1200" height="680" rx="28" fill="#0f172a"/>
  <text x="60" y="68" fill="#f8fafc" font-family="Arial, sans-serif" font-size="32" font-weight="700">PoC 의사결정: 통과율보다 잘못된 통과를 먼저 막는다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 125)"><rect width="205" height="390" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="2"/><circle cx="102" cy="68" r="38" fill="#2563eb"/><text x="102" y="78" text-anchor="middle" fill="white" font-size="28" font-weight="700">1</text><text x="102" y="135" text-anchor="middle" fill="#bfdbfe" font-size="23" font-weight="700">정확성</text><text x="102" y="180" text-anchor="middle" fill="#e2e8f0" font-size="17">deterministic assertion</text><text x="102" y="210" text-anchor="middle" fill="#e2e8f0" font-size="17">false pass = 0</text><path d="M30 280h145" stroke="#ef4444" stroke-width="2"/><text x="102" y="325" text-anchor="middle" fill="#fca5a5" font-size="17">잘못된 통과 발생 시</text><text x="102" y="352" text-anchor="middle" fill="#fca5a5" font-size="17">즉시 중단</text></g>
    <g transform="translate(285 125)"><rect width="205" height="390" rx="20" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><circle cx="102" cy="68" r="38" fill="#7c3aed"/><text x="102" y="78" text-anchor="middle" fill="white" font-size="28" font-weight="700">2</text><text x="102" y="135" text-anchor="middle" fill="#ddd6fe" font-size="23" font-weight="700">재생 안정성</text><text x="102" y="180" text-anchor="middle" fill="#e2e8f0" font-size="17">replay · hand-off</text><text x="102" y="210" text-anchor="middle" fill="#e2e8f0" font-size="17">stale reason</text><path d="M30 280h145" stroke="#f59e0b" stroke-width="2"/><text x="102" y="325" text-anchor="middle" fill="#fde68a" font-size="17">UI 변화 원인을</text><text x="102" y="352" text-anchor="middle" fill="#fde68a" font-size="17">설명할 수 있어야 함</text></g>
    <g transform="translate(510 125)"><rect width="205" height="390" rx="20" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/><circle cx="102" cy="68" r="38" fill="#0891b2"/><text x="102" y="78" text-anchor="middle" fill="white" font-size="28" font-weight="700">3</text><text x="102" y="135" text-anchor="middle" fill="#a5f3fc" font-size="23" font-weight="700">비용·지연</text><text x="102" y="180" text-anchor="middle" fill="#e2e8f0" font-size="17">model calls · token</text><text x="102" y="210" text-anchor="middle" fill="#e2e8f0" font-size="17">CI p50 · p95</text><path d="M30 280h145" stroke="#22d3ee" stroke-width="2"/><text x="102" y="325" text-anchor="middle" fill="#a5f3fc" font-size="17">cache 전후 총비용을</text><text x="102" y="352" text-anchor="middle" fill="#a5f3fc" font-size="17">같은 흐름으로 비교</text></g>
    <g transform="translate(735 125)"><rect width="205" height="390" rx="20" fill="#1e293b" stroke="#f87171" stroke-width="2"/><circle cx="102" cy="68" r="38" fill="#dc2626"/><text x="102" y="78" text-anchor="middle" fill="white" font-size="28" font-weight="700">4</text><text x="102" y="135" text-anchor="middle" fill="#fecaca" font-size="23" font-weight="700">보안</text><text x="102" y="180" text-anchor="middle" fill="#e2e8f0" font-size="17">secret canary · egress</text><text x="102" y="210" text-anchor="middle" fill="#e2e8f0" font-size="17">PR sandbox</text><path d="M30 280h145" stroke="#ef4444" stroke-width="2"/><text x="102" y="325" text-anchor="middle" fill="#fca5a5" font-size="17">공유 artifact 노출 시</text><text x="102" y="352" text-anchor="middle" fill="#fca5a5" font-size="17">즉시 중단</text></g>
    <g transform="translate(960 125)"><rect width="180" height="390" rx="20" fill="#14532d" stroke="#4ade80" stroke-width="2"/><circle cx="90" cy="68" r="38" fill="#16a34a"/><text x="90" y="78" text-anchor="middle" fill="white" font-size="28" font-weight="700">5</text><text x="90" y="135" text-anchor="middle" fill="#bbf7d0" font-size="23" font-weight="700">운영 채택</text><text x="90" y="180" text-anchor="middle" fill="#e2e8f0" font-size="17">owner · upgrade</text><text x="90" y="210" text-anchor="middle" fill="#e2e8f0" font-size="17">rollback · SLA</text><path d="M25 280h130" stroke="#4ade80" stroke-width="2"/><text x="90" y="325" text-anchor="middle" fill="#bbf7d0" font-size="17">제한된 흐름부터</text><text x="90" y="352" text-anchor="middle" fill="#bbf7d0" font-size="17">단계적으로 확대</text></g>
  </g>
  <path d="M80 570H1120" stroke="#334155" stroke-width="4"/><text x="600" y="625" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="21">앞 단계가 실패하면 뒤 단계의 비용 절감 수치는 채택 근거가 되지 않는다</text>
</svg>
