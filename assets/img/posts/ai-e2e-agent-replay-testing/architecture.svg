<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI E2E 테스트 아키텍처</title>
  <desc id="desc">테스트 계약, 에이전트 실행, 러너 정책, 앱, 검증, 재생 캐시가 분리된 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">AI E2E 테스트: 행동 선택과 통과 판정의 분리</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="120" width="280" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="200" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#075985">테스트 계약</text>
    <text x="200" y="202" text-anchor="middle" font-size="19" fill="#0f172a">goal · params · Secret</text>
    <text x="200" y="230" text-anchor="middle" font-size="19" fill="#0f172a">locator · expect</text>

    <rect x="460" y="110" width="280" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="155" text-anchor="middle" font-size="24" font-weight="700" fill="#5b21b6">Agent executor</text>
    <text x="600" y="192" text-anchor="middle" font-size="19" fill="#0f172a">화면 의미 해석</text>
    <text x="600" y="220" text-anchor="middle" font-size="19" fill="#0f172a">다음 행동 · verdict 제안</text>

    <rect x="860" y="110" width="280" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1000" y="155" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">Runner policy</text>
    <text x="1000" y="192" text-anchor="middle" font-size="19" fill="#0f172a">redaction · schema · budget</text>
    <text x="1000" y="220" text-anchor="middle" font-size="19" fill="#0f172a">secret fill · action dispatch</text>

    <rect x="460" y="350" width="280" height="130" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="398" text-anchor="middle" font-size="24" font-weight="700" fill="#9a3412">App under test</text>
    <text x="600" y="435" text-anchor="middle" font-size="19" fill="#0f172a">Web · iOS · Android</text>

    <rect x="60" y="550" width="280" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="200" y="595" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">Replay cache</text>
    <text x="200" y="630" text-anchor="middle" font-size="18" fill="#0f172a">검증된 행동만 저장</text>

    <rect x="860" y="550" width="280" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1000" y="595" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af">Deterministic gate</text>
    <text x="1000" y="630" text-anchor="middle" font-size="18" fill="#0f172a">URL · role · 데이터 상태</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M340 180H450"/><path d="M740 185H850"/><path d="M1000 260V325Q1000 415 750 415"/>
    <path d="M460 415H350Q200 415 200 540"/><path d="M740 415H850Q1000 415 1000 540"/>
    <path d="M860 605H350" stroke-dasharray="10 8"/><path d="M200 550V290Q200 270 340 230" stroke-dasharray="10 8"/>
  </g>
  <text x="600" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">실선: 실행·검증 흐름 · 점선: 검증된 replay의 다음 실행 경로</text>
</svg>
