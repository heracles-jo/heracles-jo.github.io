<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Android Skills 검증 아키텍처</title>
  <desc id="desc">요청과 저장소 문맥, Skill 계획, 에이전트 변경, Android 도구 체인과 승인 증거의 계층 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#228b62"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#f5faf7"/>
  <text x="60" y="65" fill="#12372b" font-family="Arial, sans-serif" font-size="34" font-weight="800">Skill은 계획 계층, Android 도구는 판정 계층</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="115" width="250" height="130" rx="18" fill="#ffffff" stroke="#7bbf9f" stroke-width="3"/>
    <text x="185" y="160" text-anchor="middle" fill="#164c3c" font-size="23" font-weight="700">요청과 저장소 문맥</text>
    <text x="185" y="195" text-anchor="middle" fill="#47675b" font-size="17">모듈 · variant · minSdk</text>
    <text x="185" y="222" text-anchor="middle" fill="#47675b" font-size="17">Gradle · Kotlin · CI</text>
    <path d="M310 180h90" stroke="#228b62" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="410" y="105" width="330" height="150" rx="18" fill="#e1f6ea" stroke="#3b9f72" stroke-width="3"/>
    <text x="575" y="150" text-anchor="middle" fill="#12372b" font-size="25" font-weight="800">Android Skills</text>
    <text x="575" y="185" text-anchor="middle" fill="#365d4e" font-size="17">작업 순서 · limitation · references</text>
    <text x="575" y="214" text-anchor="middle" fill="#365d4e" font-size="17">선택적 scripts · report contract</text>
    <path d="M740 180h90" stroke="#228b62" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="840" y="115" width="300" height="130" rx="18" fill="#ffffff" stroke="#7bbf9f" stroke-width="3"/>
    <text x="990" y="160" text-anchor="middle" fill="#164c3c" font-size="23" font-weight="700">에이전트 변경</text>
    <text x="990" y="195" text-anchor="middle" fill="#47675b" font-size="17">diff · 명령 · 보고서</text>
    <text x="990" y="222" text-anchor="middle" fill="#47675b" font-size="17">아직 승인되지 않은 산출물</text>

    <path d="M990 245v70" stroke="#228b62" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="80" y="335" width="1040" height="260" rx="22" fill="#12372b"/>
    <text x="600" y="382" text-anchor="middle" fill="#b8f5d2" font-size="27" font-weight="800">독립 검증 게이트</text>
    <g>
      <rect x="115" y="420" width="220" height="125" rx="15" fill="#ffffff"/>
      <text x="225" y="462" text-anchor="middle" fill="#164c3c" font-size="21" font-weight="700">정적 구조</text>
      <text x="225" y="494" text-anchor="middle" fill="#526a61" font-size="16">scope · manifest · diff</text>
      <text x="225" y="520" text-anchor="middle" fill="#526a61" font-size="16">의존성 · 공급망</text>
      <rect x="365" y="420" width="220" height="125" rx="15" fill="#ffffff"/>
      <text x="475" y="462" text-anchor="middle" fill="#164c3c" font-size="21" font-weight="700">빌드 호환성</text>
      <text x="475" y="494" text-anchor="middle" fill="#526a61" font-size="16">sync · compile · lint</text>
      <text x="475" y="520" text-anchor="middle" fill="#526a61" font-size="16">debug · release</text>
      <rect x="615" y="420" width="220" height="125" rx="15" fill="#ffffff"/>
      <text x="725" y="462" text-anchor="middle" fill="#164c3c" font-size="21" font-weight="700">동작과 UI</text>
      <text x="725" y="494" text-anchor="middle" fill="#526a61" font-size="16">unit · device · E2E</text>
      <text x="725" y="520" text-anchor="middle" fill="#526a61" font-size="16">screenshot · matrix</text>
      <rect x="865" y="420" width="220" height="125" rx="15" fill="#ffffff"/>
      <text x="975" y="462" text-anchor="middle" fill="#164c3c" font-size="21" font-weight="700">보안과 정책</text>
      <text x="975" y="494" text-anchor="middle" fill="#526a61" font-size="16">Intent · permission</text>
      <text x="975" y="520" text-anchor="middle" fill="#526a61" font-size="16">Play 선언 · 사람 검토</text>
    </g>
    <path d="M600 595v62" stroke="#228b62" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="350" y="665" width="500" height="64" rx="16" fill="#d3f2e1" stroke="#3b9f72" stroke-width="3"/>
    <text x="600" y="706" text-anchor="middle" fill="#12372b" font-size="23" font-weight="800">승인 증거: artifact · report · hash · rollback</text>
  </g>
</svg>
