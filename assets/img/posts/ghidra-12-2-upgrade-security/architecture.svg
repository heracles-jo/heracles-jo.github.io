<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ghidra 12.2 업그레이드 아키텍처</title>
  <desc id="desc">공식 배포 파일에서 런타임, 분석 상태, 자동화, 서버와 격리 경계로 이어지는 검증 구조</desc>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#102a43">Ghidra 12.2 업그레이드 단위</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 110)"><rect width="250" height="130" rx="18" fill="#0b7285"/><text x="125" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="700">배포 무결성</text><text x="125" y="76" text-anchor="middle" fill="#c5f6fa" font-size="18">공식 ZIP · SHA-256</text><text x="125" y="104" text-anchor="middle" fill="#c5f6fa" font-size="18">SBOM · side-by-side</text></g>
    <g transform="translate(355 110)"><rect width="250" height="130" rx="18" fill="#1864ab"/><text x="125" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="700">런타임</text><text x="125" y="76" text-anchor="middle" fill="#d0ebff" font-size="18">JDK 25 · Python</text><text x="125" y="104" text-anchor="middle" fill="#d0ebff" font-size="18">native components</text></g>
    <g transform="translate(655 110)"><rect width="250" height="130" rx="18" fill="#2b8a3e"/><text x="125" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="700">분석 상태</text><text x="125" y="76" text-anchor="middle" fill="#d3f9d8" font-size="18">project · data types</text><text x="125" y="104" text-anchor="middle" fill="#d3f9d8" font-size="18">profile · cache</text></g>
    <g transform="translate(955 110)"><rect width="190" height="130" rx="18" fill="#5f3dc4"/><text x="95" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="700">확장</text><text x="95" y="76" text-anchor="middle" fill="#e5dbff" font-size="18">loader · analyzer</text><text x="95" y="104" text-anchor="middle" fill="#e5dbff" font-size="18">scripts · APIs</text></g>
    <path d="M305 175h50M605 175h50M905 175h50" stroke="#627d98" stroke-width="5" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#627d98"/></marker></defs>
    <g transform="translate(90 330)"><rect width="300" height="150" rx="18" fill="#fff" stroke="#9fb3c8" stroke-width="3"/><text x="150" y="40" text-anchor="middle" fill="#243b53" font-size="24" font-weight="700">Workstation</text><text x="150" y="78" text-anchor="middle" fill="#486581" font-size="18">GUI · Debugger · PyGhidra</text><text x="150" y="110" text-anchor="middle" fill="#486581" font-size="18">fresh import ↔ upgraded copy</text></g>
    <g transform="translate(450 330)"><rect width="300" height="150" rx="18" fill="#fff" stroke="#9fb3c8" stroke-width="3"/><text x="150" y="40" text-anchor="middle" fill="#243b53" font-size="24" font-weight="700">Automation</text><text x="150" y="78" text-anchor="middle" fill="#486581" font-size="18">analyzeHeadless · CI</text><text x="150" y="110" text-anchor="middle" fill="#486581" font-size="18">allow list · deterministic output</text></g>
    <g transform="translate(810 330)"><rect width="300" height="150" rx="18" fill="#fff" stroke="#9fb3c8" stroke-width="3"/><text x="150" y="40" text-anchor="middle" fill="#243b53" font-size="24" font-weight="700">Collaboration</text><text x="150" y="78" text-anchor="middle" fill="#486581" font-size="18">Ghidra Server · BSim</text><text x="150" y="110" text-anchor="middle" fill="#486581" font-size="18">TLS · trust store · backup</text></g>
    <path d="M240 280v50M600 280v50M960 280v50" stroke="#627d98" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(120 570)"><rect width="960" height="120" rx="22" fill="#3b1d2a"/><text x="480" y="40" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">비신뢰 바이너리 분석 격리 경계</text><text x="480" y="76" text-anchor="middle" fill="#ffd8e4" font-size="18">read-only sample · 제한된 egress · 별도 사용자/VM · CPU/heap/disk/time limit · canary credential</text><text x="480" y="103" text-anchor="middle" fill="#ffd8e4" font-size="18">분석 결과는 원본 evidence가 아니라 버전이 고정된 파생 상태로 보존</text></g>
    <path d="M240 480v90M600 480v90M960 480v90" stroke="#c92a2a" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  </g>
</svg>
