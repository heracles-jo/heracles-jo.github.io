<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Twenty open-source CRM GitHub Trending analysis</title>
  <desc id="desc">Cover image for Korean technical analysis of Twenty open-source CRM</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#08111f"/><stop offset="52%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="210" fill="#38bdf8" opacity="0.16"/>
  <circle cx="150" cy="530" r="250" fill="#2dd4bf" opacity="0.16"/>
  <g filter="url(#shadow)">
    <rect x="84" y="78" width="1032" height="474" rx="36" fill="url(#card)" opacity="0.98"/>
    <text x="134" y="158" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">GitHub Trending · Open Source CRM</text>
    <text x="134" y="232" font-family="Arial, sans-serif" font-size="70" font-weight="900" fill="#0f172a">Twenty</text>
    <text x="134" y="284" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e40af">AI 시대의 CRM을 코드로 확장한다는 의미</text>
    <text x="134" y="348" font-family="Arial, sans-serif" font-size="21" fill="#334155">TypeScript · NestJS · React · PostgreSQL · Redis · AGPL/Enterprise</text>
    <g transform="translate(705 132)">
      <rect x="0" y="0" width="330" height="300" rx="28" fill="#0f172a" opacity="0.94"/>
      <rect x="34" y="42" width="262" height="46" rx="14" fill="#1d4ed8"/>
      <text x="165" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#e0f2fe">Customer OS</text>
      <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">
        <text x="64" y="134">Objects</text><text x="205" y="134">Views</text>
        <text x="64" y="198">Workflows</text><text x="205" y="198">Agents</text>
      </g>
      <g stroke="#38bdf8" stroke-width="4" opacity="0.85"><path d="M110 140 L165 166 L220 140" fill="none"/><path d="M110 204 L165 172 L220 204" fill="none"/></g>
      <rect x="74" y="232" width="182" height="34" rx="13" fill="#14b8a6"/>
      <text x="165" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#ecfeff">self-host or cloud</text>
    </g>
    <g transform="translate(134 420)">
      <rect width="164" height="48" rx="16" fill="#dbeafe"/><text x="82" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#1e3a8a">CRM</text>
      <rect x="184" width="164" height="48" rx="16" fill="#ccfbf1"/><text x="266" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#115e59">Platform</text>
      <rect x="368" width="164" height="48" rx="16" fill="#fef3c7"/><text x="450" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#92400e">Governance</text>
    </g>
