<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title id="title">Twenty adoption decision matrix</title><desc id="desc">Decision matrix comparing when to choose Twenty and when to choose alternatives</desc>
<rect width="1100" height="640" rx="30" fill="#f8fafc"/>
<text x="58" y="66" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#0f172a">Twenty 선택 판단표</text>
<text x="58" y="100" font-family="Arial,sans-serif" font-size="17" fill="#475569">CRM을 SaaS로 살지, 오픈소스 플랫폼으로 운영할지 결정할 때 볼 항목</text>
<g font-family="Arial,sans-serif" font-size="16">
  <rect x="58" y="132" width="984" height="76" rx="18" fill="#0f172a"/><text x="95" y="179" font-size="20" font-weight="900" fill="#e2e8f0">조건</text><text x="365" y="179" font-size="20" font-weight="900" fill="#bfdbfe">Twenty가 맞는 경우</text><text x="735" y="179" font-size="20" font-weight="900" fill="#fecaca">대안이 나은 경우</text>
  <g transform="translate(58 230)"><rect width="984" height="78" rx="18" fill="#dbeafe"/><text x="37" y="48" font-weight="800" fill="#1e3a8a">확장 방식</text><text x="270" y="38" fill="#1e3a8a">객체·필드·뷰를 코드로 관리하고</text><text x="270" y="61" fill="#1e3a8a">업무 앱처럼 CRM을 바꿔야 함</text><text x="650" y="48" fill="#7f1d1d">표준 영업 프로세스만 필요하고 변경이 적음</text></g>
  <g transform="translate(58 326)"><rect width="984" height="78" rx="18" fill="#ccfbf1"/><text x="37" y="48" font-weight="800" fill="#115e59">운영 역량</text><text x="270" y="38" fill="#115e59">PostgreSQL, Redis, 백업, 릴리스를</text><text x="270" y="61" fill="#115e59">플랫폼 팀이 책임질 수 있음</text><text x="650" y="48" fill="#7f1d1d">CRM 장애 대응을 내부에서 맡기 어렵다</text></g>
  <g transform="translate(58 422)"><rect width="984" height="78" rx="18" fill="#fef3c7"/><text x="37" y="48" font-weight="800" fill="#92400e">거버넌스</text><text x="270" y="38" fill="#92400e">데이터 주권, 감사, 내부 시스템 연동이</text><text x="270" y="61" fill="#92400e">SaaS 편의성보다 중요함</text><text x="650" y="48" fill="#7f1d1d">라이선스 검토와 패치 운영 비용을 피해야 함</text></g>
  <g transform="translate(58 518)"><rect width="984" height="78" rx="18" fill="#ede9fe"/><text x="37" y="48" font-weight="800" fill="#5b21b6">PoC 초점</text><text x="270" y="38" fill="#5b21b6">마이그레이션, 권한, 워크플로 실패 복구,</text><text x="270" y="61" fill="#5b21b6">API 한계까지 시험할 수 있음</text><text x="650" y="48" fill="#7f1d1d">데모 화면만 보고 빠르게 계약해야 하는 상황</text></g>
</g>
</svg>
