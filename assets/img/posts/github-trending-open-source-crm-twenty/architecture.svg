<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Twenty CRM architecture boundary</title><desc id="desc">Input, processing, storage, deployment, observability and security boundaries for Twenty CRM adoption</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1100" height="620" rx="30" fill="url(#bg)"/>
<text x="54" y="66" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#0f172a">Twenty 도입 시 책임 경계</text>
<text x="54" y="100" font-family="Arial,sans-serif" font-size="17" fill="#475569">CRM을 앱처럼 확장할 때는 제품 기능보다 데이터 흐름과 운영 책임을 먼저 나눠야 한다.</text>
<g font-family="Arial,sans-serif">
  <g transform="translate(54 145)"><rect width="180" height="130" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="90" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1e3a8a">Input</text><text x="90" y="76" text-anchor="middle" font-size="15" fill="#1e3a8a">영업/지원 사용자</text><text x="90" y="101" text-anchor="middle" font-size="15" fill="#1e3a8a">API, Import, Forms</text></g>
  <g transform="translate(294 145)"><rect width="220" height="130" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="110" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#115e59">Processing</text><text x="110" y="76" text-anchor="middle" font-size="15" fill="#115e59">Objects · Views</text><text x="110" y="101" text-anchor="middle" font-size="15" fill="#115e59">Workflows · Agents</text></g>
  <g transform="translate(574 145)"><rect width="210" height="130" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="105" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#92400e">Storage</text><text x="105" y="76" text-anchor="middle" font-size="15" fill="#92400e">PostgreSQL</text><text x="105" y="101" text-anchor="middle" font-size="15" fill="#92400e">Redis / Queue state</text></g>
  <g transform="translate(844 145)"><rect width="200" height="130" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="100" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#5b21b6">Deploy</text><text x="100" y="76" text-anchor="middle" font-size="15" fill="#5b21b6">Cloud 또는</text><text x="100" y="101" text-anchor="middle" font-size="15" fill="#5b21b6">Docker Compose</text></g>
  <path d="M238 210 H288" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M518 210 H568" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M788 210 H838" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(120 350)"><rect width="400" height="160" rx="24" fill="#0f172a" opacity="0.94"/><text x="28" y="43" font-size="21" font-weight="900" fill="#e0f2fe">Observability</text><text x="28" y="82" font-size="16" fill="#cbd5e1">로그, 작업 큐 지연, 워크플로 실패율</text><text x="28" y="112" font-size="16" fill="#cbd5e1">DB 백업/복구 시간, API 오류율, 릴리스 추적</text></g>
  <g transform="translate(580 350)"><rect width="400" height="160" rx="24" fill="#0f172a" opacity="0.94"/><text x="28" y="43" font-size="21" font-weight="900" fill="#ccfbf1">Security &amp; Governance</text><text x="28" y="82" font-size="16" fill="#cbd5e1">개인정보, 영업 데이터 권한, 감사 로그</text><text x="28" y="112" font-size="16" fill="#cbd5e1">AGPL/Enterprise 파일, 외부 AI 연동 경계</text></g>
</g>
</svg>
