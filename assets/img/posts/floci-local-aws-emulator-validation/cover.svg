<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Floci AWS 로컬 에뮬레이터 검증</title>
  <desc id="desc">단일 AWS endpoint가 프로세스 내 에뮬레이션과 Docker 기반 서비스로 분기되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#173752"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243f62"/><stop offset="1" stop-color="#132a45"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="190" fill="#ffb347" opacity=".08"/><circle cx="75" cy="610" r="250" fill="#55d6be" opacity=".08"/>
  <g filter="url(#shadow)">
    <path d="M755 260c5-78 69-136 148-136 62 0 116 38 138 93 64 2 115 54 115 118 0 66-54 120-120 120H785c-63 0-114-51-114-114 0-43 24-81 59-100 8 9 17 15 25 19Z" fill="url(#cloud)" stroke="#587797" stroke-width="2"/>
    <rect x="755" y="268" width="315" height="76" rx="18" fill="#12263d" stroke="#ffb347" stroke-width="3"/>
    <text x="912" y="300" text-anchor="middle" fill="#ffcf87" font-family="Arial, sans-serif" font-size="18" font-weight="700">AWS ENDPOINT</text>
    <text x="912" y="329" text-anchor="middle" fill="#f4f9fd" font-family="Arial, sans-serif" font-size="24" font-weight="800">localhost:4566</text>
    <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
      <rect x="720" y="382" width="185" height="58" rx="14" fill="#18483f" stroke="#55d6be"/><text x="812" y="417" text-anchor="middle" fill="#c9fff4">IN-PROCESS API</text>
      <rect x="930" y="382" width="185" height="58" rx="14" fill="#41334d" stroke="#c99cff"/><text x="1022" y="417" text-anchor="middle" fill="#f1dcff">DOCKER ENGINE</text>
    </g>
    <path d="M910 344v29M910 373l-98 0v9M910 373l112 0v9" fill="none" stroke="#ffb347" stroke-width="4"/>
  </g>
  <text x="75" y="140" fill="#ffb347" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">FLOCI · AWS LOCAL EMULATOR</text>
  <text x="75" y="220" fill="#f5faff" font-family="Arial, sans-serif" font-size="52" font-weight="800">LocalStack 대체 전</text>
  <text x="75" y="284" fill="#f5faff" font-family="Arial, sans-serif" font-size="52" font-weight="800">호환성 검증 기준</text>
  <text x="77" y="350" fill="#aec4d6" font-family="Arial, sans-serif" font-size="24">API 계약, Docker 특권, 상태 복구와</text>
  <text x="77" y="387" fill="#aec4d6" font-family="Arial, sans-serif" font-size="24">실제 AWS 승격 게이트를 분리한다</text>
  <g transform="translate(77 460)"><rect width="190" height="48" rx="24" fill="#55d6be"/><text x="95" y="31" text-anchor="middle" fill="#07221d" font-family="Arial, sans-serif" font-size="18" font-weight="800">CONTRACT TEST</text><rect x="207" width="190" height="48" rx="24" fill="#ffb347"/><text x="302" y="31" text-anchor="middle" fill="#31200a" font-family="Arial, sans-serif" font-size="18" font-weight="800">AWS GATE</text></g>
</svg>