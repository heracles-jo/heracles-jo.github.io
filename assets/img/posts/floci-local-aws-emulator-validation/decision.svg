<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Floci 테스트의 실제 AWS 승격 결정 흐름</title>
  <desc id="desc">PR 로컬 테스트에서 AWS sandbox와 canary로 승격하며 각 단계의 증거와 중단 조건을 확인하는 흐름</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1624"/><stop offset="1" stop-color="#172d43"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ffbd58"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="58" y="68" fill="#f5f9fd" font-family="Arial, sans-serif" font-size="34" font-weight="800">로컬 속도와 클라우드 진실을 분리하는 3단계 게이트</text>
  <text x="58" y="106" fill="#a9bdcc" font-family="Arial, sans-serif" font-size="19">앞 단계는 뒤 단계를 없애지 않고, 비싼 검증의 범위를 줄인다.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 175)"><rect width="310" height="315" rx="24" fill="#173f3a" stroke="#55d6be" stroke-width="2"/><circle cx="48" cy="48" r="28" fill="#55d6be"/><text x="48" y="57" text-anchor="middle" fill="#09241f" font-size="25" font-weight="800">1</text><text x="92" y="57" fill="#effcf9" font-size="24" font-weight="800">PR LOCAL</text><text x="30" y="110" fill="#cef3ec" font-size="19">job별 disposable Floci</text><text x="30" y="145" fill="#cef3ec" font-size="19">version·image digest pin</text><text x="30" y="180" fill="#cef3ec" font-size="19">SDK·event·IaC contract</text><rect x="30" y="213" width="250" height="64" rx="14" fill="#0f2d2a"/><text x="48" y="240" fill="#83ead7" font-size="16" font-weight="700">PASS EVIDENCE</text><text x="48" y="264" fill="#d8f5ef" font-size="16">빠른 실패 · 격리 · 재현성</text></g>
    <g transform="translate(445 175)"><rect width="310" height="315" rx="24" fill="#3d3425" stroke="#ffbd58" stroke-width="2"/><circle cx="48" cy="48" r="28" fill="#ffbd58"/><text x="48" y="57" text-anchor="middle" fill="#342309" font-size="25" font-weight="800">2</text><text x="92" y="57" fill="#fff8ec" font-size="24" font-weight="800">AWS SANDBOX</text><text x="30" y="110" fill="#f1dfbf" font-size="19">IAM deny · quota · consistency</text><text x="30" y="145" fill="#f1dfbf" font-size="19">VPC · DNS · TLS · rollback</text><text x="30" y="180" fill="#f1dfbf" font-size="19">parity defect 재검증</text><rect x="30" y="213" width="250" height="64" rx="14" fill="#2d271c"/><text x="48" y="240" fill="#ffd892" font-size="16" font-weight="700">PASS EVIDENCE</text><text x="48" y="264" fill="#f6e8cc" font-size="16">AWS 고유 의미 · negative test</text></g>
    <g transform="translate(835 175)"><rect width="310" height="315" rx="24" fill="#342d43" stroke="#c49cff" stroke-width="2"/><circle cx="48" cy="48" r="28" fill="#c49cff"/><text x="48" y="57" text-anchor="middle" fill="#251634" font-size="25" font-weight="800">3</text><text x="92" y="57" fill="#fbf7ff" font-size="24" font-weight="800">CANARY</text><text x="30" y="110" fill="#e5d9ef" font-size="19">실제 artifact · IaC</text><text x="30" y="145" fill="#e5d9ef" font-size="19">CloudTrail · metric · alarm</text><text x="30" y="180" fill="#e5d9ef" font-size="19">DLQ · rotation · rollback</text><rect x="30" y="213" width="250" height="64" rx="14" fill="#272234"/><text x="48" y="240" fill="#dfc6ff" font-size="16" font-weight="700">PASS EVIDENCE</text><text x="48" y="264" fill="#eee4f5" font-size="16">운영 관측성 · 복구 가능성</text></g>
  </g>
  <g fill="none" stroke="#ffbd58" stroke-width="6" marker-end="url(#arrow)"><path d="M372 330h62"/><path d="M762 330h62"/></g>
  <g font-family="Arial, sans-serif"><rect x="120" y="550" width="960" height="98" rx="22" fill="#0d2131" stroke="#47657a"/><text x="160" y="588" fill="#f5f9fd" font-size="22" font-weight="800">중단 또는 되돌림 신호</text><text x="160" y="622" fill="#b8cad6" font-size="18">parity defect 반복 · job 간 상태 공유 · Docker 특권 미격리 · 실제 AWS negative test 실패 · rollback 증거 부재</text></g>
  <text x="600" y="688" text-anchor="middle" fill="#91aabd" font-family="Arial, sans-serif" font-size="17">에뮬레이터 통과는 배포 허가가 아니라 다음 검증 단계로 갈 수 있다는 증거다.</text>
</svg>