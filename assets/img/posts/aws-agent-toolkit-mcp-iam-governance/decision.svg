<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AWS Agent Toolkit 단계적 도입 결정 흐름</title>
  <desc id="desc">문서 전용에서 읽기 전용, 검토 가능한 IaC 변경, 제한적 자동 운영으로 승격하는 판단 기준</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#fffaf3"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#292524">권한은 단계마다 새 증거를 만든 뒤 넓힌다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 112)"><rect width="245" height="150" rx="20" fill="#6d28d9"/><text x="122" y="40" text-anchor="middle" fill="white" font-size="23" font-weight="700">1. 문서 전용</text><text x="122" y="78" text-anchor="middle" fill="#ede9fe" font-size="17">credentials 없음</text><text x="122" y="106" text-anchor="middle" fill="#ede9fe" font-size="17">skills · docs · IaC 초안</text><text x="122" y="132" text-anchor="middle" fill="#fbbf24" font-size="16">서비스 선택 검증</text></g>
    <g transform="translate(340 112)"><rect width="245" height="150" rx="20" fill="#2563eb"/><text x="122" y="40" text-anchor="middle" fill="white" font-size="23" font-weight="700">2. 읽기 전용</text><text x="122" y="78" text-anchor="middle" fill="#dbeafe" font-size="17">sandbox account</text><text x="122" y="106" text-anchor="middle" fill="#dbeafe" font-size="17">inventory · diagnosis</text><text x="122" y="132" text-anchor="middle" fill="#fef3c7" font-size="16">deny · CloudTrail 검증</text></g>
    <g transform="translate(625 112)"><rect width="245" height="150" rx="20" fill="#d97706"/><text x="122" y="40" text-anchor="middle" fill="white" font-size="23" font-weight="700">3. IaC 변경</text><text x="122" y="78" text-anchor="middle" fill="#ffedd5" font-size="17">plan · diff · review</text><text x="122" y="106" text-anchor="middle" fill="#ffedd5" font-size="17">별도 deploy role</text><text x="122" y="132" text-anchor="middle" fill="#fff7ed" font-size="16">rollback 실행</text></g>
    <g transform="translate(910 112)"><rect width="235" height="150" rx="20" fill="#0f766e"/><text x="117" y="40" text-anchor="middle" fill="white" font-size="23" font-weight="700">4. 제한적 운영</text><text x="117" y="78" text-anchor="middle" fill="#ccfbf1" font-size="17">좁은 action · resource</text><text x="117" y="106" text-anchor="middle" fill="#ccfbf1" font-size="17">time window · approval</text><text x="117" y="132" text-anchor="middle" fill="#fef3c7" font-size="16">자동 read-back</text></g>
    <path d="M300 187h40M585 187h40M870 187h40" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(105 360)"><rect width="990" height="110" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="495" y="36" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="700">각 단계의 승격 게이트</text><text x="495" y="70" text-anchor="middle" fill="#475569" font-size="18">account·role·region 확인 → write tool 노출 확인 → IAM 명시적 deny → CloudTrail 연결 → 상태 read-back</text><text x="495" y="96" text-anchor="middle" fill="#475569" font-size="18">다른 리전 · 금지 tag · production account · 파괴적 action · 만료 session으로 실패 시험</text></g>

    <g transform="translate(105 555)"><rect width="460" height="120" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="230" y="38" text-anchor="middle" fill="#991b1b" font-size="23" font-weight="800">중단</text><text x="230" y="72" text-anchor="middle" fill="#7f1d1d" font-size="17">broad admin role · 직접 API 변경</text><text x="230" y="98" text-anchor="middle" fill="#7f1d1d" font-size="17">증거 없는 부분 성공 · 복구 미검증</text></g>
    <g transform="translate(635 555)"><rect width="460" height="120" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="230" y="38" text-anchor="middle" fill="#166534" font-size="23" font-weight="800">승격</text><text x="230" y="72" text-anchor="middle" fill="#14532d" font-size="17">최소 권한 · IaC artifact · 승인 기록</text><text x="230" y="98" text-anchor="middle" fill="#14532d" font-size="17">거부·재시도·rollback 증거 확보</text></g>
    <path d="M420 470v85M780 470v85" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
