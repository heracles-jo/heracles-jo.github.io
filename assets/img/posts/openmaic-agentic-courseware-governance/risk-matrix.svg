<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Adoption risk matrix for OpenMAIC</title><desc id="desc">Risk matrix comparing benefits, adoption conditions, and operational controls for agentic courseware platforms.</desc><rect width="1100" height="520" fill="#0f172a"/><text x="50" y="58" fill="#fff" font-family="Arial" font-size="30" font-weight="800">도입 판단 매트릭스</text><g font-family="Arial" font-size="17"><rect x="55" y="105" width="300" height="110" rx="12" fill="#164e63"/><text x="85" y="143" fill="#cffafe" font-weight="700">적합한 경우</text><text x="85" y="174" fill="#e0f2fe">사내 교육·기술 온보딩</text><text x="85" y="201" fill="#e0f2fe">반복 제작되는 실습형 과정</text><rect x="400" y="105" width="300" height="110" rx="12" fill="#3f3f46"/><text x="430" y="143" fill="#fef3c7" font-weight="700">조건부 검토</text><text x="430" y="174" fill="#fef9c3">공교육·자격 평가 콘텐츠</text><text x="430" y="201" fill="#fef9c3">외부 저작물 포함 과정</text><rect x="745" y="105" width="300" height="110" rx="12" fill="#7f1d1d"/><text x="775" y="143" fill="#fee2e2" font-weight="700">피해야 할 경우</text><text x="775" y="174" fill="#fecaca">검수자 없이 자동 게시</text><text x="775" y="201" fill="#fecaca">민감 개인정보/시험문항 노출</text><rect x="55" y="270" width="990" height="155" rx="16" fill="#f8fafc"/><text x="85" y="310" fill="#0f172a" font-weight="700">필수 통제</text><text x="85" y="346" fill="#334155">1. 자료 출처·라이선스 기록  2. 생성 세션 로그 보존  3. 사람 검수 및 변경 승인</text><text x="85" y="382" fill="#334155">4. 모델/도구별 비용 한도  5. 학습자 데이터 최소 수집  6. 접근 권한·비밀키 분리</text></g></svg>