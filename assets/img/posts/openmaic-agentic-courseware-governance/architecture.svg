<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">OpenMAIC operational architecture</title><desc id="desc">Reference architecture for agentic courseware from source materials through runtime, storage, playback, export, and governance.</desc><rect width="1100" height="620" fill="#f8fafc"/><text x="50" y="60" font-size="30" font-weight="800" font-family="Arial" fill="#0f172a">에이전트형 코스웨어 운영 아키텍처</text><g font-family="Arial" font-size="16"><rect x="55" y="110" width="210" height="110" rx="14" fill="#dbeafe" stroke="#2563eb"/><text x="85" y="150" font-weight="700">입력 자료 계층</text><text x="85" y="180">PDF/PPTX/오디오/영상</text><text x="85" y="205">웹 검색·기관 교재</text><rect x="330" y="100" width="245" height="130" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text x="365" y="140" font-weight="700">Agent Workbench</text><text x="365" y="171">커리큘럼 계획</text><text x="365" y="196">페이지 생성·수정</text><text x="365" y="221">사용자 스티어링</text><rect x="640" y="110" width="210" height="110" rx="14" fill="#ccfbf1" stroke="#0f766e"/><text x="670" y="150" font-weight="700">Course Tools</text><text x="670" y="180">퀴즈·화이트보드</text><text x="670" y="205">음성·이미지·PBL</text><rect x="55" y="305" width="250" height="125" rx="14" fill="#fef9c3" stroke="#ca8a04"/><text x="88" y="345" font-weight="700">지속성/저장소</text><text x="88" y="376">PostgreSQL 세션</text><text x="88" y="401">문서·KV·에셋 스토어</text><rect x="380" y="300" width="250" height="135" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="410" y="340" font-weight="700">검수 게이트</text><text x="410" y="371">출처·저작권·프롬프트</text><text x="410" y="396">환각·편향·평가 문항 품질</text><rect x="705" y="305" width="250" height="125" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="735" y="345" font-weight="700">배포/학습 운영</text><text x="735" y="376">Playback Engine</text><text x="735" y="401">HTML/MP4/SCORM 연계 검토</text><path d="M265 165 H330" stroke="#64748b" stroke-width="4"/><path d="M575 165 H640" stroke="#64748b" stroke-width="4"/><path d="M453 230 V300" stroke="#64748b" stroke-width="4"/><path d="M305 368 H380" stroke="#64748b" stroke-width="4"/><path d="M630 368 H705" stroke="#64748b" stroke-width="4"/></g><text x="55" y="535" font-family="Arial" font-size="18" fill="#334155">핵심 판단: 생성 모델 품질보다 세션 재현성, 자료 계보, 검수 워크플로, 배포 책임 경계가 먼저 설계되어야 한다.</text></svg>