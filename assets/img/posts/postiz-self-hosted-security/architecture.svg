<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Postiz 셀프호스팅 보안 아키텍처</title>
  <desc id="desc">사용자와 AI 에이전트 입력이 인증 경계, 백엔드, Temporal 오케스트레이터, 미디어 저장소와 외부 소셜 플랫폼으로 흐르는 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="820" rx="24" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#172033">게시 권한은 인증, 워크플로, 파일, 외부 API에 걸쳐 있다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(45 105)"><rect width="250" height="145" rx="20" fill="#334155"/><text x="125" y="42" text-anchor="middle" fill="white" font-size="24" font-weight="800">Inputs</text><text x="125" y="80" text-anchor="middle" fill="#e2e8f0" font-size="18">UI · Public API</text><text x="125" y="110" text-anchor="middle" fill="#e2e8f0" font-size="18">CLI · MCP agent</text><text x="125" y="133" text-anchor="middle" fill="#fecaca" font-size="16">비신뢰 요청</text></g>
    <g transform="translate(380 90)"><rect width="440" height="175" rx="22" fill="#be123c"/><text x="220" y="42" text-anchor="middle" fill="white" font-size="26" font-weight="800">Identity &amp; Authorization</text><text x="220" y="82" text-anchor="middle" fill="#ffe4e6" font-size="18">session · invitation · API key · OAuth token</text><text x="220" y="113" text-anchor="middle" fill="#ffe4e6" font-size="18">issuer · audience · purpose · role · expiry</text><text x="220" y="145" text-anchor="middle" fill="#fef3c7" font-size="17">토큰 목적과 조직 범위를 분리</text></g>
    <g transform="translate(905 105)"><rect width="250" height="145" rx="20" fill="#7c3aed"/><text x="125" y="42" text-anchor="middle" fill="white" font-size="24" font-weight="800">Provider Apps</text><text x="125" y="80" text-anchor="middle" fill="#ede9fe" font-size="18">client secret · scope</text><text x="125" y="110" text-anchor="middle" fill="#ede9fe" font-size="18">refresh token · quota</text><text x="125" y="133" text-anchor="middle" fill="#fef3c7" font-size="16">외부 정책 변경</text></g>
    <path d="M295 177h85M820 177h85" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(85 350)"><rect width="310" height="210" rx="22" fill="#2563eb"/><text x="155" y="42" text-anchor="middle" fill="white" font-size="26" font-weight="800">Postiz Backend</text><text x="155" y="83" text-anchor="middle" fill="#dbeafe" font-size="18">organization · posts · channels</text><text x="155" y="114" text-anchor="middle" fill="#dbeafe" font-size="18">schema validation · audit</text><text x="155" y="145" text-anchor="middle" fill="#dbeafe" font-size="18">PostgreSQL · Redis</text><rect x="35" y="166" width="240" height="30" rx="15" fill="#1e3a8a"/><text x="155" y="187" text-anchor="middle" fill="#bfdbfe" font-size="16">요청 시점 권한 검사</text></g>
    <g transform="translate(445 350)"><rect width="310" height="210" rx="22" fill="#c2410c"/><text x="155" y="42" text-anchor="middle" fill="white" font-size="26" font-weight="800">Temporal Orchestrator</text><text x="155" y="83" text-anchor="middle" fill="#ffedd5" font-size="18">schedule · retry · token refresh</text><text x="155" y="114" text-anchor="middle" fill="#ffedd5" font-size="18">provider task queues</text><text x="155" y="145" text-anchor="middle" fill="#ffedd5" font-size="18">idempotency · compensation</text><rect x="35" y="166" width="240" height="30" rx="15" fill="#7c2d12"/><text x="155" y="187" text-anchor="middle" fill="#fed7aa" font-size="16">실행 시점 재검증</text></g>
    <g transform="translate(805 350)"><rect width="310" height="210" rx="22" fill="#a16207"/><text x="155" y="42" text-anchor="middle" fill="white" font-size="26" font-weight="800">Media Storage</text><text x="155" y="83" text-anchor="middle" fill="#fef3c7" font-size="18">local volume or R2</text><text x="155" y="114" text-anchor="middle" fill="#fef3c7" font-size="18">canonical path · MIME · size</text><text x="155" y="145" text-anchor="middle" fill="#fef3c7" font-size="18">public URL · SSRF boundary</text><rect x="35" y="166" width="240" height="30" rx="15" fill="#713f12"/><text x="155" y="187" text-anchor="middle" fill="#fef3c7" font-size="16">host filesystem 격리</text></g>
    <path d="M600 265v45H240v40M600 310v40M600 310h360v40" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M395 455h50M755 455h50" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(145 655)"><rect width="910" height="100" rx="22" fill="#172033"/><text x="455" y="38" text-anchor="middle" fill="white" font-size="24" font-weight="800">Social Platforms</text><text x="455" y="72" text-anchor="middle" fill="#cbd5e1" font-size="18">X · Meta · LinkedIn · TikTok · YouTube · Discord · Mastodon · 기타 provider</text></g>
    <path d="M600 560v95" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
</svg>
