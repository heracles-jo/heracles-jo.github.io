<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Postiz 셀프호스팅 단계적 승격과 중단 기준</title>
  <desc id="desc">보안 패치, 권한 축소, 실패 주입과 복구 훈련을 거쳐 테스트 채널에서 제한적 운영으로 확대하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="780" rx="24" fill="#f8fafc"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#172033">예약 성공보다 침해 범위와 복구 시간을 먼저 줄인다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 110)"><rect width="245" height="160" rx="20" fill="#be123c"/><text x="122" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="800">1. Patch Baseline</text><text x="122" y="76" text-anchor="middle" fill="#ffe4e6" font-size="17">v2.25.3+ · digest</text><text x="122" y="105" text-anchor="middle" fill="#ffe4e6" font-size="17">registration off</text><text x="122" y="134" text-anchor="middle" fill="#fef3c7" font-size="16">secret exposure review</text></g>
    <g transform="translate(337 110)"><rect width="245" height="160" rx="20" fill="#c2410c"/><text x="122" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="800">2. Least Privilege</text><text x="122" y="76" text-anchor="middle" fill="#ffedd5" font-size="17">test org · draft only</text><text x="122" y="105" text-anchor="middle" fill="#ffedd5" font-size="17">non-root worker</text><text x="122" y="134" text-anchor="middle" fill="#fef3c7" font-size="16">Bearer · log masking</text></g>
    <g transform="translate(619 110)"><rect width="245" height="160" rx="20" fill="#a16207"/><text x="122" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="800">3. Failure Injection</text><text x="122" y="76" text-anchor="middle" fill="#fef3c7" font-size="17">429 · 503 · restart</text><text x="122" y="105" text-anchor="middle" fill="#fef3c7" font-size="17">path · token · queue</text><text x="122" y="134" text-anchor="middle" fill="#fff7ed" font-size="16">duplicate / missing post</text></g>
    <g transform="translate(901 110)"><rect width="245" height="160" rx="20" fill="#166534"/><text x="122" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="800">4. Limited Rollout</text><text x="122" y="76" text-anchor="middle" fill="#dcfce7" font-size="17">non-critical channels</text><text x="122" y="105" text-anchor="middle" fill="#dcfce7" font-size="17">approval · canary</text><text x="122" y="134" text-anchor="middle" fill="#fef3c7" font-size="16">measured RTO / RPO</text></g>
    <path d="M300 190h37M582 190h37M864 190h37" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(105 355)"><rect width="990" height="145" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="495" y="40" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="800">승격 게이트</text><text x="495" y="78" text-anchor="middle" fill="#475569" font-size="18">토큰 목적·조직 범위 → upload root 격리 → Temporal 중복 방지 → provider 오류 분류</text><text x="495" y="108" text-anchor="middle" fill="#475569" font-size="18">DB + media + workflow 복원 → session·API key·OAuth·provider token 회전 훈련</text><text x="495" y="133" text-anchor="middle" fill="#9a3412" font-size="16">사람 승인 없이 실제 채널 즉시 발행 금지</text></g>

    <g transform="translate(105 585)"><rect width="460" height="125" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="230" y="39" text-anchor="middle" fill="#991b1b" font-size="23" font-weight="800">중단</text><text x="230" y="75" text-anchor="middle" fill="#7f1d1d" font-size="17">패치 지연 · broad token · root worker</text><text x="230" y="102" text-anchor="middle" fill="#7f1d1d" font-size="17">중복 게시·복원 불가·로그에 key 노출</text></g>
    <g transform="translate(635 585)"><rect width="460" height="125" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="230" y="39" text-anchor="middle" fill="#166534" font-size="23" font-weight="800">승격</text><text x="230" y="75" text-anchor="middle" fill="#14532d" font-size="17">최소 권한 · idempotency · 독립 복구</text><text x="230" y="102" text-anchor="middle" fill="#14532d" font-size="17">다른 당직자도 runbook으로 회전·복원</text></g>
    <path d="M420 500v85M780 500v85" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
