<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">PoC checklist for compressed local vector index</title>
  <desc id="desc">Checklist covering data, performance, security, operations, and governance for a TurboVec proof of concept</desc>
  <rect width="1000" height="560" rx="28" fill="#0f172a"/>
  <text x="54" y="70" font-family="Arial" font-size="32" font-weight="800" fill="#e0f2fe">TurboVec PoC 체크리스트</text>
  <g font-family="Arial" font-size="21" fill="#e2e8f0">
    <g transform="translate(70 118)">
      <circle cx="0" cy="0" r="16" fill="#22d3ee"/><text x="38" y="7">대표 문서 10만~100만 건으로 recall/latency 기준선 수립</text>
    </g>
    <g transform="translate(70 178)">
      <circle cx="0" cy="0" r="16" fill="#38bdf8"/><text x="38" y="7">tenant, ACL, time window 등 필터 조건을 검색 커널과 함께 검증</text>
    </g>
    <g transform="translate(70 238)">
      <circle cx="0" cy="0" r="16" fill="#60a5fa"/><text x="38" y="7">인덱스 파일 저장, 백업, 롤백, 재생성 시간을 운영 SLO로 정의</text>
    </g>
    <g transform="translate(70 298)">
      <circle cx="0" cy="0" r="16" fill="#818cf8"/><text x="38" y="7">FAISS, Qdrant, LanceDB와 동일 쿼리셋으로 품질·비용 비교</text>
    </g>
    <g transform="translate(70 358)">
      <circle cx="0" cy="0" r="16" fill="#a78bfa"/><text x="38" y="7">CPU 아키텍처, 패키지 배포, Rust/Python 경계의 장애 모드 확인</text>
    </g>
    <g transform="translate(70 418)">
      <circle cx="0" cy="0" r="16" fill="#c084fc"/><text x="38" y="7">개인정보·영업비밀 임베딩의 반출 금지 요구와 감사 로그 설계</text>
    </g>
  </g>
  <rect x="560" y="118" width="330" height="330" rx="24" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="596" y="174" font-family="Arial" font-size="28" font-weight="700" fill="#7dd3fc">결정 기준</text>
  <text x="596" y="228" font-family="Arial" font-size="21" fill="#cbd5e1">1. 메모리 절감이 병목인가?</text>
  <text x="596" y="276" font-family="Arial" font-size="21" fill="#cbd5e1">2. 검색 필터가 품질을 흔드는가?</text>
  <text x="596" y="324" font-family="Arial" font-size="21" fill="#cbd5e1">3. 데이터가 VPC 밖으로 나가면 안 되는가?</text>
  <text x="596" y="372" font-family="Arial" font-size="21" fill="#cbd5e1">4. 팀이 인덱스 운영을 감당할 수 있는가?</text>
  <text x="54" y="512" font-family="Arial" font-size="18" fill="#94a3b8">스냅샷 기준: GitHub Trending 및 공개 저장소 신호 확인 후 작성</text>
</svg>
