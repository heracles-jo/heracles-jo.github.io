<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI 데이터-모델-운영 파이프라인</title>
  <desc id="desc">센서 데이터와 합성 시뮬레이션 데이터가 월드 모델을 거쳐 정책 학습, 검증, 엣지 배포로 이어지는 구조</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#38bdf8"/></marker></defs>
  <rect width="1100" height="620" rx="26" fill="#0b1220"/>
  <text x="52" y="64" fill="#f8fafc" font-size="32" font-family="Inter, Apple SD Gothic Neo, Arial" font-weight="800">Physical AI 참조 파이프라인</text>
  <g font-family="Inter, Apple SD Gothic Neo, Arial" font-size="20" fill="#e2e8f0">
    <g transform="translate(60 125)"><rect width="220" height="120" rx="18" fill="#12352d" stroke="#34d399"/><text x="24" y="46" font-weight="700">현실 데이터</text><text x="24" y="82" font-size="16" fill="#bbf7d0">카메라 · 라이다 · 로그</text></g>
    <g transform="translate(60 340)"><rect width="220" height="120" rx="18" fill="#172554" stroke="#60a5fa"/><text x="24" y="46" font-weight="700">합성 데이터</text><text x="24" y="82" font-size="16" fill="#bfdbfe">시뮬레이션 · 장면 생성</text></g>
    <g transform="translate(410 230)"><rect width="260" height="145" rx="22" fill="#14532d" stroke="#86efac"/><text x="30" y="52" font-weight="800">월드 모델</text><text x="30" y="88" font-size="16" fill="#dcfce7">미래 상태 예측, rare case 생성</text><text x="30" y="114" font-size="16" fill="#dcfce7">멀티모달 표현 학습</text></g>
    <g transform="translate(810 110)"><rect width="220" height="110" rx="18" fill="#3b0764" stroke="#c084fc"/><text x="24" y="45" font-weight="700">정책 학습</text><text x="24" y="78" font-size="16" fill="#e9d5ff">로봇/차량 액션 모델</text></g>
    <g transform="translate(810 285)"><rect width="220" height="110" rx="18" fill="#4a1d1d" stroke="#fca5a5"/><text x="24" y="45" font-weight="700">검증 게이트</text><text x="24" y="78" font-size="16" fill="#fecaca">안전성, 실패 모드, 회귀</text></g>
    <g transform="translate(810 455)"><rect width="220" height="110" rx="18" fill="#1f2937" stroke="#94a3b8"/><text x="24" y="45" font-weight="700">엣지 배포</text><text x="24" y="78" font-size="16" fill="#cbd5e1">관측성, 롤백, 데이터 루프</text></g>
  </g>
  <g stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M280 185 C335 185 350 260 405 285"/>
    <path d="M280 400 C345 400 350 330 405 310"/>
    <path d="M670 285 C745 250 745 170 805 165"/>
    <path d="M670 310 C745 320 745 340 805 340"/>
    <path d="M920 395 L920 448"/>
  </g>
  <text x="60" y="565" fill="#94a3b8" font-size="17" font-family="Inter, Apple SD Gothic Neo, Arial">핵심은 모델 성능만이 아니라 데이터 거버넌스, 검증 자동화, 현장 피드백 루프를 함께 설계하는 것이다.</text>
</svg>
