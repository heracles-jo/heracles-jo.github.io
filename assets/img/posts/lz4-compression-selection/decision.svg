<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LZ4 압축 도입 의사결정 게이트</title>
  <desc id="desc">지연시간, 비용 이동, 호환성, 복구 검증을 통과해 LZ4, Zstd 또는 무압축을 선택하는 절차</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17324d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".25"/></filter></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="58" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="800">압축 codec을 workload별로 승인하는 4개 게이트</text>
  <text x="58" y="102" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">압축률이 아니라 end-to-end 비용과 복구 가능성을 통과해야 한다</text>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="58" y="152" width="244" height="250" rx="22" fill="#102a43" stroke="#38bdf8"/>
    <circle cx="102" cy="198" r="24" fill="#0ea5e9"/><text x="94" y="207" fill="white" font-size="24" font-weight="700">1</text>
    <text x="140" y="207" fill="#7dd3fc" font-size="23" font-weight="700">지연시간</text>
    <text x="88" y="254" fill="#e2e8f0" font-size="18">실제 객체 크기 분포</text><text x="88" y="288" fill="#e2e8f0" font-size="18">read/write p99</text><text x="88" y="322" fill="#e2e8f0" font-size="18">cold·warm context</text><text x="88" y="356" fill="#fbbf24" font-size="18">hot path 회귀?</text>
    <rect x="338" y="152" width="244" height="250" rx="22" fill="#102a43" stroke="#2dd4bf"/>
    <circle cx="382" cy="198" r="24" fill="#14b8a6"/><text x="374" y="207" fill="white" font-size="24" font-weight="700">2</text>
    <text x="420" y="207" fill="#5eead4" font-size="23" font-weight="700">비용 이동</text>
    <text x="368" y="254" fill="#e2e8f0" font-size="18">CPU cycles / byte</text><text x="368" y="288" fill="#e2e8f0" font-size="18">peak RSS·workers</text><text x="368" y="322" fill="#e2e8f0" font-size="18">network·storage 절감</text><text x="368" y="356" fill="#fbbf24" font-size="18">순비용이 감소?</text>
    <rect x="618" y="152" width="244" height="250" rx="22" fill="#102a43" stroke="#a78bfa"/>
    <circle cx="662" cy="198" r="24" fill="#8b5cf6"/><text x="654" y="207" fill="white" font-size="24" font-weight="700">3</text>
    <text x="700" y="207" fill="#c4b5fd" font-size="23" font-weight="700">호환성</text>
    <text x="648" y="254" fill="#e2e8f0" font-size="18">frame·block 옵션</text><text x="648" y="288" fill="#e2e8f0" font-size="18">build·언어 matrix</text><text x="648" y="322" fill="#e2e8f0" font-size="18">dictionary hash</text><text x="648" y="356" fill="#fbbf24" font-size="18">혼합 배포 가능?</text>
    <rect x="898" y="152" width="244" height="250" rx="22" fill="#102a43" stroke="#f59e0b"/>
    <circle cx="942" cy="198" r="24" fill="#d97706"/><text x="934" y="207" fill="white" font-size="24" font-weight="700">4</text>
    <text x="980" y="207" fill="#fcd34d" font-size="23" font-weight="700">복구</text>
    <text x="928" y="254" fill="#e2e8f0" font-size="18">checksum·truncation</text><text x="928" y="288" fill="#e2e8f0" font-size="18">partial write fixture</text><text x="928" y="322" fill="#e2e8f0" font-size="18">restore RTO</text><text x="928" y="356" fill="#fbbf24" font-size="18">rollback 가능?</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none"><path d="M302 278h36"/><path d="m326 267 14 11-14 11"/><path d="M582 278h36"/><path d="m606 267 14 11-14 11"/><path d="M862 278h36"/><path d="m886 267 14 11-14 11"/></g>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="108" y="486" width="286" height="142" rx="22" fill="#0d3a3a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="154" y="534" fill="#5eead4" font-size="27" font-weight="800">LZ4</text><text x="154" y="570" fill="#e2e8f0" font-size="18">hot path · 빠른 복구</text><text x="154" y="599" fill="#e2e8f0" font-size="18">CPU 지연이 핵심</text>
    <rect x="457" y="486" width="286" height="142" rx="22" fill="#252147" stroke="#a78bfa" stroke-width="2"/>
    <text x="503" y="534" fill="#c4b5fd" font-size="27" font-weight="800">Zstd</text><text x="503" y="570" fill="#e2e8f0" font-size="18">WAN · 장기 저장</text><text x="503" y="599" fill="#e2e8f0" font-size="18">압축률이 비용 지배</text>
    <rect x="806" y="486" width="286" height="142" rx="22" fill="#342817" stroke="#f59e0b" stroke-width="2"/>
    <text x="852" y="534" fill="#fcd34d" font-size="27" font-weight="800">무압축</text><text x="852" y="570" fill="#e2e8f0" font-size="18">작은 무작위·암호문</text><text x="852" y="599" fill="#e2e8f0" font-size="18">복잡도가 이득 초과</text>
  </g>
  <path d="M600 402v58" stroke="#94a3b8" stroke-width="4"/><path d="m588 448 12 16 12-16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <text x="58" y="682" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">한 시스템 안에서도 cache, WAN, archive 경로마다 다른 codec을 승인할 수 있다. 단, 분기 수만큼 테스트와 관측 계약이 늘어난다.</text>
</svg>
