<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LZ4 압축 선택 기준</title>
  <desc id="desc">데이터가 LZ4와 Zstd 경로로 나뉘며 지연시간, 압축률, 호환성을 비교하는 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2f"/><stop offset="1" stop-color="#17385a"/></linearGradient>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="#38bdf8" opacity=".08"/><circle cx="105" cy="585" r="220" fill="#2dd4bf" opacity=".07"/>
  <g transform="translate(72 82)">
    <text x="0" y="0" fill="#7dd3fc" font-size="24" font-family="Arial, sans-serif" font-weight="700">DATA PATH DECISION</text>
    <text x="0" y="68" fill="#f8fafc" font-size="58" font-family="Arial, sans-serif" font-weight="800">LZ4 압축 선택</text>
    <text x="0" y="116" fill="#cbd5e1" font-size="29" font-family="Arial, sans-serif">Zstd 대비 지연시간 · 압축률 · 호환성 기준</text>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="74" y="270" width="270" height="190" rx="24" fill="#102b46" stroke="#64748b"/>
    <text x="110" y="320" fill="#cbd5e1" font-size="22">원본 데이터</text>
    <rect x="110" y="350" width="198" height="18" rx="9" fill="#94a3b8"/><rect x="110" y="386" width="158" height="18" rx="9" fill="#64748b"/><rect x="110" y="422" width="184" height="18" rx="9" fill="#475569"/>
    <path d="M344 365H440" stroke="#94a3b8" stroke-width="5"/><path d="m430 352 18 13-18 13" fill="none" stroke="#94a3b8" stroke-width="5"/>
    <rect x="466" y="245" width="286" height="240" rx="28" fill="#0c3141" stroke="#2dd4bf" stroke-width="3"/>
    <text x="510" y="310" fill="#5eead4" font-size="40" font-weight="800">LZ4</text>
    <text x="510" y="350" fill="#e2e8f0" font-size="21">빠른 압축·해제</text><text x="510" y="382" fill="#e2e8f0" font-size="21">낮은 CPU 지연</text><text x="510" y="414" fill="#e2e8f0" font-size="21">프레임 계약 검증</text>
    <path d="M752 365H832" stroke="url(#fast)" stroke-width="6"/><path d="m822 351 20 14-20 14" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <rect x="858" y="270" width="270" height="190" rx="24" fill="#102b46" stroke="#64748b"/>
    <text x="895" y="320" fill="#cbd5e1" font-size="22">운영 결과</text>
    <text x="895" y="366" fill="#f8fafc" font-size="24" font-weight="700">p99 지연</text><text x="895" y="402" fill="#f8fafc" font-size="24" font-weight="700">CPU·메모리</text><text x="895" y="438" fill="#f8fafc" font-size="24" font-weight="700">복구 가능성</text>
  </g>
  <g transform="translate(74 535)" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1"><text x="0">BLOCK</text><circle cx="112" cy="-7" r="5" fill="#2dd4bf"/><text x="135">FRAME</text><circle cx="250" cy="-7" r="5" fill="#38bdf8"/><text x="273">DICTIONARY</text><circle cx="430" cy="-7" r="5" fill="#fbbf24"/><text x="453">CHECKSUM</text></g>
</svg>
