<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Uptime Kuma 운영 위험 체크리스트</title>
  <desc id="desc">감시 위치, 판정, 알림, 보안, 데이터, 복구의 위험과 승격 게이트</desc>
  <rect width="1200" height="760" fill="#0b1f29"/>
  <text x="58" y="66" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#fff">운영 감시로 승격하기 전 6개 게이트</text>
  <text x="58" y="102" font-family="system-ui,sans-serif" font-size="18" fill="#9fc2cc">설치 성공이 아니라 실패를 발견하고 설명하고 복구하는 능력을 검증한다.</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(55 145)"><rect width="340" height="155" rx="20" fill="#123443" stroke="#4dd49a"/><circle cx="42" cy="42" r="22" fill="#4dd49a"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#09231b">1</text><text x="78" y="48" font-size="23" font-weight="750" fill="#fff">감시 위치</text><text x="28" y="86" font-size="17" fill="#b9d5dd">서비스와 다른 host·region·DNS인가?</text><text x="28" y="116" font-size="17" fill="#b9d5dd">checker 자체를 외부에서 감시하는가?</text></g>
    <g transform="translate(430 145)"><rect width="340" height="155" rx="20" fill="#123443" stroke="#62a9e8"/><circle cx="42" cy="42" r="22" fill="#62a9e8"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#092139">2</text><text x="78" y="48" font-size="23" font-weight="750" fill="#fff">판정 깊이</text><text x="28" y="86" font-size="17" fill="#b9d5dd">200이 아닌 핵심 결과를 확인하는가?</text><text x="28" y="116" font-size="17" fill="#b9d5dd">probe 부작용과 비용이 제한되는가?</text></g>
    <g transform="translate(805 145)"><rect width="340" height="155" rx="20" fill="#123443" stroke="#f0b65b"/><circle cx="42" cy="42" r="22" fill="#f0b65b"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#3d2908">3</text><text x="78" y="48" font-size="23" font-weight="750" fill="#fff">알림 경로</text><text x="28" y="86" font-size="17" fill="#b9d5dd">retry·중복·maintenance가 검증됐는가?</text><text x="28" y="116" font-size="17" fill="#b9d5dd">다른 provider의 보조 채널이 있는가?</text></g>
    <g transform="translate(55 340)"><rect width="340" height="155" rx="20" fill="#123443" stroke="#ee7777"/><circle cx="42" cy="42" r="22" fill="#ee7777"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#401010">4</text><text x="78" y="48" font-size="23" font-weight="750" fill="#fff">보안 경계</text><text x="28" y="86" font-size="17" fill="#b9d5dd">최신 2.x 패치와 2FA를 쓰는가?</text><text x="28" y="116" font-size="17" fill="#b9d5dd">egress·metadata·관리망이 차단됐는가?</text></g>
    <g transform="translate(430 340)"><rect width="340" height="155" rx="20" fill="#123443" stroke="#ba87e8"/><circle cx="42" cy="42" r="22" fill="#ba87e8"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#32114e">5</text><text x="78" y="48" font-size="23" font-weight="750" fill="#fff">데이터 경계</text><text x="28" y="86" font-size="17" fill="#b9d5dd">local volume과 secret이 분리됐는가?</text><text x="28" y="116" font-size="17" fill="#b9d5dd">공개 페이지가 내부 정보를 숨기는가?</text></g>
    <g transform="translate(805 340)"><rect width="340" height="155" rx="20" fill="#123443" stroke="#65d8d2"/><circle cx="42" cy="42" r="22" fill="#65d8d2"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#073c3a">6</text><text x="78" y="48" font-size="23" font-weight="750" fill="#fff">복구 증거</text><text x="28" y="86" font-size="17" fill="#b9d5dd">빈 local volume에 복원했는가?</text><text x="28" y="116" font-size="17" fill="#b9d5dd">down·recovery 알림까지 재현했는가?</text></g>
  </g>
  <rect x="55" y="550" width="1090" height="125" rx="22" fill="#0f2b37" stroke="#3e6674"/>
  <text x="85" y="595" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#fff">승격 조건</text>
  <text x="85" y="634" font-family="system-ui,sans-serif" font-size="19" fill="#b9d5dd">목표 장애를 제한 시간 안에 발견하고 · 사람이 처리 가능한 알림으로 묶고 · checker 침묵을 별도로 탐지하고 · 빈 서버에서 RTO 안에 복원한다.</text>
  <text x="58" y="723" font-family="system-ui,sans-serif" font-size="16" fill="#7598a4">하나라도 증명되지 않으면 monitor 수를 늘리기보다 배치·권한·복구 절차를 먼저 보완한다.</text>
</svg>
