  <text x="76" y="190" fill="#fff" font-family="system-ui,sans-serif" font-size="58" font-weight="800">Uptime Kuma</text>
  <text x="76" y="258" fill="#fff" font-family="system-ui,sans-serif" font-size="46" font-weight="750">외부 감시·복구 설계 기준</text>
  <text x="78" y="314" fill="#b8d4d2" font-family="system-ui,sans-serif" font-size="25">감시 위치 · 사용자 경로 · 알림 실패 · 보안 패치 · 빈 서버 복원</text>
  <g filter="url(#shadow)">
