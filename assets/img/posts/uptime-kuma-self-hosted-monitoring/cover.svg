    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5cdd8b"/><stop offset="1" stop-color="#b3f56f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="210" fill="#5cdd8b" opacity=".07"/>
  <circle cx="1080" cy="570" r="280" fill="#4ad8c5" opacity=".06"/>
