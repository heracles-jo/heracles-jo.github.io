<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">모바일 컴플라이언스 게이트 PoC 의사결정</title>
  <desc id="desc">과거 릴리스 재생, shadow mode, 증거 검증, 제한적 차단, 확대 적용 순서를 나타낸 흐름도</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#f8fafc">규칙 수가 아니라 판정 재현성을 통과시킨다</text>
  <g font-family="Arial">
    <g transform="translate(70 125)"><circle cx="75" cy="75" r="70" fill="#1e3a8a"/><text x="75" y="67" text-anchor="middle" fill="white" font-size="23" font-weight="700">과거 릴리스</text><text x="75" y="97" text-anchor="middle" fill="#bfdbfe" font-size="20">재생</text></g>
    <path d="M220 200h110" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(335 125)"><circle cx="75" cy="75" r="70" fill="#0f766e"/><text x="75" y="67" text-anchor="middle" fill="white" font-size="23" font-weight="700">Shadow</text><text x="75" y="97" text-anchor="middle" fill="#ccfbf1" font-size="20">비차단 관찰</text></g>
    <path d="M485 200h110" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(600 125)"><circle cx="75" cy="75" r="70" fill="#7c3aed"/><text x="75" y="67" text-anchor="middle" fill="white" font-size="23" font-weight="700">증거·예외</text><text x="75" y="97" text-anchor="middle" fill="#ede9fe" font-size="20">재현 검증</text></g>
    <path d="M750 200h110" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(865 125)"><circle cx="75" cy="75" r="70" fill="#b45309"/><text x="75" y="67" text-anchor="middle" fill="white" font-size="23" font-weight="700">제한 차단</text><text x="75" y="97" text-anchor="middle" fill="#fef3c7" font-size="20">강한 증거만</text></g>
    <path d="M1015 200h90v110" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a)"/>
    <rect x="820" y="330" width="310" height="100" rx="22" fill="#166534"/><text x="975" y="373" text-anchor="middle" fill="white" font-size="26" font-weight="700">Fleet 확대</text><text x="975" y="405" text-anchor="middle" fill="#dcfce7" font-size="19">정책·앱 유형별 단계 승격</text>
    <rect x="85" y="340" width="620" height="285" rx="28" fill="#111827" stroke="#334155" stroke-width="3"/>
    <text x="125" y="395" fill="#93c5fd" font-size="25" font-weight="700">각 단계의 통과 질문</text>
    <text x="125" y="445" fill="#e2e8f0" font-size="21">• 실제 과거 거절을 재현했는가?</text>
    <text x="125" y="487" fill="#e2e8f0" font-size="21">• 승인 릴리스의 오탐에 설명 가능한 근거가 있는가?</text>
    <text x="125" y="529" fill="#e2e8f0" font-size="21">• 정책 snapshot과 확인 날짜를 고정했는가?</text>
    <text x="125" y="571" fill="#e2e8f0" font-size="21">• waiver에 승인자·대체 통제·만료일이 있는가?</text>
    <text x="125" y="613" fill="#e2e8f0" font-size="21">• 로컬 hook을 우회해도 CI 제출 게이트가 남는가?</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
</svg>
