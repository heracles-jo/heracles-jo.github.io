<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Immich operational architecture</title>
  <desc id="desc">An architecture diagram showing clients, reverse proxy, Immich server, machine learning worker, PostgreSQL, Redis, object storage and backup copies.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Immich 운영 아키텍처: 앱이 아니라 데이터 파이프라인</text>
  <g font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="700">
    <rect x="70" y="150" width="210" height="86" rx="18" fill="#dbeafe" stroke="#2563eb"/><text x="115" y="202" fill="#1e3a8a">Mobile / Web</text>
    <rect x="380" y="150" width="210" height="86" rx="18" fill="#e0f2fe" stroke="#0284c7"/><text x="424" y="202" fill="#075985">Reverse Proxy</text>
    <rect x="690" y="150" width="250" height="86" rx="18" fill="#ccfbf1" stroke="#0d9488"/><text x="734" y="202" fill="#115e59">Immich Server API</text>
    <rect x="690" y="310" width="250" height="86" rx="18" fill="#ede9fe" stroke="#7c3aed"/><text x="725" y="362" fill="#5b21b6">ML / Jobs Worker</text>
    <rect x="370" y="470" width="210" height="86" rx="18" fill="#fef3c7" stroke="#d97706"/><text x="420" y="522" fill="#92400e">PostgreSQL</text>
    <rect x="650" y="470" width="160" height="86" rx="18" fill="#fee2e2" stroke="#dc2626"/><text x="703" y="522" fill="#991b1b">Redis</text>
    <rect x="880" y="470" width="230" height="86" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="930" y="522" fill="#166534">Media Files</text>
    <rect x="360" y="630" width="260" height="70" rx="18" fill="#e2e8f0" stroke="#475569"/><text x="400" y="674" fill="#334155">DB Backup / PITR</text>
    <rect x="730" y="630" width="290" height="70" rx="18" fill="#e2e8f0" stroke="#475569"/><text x="768" y="674" fill="#334155">Object/File Backup</text>
  </g>
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#334155"/></marker></defs>
    <path d="M280 193 H380"/><path d="M590 193 H690"/><path d="M815 236 V310"/>
    <path d="M760 236 C720 315 580 385 505 470"/><path d="M830 236 C860 330 810 410 760 470"/><path d="M910 236 C990 325 1005 410 1000 470"/>
    <path d="M475 556 V630"/><path d="M995 556 V630"/>
  </g>
  <text x="70" y="295" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="18" fill="#475569">핵심 판단: 사진 서비스는 업로드 앱이 아니라 DB·파일·ML·모바일 백그라운드 작업이 결합된 운영 시스템이다.</text>
</svg>
