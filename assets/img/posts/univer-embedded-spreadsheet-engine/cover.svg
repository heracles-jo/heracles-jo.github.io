<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">임베디드 스프레드시트 엔진과 Univer</title>
  <desc id="desc">수식 계산, 편집 명령, 제품 권한을 분리해 검증하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a16"/><stop offset="1" stop-color="#123b36"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="180" fill="#34d399" opacity=".08"/><circle cx="120" cy="570" r="210" fill="#22d3ee" opacity=".07"/>
  <g filter="url(#shadow)">
    <rect x="700" y="105" width="380" height="420" rx="24" fill="#f8fafc"/>
    <rect x="735" y="145" width="310" height="42" rx="10" fill="#d1fae5"/>
    <g stroke="#cbd5e1" stroke-width="2">
      <path d="M735 205H1045M735 260H1045M735 315H1045M735 370H1045M735 425H1045M735 480H1045"/>
      <path d="M800 145V480M900 145V480M990 145V480"/>
    </g>
    <rect x="801" y="261" width="98" height="53" fill="#a7f3d0" stroke="#10b981" stroke-width="3"/>
    <text x="850" y="294" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#065f46">=SUM()</text>
    <rect x="735" y="500" width="310" height="10" rx="5" fill="#94a3b8"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="100" y="150" fill="#6ee7b7" font-size="28" font-weight="700">UNIVER · EMBEDDED SPREADSHEET</text>
    <text x="100" y="230" fill="#fff" font-size="51" font-weight="800">임베디드 스프레드시트</text>
    <text x="100" y="295" fill="#fff" font-size="51" font-weight="800">엔진 검증 기준</text>
    <rect x="100" y="340" width="500" height="6" rx="3" fill="url(#accent)"/>
    <text x="100" y="405" fill="#d1fae5" font-size="24">수식 의미 · command/undo · Headless · 권한</text>
    <text x="100" y="450" fill="#94a3b8" font-size="21">Excel처럼 보이는 UI보다 계산 계약을 먼저 검증한다</text>
