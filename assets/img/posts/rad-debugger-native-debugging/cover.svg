<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RAD Debugger 네이티브 디버깅</title>
  <desc id="desc">PDB와 DWARF가 RDI 변환을 거쳐 멀티프로세스 디버깅과 충돌 분석으로 연결되는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#60a5fa" fill="none">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>
  <rect x="78" y="78" width="1044" height="474" rx="30" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="112" y="112" width="12" height="94" rx="6" fill="url(#accent)"/>
  <text x="150" y="150" fill="#93c5fd" font-family="Arial, sans-serif" font-size="25" font-weight="700">NATIVE DEBUGGING · PDB · DWARF · RDI</text>
  <text x="112" y="266" fill="#f8fafc" font-family="Arial, sans-serif" font-size="55" font-weight="800">RAD Debugger</text>
  <text x="112" y="332" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="36" font-weight="700">기호·스택·변수 해석을 검증하는 법</text>
  <g transform="translate(112 396)">
    <rect width="210" height="76" rx="14" fill="#1e293b" stroke="#38bdf8"/>
    <text x="105" y="47" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="25" font-weight="700">PDB / DWARF</text>
    <path d="M230 38h84" stroke="#64748b" stroke-width="4"/>
    <path d="m304 28 16 10-16 10" fill="#64748b"/>
    <rect x="330" width="180" height="76" rx="14" fill="#312e81" stroke="#a78bfa"/>
    <text x="420" y="47" text-anchor="middle" fill="#ede9fe" font-family="Arial, sans-serif" font-size="27" font-weight="800">RDI</text>
    <path d="M530 38h84" stroke="#64748b" stroke-width="4"/>
    <path d="m604 28 16 10-16 10" fill="#64748b"/>
    <rect x="630" width="314" height="76" rx="14" fill="#1e293b" stroke="#22d3ee"/>
    <text x="787" y="47" text-anchor="middle" fill="#cffafe" font-family="Arial, sans-serif" font-size="24" font-weight="700">STACK · PROCESS · DUMP</text>
  </g>
  <text x="112" y="516" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">대형 C/C++ 프로젝트를 위한 도입·교차 검증 기준</text>
</svg>
