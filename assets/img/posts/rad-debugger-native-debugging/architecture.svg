<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RAD Debugger 아키텍처</title>
  <desc id="desc">빌드 산출물과 PDB·DWARF가 RDI 변환과 캐시를 거쳐 디버그 엔진, 프로세스 제어, 사용자 인터페이스에 공급되는 구조</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="64" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="800">디버그 정보가 화면에 오르기까지의 신뢰 경계</text>
  <text x="60" y="100" fill="#475569" font-family="Arial, sans-serif" font-size="20">변환 성공과 의미 정확성을 분리해 검증해야 한다</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="158" width="230" height="122" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="170" y="202" text-anchor="middle" fill="#075985" font-size="24" font-weight="800">빌드 산출물</text>
    <text x="170" y="237" text-anchor="middle" fill="#334155" font-size="18">PE / ELF · executable</text>
    <text x="170" y="264" text-anchor="middle" fill="#334155" font-size="18">compiler · linker 옵션</text>

    <rect x="55" y="352" width="230" height="122" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="170" y="396" text-anchor="middle" fill="#5b21b6" font-size="24" font-weight="800">원본 기호</text>
    <text x="170" y="431" text-anchor="middle" fill="#334155" font-size="18">PDB / DWARF</text>
    <text x="170" y="458" text-anchor="middle" fill="#334155" font-size="18">GUID · build ID · source</text>

    <rect x="382" y="255" width="250" height="160" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="507" y="302" text-anchor="middle" fill="#9a3412" font-size="25" font-weight="800">RDI 변환</text>
    <text x="507" y="339" text-anchor="middle" fill="#475569" font-size="18">rdi_from_pdb / dwarf</text>
    <text x="507" y="370" text-anchor="middle" fill="#475569" font-size="18">별도 process · radbin</text>
    <text x="507" y="398" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="700">타입·라인·unwind 의미 검증</text>

    <rect x="714" y="158" width="210" height="122" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="819" y="201" text-anchor="middle" fill="#166534" font-size="24" font-weight="800">RDI 캐시</text>
    <text x="819" y="237" text-anchor="middle" fill="#334155" font-size="18">비동기 적재·검색</text>
    <text x="819" y="264" text-anchor="middle" fill="#334155" font-size="18">artifact identity</text>

    <rect x="714" y="352" width="210" height="122" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="819" y="396" text-anchor="middle" fill="#155e75" font-size="24" font-weight="800">디버그 엔진</text>
    <text x="819" y="431" text-anchor="middle" fill="#334155" font-size="18">eval · stack · breakpoint</text>
    <text x="819" y="458" text-anchor="middle" fill="#334155" font-size="18">dbg_engine · ctrl</text>

    <rect x="980" y="158" width="170" height="122" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="1065" y="201" text-anchor="middle" fill="#1e293b" font-size="23" font-weight="800">UI</text>
    <text x="1065" y="237" text-anchor="middle" fill="#334155" font-size="17">Watch · Types</text>
    <text x="1065" y="264" text-anchor="middle" fill="#334155" font-size="17">Call Stack</text>

    <rect x="980" y="352" width="170" height="122" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1065" y="396" text-anchor="middle" fill="#991b1b" font-size="22" font-weight="800">대상 process</text>
    <text x="1065" y="431" text-anchor="middle" fill="#334155" font-size="17">thread · memory</text>
    <text x="1065" y="458" text-anchor="middle" fill="#334155" font-size="17">module · register</text>

    <path d="M285 219 C335 219 336 290 382 300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M285 413 C335 413 336 377 382 365" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M632 302 C672 276 682 230 714 220" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M819 280v72" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M924 219h56" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M924 413h56" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1065 352v-72" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="55" y="548" width="1095" height="116" rx="18" fill="#0f172a"/>
  <text x="84" y="590" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">검증 manifest</text>
  <text x="84" y="626" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">binary hash · PDB GUID/age 또는 ELF build ID · compiler/linker · RDI converter commit · RDI hash</text>
  <text x="84" y="651" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="17">불일치하면 캐시를 폐기하고 기준 디버거와 타입·스택·소스 라인을 교차 확인</text>
</svg>
