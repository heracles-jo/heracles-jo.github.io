<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Prometheus 3.16 업그레이드 검증 게이트</title><desc id="desc">쿼리, 저장소, 히스토그램, 롤백을 순서대로 검증하는 체크리스트</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1726"/><stop offset="1" stop-color="#2b1620"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".28"/></filter></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif"><text x="58" y="66" fill="#fff7ed" font-size="34" font-weight="800">Prometheus 3.16 단계적 승격 게이트</text><text x="58" y="104" fill="#cbd5e1" font-size="20">기동 성공이 아니라 query 의미, 데이터 복구, 실제 rollback까지 확인한다</text></g>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="58" y="160" width="244" height="300" rx="22" fill="#23233a" stroke="#a78bfa"/><circle cx="102" cy="207" r="24" fill="#7c3aed"/><text x="94" y="216" fill="white" font-size="24" font-weight="700">1</text><text x="140" y="216" fill="#ddd6fe" font-size="23" font-weight="700">Query</text><text x="86" y="266" fill="#e2e8f0" font-size="18">dashboard·API fixture</text><text x="86" y="302" fill="#e2e8f0" font-size="18">rule evaluation</text><text x="86" y="338" fill="#e2e8f0" font-size="18">series·sample 비용</text><text x="86" y="384" fill="#fbbf24" font-size="18">필수 질의가 차단?</text>
    <rect x="338" y="160" width="244" height="300" rx="22" fill="#1d2a35" stroke="#38bdf8"/><circle cx="382" cy="207" r="24" fill="#0284c7"/><text x="374" y="216" fill="white" font-size="24" font-weight="700">2</text><text x="420" y="216" fill="#bae6fd" font-size="23" font-weight="700">Storage</text><text x="366" y="266" fill="#e2e8f0" font-size="18">WAL replay·restart</text><text x="366" y="302" fill="#e2e8f0" font-size="18">compaction·OOO</text><text x="366" y="338" fill="#e2e8f0" font-size="18">head·block 비교</text><text x="366" y="384" fill="#fbbf24" font-size="18">sample 의미 불일치?</text>
    <rect x="618" y="160" width="244" height="300" rx="22" fill="#302519" stroke="#f59e0b"/><circle cx="662" cy="207" r="24" fill="#d97706"/><text x="654" y="216" fill="white" font-size="24" font-weight="700">3</text><text x="700" y="216" fill="#fde68a" font-size="23" font-weight="700">Histogram</text><text x="646" y="266" fill="#e2e8f0" font-size="18">classic·native 비교</text><text x="646" y="302" fill="#e2e8f0" font-size="18">quantile·fraction</text><text x="646" y="338" fill="#e2e8f0" font-size="18">OTLP·remote roundtrip</text><text x="646" y="384" fill="#fbbf24" font-size="18">SLO 계산 회귀?</text>
    <rect x="898" y="160" width="244" height="300" rx="22" fill="#352023" stroke="#f43f5e"/><circle cx="942" cy="207" r="24" fill="#e11d48"/><text x="934" y="216" fill="white" font-size="24" font-weight="700">4</text><text x="980" y="216" fill="#fecdd3" font-size="23" font-weight="700">Rollback</text><text x="926" y="266" fill="#e2e8f0" font-size="18">feature flag 해제</text><text x="926" y="302" fill="#e2e8f0" font-size="18">구버전 block reader</text><text x="926" y="338" fill="#e2e8f0" font-size="18">RTO·RPO 재현</text><text x="926" y="384" fill="#fbbf24" font-size="18">데이터 삭제 필요?</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none"><path d="M302 310h36"/><path d="m326 299 14 11-14 11"/><path d="M582 310h36"/><path d="m606 299 14 11-14 11"/><path d="M862 310h36"/><path d="m886 299 14 11-14 11"/></g>
  <rect x="146" y="530" width="908" height="108" rx="22" fill="#182435" stroke="#34d399" stroke-width="2"/><text x="190" y="574" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="25" font-weight="800">승격 조건</text><text x="190" y="610" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="19">업무 dashboard · rule cycle · compaction · restart · remote 지연 · 장기 조사 query를 모두 통과</text><text x="58" y="686" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">실험적 chunk format을 썼다면 binary downgrade만으로 rollback이 끝나지 않을 수 있다.</text>
</svg>
