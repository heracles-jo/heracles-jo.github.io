  <g transform="translate(72 82)" font-family="Arial, sans-serif"><text fill="#fdba74" font-size="24" font-weight="700">OBSERVABILITY UPGRADE GATE</text><text y="70" fill="#fff7ed" font-size="57" font-weight="800">Prometheus 3.16</text><text y="118" fill="#fed7aa" font-size="29">쿼리 비용 제한 · TSDB 복구 검증</text></g>
