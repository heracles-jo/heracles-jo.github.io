<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Prometheus 3.16 업그레이드 검증</title>
  <desc id="desc">Prometheus 쿼리 비용 제한과 TSDB 복구, 히스토그램 호환성을 나타내는 표지</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#260b0b"/><stop offset="1" stop-color="#532016"/></linearGradient><linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f97316"/><stop offset="1" stop-color="#facc15"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter></defs>
