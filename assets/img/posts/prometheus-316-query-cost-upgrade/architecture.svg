<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Prometheus query-cost 자원 경계</title><desc id="desc">대시보드와 API, 룰 쿼리가 비용 추정과 실행 엔진, TSDB를 공유하고 실행 한도에 의해 통제되는 구조</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120f1b"/><stop offset="1" stop-color="#2d1720"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".3"/></filter></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif"><text x="56" y="66" fill="#fff7ed" font-size="34" font-weight="800">query-cost는 견적과 실행 중 강제를 분리한다</text><text x="56" y="104" fill="#cbd5e1" font-size="20">API 요청과 recording·alerting rule이 같은 PromQL 엔진과 전역 한도를 공유한다</text></g>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="58" y="170" width="230" height="100" rx="20" fill="#262235" stroke="#a78bfa"/><text x="96" y="212" fill="#ddd6fe" font-size="23" font-weight="700">Dashboard / API</text><text x="96" y="245" fill="#cbd5e1" font-size="18">ad hoc · range query</text>
    <rect x="58" y="310" width="230" height="100" rx="20" fill="#262235" stroke="#38bdf8"/><text x="96" y="352" fill="#bae6fd" font-size="23" font-weight="700">Recording rule</text><text x="96" y="385" fill="#cbd5e1" font-size="18">반복 계산 · 새 series</text>
    <rect x="58" y="450" width="230" height="100" rx="20" fill="#262235" stroke="#f43f5e"/><text x="96" y="492" fill="#fecdd3" font-size="23" font-weight="700">Alerting rule</text><text x="96" y="525" fill="#cbd5e1" font-size="18">장애 탐지 · pending</text>
    <rect x="378" y="160" width="300" height="150" rx="24" fill="#3a2017" stroke="#fb923c"/><text x="420" y="208" fill="#fdba74" font-size="25" font-weight="800">비용 추정</text><text x="420" y="246" fill="#fff7ed" font-size="19">query_cost API</text><text x="420" y="276" fill="#fff7ed" font-size="19">예상 series · samples</text>
    <rect x="378" y="365" width="300" height="190" rx="24" fill="#452018" stroke="#f97316" stroke-width="2"/><text x="420" y="414" fill="#fb923c" font-size="25" font-weight="800">PromQL 실행 엔진</text><text x="420" y="454" fill="#fff7ed" font-size="19">실제 series · samples read</text><text x="420" y="488" fill="#fff7ed" font-size="19">query duration · peak samples</text><text x="420" y="526" fill="#fde68a" font-size="19">초과 시 실행 중 중단</text>
    <rect x="770" y="170" width="360" height="180" rx="24" fill="#302519" stroke="#facc15"/><text x="814" y="218" fill="#fde68a" font-size="25" font-weight="800">전역 실행 한도</text><text x="814" y="258" fill="#fff7ed" font-size="19">query_max_series</text><text x="814" y="290" fill="#fff7ed" font-size="19">query_max_samples_read</text><text x="814" y="322" fill="#fff7ed" font-size="19">query_max_duration</text>
    <rect x="770" y="410" width="360" height="145" rx="24" fill="#1d2935" stroke="#38bdf8"/><text x="814" y="458" fill="#bae6fd" font-size="25" font-weight="800">TSDB / remote read</text><text x="814" y="497" fill="#e2e8f0" font-size="19">index · head · blocks · chunks</text><text x="814" y="528" fill="#e2e8f0" font-size="19">실제 read가 enforcement 기준</text>
  </g>
  <g stroke="#94a3b8" stroke-width="4" fill="none"><path d="M288 220h90"/><path d="M288 360h90"/><path d="M288 500h90"/><path d="m366 208 15 12-15 12"/><path d="m366 348 15 12-15 12"/><path d="m366 488 15 12-15 12"/><path d="M678 455h92"/><path d="m758 443 15 12-15 12"/><path d="M950 350v60"/><path d="m938 398 12 16 12-16"/></g>
  <text x="56" y="654" fill="#fca5a5" font-family="Arial, sans-serif" font-size="19">주의: 전역 한도는 사용자 쿼리뿐 아니라 recording·alerting rule에도 적용된다.</text><text x="56" y="684" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">추정치는 안내용이며 실제 거부는 실행 중 관측된 비용으로 결정된다.</text>
</svg>
