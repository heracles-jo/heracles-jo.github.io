<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Python 품질 도구 통합 아키텍처</title>
  <desc id="desc">기존 Flake8, isort, Black, pyupgrade 설정을 정책 원장으로 비교해 Ruff linter와 formatter 및 검증 계층으로 전환하는 구조</desc>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="60" y="64" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="34" font-weight="800">도구 교체가 아니라 품질 계약의 재구성</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <text x="80" y="125" fill="#475569" font-size="22" font-weight="700">기존 실행 계층</text>
    <g fill="#fff" stroke="#94a3b8" stroke-width="2">
      <rect x="60" y="150" width="210" height="78" rx="14"/><rect x="60" y="246" width="210" height="78" rx="14"/>
      <rect x="60" y="342" width="210" height="78" rx="14"/><rect x="60" y="438" width="210" height="78" rx="14"/>
    </g>
    <g fill="#0f172a" font-size="25" font-weight="700" text-anchor="middle">
      <text x="165" y="198">Flake8 + plugins</text><text x="165" y="294">isort</text><text x="165" y="390">Black</text><text x="165" y="486">pyupgrade / autoflake</text>
    </g>
    <path d="M285 188H400M285 284H400M285 380H400M285 476H400" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="405" y="145" width="310" height="390" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text x="560" y="190" text-anchor="middle" fill="#312e81" font-size="27" font-weight="800">정책 원장</text>
    <g fill="#3730a3" font-size="21">
      <text x="440" y="240">• rule / plugin 대응 관계</text><text x="440" y="282">• ignore · noqa · 예외 사유</text>
      <text x="440" y="324">• Python target · import 경계</text><text x="440" y="366">• format 옵션 · known deviation</text>
      <text x="440" y="408">• safe / unsafe fix 분류</text><text x="440" y="450">• generated · notebook 제외</text>
      <text x="440" y="492">• owner · 만료 · rollback</text>
    </g>
    <path d="M730 265H820M730 420H820" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow2)"/>
    <rect x="835" y="160" width="290" height="145" rx="18" fill="#111827"/>
    <text x="980" y="208" text-anchor="middle" fill="#a5b4fc" font-size="24" font-weight="800">RUFF LINTER</text>
    <text x="980" y="248" text-anchor="middle" fill="white" font-size="22">명시적 rule set</text><text x="980" y="278" text-anchor="middle" fill="#cbd5e1" font-size="19">진단 · fix · suppression</text>
    <rect x="835" y="350" width="290" height="145" rx="18" fill="#111827"/>
    <text x="980" y="398" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="800">RUFF FORMATTER</text>
    <text x="980" y="438" text-anchor="middle" fill="white" font-size="22">Black 호환 + deviation</text><text x="980" y="468" text-anchor="middle" fill="#cbd5e1" font-size="19">idempotency · corpus diff</text>
    <rect x="310" y="585" width="580" height="82" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="600" y="620" text-anchor="middle" fill="#065f46" font-size="23" font-weight="800">검증 계층</text>
    <text x="600" y="652" text-anchor="middle" fill="#047857" font-size="20">test · type check · AST/compile · CI 재현성 · artifact provenance</text>
    <path d="M980 515V550H600V575" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrow3)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#4f46e5"/></marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#10b981"/></marker>
  </defs>
</svg>
