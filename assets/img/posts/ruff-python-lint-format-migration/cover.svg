<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ruff 전환 검증 기준</title>
  <desc id="desc">Flake8, isort, Black을 Ruff로 통합하면서 규칙, 포맷, 자동 수정, CI를 검증하는 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="100" r="180" fill="#8b5cf6" opacity=".16"/>
  <circle cx="1040" cy="590" r="230" fill="#22d3ee" opacity=".10"/>
  <text x="72" y="98" fill="#a5b4fc" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="28" font-weight="700">PYTHON TOOLCHAIN MIGRATION</text>
  <text x="72" y="174" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="58" font-weight="800">Ruff 전환</text>
  <text x="72" y="234" fill="#e0e7ff" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="35" font-weight="650">Flake8 · isort · Black 통합</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <rect x="72" y="300" width="225" height="105" rx="18" fill="#1f2937" stroke="#818cf8" stroke-width="2"/>
    <text x="184" y="342" text-anchor="middle" fill="#c7d2fe" font-size="22" font-weight="700">RULE PARITY</text>
    <text x="184" y="375" text-anchor="middle" fill="white" font-size="25">규칙 동등성</text>
    <rect x="321" y="300" width="225" height="105" rx="18" fill="#1f2937" stroke="#22d3ee" stroke-width="2"/>
    <text x="433" y="342" text-anchor="middle" fill="#a5f3fc" font-size="22" font-weight="700">FIX SAFETY</text>
    <text x="433" y="375" text-anchor="middle" fill="white" font-size="25">자동 수정</text>
    <rect x="570" y="300" width="225" height="105" rx="18" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
    <text x="682" y="342" text-anchor="middle" fill="#fde68a" font-size="22" font-weight="700">FORMAT DIFF</text>
    <text x="682" y="375" text-anchor="middle" fill="white" font-size="25">포맷 회귀</text>
    <rect x="819" y="300" width="225" height="105" rx="18" fill="#1f2937" stroke="#34d399" stroke-width="2"/>
    <text x="931" y="342" text-anchor="middle" fill="#a7f3d0" font-size="22" font-weight="700">CI GATE</text>
    <text x="931" y="375" text-anchor="middle" fill="white" font-size="25">재현 가능한 실행</text>
  </g>
  <path d="M184 438H931" stroke="#64748b" stroke-width="4" stroke-dasharray="10 12"/>
  <circle cx="184" cy="438" r="9" fill="#818cf8"/><circle cx="433" cy="438" r="9" fill="#22d3ee"/><circle cx="682" cy="438" r="9" fill="#f59e0b"/><circle cx="931" cy="438" r="9" fill="#34d399"/>
  <text x="72" y="530" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="30" font-weight="700">속도보다 먼저 확인할 것:</text>
  <text x="72" y="575" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="27">기존 코드 품질 계약이 같은 의미로 유지되는가</text>
</svg>
