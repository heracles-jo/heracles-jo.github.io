<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Context Mode 도입 의사결정 게이트</title>
  <desc id="desc">정보 보존, 실행 보안, 세션 격리, 실제 비용을 순서대로 검증해 확대 또는 중단한다</desc>
  <defs><style>.h{font:700 30px Arial,sans-serif;fill:#eef5ff}.n{font:700 20px Arial,sans-serif;fill:#fff}.s{font:16px Arial,sans-serif;fill:#ccdaed}.bad{font:700 16px Arial,sans-serif;fill:#ffb2b2}</style></defs>
  <rect width="1200" height="680" fill="#101a2d"/>
  <text class="h" x="60" y="65">절감률만 통과하면 안 되는 네 개의 게이트</text>
  <g transform="translate(60 120)"><rect width="250" height="370" rx="22" fill="#172943" stroke="#4f91d8" stroke-width="2"/><circle cx="125" cy="68" r="34" fill="#2f6ea9"/><text class="n" x="115" y="76">1</text><text class="n" x="55" y="132">정보 보존</text><text class="s" x="30" y="176">핵심 오류와 코드 근거가</text><text class="s" x="30" y="202">집계·검색 뒤에도 남는가</text><text class="s" x="30" y="246">재조회 횟수와 오답 patch</text><text class="s" x="30" y="272">acceptance test로 확인</text><text class="bad" x="30" y="330">누락된 증거 → 중단</text></g>
  <g transform="translate(340 120)"><rect width="250" height="370" rx="22" fill="#17343a" stroke="#42c6a3" stroke-width="2"/><circle cx="125" cy="68" r="34" fill="#25866e"/><text class="n" x="115" y="76">2</text><text class="n" x="55" y="132">실행 보안</text><text class="s" x="30" y="176">workspace · credential · egress</text><text class="s" x="30" y="202">경계가 OS 수준에서 강제되는가</text><text class="s" x="30" y="246">canary file · metadata IP</text><text class="s" x="30" y="272">symlink · subprocess 시험</text><text class="bad" x="30" y="330">권한 밖 접근 → 중단</text></g>
  <g transform="translate(620 120)"><rect width="250" height="370" rx="22" fill="#302747" stroke="#a880de" stroke-width="2"/><circle cx="125" cy="68" r="34" fill="#7651a8"/><text class="n" x="115" y="76">3</text><text class="n" x="55" y="132">상태 격리</text><text class="s" x="30" y="176">project · worktree · session</text><text class="s" x="30" y="202">데이터가 서로 섞이지 않는가</text><text class="s" x="30" y="246">compaction 복구와 purge를</text><text class="s" x="30" y="272">ground truth로 대조</text><text class="bad" x="30" y="330">교차 혼입 → 중단</text></g>
  <g transform="translate(900 120)"><rect width="250" height="370" rx="22" fill="#3b2e23" stroke="#e2a458" stroke-width="2"/><circle cx="125" cy="68" r="34" fill="#a36b2f"/><text class="n" x="115" y="76">4</text><text class="n" x="55" y="132">실제 비용</text><text class="s" x="30" y="176">provider token · cache · latency</text><text class="s" x="30" y="202">재조회와 실패 수정까지 합산</text><text class="s" x="30" y="246">같은 task · model · SHA로</text><text class="s" x="30" y="272">baseline과 비교</text><text class="bad" x="30" y="330">순효과 없음 → 보류</text></g>
  <path d="M185 520 V565 H1025 V520" fill="none" stroke="#7891b5" stroke-width="3"/>
  <rect x="390" y="560" width="420" height="72" rx="18" fill="#234d78"/>
  <text x="464" y="589" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">네 게이트를 모두 통과할 때만 확대</text><text x="445" y="616" font-family="Arial,sans-serif" font-size="16" fill="#d3e5f8">ELv2 사용 범위와 degraded 상태 표시도 함께 확인</text>
</svg>
