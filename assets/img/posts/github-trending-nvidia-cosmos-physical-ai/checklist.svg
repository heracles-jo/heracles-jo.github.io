<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI 도입 판단 매트릭스</title>
  <desc id="desc">PoC, 데이터, 인프라, 안전성, 운영 지표를 기준으로 월드 모델 도입 여부를 평가하는 체크리스트</desc>
  <rect width="1100" height="520" fill="#09111f"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="60" fill="#ffffff" font-size="32" font-weight="800">Physical AI PoC Decision Matrix</text>
    <text x="56" y="96" fill="#a7f36b" font-size="20">월드 모델은 데모가 아니라 데이터·검증·운영 체계로 판단해야 한다</text>
    <g transform="translate(60 145)">
      <rect width="980" height="310" rx="24" fill="#101d31" stroke="#2b4a6b"/>
      <g fill="#162a44" stroke="#355a7d">
        <rect x="28" y="35" width="180" height="220" rx="18"/><rect x="220" y="35" width="180" height="220" rx="18"/><rect x="412" y="35" width="180" height="220" rx="18"/><rect x="604" y="35" width="180" height="220" rx="18"/><rect x="796" y="35" width="156" height="220" rx="18"/>
      </g>
      <g font-size="20" font-weight="800" fill="#8be9fd">
        <text x="65" y="78">Use Case</text><text x="265" y="78">Data</text><text x="446" y="78">Compute</text><text x="642" y="78">Safety</text><text x="825" y="78">Ops</text>
      </g>
      <g font-size="16" fill="#e8faff">
        <text x="55" y="122">시뮬레이션</text><text x="55" y="154">합성 데이터</text><text x="55" y="186">정책 후보</text><text x="55" y="218">검증 자동화</text>
        <text x="250" y="122">센서 품질</text><text x="250" y="154">액션 로그</text><text x="250" y="186">라벨/메타</text><text x="250" y="218">권리·라이선스</text>
        <text x="440" y="122">16B/64B</text><text x="440" y="154">BF16 GPU</text><text x="440" y="186">vLLM/NIM</text><text x="440" y="218">비용 상한</text>
        <text x="632" y="122">폐루프 금지</text><text x="632" y="154">휴먼 승인</text><text x="632" y="186">시나리오 테스트</text><text x="632" y="218">실패 모드</text>
        <text x="818" y="122">지연시간</text><text x="818" y="154">드리프트</text><text x="818" y="186">재현성</text><text x="818" y="218">감사 로그</text>
      </g>
      <path d="M50 278 H930" stroke="#a7f36b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="120" cy="278" r="10" fill="#a7f36b"/><circle cx="315" cy="278" r="10" fill="#a7f36b"/><circle cx="508" cy="278" r="10" fill="#ffb86c"/><circle cx="700" cy="278" r="10" fill="#ff5555"/><circle cx="874" cy="278" r="10" fill="#8be9fd"/>
    </g>
