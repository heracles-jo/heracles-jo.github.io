<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA Cosmos와 Physical AI 월드 모델 분석</title>
  <desc id="desc">언어, 이미지, 비디오, 오디오, 액션 토큰을 하나의 월드 모델로 연결하는 Physical AI 아키텍처 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102f2e"/>
      <stop offset="1" stop-color="#1a3d13"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.2" stroke="#9be564" stroke-width="1">
    <path d="M0 470 C220 360 330 520 540 410 S920 300 1200 390" fill="none"/>
    <path d="M0 525 C260 430 390 560 650 460 S965 380 1200 450" fill="none"/>
  </g>
  <g transform="translate(680 95)" filter="url(#glow)">
    <circle cx="155" cy="155" r="120" fill="#112d37" stroke="#9be564" stroke-width="3"/>
    <circle cx="155" cy="155" r="68" fill="#193d3e" stroke="#61dafb" stroke-width="2"/>
    <circle cx="155" cy="155" r="18" fill="#9be564"/>
    <g stroke="#e8fff4" stroke-width="3" fill="none">
      <path d="M155 35 L155 275"/><path d="M35 155 L275 155"/><path d="M70 70 L240 240"/><path d="M240 70 L70 240"/>
    </g>
    <g fill="#61dafb">
      <circle cx="155" cy="35" r="10"/><circle cx="275" cy="155" r="10"/><circle cx="155" cy="275" r="10"/><circle cx="35" cy="155" r="10"/>
    </g>
  </g>
  <g transform="translate(95 115)">
    <text x="0" y="0" fill="#9be564" font-family="Arial, sans-serif" font-size="26" font-weight="700">GitHub Trending Analysis</text>
    <text x="0" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="800">NVIDIA Cosmos 3</text>
    <text x="0" y="132" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">Physical AI를 위한 월드 모델</text>
    <text x="0" y="194" fill="#c9f7dd" font-family="Arial, sans-serif" font-size="24">Reasoner + Generator + Action Modeling</text>
  </g>
  <g transform="translate(98 390)" font-family="Arial, sans-serif" font-size="22" fill="#e8fff4">
    <rect x="0" y="0" width="200" height="58" rx="16" fill="#16323a" stroke="#61dafb"/>
    <text x="28" y="37">Video / Image</text>
    <rect x="230" y="0" width="160" height="58" rx="16" fill="#193923" stroke="#9be564"/>
    <text x="270" y="37">Action</text>
    <rect x="420" y="0" width="190" height="58" rx="16" fill="#2b2b44" stroke="#d4b5ff"/>
    <text x="454" y="37">World Model</text>
  </g>
</svg>