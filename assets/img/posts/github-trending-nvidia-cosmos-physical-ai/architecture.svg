<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Cosmos 3 아키텍처 흐름</title>
  <desc id="desc">센서 데이터와 액션이 Reasoner와 Generator를 거쳐 시뮬레이션, 예측, 정책 후보로 이어지는 흐름</desc>
  <rect width="1100" height="520" fill="#0b1220"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8be9fd"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="48" y="58" fill="#ffffff" font-size="32" font-weight="800">Omnimodal World Model Pipeline</text>
    <g fill="#14243b" stroke="#8be9fd" stroke-width="2">
      <rect x="55" y="130" width="170" height="86" rx="18"/><rect x="55" y="250" width="170" height="86" rx="18"/><rect x="55" y="370" width="170" height="86" rx="18"/>
    </g>
    <g fill="#e8faff" font-size="22" font-weight="700">
      <text x="90" y="181">Video/Image</text><text x="103" y="301">Audio</text><text x="91" y="421">Action JSON</text>
    </g>
    <g stroke="#8be9fd" stroke-width="3" marker-end="url(#arrow)">
      <path d="M225 173 C285 173 300 220 350 220"/><path d="M225 293 C285 293 300 250 350 250"/><path d="M225 413 C300 413 300 292 350 292"/>
      <path d="M705 260 L805 260"/>
    </g>
    <rect x="350" y="155" width="300" height="180" rx="26" fill="#162d2d" stroke="#a7f36b" stroke-width="3"/>
    <text x="425" y="208" fill="#a7f36b" font-size="26" font-weight="800">Mixture-of-Transformers</text>
    <text x="393" y="253" fill="#ffffff" font-size="20">AR Reasoner: 인식·계획·질의응답</text>
    <text x="393" y="291" fill="#ffffff" font-size="20">Diffusion Generator: 이미지·비디오·사운드</text>
