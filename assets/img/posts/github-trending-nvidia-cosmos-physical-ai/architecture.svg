    <rect x="805" y="116" width="250" height="78" rx="18" fill="#261f3e" stroke="#d4b5ff" stroke-width="2"/>
    <rect x="805" y="224" width="250" height="78" rx="18" fill="#26341f" stroke="#a7f36b" stroke-width="2"/>
    <rect x="805" y="332" width="250" height="78" rx="18" fill="#33211f" stroke="#ffb86c" stroke-width="2"/>
    <g fill="#ffffff" font-size="21" font-weight="700">
