<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Spirula Studio 도입 의사결정 게이트</title>
  <desc id="desc">입력 정확성, backend 동등성, 자원, downstream, 공급망을 차례로 검증하는 흐름</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1725"/><stop offset="1" stop-color="#19344f"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#78ddff"/></marker></defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <text x="600" y="60" fill="#fff" font-family="Arial, sans-serif" font-size="35" font-weight="800" text-anchor="middle">기능 데모를 제작 파이프라인으로 승격하는 다섯 게이트</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 115)"><rect width="200" height="145" rx="20" fill="#143c58" stroke="#59d7ff" stroke-width="3"/><text x="100" y="38" fill="#8ee7ff" font-size="19" font-weight="800" text-anchor="middle">01 INPUT</text><text x="100" y="76" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">SfM 정확성</text><text x="100" y="108" fill="#b8d1e2" font-size="15" text-anchor="middle">pose · scale · mask</text><text x="100" y="130" fill="#b8d1e2" font-size="15" text-anchor="middle">frame provenance</text></g>
    <path d="M280 187H325" stroke="#78ddff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(335 115)"><rect width="200" height="145" rx="20" fill="#193b59" stroke="#59d7ff" stroke-width="3"/><text x="100" y="38" fill="#8ee7ff" font-size="19" font-weight="800" text-anchor="middle">02 PARITY</text><text x="100" y="76" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">CUDA · Vulkan</text><text x="100" y="108" fill="#b8d1e2" font-size="15" text-anchor="middle">artifact diff</text><text x="100" y="130" fill="#b8d1e2" font-size="15" text-anchor="middle">driver별 회귀</text></g>
    <path d="M545 187H590" stroke="#78ddff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(600 115)"><rect width="200" height="145" rx="20" fill="#263858" stroke="#a28dff" stroke-width="3"/><text x="100" y="38" fill="#c1b4ff" font-size="19" font-weight="800" text-anchor="middle">03 CAPACITY</text><text x="100" y="76" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">VRAM · 시간</text><text x="100" y="108" fill="#c8cce0" font-size="15" text-anchor="middle">peak memory</text><text x="100" y="130" fill="#c8cce0" font-size="15" text-anchor="middle">end-to-end deadline</text></g>
    <path d="M810 187H855" stroke="#78ddff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(865 115)"><rect width="265" height="145" rx="20" fill="#263858" stroke="#a28dff" stroke-width="3"/><text x="132" y="38" fill="#c1b4ff" font-size="19" font-weight="800" text-anchor="middle">04 HANDOFF</text><text x="132" y="76" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">Mesh · DCC · Engine</text><text x="132" y="108" fill="#c8cce0" font-size="15" text-anchor="middle">좌표계 · UV · normal · LOD</text><text x="132" y="130" fill="#c8cce0" font-size="15" text-anchor="middle">downstream round-trip</text></g>
    <path d="M997 270V340H600V390" fill="none" stroke="#78ddff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(310 405)"><rect width="580" height="150" rx="24" fill="#174b4d" stroke="#71e2bf" stroke-width="3"/><text x="290" y="42" fill="#91f0d2" font-size="20" font-weight="800" text-anchor="middle">05 OPERATIONS &amp; SUPPLY CHAIN</text><text x="290" y="82" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">commit · config · model digest · build option</text><text x="290" y="116" fill="#bfe2dc" font-size="17" text-anchor="middle">GPL 배포 · codec 특허 · binary provenance · rollback</text></g>
    <path d="M600 565V620" stroke="#71e2bf" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(260 635)"><rect width="680" height="95" rx="24" fill="#0f2b3d" stroke="#ffd27b" stroke-width="3"/><text x="340" y="40" fill="#ffd27b" font-size="24" font-weight="800" text-anchor="middle">모든 게이트에 증거가 있을 때만 운영 후보</text><text x="340" y="70" fill="#d5e5ef" font-size="17" text-anchor="middle">한 장면의 성공이나 낮은 VRAM 숫자는 승인 영수증이 아니다</text></g>
  </g>
</svg>
