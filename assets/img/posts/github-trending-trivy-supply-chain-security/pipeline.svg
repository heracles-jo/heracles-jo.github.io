<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Trivy 스캔 대상과 결과 흐름</title>
  <desc id="desc">소스, 컨테이너 이미지, Kubernetes, 클라우드 설정에서 취약점, 시크릿, SBOM, 정책 결과가 생성되는 흐름</desc>
  <rect width="1100" height="520" rx="24" fill="#f8fafc"/>
  <text x="55" y="70" font-family="Inter, Arial" font-size="32" font-weight="800" fill="#0f172a">하나의 스캐너가 여러 보안 신호를 모으는 구조</text>
  <g font-family="Inter, Arial" font-size="18" font-weight="700">
    <rect x="70" y="125" width="190" height="70" rx="18" fill="#e0f2fe"/><text x="165" y="168" text-anchor="middle" fill="#075985">Git Repository</text>
    <rect x="70" y="225" width="190" height="70" rx="18" fill="#dcfce7"/><text x="165" y="268" text-anchor="middle" fill="#166534">Container Image</text>
    <rect x="70" y="325" width="190" height="70" rx="18" fill="#fef3c7"/><text x="165" y="368" text-anchor="middle" fill="#92400e">Kubernetes / IaC</text>
    <rect x="410" y="210" width="260" height="110" rx="28" fill="#0f172a"/><text x="540" y="257" text-anchor="middle" fill="#fff" font-size="30">Trivy</text><text x="540" y="292" text-anchor="middle" fill="#bae6fd" font-size="17">scan · classify · report</text>
    <rect x="820" y="95" width="210" height="58" rx="16" fill="#fee2e2"/><text x="925" y="132" text-anchor="middle" fill="#991b1b">Vulnerabilities</text>
    <rect x="820" y="175" width="210" height="58" rx="16" fill="#fae8ff"/><text x="925" y="212" text-anchor="middle" fill="#86198f">Secrets</text>
    <rect x="820" y="255" width="210" height="58" rx="16" fill="#dbeafe"/><text x="925" y="292" text-anchor="middle" fill="#1e40af">SBOM / Licenses</text>
    <rect x="820" y="335" width="210" height="58" rx="16" fill="#ccfbf1"/><text x="925" y="372" text-anchor="middle" fill="#115e59">Misconfig / Policy</text>
  </g>
  <g stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M270 160 C330 160 350 235 405 250"/><path d="M270 260 H405"/><path d="M270 360 C330 360 350 295 405 280"/>
    <path d="M675 245 C735 225 760 125 815 125"/><path d="M675 260 C735 250 760 205 815 205"/><path d="M675 275 C735 285 760 285 815 285"/><path d="M675 290 C735 315 760 365 815 365"/>
  </g>
  <text x="55" y="470" font-family="Inter, Arial" font-size="18" fill="#475569">핵심은 도구 하나가 모든 문제를 해결한다는 뜻이 아니라, CI/CD와 런타임 사이에 공통 보안 언어를 만드는 데 있다.</text>
</svg>
