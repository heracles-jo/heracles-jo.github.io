<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenVINO 엣지 AI 추론 검증</title>
  <desc id="desc">모델을 CPU GPU NPU에 배포하고 품질 성능 보안을 검증하는 개념도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2b"/><stop offset="1" stop-color="#123d4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d0c3"/><stop offset="1" stop-color="#8fe388"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="90" r="170" fill="#39d0c3" opacity=".08"/>
  <circle cx="105" cy="575" r="220" fill="#8fe388" opacity=".06"/>
  <text x="80" y="105" fill="#7ce0d6" font-family="Arial, sans-serif" font-size="28" font-weight="700">EDGE AI INFERENCE</text>
  <text x="80" y="185" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="800">OpenVINO 엣지 AI 추론</text>
  <text x="80" y="245" fill="#d6edf0" font-family="Arial, sans-serif" font-size="34" font-weight="600">CPU · GPU · NPU 검증 기준</text>
  <rect x="80" y="292" width="1040" height="3" fill="url(#accent)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="350" width="250" height="145" rx="20" fill="#102f43" stroke="#39d0c3" stroke-width="3"/>
    <text x="215" y="408" fill="#ffffff" font-size="30" font-weight="700">CPU</text><text x="215" y="452" fill="#a9cbd2" font-size="22">호환성 · fallback</text>
    <rect x="475" y="350" width="250" height="145" rx="20" fill="#102f43" stroke="#5fd3ff" stroke-width="3"/>
    <text x="600" y="408" fill="#ffffff" font-size="30" font-weight="700">GPU</text><text x="600" y="452" fill="#a9cbd2" font-size="22">처리량 · memory</text>
    <rect x="860" y="350" width="250" height="145" rx="20" fill="#102f43" stroke="#8fe388" stroke-width="3"/>
    <text x="985" y="408" fill="#ffffff" font-size="30" font-weight="700">NPU</text><text x="985" y="452" fill="#a9cbd2" font-size="22">전력 · driver</text>
  </g>
  <path d="M340 422h125M725 422h125" stroke="#d6edf0" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="80" y="570" fill="#9cb9c1" font-family="Arial, sans-serif" font-size="22">quality · latency · power · security · rollback</text>
</svg>
