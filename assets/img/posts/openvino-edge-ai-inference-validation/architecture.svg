<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenVINO 엣지 추론 아키텍처</title>
  <desc id="desc">원본 모델 변환, OpenVINO Runtime, 장치 plugin, CPU GPU NPU 실행과 검증 feedback 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3d6f84"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#f4f8fa"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#123446">모델에서 장치까지: 검증해야 할 경계</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="120" width="260" height="120" rx="16" fill="#ffffff" stroke="#4c91a8" stroke-width="3"/>
    <text x="190" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#123446">원본 모델</text>
    <text x="190" y="205" text-anchor="middle" font-size="19" fill="#4b6875">PyTorch · TensorFlow · ONNX</text>
    <rect x="470" y="120" width="260" height="120" rx="16" fill="#e9fbf7" stroke="#2cbba9" stroke-width="3"/>
    <text x="600" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#123446">변환·최적화</text>
    <text x="600" y="205" text-anchor="middle" font-size="19" fill="#4b6875">IR · graph fusion · precision</text>
    <rect x="880" y="120" width="260" height="120" rx="16" fill="#ffffff" stroke="#4c91a8" stroke-width="3"/>
    <text x="1010" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#123446">Runtime 정책</text>
    <text x="1010" y="205" text-anchor="middle" font-size="19" fill="#4b6875">AUTO · HETERO · hint · cache</text>
    <path d="M320 180h140M730 180h140" stroke="#3d6f84" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="90" y="330" width="280" height="150" rx="18" fill="#e9f2ff" stroke="#4d7fc2" stroke-width="3"/>
    <text x="230" y="385" text-anchor="middle" font-size="30" font-weight="700" fill="#123446">CPU plugin</text>
    <text x="230" y="425" text-anchor="middle" font-size="19" fill="#4b6875">ISA · oneDNN · JIT</text>
    <text x="230" y="454" text-anchor="middle" font-size="19" fill="#4b6875">범용 fallback</text>
    <rect x="460" y="330" width="280" height="150" rx="18" fill="#eef7ff" stroke="#45a6c7" stroke-width="3"/>
    <text x="600" y="385" text-anchor="middle" font-size="30" font-weight="700" fill="#123446">GPU plugin</text>
    <text x="600" y="425" text-anchor="middle" font-size="19" fill="#4b6875">driver · layout · zero-copy</text>
    <text x="600" y="454" text-anchor="middle" font-size="19" fill="#4b6875">처리량·동적 shape</text>
    <rect x="830" y="330" width="280" height="150" rx="18" fill="#edf9ef" stroke="#61a969" stroke-width="3"/>
    <text x="970" y="385" text-anchor="middle" font-size="30" font-weight="700" fill="#123446">NPU plugin</text>
    <text x="970" y="425" text-anchor="middle" font-size="19" fill="#4b6875">compiler · firmware · blob</text>
    <text x="970" y="454" text-anchor="middle" font-size="19" fill="#4b6875">전력·driver cohort</text>
    <path d="M1010 240v50H230v30M1010 290H600v30M1010 290H970v30" stroke="#3d6f84" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <rect x="60" y="570" width="1080" height="120" rx="18" fill="#123446"/>
    <text x="600" y="615" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">제품 검증 루프</text>
    <text x="600" y="655" text-anchor="middle" font-size="21" fill="#d8e9ef">정확도 · p95 지연 · 전력/열 · fallback · 안정성 · artifact · rollback</text>
    <path d="M230 480v80M600 480v80M970 480v80" stroke="#3d6f84" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
