<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sure 도입 결정 게이트</title>
  <desc id="desc">정합성, 비밀과 권한, 복구 검증을 통과해야 개인 금융 원장으로 승격하는 결정 흐름</desc>
  <rect width="1200" height="720" rx="28" fill="#0f172a"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <text x="600" y="65" fill="#f8fafc" font-size="34" font-weight="800" text-anchor="middle">개인 금융 원장 승격 결정 게이트</text>
    <g transform="translate(70 120)">
      <rect width="320" height="430" rx="26" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
      <circle cx="160" cy="72" r="42" fill="#2563eb"/><text x="160" y="84" fill="white" font-size="34" font-weight="800" text-anchor="middle">1</text>
      <text x="160" y="145" fill="#bfdbfe" font-size="27" font-weight="800" text-anchor="middle">정합성</text>
      <g fill="#e2e8f0" font-size="19"><text x="30" y="195">• statement와 잔액 대조</text><text x="30" y="235">• pending·중복·누락 확인</text><text x="30" y="275">• 이체·외화·투자 부호 검증</text><text x="30" y="315">• 재동기화 결과의 재현성</text></g>
      <rect x="45" y="355" width="230" height="48" rx="24" fill="#1d4ed8"/><text x="160" y="386" fill="white" font-size="18" font-weight="700" text-anchor="middle">원천 자료와 일치하는가?</text>
    </g>
    <g transform="translate(440 120)">
      <rect width="320" height="430" rx="26" fill="#3b1220" stroke="#fb7185" stroke-width="3"/>
      <circle cx="160" cy="72" r="42" fill="#e11d48"/><text x="160" y="84" fill="white" font-size="34" font-weight="800" text-anchor="middle">2</text>
      <text x="160" y="145" fill="#fecdd3" font-size="27" font-weight="800" text-anchor="middle">비밀·권한</text>
      <g fill="#e2e8f0" font-size="19"><text x="30" y="195">• SECRET_KEY_BASE 보존·회전</text><text x="30" y="235">• MFA·reverse proxy·patch</text><text x="30" y="275">• MCP token과 write 승인</text><text x="30" y="315">• 외부 AI 데이터 경계</text></g>
      <rect x="45" y="355" width="230" height="48" rx="24" fill="#be123c"/><text x="160" y="386" fill="white" font-size="18" font-weight="700" text-anchor="middle">최소 권한을 증명했는가?</text>
    </g>
    <g transform="translate(810 120)">
      <rect width="320" height="430" rx="26" fill="#123126" stroke="#34d399" stroke-width="3"/>
      <circle cx="160" cy="72" r="42" fill="#059669"/><text x="160" y="84" fill="white" font-size="34" font-weight="800" text-anchor="middle">3</text>
      <text x="160" y="145" fill="#a7f3d0" font-size="27" font-weight="800" text-anchor="middle">복구</text>
      <g fill="#e2e8f0" font-size="19"><text x="30" y="195">• DB·upload·config 함께 백업</text><text x="30" y="235">• off-site copy 별도 암호화</text><text x="30" y="275">• 빈 host restore 시험</text><text x="30" y="315">• worker·provider·권한 재검증</text></g>
      <rect x="45" y="355" width="230" height="48" rx="24" fill="#047857"/><text x="160" y="386" fill="white" font-size="18" font-weight="700" text-anchor="middle">같은 금융 의미가 복원되는가?</text>
    </g>
    <path d="M230 585H970" stroke="#475569" stroke-width="4"/>
    <circle cx="230" cy="585" r="10" fill="#60a5fa"/><circle cx="600" cy="585" r="10" fill="#fb7185"/><circle cx="970" cy="585" r="10" fill="#34d399"/>
    <rect x="350" y="620" width="500" height="58" rx="29" fill="#f8fafc"/>
    <text x="600" y="657" fill="#0f172a" font-size="23" font-weight="800" text-anchor="middle">세 게이트를 모두 통과할 때 운영 원장으로 승격</text>
  </g>
</svg>
