<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sure 개인 금융 데이터 아키텍처</title>
  <desc id="desc">금융 provider와 수동 입력이 Rails 서버, worker, PostgreSQL 원장으로 들어가 클라이언트와 AI MCP, 백업으로 전달되는 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <text x="60" y="64" font-size="32" font-weight="800" fill="#0f172a">Sure의 신뢰 경계: 입력부터 복구까지</text>
    <g font-size="21" font-weight="700" text-anchor="middle">
      <rect x="45" y="130" width="220" height="92" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <text x="155" y="168" fill="#1e3a8a">은행·카드·거래소</text><text x="155" y="197" fill="#334155" font-size="17">Provider API / OAuth</text>
      <rect x="45" y="270" width="220" height="92" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="155" y="308" fill="#075985">수동 입력·명세서</text><text x="155" y="337" fill="#334155" font-size="17">CSV · PDF · attachment</text>
      <rect x="370" y="112" width="300" height="132" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
      <text x="520" y="158" fill="#115e59">Rails Web / API</text><text x="520" y="190" fill="#334155" font-size="17">인증 · 권한 · 금융 계산</text><text x="520" y="216" fill="#334155" font-size="17">MFA · session · client surface</text>
      <rect x="370" y="292" width="300" height="132" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="520" y="338" fill="#92400e">Sidekiq Worker</text><text x="520" y="370" fill="#334155" font-size="17">sync · rule · 가격 · AI job</text><text x="520" y="396" fill="#334155" font-size="17">신선도와 재처리 경계</text>
      <rect x="395" y="496" width="250" height="118" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
      <text x="520" y="540" fill="#5b21b6">PostgreSQL 원장</text><text x="520" y="572" fill="#334155" font-size="17">계좌 · 거래 · 예산 · 권한</text><text x="520" y="598" fill="#334155" font-size="17">암호화된 provider secret</text>
      <rect x="780" y="105" width="340" height="105" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="950" y="147" fill="#166534">Web · Mobile · Desktop</text><text x="950" y="180" fill="#334155" font-size="17">같은 server 계산과 권한 재사용</text>
      <rect x="780" y="270" width="340" height="120" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="950" y="312" fill="#991b1b">AI Assistant · MCP</text><text x="950" y="344" fill="#334155" font-size="17">금융 조회 + write-capable tools</text><text x="950" y="370" fill="#334155" font-size="17">token · provider · 승인 필요</text>
      <rect x="780" y="490" width="340" height="130" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
      <text x="950" y="530" fill="#1e293b">Backup · Off-site Restore</text><text x="950" y="562" fill="#334155" font-size="17">DB · upload · .env · version</text><text x="950" y="589" fill="#b91c1c" font-size="17">복구 자산이자 최고 등급 비밀</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
      <path d="M265 176H360"/><path d="M265 316H360"/><path d="M520 244V282"/><path d="M500 424V484"/><path d="M540 244V484"/>
      <path d="M670 170H770"/><path d="M670 342H770"/><path d="M645 555H770"/>
    </g>
    <text x="60" y="680" fill="#475569" font-size="19">핵심 판정: sync 성공이 아니라 원천 자료와의 정합성, 최소 권한, 암호화 키를 포함한 빈 서버 복구</text>
  </g>
</svg>
