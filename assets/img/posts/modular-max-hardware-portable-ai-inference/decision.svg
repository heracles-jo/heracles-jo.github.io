<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MAX 도입 검증 게이트</title><desc id="desc">수요, 호환성, 성능, 운영, 라이선스 검증을 통과해야 이기종 AI 추론 플랫폼으로 채택하는 의사결정 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/><text x="60" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">“실행된다”가 아니라 “반복 검증된다”를 통과 조건으로 둔다</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="21" font-weight="700"><rect x="70" y="145" width="190" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="165" y="183" fill="#1e3a8a">NEED</text><text x="165" y="213" fill="#334155" font-size="17">두 번째 HW 경로</text><rect x="290" y="145" width="190" height="90" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="385" y="183" fill="#312e81">COMPAT</text><text x="385" y="213" fill="#334155" font-size="17">모델·기능 계약</text><rect x="510" y="145" width="190" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="605" y="183" fill="#4c1d95">BENCH</text><text x="605" y="213" fill="#334155" font-size="17">품질·SLO·비용</text><rect x="730" y="145" width="190" height="90" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="825" y="183" fill="#134e4a">OPS</text><text x="825" y="213" fill="#334155" font-size="17">관측·롤백·업그레이드</text><rect x="950" y="145" width="190" height="90" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="1045" y="183" fill="#7c2d12">LICENSE</text><text x="1045" y="213" fill="#334155" font-size="17">실제 배포 권리</text></g>
    <path d="M260 190H290M480 190H510M700 190H730M920 190H950" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <path d="M1045 235V340H735" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <rect x="465" y="325" width="270" height="90" rx="22" fill="#166534"/><text x="600" y="365" fill="white" font-size="24" font-weight="700">CANARY ADOPTION</text><text x="600" y="394" fill="#dcfce7" font-size="18">라우팅 경계와 rollback 유지</text>
    <path d="M600 415V500" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <rect x="115" y="515" width="420" height="110" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="325" y="555" fill="#991b1b" font-size="23" font-weight="700">하나라도 실패</text><text x="325" y="590" fill="#475569" font-size="18">기존 엔진 유지 · 가설과 범위 축소</text><rect x="665" y="515" width="420" height="110" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="875" y="555" fill="#14532d" font-size="23" font-weight="700">모두 반복 가능</text><text x="875" y="590" fill="#475569" font-size="18">장치별 점진 확대 · 회귀 게이트 고정</text>
    <path d="M600 500L325 515M600 500L875 515" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  </g>
</svg>
