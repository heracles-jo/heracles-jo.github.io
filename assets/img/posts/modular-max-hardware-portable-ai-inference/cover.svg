<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MAX 이기종 AI 추론</title>
  <desc id="desc">하나의 MAX 모델 서빙 경로가 NVIDIA, AMD, Apple 하드웨어로 이어지는 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#3b0764"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1070" cy="100" r="190" fill="#7c3aed" opacity=".17"/><circle cx="90" cy="570" r="210" fill="#0891b2" opacity=".13"/>
  <text x="78" y="115" fill="#67e8f9" font-family="Arial, sans-serif" font-size="27" font-weight="700">MODULAR MAX · MOJO 1.0</text>
  <text x="78" y="198" fill="#f8fafc" font-family="Arial, sans-serif" font-size="55" font-weight="800">이기종 AI 추론의 운영 조건</text>
  <text x="78" y="252" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">CUDA 종속성을 줄여도 검증 책임은 사라지지 않는다</text>
  <rect x="455" y="330" width="290" height="88" rx="22" fill="#f8fafc"/><text x="600" y="385" text-anchor="middle" fill="#312e81" font-family="Arial, sans-serif" font-size="32" font-weight="800">MODEL → MAX → KERNEL</text>
  <path d="M600 418V474M600 474H215M600 474H985" stroke="url(#beam)" stroke-width="7" fill="none"/>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><rect x="100" y="488" width="230" height="78" rx="18" fill="#164e63"/><text x="215" y="537" fill="#cffafe">NVIDIA GPU</text><rect x="485" y="488" width="230" height="78" rx="18" fill="#4c1d95"/><text x="600" y="537" fill="#ede9fe">AMD GPU</text><rect x="870" y="488" width="230" height="78" rx="18" fill="#881337"/><text x="985" y="537" fill="#ffe4e6">APPLE SILICON</text></g>
</svg>
