<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MAX 이기종 추론 아키텍처</title><desc id="desc">OpenAI 호환 API에서 Python 모델 파이프라인, 컴파일 실행 계층, Mojo 커널을 거쳐 세 하드웨어 계열로 연결되는 구조와 검증 경계</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="60" y="62" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">하나의 API 아래에도 검증해야 할 네 계층이 있다</text>
