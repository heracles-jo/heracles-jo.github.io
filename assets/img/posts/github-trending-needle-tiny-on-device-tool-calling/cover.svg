    <text x="0" y="70" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Needle 2와</text>
    <text x="0" y="138" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">초소형 온디바이스 AI</text>
    <text x="0" y="205" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="30">14MB 모델 · 도구 호출 · 구조화 추출 · 엣지 운영</text>
  </g>
  <g filter="url(#shadow)" transform="translate(650 125)">
