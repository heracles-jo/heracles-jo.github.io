    <text x="60" y="204" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Grammar + Confidence</text>
    <path d="M195 234 L195 278" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <rect x="35" y="278" width="148" height="38" rx="14" fill="#164e63"/>
    <rect x="207" y="278" width="148" height="38" rx="14" fill="#134e4a"/>
    <text x="62" y="304" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Act Local</text>
