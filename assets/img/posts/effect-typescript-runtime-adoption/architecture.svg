<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Effect runtime architecture</title>
  <desc id="desc">Type contract flows through layers, fibers and scopes into runtime observability</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Effect 실행 계약이 프로덕션 경계로 전달되는 흐름</text>
  <rect x="70" y="120" width="1060" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" fill="#4c1d95" font-family="Arial, sans-serif" font-size="30" font-weight="700">Effect&lt;Success, Error, Requirements&gt;</text>
  <text x="600" y="207" text-anchor="middle" fill="#6d28d9" font-family="Arial, sans-serif" font-size="22">성공 값 · 예상 오류 · 필요한 service를 호출 경계에 표시</text>
  <path d="M600 240 V290" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="310" width="300" height="150" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="220" y="354" text-anchor="middle" fill="#075985" font-size="27" font-weight="700">Layer</text>
    <text x="220" y="392" text-anchor="middle" fill="#0369a1" font-size="21">Config · Logger · Database</text>
    <text x="220" y="425" text-anchor="middle" fill="#475569" font-size="19">construction graph와 startup failure</text>
    <rect x="450" y="310" width="300" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="354" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">Fiber</text>
    <text x="600" y="392" text-anchor="middle" fill="#15803d" font-size="21">동시성 상한 · interruption</text>
    <text x="600" y="425" text-anchor="middle" fill="#475569" font-size="19">parent-child 수명과 failure cause</text>
    <rect x="830" y="310" width="300" height="150" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="980" y="354" text-anchor="middle" fill="#92400e" font-size="27" font-weight="700">Scope</text>
    <text x="980" y="392" text-anchor="middle" fill="#b45309" font-size="21">acquire · use · finalizer</text>
    <text x="980" y="425" text-anchor="middle" fill="#475569" font-size="19">성공·실패·취소의 자원 정리</text>
  </g>
  <path d="M220 460 V520 M600 460 V520 M980 460 V520" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="70" y="545" width="1060" height="130" rx="18" fill="#0f172a"/>
  <text x="600" y="590" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Effect Runtime + Platform Adapters</text>
  <text x="600" y="628" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="21">HTTP · SQL · Queue · File · Scheduler · OpenTelemetry</text>
  <text x="600" y="706" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="21">검증 포인트: adapter가 취소·오류·자원 수명·trace 문맥을 실제 외부 시스템까지 전달하는가</text>
</svg>
