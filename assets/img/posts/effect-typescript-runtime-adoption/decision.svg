<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Effect adoption decision gates</title>
  <desc id="desc">A two-week proof of concept decides whether to expand, contain or stop Effect adoption</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#fffdf7"/>
  <text x="60" y="66" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700">2주 PoC: 문법 선호가 아니라 운영 결과로 결정한다</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="120" width="260" height="118" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="200" y="163" text-anchor="middle" fill="#075985" font-size="24" font-weight="700">1. 경계 선택</text>
    <text x="200" y="200" text-anchor="middle" fill="#334155" font-size="19">외부 I/O가 많은 workflow 1개</text>
    <path d="M330 179 H420" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="440" y="120" width="300" height="118" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="590" y="163" text-anchor="middle" fill="#4c1d95" font-size="24" font-weight="700">2. 실패 주입</text>
    <text x="590" y="200" text-anchor="middle" fill="#334155" font-size="19">timeout · partial failure · shutdown</text>
    <path d="M740 179 H830" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="850" y="120" width="280" height="118" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="990" y="163" text-anchor="middle" fill="#166534" font-size="24" font-weight="700">3. 비교 측정</text>
    <text x="990" y="200" text-anchor="middle" fill="#334155" font-size="19">현재 Promise 구현과 동일 trace</text>
  </g>
  <path d="M990 238 V295 H600 V330" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="410" y="350" width="380" height="132" rx="66" fill="#111827"/>
  <text x="600" y="402" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">운영 계약이 더 명확해졌는가?</text>
  <text x="600" y="440" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">취소 · 누수 · 오류 원인 · graph · trace · 개발 속도</text>
  <path d="M410 416 H260 V535" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 416 H940 V535" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 482 V535" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="555" width="330" height="130" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="255" y="603" text-anchor="middle" fill="#991b1b" font-size="26" font-weight="700">중단</text>
    <text x="255" y="642" text-anchor="middle" fill="#475569" font-size="19">추상화 비용과 feedback 지연이 더 큼</text>
    <rect x="435" y="555" width="330" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="600" y="603" text-anchor="middle" fill="#92400e" font-size="26" font-weight="700">경계 유지</text>
    <text x="600" y="642" text-anchor="middle" fill="#475569" font-size="19">worker·adapter 등 효과가 난 영역만 사용</text>
    <rect x="780" y="555" width="330" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="945" y="603" text-anchor="middle" fill="#166534" font-size="26" font-weight="700">점진 확대</text>
    <text x="945" y="642" text-anchor="middle" fill="#475569" font-size="19">공통 runtime 규약과 upgrade gate 구축</text>
  </g>
  <text x="600" y="724" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="20">전면 재작성은 선택지가 아니다. 검증된 경계를 한 단계씩 넓힌다.</text>
</svg>
