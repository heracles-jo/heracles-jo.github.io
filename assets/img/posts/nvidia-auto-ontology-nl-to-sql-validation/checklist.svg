<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Auto Ontology PoC 체크리스트</title><desc id="desc">정확도, 거부, 권한, 재현성, 비용, 복구를 단계별로 검증하는 체크리스트</desc>
  <defs><style>.h{font:700 28px Arial,'Noto Sans KR',sans-serif}.t{font:19px Arial,'Noto Sans KR',sans-serif}.n{font:700 20px Arial,'Noto Sans KR',sans-serif}</style></defs>
  <rect width="1200" height="720" rx="28" fill="#0d241a"/>
  <text x="58" y="62" class="h" fill="#fff">PoC 승격 조건: 정확한 답뿐 아니라 안전한 거부와 복구까지</text>
  <g transform="translate(55 105)">
    <g><rect width="335" height="210" rx="20" fill="#163a2a" stroke="#6ba785"/><circle cx="48" cy="50" r="25" fill="#76b900"/><text x="41" y="58" class="n" fill="#0d241a">1</text><text x="88" y="58" class="h" fill="#b8f34a">정확도</text><text x="30" y="105" class="t" fill="#e3f0e8">□ 같은 모델의 control 비교</text><text x="30" y="140" class="t" fill="#e3f0e8">□ 핵심 KPI 회귀 목록</text><text x="30" y="175" class="t" fill="#e3f0e8">□ join·시간대·NULL fixture</text></g>
    <g transform="translate(365)"><rect width="335" height="210" rx="20" fill="#163a2a" stroke="#6ba785"/><circle cx="48" cy="50" r="25" fill="#76b900"/><text x="41" y="58" class="n" fill="#0d241a">2</text><text x="88" y="58" class="h" fill="#b8f34a">거부·질문</text><text x="30" y="105" class="t" fill="#e3f0e8">□ 답할 수 없는 질문</text><text x="30" y="140" class="t" fill="#e3f0e8">□ clarification 품질</text><text x="30" y="175" class="t" fill="#e3f0e8">□ 유사 지표 몰래 대체 금지</text></g>
    <g transform="translate(730)"><rect width="335" height="210" rx="20" fill="#163a2a" stroke="#6ba785"/><circle cx="48" cy="50" r="25" fill="#76b900"/><text x="41" y="58" class="n" fill="#0d241a">3</text><text x="88" y="58" class="h" fill="#b8f34a">권한·비밀</text><text x="30" y="105" class="t" fill="#e3f0e8">□ role·row 정책 재검증</text><text x="30" y="140" class="t" fill="#e3f0e8">□ 내부 API 외부 노출 차단</text><text x="30" y="175" class="t" fill="#e3f0e8">□ Vault·회전·로그 마스킹</text></g>
    <g transform="translate(0 245)"><rect width="335" height="210" rx="20" fill="#183027" stroke="#557b68"/><circle cx="48" cy="50" r="25" fill="#67d6a0"/><text x="41" y="58" class="n" fill="#0d241a">4</text><text x="88" y="58" class="h" fill="#a7efd0">재현성</text><text x="30" y="105" class="t" fill="#e3f0e8">□ ontology·source version</text><text x="30" y="140" class="t" fill="#e3f0e8">□ model·prompt·SQL 기록</text><text x="30" y="175" class="t" fill="#e3f0e8">□ 결과 차이 원인 추적</text></g>
    <g transform="translate(365 245)"><rect width="335" height="210" rx="20" fill="#183027" stroke="#557b68"/><circle cx="48" cy="50" r="25" fill="#67d6a0"/><text x="41" y="58" class="n" fill="#0d241a">5</text><text x="88" y="58" class="h" fill="#a7efd0">비용·지연</text><text x="30" y="105" class="t" fill="#e3f0e8">□ compile·질의 p95</text><text x="30" y="140" class="t" fill="#e3f0e8">□ model·embedding·rerank</text><text x="30" y="175" class="t" fill="#e3f0e8">□ 사람 검토 시간 포함</text></g>
    <g transform="translate(730 245)"><rect width="335" height="210" rx="20" fill="#183027" stroke="#557b68"/><circle cx="48" cy="50" r="25" fill="#67d6a0"/><text x="41" y="58" class="n" fill="#0d241a">6</text><text x="88" y="58" class="h" fill="#a7efd0">복구·중단</text><text x="30" y="105" class="t" fill="#e3f0e8">□ catalog backup·export</text><text x="30" y="140" class="t" fill="#e3f0e8">□ 이전 인증 모델 rollback</text><text x="30" y="175" class="t" fill="#e3f0e8">□ 승격·중단 조건 명시</text></g>
  </g>
  <rect x="55" y="585" width="1065" height="76" rx="18" fill="#76b900"/><text x="83" y="632" class="h" fill="#0d241a">승격 원칙: snapshot → shadow → 저위험 내부 사용</text>
</svg>
