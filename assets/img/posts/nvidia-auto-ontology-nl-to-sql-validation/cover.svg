  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a12"/><stop offset="1" stop-color="#163b2b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76b900"/><stop offset="1" stop-color="#b8f34a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="95" r="180" fill="#76b900" opacity=".08"/><circle cx="110" cy="570" r="220" fill="#6be6b1" opacity=".06"/>
