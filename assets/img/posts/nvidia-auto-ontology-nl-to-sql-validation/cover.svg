    <path d="m812 122 18 18 38-45" fill="none" stroke="#b8f34a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="890" y="108" width="124" height="10" rx="5" fill="#38644f"/><rect x="890" y="132" width="92" height="10" rx="5" fill="#38644f"/>
