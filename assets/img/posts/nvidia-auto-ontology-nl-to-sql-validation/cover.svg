    <text x="72" y="166" fill="#ffffff" font-size="54" font-weight="800">NVIDIA Auto Ontology</text>
    <text x="72" y="222" fill="#d7e8df" font-size="32" font-weight="600">NL-to-SQL 정확도 검증 기준</text>
  </g>
