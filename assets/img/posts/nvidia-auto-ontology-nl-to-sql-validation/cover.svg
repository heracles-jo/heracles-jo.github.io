    <rect x="355" y="0" width="300" height="170" rx="20" fill="#173629" stroke="#76b900" stroke-width="2"/>
    <text x="383" y="45" fill="#b8f34a" font-size="18">SEMANTIC GRAPH</text><text x="383" y="82" fill="#fff" font-size="25" font-weight="700">Terms · SQL · Relations</text>
    <circle cx="415" cy="125" r="12" fill="#76b900"/><circle cx="505" cy="112" r="12" fill="#6be6b1"/><circle cx="590" cy="137" r="12" fill="#b8f34a"/><path d="M427 123 493 114M517 116l61 17" stroke="#77a990" stroke-width="4"/>
    <path d="M665 85h78" stroke="url(#accent)" stroke-width="8"/><path d="m733 70 22 15-22 15" fill="none" stroke="#b8f34a" stroke-width="8"/>
