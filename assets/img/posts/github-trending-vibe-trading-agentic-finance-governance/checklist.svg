<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">에이전트형 금융 도구 PoC 체크리스트</title>
  <desc id="desc">Vibe-Trading 같은 에이전트형 금융 리서치 도구를 실무에 도입할 때 확인해야 할 데이터, 검증, 보안, 운영, 책임 경계를 체크리스트로 정리한 이미지</desc>
  <rect width="1100" height="520" rx="26" fill="#0f172a"/>
  <circle cx="920" cy="110" r="190" fill="#22c55e" opacity="0.12"/>
  <circle cx="130" cy="440" r="180" fill="#38bdf8" opacity="0.1"/>
  <text x="60" y="62" font-family="Inter,Apple SD Gothic Neo,Pretendard,Arial,sans-serif" font-size="28" font-weight="800" fill="#f8fafc">PoC 전에 반드시 확인할 6가지</text>
  <text x="60" y="96" font-family="Inter,Apple SD Gothic Neo,Pretendard,Arial,sans-serif" font-size="16" fill="#94a3b8">금융 리서치 에이전트는 생산성 도구이면서 동시에 위험 증폭기다. 체크리스트 없는 실험은 운영 리스크가 된다.</text>
  <g font-family="Inter,Apple SD Gothic Neo,Pretendard,Arial,sans-serif" font-size="18" fill="#e2e8f0">
    <g transform="translate(70 140)"><rect width="450" height="70" rx="18" fill="#1e293b" stroke="#334155"/><circle cx="34" cy="35" r="13" fill="#10b981"/><path d="M27 35 l6 7 l13 -17" stroke="#fff" stroke-width="4" fill="none"/><text x="62" y="31" font-weight="700">데이터 출처와 시점 고정</text><text x="62" y="55" font-size="14" fill="#94a3b8">PIT, survivorship bias, 누락값, fallback 순서 문서화</text></g>
    <g transform="translate(580 140)"><rect width="450" height="70" rx="18" fill="#1e293b" stroke="#334155"/><circle cx="34" cy="35" r="13" fill="#10b981"/><path d="M27 35 l6 7 l13 -17" stroke="#fff" stroke-width="4" fill="none"/><text x="62" y="31" font-weight="700">백테스트 재현성</text><text x="62" y="55" font-size="14" fill="#94a3b8">커밋, 파라미터, 수수료, 슬리피지, run card 보관</text></g>
    <g transform="translate(70 235)"><rect width="450" height="70" rx="18" fill="#1e293b" stroke="#334155"/><circle cx="34" cy="35" r="13" fill="#f59e0b"/><path d="M27 35 l6 7 l13 -17" stroke="#fff" stroke-width="4" fill="none"/><text x="62" y="31" font-weight="700">브로커 권한 분리</text><text x="62" y="55" font-size="14" fill="#94a3b8">읽기 전용부터 시작, 주문은 별도 승인과 한도 적용</text></g>
    <g transform="translate(580 235)"><rect width="450" height="70" rx="18" fill="#1e293b" stroke="#334155"/><circle cx="34" cy="35" r="13" fill="#f59e0b"/><path d="M27 35 l6 7 l13 -17" stroke="#fff" stroke-width="4" fill="none"/><text x="62" y="31" font-weight="700">프롬프트와 도구 실행 로그</text><text x="62" y="55" font-size="14" fill="#94a3b8">외부 문서, 웹 검색, 파일 접근의 근거 추적</text></g>
    <g transform="translate(70 330)"><rect width="450" height="70" rx="18" fill="#1e293b" stroke="#334155"/><circle cx="34" cy="35" r="13" fill="#ef4444"/><path d="M27 35 l6 7 l13 -17" stroke="#fff" stroke-width="4" fill="none"/><text x="62" y="31" font-weight="700">손실 제한과 중지 절차</text><text x="62" y="55" font-size="14" fill="#94a3b8">일일 주문·노출·손실 한도, kill switch 리허설</text></g>
    <g transform="translate(580 330)"><rect width="450" height="70" rx="18" fill="#1e293b" stroke="#334155"/><circle cx="34" cy="35" r="13" fill="#ef4444"/><path d="M27 35 l6 7 l13 -17" stroke="#fff" stroke-width="4" fill="none"/><text x="62" y="31" font-weight="700">책임 경계와 규제 검토</text><text x="62" y="55" font-size="14" fill="#94a3b8">투자 조언, 고객 데이터, 내부 통제 범위 명확화</text></g>
  </g>
  <text x="60" y="465" font-family="Inter,Apple SD Gothic Neo,Pretendard,Arial,sans-serif" font-size="15" fill="#94a3b8">권장 순서: 연구 전용 → paper trading → 소액·수동 승인 → 제한된 자동화. 각 단계마다 실패 기준을 먼저 정의한다.</text>
</svg>
