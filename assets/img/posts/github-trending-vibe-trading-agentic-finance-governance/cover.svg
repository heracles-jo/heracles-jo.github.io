<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vibe-Trading과 에이전트형 금융 리서치 거버넌스</title>
  <desc id="desc">GitHub Trending에 오른 Vibe-Trading을 중심으로 자연어 금융 리서치, 백테스트, 브로커 연결, 위험 통제를 하나의 거버넌스 흐름으로 표현한 커버 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="210" fill="#22c55e" opacity="0.13"/>
  <circle cx="170" cy="520" r="230" fill="#38bdf8" opacity="0.12"/>
  <path d="M120 438 C260 330 356 410 480 292 C622 157 747 247 899 146 C1007 75 1087 91 1160 60" fill="none" stroke="#67e8f9" stroke-width="6" opacity="0.42"/>
  <path d="M120 482 C280 460 360 505 510 410 C640 328 755 370 900 290 C1010 228 1090 230 1165 198" fill="none" stroke="#a7f3d0" stroke-width="4" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="92" y="82" width="1016" height="466" rx="34" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.34"/>
    <text x="140" y="158" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="32" fill="#93c5fd" font-weight="700">GitHub Trending Analysis</text>
    <text x="140" y="232" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="54" fill="#f8fafc" font-weight="800">Vibe-Trading</text>
    <text x="140" y="294" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="38" fill="#d1fae5" font-weight="700">에이전트형 금융 리서치의</text>
    <text x="140" y="345" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="38" fill="#d1fae5" font-weight="700">거버넌스 전환점</text>
    <g transform="translate(690 166)">
      <rect x="0" y="0" width="330" height="238" rx="24" fill="#020617" opacity="0.42" stroke="#94a3b8" stroke-opacity="0.35"/>
      <text x="28" y="50" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd" font-weight="700">Research Agent Flow</text>
      <rect x="36" y="78" width="258" height="34" rx="17" fill="#1d4ed8" opacity="0.86"/>
      <text x="60" y="101" font-family="Inter, Arial, sans-serif" font-size="16" fill="#eff6ff">Market data + documents</text>
      <rect x="36" y="128" width="258" height="34" rx="17" fill="#0f766e" opacity="0.9"/>
      <text x="60" y="151" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ecfdf5">Backtest + run card</text>
      <rect x="36" y="178" width="258" height="34" rx="17" fill="#92400e" opacity="0.88"/>
      <text x="60" y="201" font-family="Inter, Arial, sans-serif" font-size="16" fill="#fffbeb">Human approval + limits</text>
    </g>
    <text x="140" y="454" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="22" fill="#cbd5e1">자연어 리서치 · 백테스트 · MCP · 브로커 연결 · 리스크 통제</text>
    <text x="140" y="496" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="18" fill="#94a3b8">확인 시점 스냅샷 기준 공개 GitHub 신호를 바탕으로 한 실무 분석</text>
  </g>
</svg>
