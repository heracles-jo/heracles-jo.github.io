    <rect x="945" y="575" width="145" height="92" rx="15" fill="#0f172a"/>
    <text x="1017" y="610" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Sandbox</text>
    <text x="1017" y="638" text-anchor="middle" fill="#cbd5e1" font-size="16">gVisor / VM</text>
  </g>
