<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Google AX와 Agent Substrate 아키텍처</title>
  <desc id="desc">선언형 리소스가 AX 서버, Redis, 컨트롤러를 지나 Agent Substrate actor와 worker에서 실행되는 구조</desc>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">선언형 API와 실행 데이터면의 분리</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="100" width="1060" height="126" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="136" fill="#075985" font-size="19" font-weight="700">AX RESOURCES</text>
    <g font-size="23" font-weight="700" text-anchor="middle">
      <rect x="105" y="157" width="210" height="48" rx="12" fill="#fff"/><text x="210" y="188" fill="#0f172a">Task</text>
      <rect x="365" y="157" width="210" height="48" rx="12" fill="#fff"/><text x="470" y="188" fill="#0f172a">Workspace</text>
      <rect x="625" y="157" width="210" height="48" rx="12" fill="#fff"/><text x="730" y="188" fill="#0f172a">Gateway</text>
      <rect x="885" y="157" width="210" height="48" rx="12" fill="#fff"/><text x="990" y="188" fill="#0f172a">Model</text>
    </g>
    <path d="M600 226V270" stroke="#475569" stroke-width="4"/><path d="M600 270l-9-15h18z" fill="#475569"/>
    <rect x="150" y="282" width="900" height="180" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="185" y="320" fill="#5b21b6" font-size="19" font-weight="700">AX CONTROL PLANE</text>
    <rect x="200" y="346" width="235" height="78" rx="15" fill="#fff" stroke="#8b5cf6"/>
    <text x="317" y="378" text-anchor="middle" fill="#1e293b" font-size="23" font-weight="700">ax-server</text>
    <text x="317" y="405" text-anchor="middle" fill="#64748b" font-size="17">검증 · gRPC API</text>
    <rect x="485" y="346" width="230" height="78" rx="15" fill="#fff" stroke="#8b5cf6"/>
    <text x="600" y="378" text-anchor="middle" fill="#1e293b" font-size="23" font-weight="700">Redis</text>
    <text x="600" y="405" text-anchor="middle" fill="#64748b" font-size="17">State · Streams</text>
    <rect x="765" y="346" width="235" height="78" rx="15" fill="#fff" stroke="#8b5cf6"/>
    <text x="882" y="378" text-anchor="middle" fill="#1e293b" font-size="23" font-weight="700">ax-controller</text>
    <text x="882" y="405" text-anchor="middle" fill="#64748b" font-size="17">Reconcile · Scale out</text>
    <path d="M435 385H475M715 385H755" stroke="#7c3aed" stroke-width="4"/>
    <path d="M475 385l-12-8v16zM755 385l-12-8v16z" fill="#7c3aed"/>
    <path d="M600 462V506" stroke="#475569" stroke-width="4"/><path d="M600 506l-9-15h18z" fill="#475569"/>
    <rect x="70" y="518" width="1060" height="176" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="105" y="556" fill="#166534" font-size="19" font-weight="700">AGENT SUBSTRATE DATA PLANE</text>
