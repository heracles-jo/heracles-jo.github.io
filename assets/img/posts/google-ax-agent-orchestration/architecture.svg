    <text x="232" y="641" text-anchor="middle" fill="#64748b" font-size="16">Actor → Worker</text>
    <rect x="395" y="585" width="225" height="72" rx="15" fill="#fff" stroke="#22c55e"/>
    <text x="507" y="616" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Snapshot</text>
    <text x="507" y="641" text-anchor="middle" fill="#64748b" font-size="16">Suspend · Resume</text>
    <rect x="670" y="585" width="225" height="72" rx="15" fill="#fff" stroke="#22c55e"/>
    <text x="782" y="616" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Network</text>
