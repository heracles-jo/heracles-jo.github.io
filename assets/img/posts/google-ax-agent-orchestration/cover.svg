    <rect x="920" y="300" width="200" height="158" rx="24" fill="#0f2538" stroke="#fbbf24" stroke-width="3"/>
    <text x="1020" y="350" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="25" font-weight="700">Sandbox</text>
    <text x="1020" y="386" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20">Suspend</text>
    <text x="1020" y="418" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20">Resume</text>
