      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#183d58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="180" fill="#22d3ee" opacity=".08"/>
  <circle cx="110" cy="560" r="230" fill="#8b5cf6" opacity=".1"/>
