    <text x="475" y="401" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Git · MCP · Skills</text>
    <rect x="640" y="320" width="230" height="118" rx="18" fill="#123047" stroke="#34d399" stroke-width="2"/>
