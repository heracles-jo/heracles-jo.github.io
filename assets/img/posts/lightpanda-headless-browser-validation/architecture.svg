<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Lightpanda 브라우저 자동화 아키텍처와 검증 경계</title>
  <desc id="desc">에이전트와 자동화 클라이언트, CDP와 BiDi, Lightpanda의 웹 플랫폼 구현, 외부 웹과 운영 보안 경계를 계층으로 설명한다</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fafc"/><stop offset="1" stop-color="#eaf4f7"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17384b" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#377894"/></marker>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="70" fill="#102f45" font-size="40" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">Lightpanda 도입은 네 개의 계약을 함께 검증해야 한다</text>
  <text x="70" y="112" fill="#527184" font-size="22" font-family="Pretendard, sans-serif">프로토콜 호환만으로 웹 플랫폼 동등성이나 보안 격리가 보장되지는 않는다.</text>

  <g filter="url(#s)" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <rect x="70" y="165" width="1260" height="130" rx="24" fill="#ffffff" stroke="#93b9c9" stroke-width="2"/>
    <text x="105" y="207" fill="#1b536c" font-size="22" font-weight="800">1 · 작업·클라이언트 계약</text>
    <rect x="105" y="228" width="245" height="43" rx="12" fill="#eaf8f2"/><text x="227" y="256" text-anchor="middle" fill="#17604a" font-size="19" font-weight="700">AI Agent / MCP</text>
    <rect x="375" y="228" width="245" height="43" rx="12" fill="#edf5ff"/><text x="497" y="256" text-anchor="middle" fill="#245b92" font-size="19" font-weight="700">Puppeteer</text>
    <rect x="645" y="228" width="245" height="43" rx="12" fill="#edf5ff"/><text x="767" y="256" text-anchor="middle" fill="#245b92" font-size="19" font-weight="700">Playwright</text>
    <rect x="915" y="228" width="245" height="43" rx="12" fill="#edf5ff"/><text x="1037" y="256" text-anchor="middle" fill="#245b92" font-size="19" font-weight="700">chromedp / custom</text>
    <text x="1290" y="256" text-anchor="end" fill="#718997" font-size="17">성공 assertion · timeout · fallback</text>

    <rect x="70" y="345" width="1260" height="130" rx="24" fill="#ffffff" stroke="#7eadd2" stroke-width="2"/>
    <text x="105" y="387" fill="#235f8d" font-size="22" font-weight="800">2 · 제어 프로토콜 계약</text>
    <rect x="105" y="408" width="360" height="43" rx="12" fill="#e8f3ff"/><text x="285" y="436" text-anchor="middle" fill="#205a8d" font-size="19" font-weight="700">Chrome DevTools Protocol</text>
    <rect x="495" y="408" width="300" height="43" rx="12" fill="#eef0ff"/><text x="645" y="436" text-anchor="middle" fill="#4b5291" font-size="19" font-weight="700">WebDriver BiDi</text>
    <rect x="825" y="408" width="300" height="43" rx="12" fill="#e9f8f5"/><text x="975" y="436" text-anchor="middle" fill="#216b5d" font-size="19" font-weight="700">MCP · PandaScript</text>
    <text x="1290" y="436" text-anchor="end" fill="#718997" font-size="17">명령·이벤트 coverage</text>

    <rect x="70" y="525" width="1260" height="185" rx="24" fill="#0f2d3f" stroke="#4e8aa5" stroke-width="2"/>
    <text x="105" y="568" fill="#8ee8bd" font-size="22" font-weight="800">3 · Lightpanda 웹 플랫폼 구현</text>
    <rect x="105" y="594" width="215" height="76" rx="15" fill="#163f4d" stroke="#72e6b1"/><text x="212" y="624" text-anchor="middle" fill="#ecfff6" font-size="20" font-weight="800">V8</text><text x="212" y="650" text-anchor="middle" fill="#a9d8c8" font-size="16">JavaScript</text>
    <rect x="340" y="594" width="215" height="76" rx="15" fill="#17394d" stroke="#63b7df"/><text x="447" y="624" text-anchor="middle" fill="#edf9ff" font-size="20" font-weight="800">libcurl</text><text x="447" y="650" text-anchor="middle" fill="#aed0e1" font-size="16">HTTP · proxy</text>
    <rect x="575" y="594" width="215" height="76" rx="15" fill="#23394d" stroke="#8ab3dd"/><text x="682" y="624" text-anchor="middle" fill="#edf7ff" font-size="20" font-weight="800">html5ever</text><text x="682" y="650" text-anchor="middle" fill="#b8cee1" font-size="16">HTML parser</text>
    <rect x="810" y="594" width="215" height="76" rx="15" fill="#302f4c" stroke="#b5a1f4"/><text x="917" y="624" text-anchor="middle" fill="#f4f0ff" font-size="20" font-weight="800">자체 구현</text><text x="917" y="650" text-anchor="middle" fill="#cdc5ed" font-size="16">DOM · Web API · layout</text>
    <rect x="1045" y="594" width="245" height="76" rx="15" fill="#49333b" stroke="#e69aab"/><text x="1167" y="624" text-anchor="middle" fill="#fff1f4" font-size="20" font-weight="800">호환성 증거</text><text x="1167" y="650" text-anchor="middle" fill="#e6bec7" font-size="16">WPT + 실제 corpus</text>

    <rect x="70" y="760" width="1260" height="90" rx="24" fill="#fff8ed" stroke="#d5a754" stroke-width="2"/>
    <text x="105" y="800" fill="#815916" font-size="22" font-weight="800">4 · 외부 웹과 운영 보안 경계</text>
    <text x="105" y="829" fill="#745f3c" font-size="18">origin allowlist · private network 차단 · robots 정책 · cookie/storage · download · telemetry · core dump · 프로세스/컨테이너 격리</text>
  </g>

  <path d="M700 295v42" stroke="#377894" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 475v42" stroke="#377894" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 710v42" stroke="#377894" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
