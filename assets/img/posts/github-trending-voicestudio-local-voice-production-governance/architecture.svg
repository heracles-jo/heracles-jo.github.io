<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">VoiceStudio 로컬 음성 제작 아키텍처</title>
  <desc id="desc">오디오 입력, 모델 카탈로그, 로컬 백엔드, 작업 큐, 산출물 저장소, API 접근 제어가 분리된 구조</desc>
  <rect width="1100" height="620" rx="26" fill="#0f172a"/>
  <text x="55" y="70" fill="#f8fafc" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="800">로컬 음성 제작 파이프라인을 운영 관점으로 읽기</text>
  <text x="55" y="110" fill="#94a3b8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">VoiceStudio의 가치는 모델 수보다 경계 분리, 재시도, 캐시·권한·산출물 추적에서 결정된다.</text>
  <g font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700">
    <rect x="58" y="174" width="180" height="88" rx="18" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="148" y="210" text-anchor="middle" fill="#ccfbf1">Audio Input</text>
    <text x="148" y="238" text-anchor="middle" fill="#99f6e4" font-size="14">mic · video · SRT</text>
    <rect x="308" y="174" width="190" height="88" rx="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="403" y="210" text-anchor="middle" fill="#dbeafe">Engine Catalogue</text>
    <text x="403" y="238" text-anchor="middle" fill="#bfdbfe" font-size="14">16 TTS · 11 ASR</text>
    <rect x="568" y="174" width="190" height="88" rx="18" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="663" y="210" text-anchor="middle" fill="#f3e8ff">Local Backend</text>
    <text x="663" y="238" text-anchor="middle" fill="#e9d5ff" font-size="14">worker · GPU · CPU</text>
    <rect x="828" y="174" width="190" height="88" rx="18" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="923" y="210" text-anchor="middle" fill="#ffedd5">Output Store</text>
    <text x="923" y="238" text-anchor="middle" fill="#fed7aa" font-size="14">voices · projects · files</text>
  </g>
  <path d="M238 218h70M498 218h70M758 218h70" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8">
    <path d="M663 262v80"/>
    <path d="M403 262v80"/>
  </g>
  <g font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700">
    <rect x="178" y="344" width="230" height="88" rx="18" fill="#111827" stroke="#475569"/>
    <text x="293" y="380" text-anchor="middle" fill="#e2e8f0">Policy Gate</text>
    <text x="293" y="407" text-anchor="middle" fill="#94a3b8" font-size="14">license · consent · quota</text>
    <rect x="468" y="344" width="230" height="88" rx="18" fill="#111827" stroke="#475569"/>
    <text x="583" y="380" text-anchor="middle" fill="#e2e8f0">Job Control</text>
    <text x="583" y="407" text-anchor="middle" fill="#94a3b8" font-size="14">queue · retry · crash isolation</text>
    <rect x="758" y="344" width="230" height="88" rx="18" fill="#111827" stroke="#475569"/>
    <text x="873" y="380" text-anchor="middle" fill="#e2e8f0">Local API</text>
    <text x="873" y="407" text-anchor="middle" fill="#94a3b8" font-size="14">REST · SSE · WebSocket</text>
  </g>
  <rect x="58" y="492" width="984" height="72" rx="18" fill="#020617" stroke="#334155"/>
  <text x="82" y="536" fill="#cbd5e1" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">핵심 질문: “음성이 로컬에 남는가?”뿐 아니라 “모델·권한·작업 실패·산출물 책임을 누가 운영하는가?”</text>
</svg>
