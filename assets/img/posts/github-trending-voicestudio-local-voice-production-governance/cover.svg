      <rect x="412" width="164" height="74" rx="18" fill="#581c87" stroke="#c084fc"/>
      <text x="494" y="45" text-anchor="middle" fill="#f3e8ff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">Dubbing</text>
      <rect x="618" width="164" height="74" rx="18" fill="#7c2d12" stroke="#fb923c"/>
      <text x="700" y="45" text-anchor="middle" fill="#ffedd5" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">Policy</text>
