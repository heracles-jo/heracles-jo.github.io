    <text x="126" y="164" fill="#67e8f9" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700">GitHub Trending Analysis</text>
    <text x="126" y="224" fill="#f8fafc" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="56" font-weight="800">VoiceStudio</text>
    <text x="126" y="280" fill="#e2e8f0" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700">로컬 음성 제작 스택의 운영 경계</text>
    <text x="126" y="334" fill="#cbd5e1" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24">voice cloning · dubbing · dictation · local API · model governance</text>
    <g transform="translate(130 380)">
