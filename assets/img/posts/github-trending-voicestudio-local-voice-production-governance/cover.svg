<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VoiceStudio 로컬 음성 제작 거버넌스</title>
  <desc id="desc">로컬 음성 제작 스택에서 TTS, ASR, 더빙, API, 모델 캐시와 운영 통제가 연결되는 흐름</desc>
  <defs>
