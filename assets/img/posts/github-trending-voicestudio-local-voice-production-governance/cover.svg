      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="92" r="190" fill="#22d3ee" opacity="0.16"/>
  <circle cx="136" cy="548" r="220" fill="#a78bfa" opacity="0.14"/>
