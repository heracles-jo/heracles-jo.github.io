<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 데스크톱 자동화 위험 경계</title>
  <desc id="desc">권한, 개인정보, 오작동, 공급망을 서로 다른 통제로 관리하는 구조</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1524"/><stop offset="1" stop-color="#19273a"/></linearGradient></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f4f8fc" font-family="Arial, sans-serif" font-size="34" font-weight="800">데스크톱 actuator의 네 가지 위험 경계</text>
  <text x="60" y="108" fill="#a8bac9" font-family="Arial, sans-serif" font-size="19">접근성 ref가 정확해도 권한·데이터·부작용·배포 출처는 자동으로 해결되지 않는다.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(65 155)"><rect width="510" height="210" rx="22" fill="#172f43" stroke="#4d728d"/><circle cx="62" cy="58" r="28" fill="#5b8cff"/><text x="62" y="66" text-anchor="middle" fill="white" font-size="24" font-weight="800">1</text><text x="108" y="66" fill="#f4f8fc" font-size="25" font-weight="800">권한·격리</text><text x="35" y="112" fill="#c7d6e0" font-size="19">OS 접근성·화면·elevation 권한</text><text x="35" y="145" fill="#c7d6e0" font-size="19">전용 사용자 · 앱 allowlist · egress</text><rect x="35" y="170" width="430" height="5" rx="3" fill="#5b8cff"/></g>
    <g transform="translate(625 155)"><rect width="510" height="210" rx="22" fill="#173b3d" stroke="#4c817d"/><circle cx="62" cy="58" r="28" fill="#35d0ba"/><text x="62" y="66" text-anchor="middle" fill="#071b1b" font-size="24" font-weight="800">2</text><text x="108" y="66" fill="#f4f8fc" font-size="25" font-weight="800">개인정보·증거</text><text x="35" y="112" fill="#c7dedc" font-size="19">label · value · clipboard · screenshot</text><text x="35" y="145" fill="#c7dedc" font-size="19">최소 로그 · 암호화 · 보존·삭제 검증</text><rect x="35" y="170" width="430" height="5" rx="3" fill="#35d0ba"/></g>
    <g transform="translate(65 405)"><rect width="510" height="210" rx="22" fill="#40312c" stroke="#8b695a"/><circle cx="62" cy="58" r="28" fill="#ffad72"/><text x="62" y="66" text-anchor="middle" fill="#29150a" font-size="24" font-weight="800">3</text><text x="108" y="66" fill="#f4f8fc" font-size="25" font-weight="800">오작동·중복 실행</text><text x="35" y="112" fill="#ead4c8" font-size="19">delivery와 업무 성공을 분리</text><text x="35" y="145" fill="#ead4c8" font-size="19">unsafe retry 금지 · idempotency · 승인</text><rect x="35" y="170" width="430" height="5" rx="3" fill="#ffad72"/></g>
    <g transform="translate(625 405)"><rect width="510" height="210" rx="22" fill="#382d43" stroke="#806694"/><circle cx="62" cy="58" r="28" fill="#c18cff"/><text x="62" y="66" text-anchor="middle" fill="#211028" font-size="24" font-weight="800">4</text><text x="108" y="66" fill="#f4f8fc" font-size="25" font-weight="800">공급망·버전</text><text x="35" y="112" fill="#ded0e8" font-size="19">npm·release artifact · helper 일치</text><text x="35" y="145" fill="#ded0e8" font-size="19">attestation · pin · rollback · 회귀 corpus</text><rect x="35" y="170" width="430" height="5" rx="3" fill="#c18cff"/></g>
  </g>
  <rect x="350" y="650" width="500" height="42" rx="21" fill="#0e2131" stroke="#557188"/><text x="600" y="678" text-anchor="middle" fill="#eef6fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">정확한 ref는 필요한 조건이지만 충분한 안전 조건은 아니다</text>
</svg>
