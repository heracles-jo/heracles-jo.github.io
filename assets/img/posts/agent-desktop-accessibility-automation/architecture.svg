<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">agent-desktop 접근성 기반 실행 아키텍처</title>
  <desc id="desc">에이전트가 운영체제 접근성 트리를 snapshot으로 읽고 ref 행동 뒤 결과를 다시 검증하는 흐름</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081521"/><stop offset="1" stop-color="#102d3d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#5dd8c4"/></marker></defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f5fbff" font-family="Arial, sans-serif" font-size="34" font-weight="800">접근성 트리 기반 observe → act → verify</text>
  <text x="60" y="108" fill="#9db8c7" font-family="Arial, sans-serif" font-size="19">각 단계는 다른 증거를 책임지며, ref 유일성이나 전달 상태를 추측하지 않는다.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 165)"><rect width="205" height="170" rx="20" fill="#16364a" stroke="#4f7084"/><text x="102" y="43" text-anchor="middle" fill="#5dd8c4" font-size="18" font-weight="700">1. AGENT PLAN</text><text x="28" y="84" fill="#eef8fc" font-size="20">목표·허용 앱</text><text x="28" y="116" fill="#eef8fc" font-size="20">위험 등급·승인</text><text x="28" y="148" fill="#91afbf" font-size="16">모델은 루프 바깥</text></g>
    <g transform="translate(300 165)"><rect width="205" height="170" rx="20" fill="#16364a" stroke="#4f7084"/><text x="102" y="43" text-anchor="middle" fill="#5dd8c4" font-size="18" font-weight="700">2. SNAPSHOT</text><text x="26" y="84" fill="#eef8fc" font-size="20">role · name · state</text><text x="26" y="116" fill="#eef8fc" font-size="20">native id · window</text><text x="26" y="148" fill="#91afbf" font-size="16">complete / partial</text></g>
    <g transform="translate(545 165)"><rect width="205" height="170" rx="20" fill="#16364a" stroke="#4f7084"/><text x="102" y="43" text-anchor="middle" fill="#5dd8c4" font-size="18" font-weight="700">3. REF RESOLVE</text><text x="26" y="84" fill="#eef8fc" font-size="20">유일성 재확인</text><text x="26" y="116" fill="#eef8fc" font-size="20">stale / ambiguous</text><text x="26" y="148" fill="#91afbf" font-size="16">불명확하면 거부</text></g>
    <g transform="translate(790 165)"><rect width="160" height="170" rx="20" fill="#16364a" stroke="#4f7084"/><text x="80" y="43" text-anchor="middle" fill="#5dd8c4" font-size="18" font-weight="700">4. ACTION</text><text x="28" y="84" fill="#eef8fc" font-size="20">click · type</text><text x="28" y="116" fill="#eef8fc" font-size="20">select · move</text><text x="28" y="148" fill="#91afbf" font-size="16">OS adapter</text></g>
    <g transform="translate(990 165)"><rect width="155" height="170" rx="20" fill="#16364a" stroke="#4f7084"/><text x="78" y="43" text-anchor="middle" fill="#5dd8c4" font-size="18" font-weight="700">5. VERIFY</text><text x="21" y="84" fill="#eef8fc" font-size="19">delivery</text><text x="21" y="116" fill="#eef8fc" font-size="19">post-state</text><text x="21" y="148" fill="#91afbf" font-size="16">업무 assertion</text></g>
  </g>
  <g stroke="#5dd8c4" stroke-width="5" marker-end="url(#arrow)"><path d="M260 250h35"/><path d="M505 250h35"/><path d="M750 250h35"/><path d="M950 250h35"/></g>
  <g font-family="Arial, sans-serif"><rect x="105" y="410" width="990" height="205" rx="24" fill="#0c2130" stroke="#36576c"/><text x="145" y="455" fill="#f5fbff" font-size="24" font-weight="800">거부와 복구 계약</text><g font-size="19"><rect x="145" y="490" width="260" height="76" rx="14" fill="#402a36"/><text x="168" y="522" fill="#ffb7c5" font-weight="700">STALE_REF</text><text x="168" y="550" fill="#d8c4cc">새 snapshot 후 재선택</text><rect x="435" y="490" width="300" height="76" rx="14" fill="#403728"/><text x="458" y="522" fill="#ffd286" font-weight="700">AMBIGUOUS_TARGET</text><text x="458" y="550" fill="#ddcfb7">추측하지 않고 범위 축소</text><rect x="765" y="490" width="285" height="76" rx="14" fill="#203c3a"/><text x="788" y="522" fill="#7ce5d3" font-weight="700">DELIVERY UNSAFE</text><text x="788" y="550" fill="#c1ddd8">재실행 대신 상태 조회</text></g></g>
  <text x="600" y="665" text-anchor="middle" fill="#8ca9b8" font-family="Arial, sans-serif" font-size="17">도구의 로컬 검증과 애플리케이션·서버의 최종 결과 검증은 별도 계층이다.</text>
</svg>
