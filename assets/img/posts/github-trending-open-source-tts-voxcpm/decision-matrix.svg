<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">VoxCPM 도입 판단</title><desc id="desc">도입 판단 매트릭스</desc><rect width="1200" height="760" fill="#f8fafc"/><rect x="50" y="48" width="1100" height="90" rx="24" fill="#0f172a"/><text x="82" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#e0f2fe">VoxCPM 도입 판단</text><text x="82" y="120" font-family="Arial,sans-serif" font-size="18" fill="#cbd5e1">장점과 리스크를 함께 보는 실무 검토표</text><g font-family="Arial,sans-serif"><rect x="70" y="165" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="203" font-size="23" font-weight="800" fill="#0f172a">내부 교육</text><text x="365" y="200" font-size="18" fill="#166534">다국어 내레이션 자동화</text><text x="365" y="233" font-size="18" fill="#9f1239">음성권·검수 정책 필요</text></g><g font-family="Arial,sans-serif"><rect x="70" y="283" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="321" font-size="23" font-weight="800" fill="#0f172a">AI 에이전트</text><text x="365" y="318" font-size="18" fill="#166534">음성 UX 확장 가능</text><text x="365" y="351" font-size="18" fill="#9f1239">실시간 지연 시간 검증 필요</text></g><g font-family="Arial,sans-serif"><rect x="70" y="401" width="1060" height="96" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="100" y="439" font-size="23" font-weight="800" fill="#0f172a">콘텐츠 제작</text><text x="365" y="436" font-size="18" fill="#166534">프로토타입 속도 향상</text><text x="365" y="469" font-size="18" fill="#9f1239">품질 편차와 라이선스 확인</text></g></svg>