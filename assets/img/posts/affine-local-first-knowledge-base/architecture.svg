<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AFFiNE 로컬 퍼스트 동기화 아키텍처</title>
  <desc id="desc">여러 장치의 로컬 저장, CRDT provider, 협업 서버, PostgreSQL과 blob 저장소 사이의 데이터 흐름</desc>
  <style>text{font-family:Arial,sans-serif}.h{font-size:31px;font-weight:700;fill:#0f172a}.t{font-size:22px;font-weight:700;fill:#0f172a}.s{font-size:17px;fill:#475569}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.local{fill:#ecfeff;stroke:#0891b2;stroke-width:3}.sync{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3}.store{fill:#f0fdf4;stroke:#16a34a;stroke-width:3}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="60" y="62" class="h">로컬 편집이 서버 복구까지 안전하려면 네 계층이 함께 맞아야 한다</text>
  <g>
    <rect x="70" y="130" width="260" height="145" rx="18" class="local"/><text x="200" y="177" text-anchor="middle" class="t">웹·데스크톱</text><text x="200" y="210" text-anchor="middle" class="s">IndexedDB / local store</text><text x="200" y="239" text-anchor="middle" class="s">pending CRDT updates</text>
    <rect x="70" y="430" width="260" height="145" rx="18" class="local"/><text x="200" y="477" text-anchor="middle" class="t">모바일·오프라인 장치</text><text x="200" y="510" text-anchor="middle" class="s">독립 복사본과 캐시</text><text x="200" y="539" text-anchor="middle" class="s">늦은 재접속</text>
    <rect x="465" y="275" width="270" height="160" rx="22" class="sync"/><text x="600" y="326" text-anchor="middle" class="t">CRDT 동기화 계층</text><text x="600" y="360" text-anchor="middle" class="s">doc update · awareness</text><text x="600" y="390" text-anchor="middle" class="s">provider · WebSocket</text>
    <rect x="860" y="115" width="270" height="125" rx="18" class="box"/><text x="995" y="162" text-anchor="middle" class="t">AFFiNE Server</text><text x="995" y="195" text-anchor="middle" class="s">account · workspace · sync</text>
    <rect x="810" y="330" width="170" height="125" rx="18" class="store"/><text x="895" y="378" text-anchor="middle" class="t">PostgreSQL</text><text x="895" y="410" text-anchor="middle" class="s">metadata · 관계</text>
    <rect x="1010" y="330" width="150" height="125" rx="18" class="store"/><text x="1085" y="378" text-anchor="middle" class="t">Storage</text><text x="1085" y="410" text-anchor="middle" class="s">blob · 첨부</text>
    <rect x="845" y="545" width="290" height="120" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="990" y="591" text-anchor="middle" class="t">복구 세트</text><text x="990" y="623" text-anchor="middle" class="s">DB + blob + config + image</text>
    <path d="M330 202 C400 202 405 315 465 335" class="a"/><path d="M330 500 C405 500 405 407 465 385" class="a"/><path d="M735 330 C800 285 820 205 860 185" class="a"/><path d="M995 240 L920 330" class="a"/><path d="M1025 240 L1070 330" class="a"/><path d="M895 455 L955 545" class="a"/><path d="M1085 455 L1025 545" class="a"/>
  </g>
  <rect x="70" y="635" width="650" height="70" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="395" y="665" text-anchor="middle" class="t">검증 포인트</text><text x="395" y="692" text-anchor="middle" class="s">수렴 ≠ 의미 정확성 · 로컬 복사본 ≠ 백업 · DB 복원 ≠ 문서 복구</text>
</svg>
