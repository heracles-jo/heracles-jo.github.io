<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LikeC4 Architecture as Code analysis</title>
  <desc id="desc">코드 저장소와 아키텍처 모델이 연결되어 항상 최신 상태의 C4 다이어그램을 생성하는 흐름을 표현한 커버 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="52%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#e0f2fe" stroke-width="1">
    <path d="M0 110H1200M0 230H1200M0 350H1200M0 470H1200M140 0V630M340 0V630M540 0V630M740 0V630M940 0V630"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="110" y="120" width="270" height="150" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text x="245" y="178" text-anchor="middle" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Repository</text>
    <text x="245" y="220" text-anchor="middle" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="22">services · APIs · domains</text>

    <rect x="465" y="84" width="270" height="222" rx="28" fill="#111827" stroke="#a78bfa" stroke-width="3"/>
    <text x="600" y="146" text-anchor="middle" fill="#f5f3ff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">LikeC4</text>
    <text x="600" y="189" text-anchor="middle" fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="22">architecture model</text>
    <text x="600" y="230" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="20">views · relationships · styles</text>

    <rect x="820" y="120" width="270" height="150" rx="24" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
    <text x="955" y="178" text-anchor="middle" fill="#dcfce7" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Live diagrams</text>
    <text x="955" y="220" text-anchor="middle" fill="#86efac" font-family="Inter,Arial,sans-serif" font-size="22">docs · PR review · portal</text>
  </g>
  <path d="M382 195C420 195 427 195 462 195" stroke="url(#node)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M737 195C775 195 782 195 817 195" stroke="url(#node)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g transform="translate(146 388)">
    <rect width="908" height="118" rx="26" fill="#020617" opacity="0.76" stroke="#64748b"/>
    <text x="454" y="47" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800">Architecture as Code</text>
    <text x="454" y="84" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="23">GitHub Trending으로 보는 최신 아키텍처 문서화 흐름</text>
  </g>
</svg>
