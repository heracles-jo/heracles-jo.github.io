<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 코딩 에이전트의 최소 구현 선택 사다리</title>
  <desc id="desc">요구 이해 후 불필요한 기능을 제거하고 기존 코드, 표준 라이브러리, 네이티브 기능, 기존 의존성을 차례로 확인한 뒤 최소 구현과 안전 검증으로 이어지는 흐름</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8fb"/><stop offset="1" stop-color="#e9f5f1"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" fill="#102a43" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="34" font-weight="800">과잉 구현을 멈추는 선택 사다리</text>
  <text x="64" y="106" fill="#526d82" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="20">해결책을 줄이기 전에 변경 경로와 신뢰 경계를 먼저 이해한다</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" filter="url(#s)">
    <g transform="translate(65 148)"><rect width="300" height="92" rx="18" fill="#ffffff" stroke="#9cb7c9"/><circle cx="42" cy="46" r="25" fill="#193b57"/><text x="42" y="54" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text><text x="82" y="40" fill="#15324a" font-size="21" font-weight="800">필요한가?</text><text x="82" y="68" fill="#60798b" font-size="17">추측한 미래 요구는 보류</text></g>
    <g transform="translate(450 148)"><rect width="300" height="92" rx="18" fill="#ffffff" stroke="#9cb7c9"/><circle cx="42" cy="46" r="25" fill="#205270"/><text x="42" y="54" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text><text x="82" y="40" fill="#15324a" font-size="21" font-weight="800">이미 있는가?</text><text x="82" y="68" fill="#60798b" font-size="17">helper·type·pattern 재사용</text></g>
    <g transform="translate(835 148)"><rect width="300" height="92" rx="18" fill="#ffffff" stroke="#9cb7c9"/><circle cx="42" cy="46" r="25" fill="#23738a"/><text x="42" y="54" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text><text x="82" y="40" fill="#15324a" font-size="21" font-weight="800">표준 기능인가?</text><text x="82" y="68" fill="#60798b" font-size="17">stdlib·DB·브라우저 우선</text></g>
    <g transform="translate(835 310)"><rect width="300" height="92" rx="18" fill="#ffffff" stroke="#7bb9b0"/><circle cx="42" cy="46" r="25" fill="#168276"/><text x="42" y="54" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">4</text><text x="82" y="40" fill="#15324a" font-size="21" font-weight="800">설치돼 있는가?</text><text x="82" y="68" fill="#60798b" font-size="17">새 의존성보다 기존 도구</text></g>
    <g transform="translate(450 310)"><rect width="300" height="92" rx="18" fill="#ffffff" stroke="#70baa4"/><circle cx="42" cy="46" r="25" fill="#0f9270"/><text x="42" y="54" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">5</text><text x="82" y="40" fill="#15324a" font-size="21" font-weight="800">최소 변경</text><text x="82" y="68" fill="#60798b" font-size="17">원인의 공통 경로를 수정</text></g>
    <g transform="translate(65 310)"><rect width="300" height="92" rx="18" fill="#e7faf4" stroke="#2fae85" stroke-width="2"/><circle cx="42" cy="46" r="25" fill="#087f5b"/><text x="42" y="54" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">6</text><text x="82" y="40" fill="#0b5f49" font-size="21" font-weight="800">작은 실행 검증</text><text x="82" y="68" fill="#3e7465" font-size="17">test·lint·acceptance 증거</text></g>
  </g>
  <g fill="none" stroke="#55a6a2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M365 194h68"/><path d="m422 183 13 11-13 11"/><path d="M750 194h68"/><path d="m807 183 13 11-13 11"/><path d="M985 242v51"/><path d="m974 282 11 13 11-13"/><path d="M835 356h-68"/><path d="m778 345-13 11 13 11"/><path d="M450 356h-68"/><path d="m393 345-13 11 13 11"/></g>
  <g transform="translate(65 468)" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <rect width="1070" height="174" rx="22" fill="#102a43"/>
    <text x="34" y="45" fill="#7dd3fc" font-size="18" font-weight="800">줄이면 안 되는 경계</text>
    <g font-size="20" font-weight="700"><text x="34" y="88" fill="#fff">입력 검증</text><text x="215" y="88" fill="#fff">데이터 손실 방지</text><text x="451" y="88" fill="#fff">보안 통제</text><text x="624" y="88" fill="#fff">접근성</text><text x="770" y="88" fill="#fff">명시된 요구사항</text></g>
    <path d="M34 111h1002" stroke="#36556d"/>
    <text x="34" y="145" fill="#b8c9d5" font-size="18">최소화의 목표는 LOC가 아니라 불필요한 선택지·중복·소유 비용이다.</text>
  </g>
</svg>
