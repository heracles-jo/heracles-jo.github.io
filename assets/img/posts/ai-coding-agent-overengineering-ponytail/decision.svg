<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 코딩 최소화 도입 의사결정 매트릭스</title>
  <desc id="desc">과잉 구현 절감 효과와 안전 검증 강도를 두 축으로 나눠 중단, 규칙 개선, 제한 도입, 확대 도입을 결정하는 표</desc>
  <rect width="1200" height="720" rx="28" fill="#0b1727"/>
  <text x="62" y="68" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="34" font-weight="800">PoC 결과로 결정하는 최소화 전략</text>
  <text x="62" y="105" fill="#91a8bb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="20">코드 감소만으로 성공을 선언하지 않는다</text>
  <g transform="translate(182 145)" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <rect width="900" height="480" rx="16" fill="#13263a" stroke="#35516b"/>
    <rect x="450" width="450" height="240" fill="#174d48"/><rect y="240" width="450" height="240" fill="#3e2835"/><rect x="450" y="240" width="450" height="240" fill="#4a3d24"/><rect width="450" height="240" fill="#1c344b"/>
    <path d="M450 0v480M0 240h900" stroke="#6c879c" stroke-width="2"/>
    <g text-anchor="middle"><text x="225" y="66" fill="#9dc7e4" font-size="18" font-weight="800">검증 강함 · 절감 낮음</text><text x="225" y="116" fill="#fff" font-size="29" font-weight="800">규칙을 더 좁게</text><text x="225" y="153" fill="#c1d2df" font-size="18">과잉 구현 task에만 적용</text><text x="225" y="183" fill="#c1d2df" font-size="18">효과 없는 작업은 기본 흐름 유지</text>
    <text x="675" y="66" fill="#91f2db" font-size="18" font-weight="800">검증 강함 · 절감 높음</text><text x="675" y="116" fill="#fff" font-size="29" font-weight="800">제한적으로 확대</text><text x="675" y="153" fill="#cff8ee" font-size="18">버전 고정 · CI gate 유지</text><text x="675" y="183" fill="#cff8ee" font-size="18">review 시간·회귀를 계속 관찰</text>
    <text x="225" y="306" fill="#f1a9be" font-size="18" font-weight="800">검증 약함 · 절감 낮음</text><text x="225" y="356" fill="#fff" font-size="29" font-weight="800">도입 중단</text><text x="225" y="393" fill="#ebcbd4" font-size="18">추가 hook·규칙 비용이 이득 초과</text><text x="225" y="423" fill="#ebcbd4" font-size="18">저장소 기본 규칙으로 복귀</text>
    <text x="675" y="306" fill="#ffd98a" font-size="18" font-weight="800">검증 약함 · 절감 높음</text><text x="675" y="356" fill="#fff" font-size="29" font-weight="800">가장 위험한 구간</text><text x="675" y="393" fill="#f7e7c1" font-size="18">guard·test·접근성 누락 조사</text><text x="675" y="423" fill="#f7e7c1" font-size="18">LOC 성과를 채택하지 말 것</text></g>
  </g>
  <text x="632" y="670" text-anchor="middle" fill="#8fa8ba" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="18">과잉 구현 절감 효과  →</text>
  <text x="62" y="400" transform="rotate(-90 62 400)" text-anchor="middle" fill="#8fa8ba" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="18">안전·정확성 검증 강도  →</text>
</svg>
