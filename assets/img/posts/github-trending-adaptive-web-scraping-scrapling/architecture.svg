<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive scraping architecture</title>
  <desc id="desc">Scrapling 기반 웹 수집 파이프라인의 fetch, parse, adaptive selector, queue, storage, governance 경계를 설명하는 다이어그램</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">적응형 웹 스크래핑 파이프라인의 운영 경계</text>
  <text x="70" y="108" font-family="Arial, sans-serif" font-size="18" fill="#475569">수집 성공률보다 더 중요한 것은 변경 대응, 재시도, 정책 준수, 관측성이다.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="170" width="180" height="110" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text x="104" y="218" font-size="22" font-weight="700" fill="#1e3a8a">Target Web</text>
    <text x="94" y="250" font-size="15" fill="#1e40af">HTML · JS · Anti-bot</text>
    <rect x="330" y="150" width="210" height="150" rx="18" fill="#ecfeff" stroke="#0891b2"/>
    <text x="372" y="198" font-size="22" font-weight="700" fill="#155e75">Fetcher Layer</text>
    <text x="358" y="232" font-size="15" fill="#0e7490">HTTP / browser session</text>
    <text x="358" y="258" font-size="15" fill="#0e7490">TLS fingerprint / retry</text>
    <rect x="620" y="150" width="210" height="150" rx="18" fill="#fef3c7" stroke="#d97706"/>
    <text x="655" y="198" font-size="22" font-weight="700" fill="#92400e">Parser Layer</text>
    <text x="650" y="232" font-size="15" fill="#92400e">DOM navigation</text>
    <text x="650" y="258" font-size="15" fill="#92400e">CSS / XPath extraction</text>
    <rect x="910" y="150" width="220" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="944" y="198" font-size="22" font-weight="700" fill="#5b21b6">Adaptive Match</text>
    <text x="938" y="232" font-size="15" fill="#6d28d9">selector relocation</text>
    <text x="938" y="258" font-size="15" fill="#6d28d9">layout drift tolerance</text>
    <path d="M250 225 H326" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M540 225 H616" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M830 225 H906" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="170" y="420" width="230" height="135" rx="18" fill="#dcfce7" stroke="#16a34a"/>
    <text x="215" y="468" font-size="22" font-weight="700" fill="#166534">Spider &amp; Queue</text>
    <text x="198" y="502" font-size="15" fill="#15803d">concurrency · throttle</text>
    <text x="198" y="528" font-size="15" fill="#15803d">pause / resume</text>
    <rect x="485" y="420" width="230" height="135" rx="18" fill="#fee2e2" stroke="#dc2626"/>
    <text x="540" y="468" font-size="22" font-weight="700" fill="#991b1b">Data Sink</text>
    <text x="520" y="502" font-size="15" fill="#b91c1c">JSONL · lake · search</text>
    <text x="520" y="528" font-size="15" fill="#b91c1c">schema validation</text>
    <rect x="800" y="420" width="250" height="135" rx="18" fill="#f1f5f9" stroke="#475569"/>
    <text x="838" y="468" font-size="22" font-weight="700" fill="#334155">Governance</text>
    <text x="828" y="502" font-size="15" fill="#475569">robots.txt · rate limit</text>
    <text x="828" y="528" font-size="15" fill="#475569">audit · legal review</text>
    <path d="M725 300 C725 365 285 350 285 416" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M400 488 H481" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M715 488 H796" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  </g>
  <rect x="70" y="625" width="1060" height="74" rx="16" fill="#0f172a"/>
  <text x="100" y="670" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0">핵심 판단: 자동 우회 능력보다 정책 준수와 실패 복구 설계가 먼저다.</text>
</svg>
