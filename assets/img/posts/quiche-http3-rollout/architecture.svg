<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">HTTP/3 전환 아키텍처</title>
  <desc id="desc">엔드포인트 발견, UDP QUIC 연결, 엣지의 quiche 처리, 애플리케이션 전달과 HTTP/2 폴백을 계층별로 보여 준다</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f4f8fc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#102a43">HTTP/3는 별도 경로이며 HTTP/2는 정상 폴백이다</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="135" width="210" height="150" rx="18" fill="#fff" stroke="#4f8bc9" stroke-width="3"/>
    <text x="160" y="185" text-anchor="middle" font-size="24" font-weight="700" fill="#173b5f">Client</text>
    <text x="160" y="225" text-anchor="middle" font-size="18" fill="#486581">Alt-Svc / HTTPS RR</text>
    <text x="160" y="253" text-anchor="middle" font-size="18" fill="#486581">endpoint 발견</text>
    <rect x="365" y="110" width="280" height="200" rx="18" fill="#e8fff8" stroke="#11a579" stroke-width="3"/>
    <text x="505" y="160" text-anchor="middle" font-size="24" font-weight="700" fill="#075e49">QUIC / UDP 443</text>
    <text x="505" y="200" text-anchor="middle" font-size="18" fill="#236b59">TLS 1.3 · stream · flow control</text>
    <text x="505" y="232" text-anchor="middle" font-size="18" fill="#236b59">loss recovery · pacing · PMTU</text>
    <text x="505" y="264" text-anchor="middle" font-size="18" fill="#236b59">path validation · migration</text>
    <rect x="745" y="110" width="390" height="200" rx="18" fill="#fff" stroke="#4f8bc9" stroke-width="3"/>
    <text x="940" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#173b5f">Edge / quiche</text>
    <text x="940" y="198" text-anchor="middle" font-size="18" fill="#486581">HTTP/3 frames · QPACK · limits</text>
    <text x="940" y="230" text-anchor="middle" font-size="18" fill="#486581">event loop · timers · UDP I/O는 호스트 책임</text>
    <text x="940" y="262" text-anchor="middle" font-size="18" fill="#486581">metric 집계 · qlog 표본</text>
    <path d="M265 205 H350" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M645 205 H730" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="745" y="405" width="390" height="145" rx="18" fill="#fff7e8" stroke="#d97706" stroke-width="3"/>
    <text x="940" y="453" text-anchor="middle" font-size="24" font-weight="700" fill="#8a4b08">Origin / Application</text>
    <text x="940" y="492" text-anchor="middle" font-size="18" fill="#805b2a">HTTP semantics · 인증 · idempotency</text>
    <text x="940" y="522" text-anchor="middle" font-size="18" fill="#805b2a">backpressure · request lifecycle</text>
    <path d="M940 310 V390" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="55" y="405" width="590" height="145" rx="18" fill="#fff0f0" stroke="#d64545" stroke-width="3"/>
    <text x="350" y="451" text-anchor="middle" font-size="24" font-weight="700" fill="#9b2c2c">QUIC 실패: UDP 차단 · timeout · 인증서 · path 문제</text>
    <text x="350" y="493" text-anchor="middle" font-size="19" fill="#7b3434">HTTP/2 / TCP 443으로 폴백</text>
    <text x="350" y="523" text-anchor="middle" font-size="18" fill="#7b3434">최종 성공뿐 아니라 시도 실패와 추가 지연을 기록</text>
    <path d="M160 285 V390" stroke="#d64545" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#arrow)"/>
    <path d="M645 477 H730" stroke="#d64545" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#arrow)"/>
    <rect x="55" y="610" width="1080" height="62" rx="14" fill="#102a43"/>
    <text x="595" y="650" text-anchor="middle" font-size="21" fill="#fff">운영 관측 단위 = h3 시도 + handshake 결과 + 폴백 시간 + 최종 protocol + 사용자 지연</text>
  </g>
</svg>
