<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tiny11 Builder Windows 11 경량 ISO</title>
  <desc id="desc">공식 Windows ISO를 서비스 가능한 경량 이미지로 변환하면서 업데이트, 보안, 복구 경계를 판단하는 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#142b4a"/>
    </linearGradient>
    <linearGradient id="iso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49b8ff"/>
      <stop offset="1" stop-color="#38e0b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#1b4c78" opacity=".28"/>
  <circle cx="108" cy="570" r="220" fill="#0d685d" opacity=".2"/>
  <g opacity=".12" stroke="#9bdcff">
    <path d="M0 110H1200M0 210H1200M0 310H1200M0 410H1200M0 510H1200"/>
    <path d="M100 0V630M300 0V630M500 0V630M700 0V630M900 0V630M1100 0V630"/>
  </g>
  <g transform="translate(760 132)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="330" rx="42" fill="#0b1e34" stroke="#55c8ff" stroke-width="3"/>
    <g transform="translate(55 55)" fill="url(#iso)">
      <rect width="98" height="98" rx="8"/>
      <rect x="122" width="98" height="98" rx="8"/>
      <rect y="122" width="98" height="98" rx="8"/>
      <rect x="122" y="122" width="98" height="98" rx="8"/>
    </g>
    <path d="M45 274H285" stroke="#b7e7ff" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <path d="M95 296H235" stroke="#3ee0b5" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="82" y="120" fill="#54dcb7" font-size="24" font-weight="700" letter-spacing="3">WINDOWS IMAGE LIFECYCLE</text>
    <text x="80" y="208" fill="#fff" font-size="66" font-weight="800">Tiny11 Builder</text>
    <text x="80" y="284" fill="#d8efff" font-size="44" font-weight="700">경량 ISO의 진짜 기준</text>
    <text x="82" y="350" fill="#9fc0d9" font-size="27">작은 용량보다 중요한 업데이트 · 보안 · 복구</text>
    <g transform="translate(82 416)">
      <rect width="174" height="54" rx="27" fill="#123b58" stroke="#49b8ff"/>
      <text x="87" y="35" text-anchor="middle" fill="#bde8ff" font-size="21" font-weight="700">SERVICEABLE</text>
      <rect x="190" width="146" height="54" rx="27" fill="#123f3b" stroke="#38e0b2"/>
      <text x="263" y="35" text-anchor="middle" fill="#bdf8e9" font-size="21" font-weight="700">VERIFIED</text>
      <rect x="352" width="150" height="54" rx="27" fill="#453027" stroke="#ffb26b"/>
      <text x="427" y="35" text-anchor="middle" fill="#ffd6ad" font-size="21" font-weight="700">RECOVERABLE</text>
    </g>
  </g>
</svg>
