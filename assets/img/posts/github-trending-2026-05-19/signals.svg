<style>.title{font:800 36px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f6fc}.sub{font:500 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8b949e}.h{font:800 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f6fc}.p{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8b949e}</style>
<rect width="1100" height="390" fill="#0d1117"/><text x="80" y="70" class="title">Four signals from today’s trend</text><text x="80" y="100" class="sub">The list is less about one library and more about a changing software interface.</text><rect x="80" y="120" width="440" height="78" rx="18" fill="#161b22" stroke="#2ea043"/><circle cx="114" cy="159" r="12" fill="#2ea043"/><text x="142" y="152" class="h">Agent skills</text><text x="142" y="178" class="p">academic-research-skills, scientific-agent-skills, agent-skills</text><rect x="580" y="120" width="440" height="78" rx="18" fill="#161b22" stroke="#58a6ff"/><circle cx="614" cy="159" r="12" fill="#58a6ff"/><text x="642" y="152" class="h">Agent-native CLI</text><text x="642" y="178" class="p">CLI-Anything turns software into callable interfaces</text><rect x="80" y="225" width="440" height="78" rx="18" fill="#161b22" stroke="#a371f7"/><circle cx="114" cy="264" r="12" fill="#a371f7"/><text x="142" y="257" class="h">Local/on-device AI</text><text x="142" y="283" class="p">openhuman, supertonic, llama.cpp</text><rect x="580" y="225" width="440" height="78" rx="18" fill="#161b22" stroke="#f78166"/><circle cx="614" cy="264" r="12" fill="#f78166"/><text x="642" y="257" class="h">Automation &amp; sensing</text><text x="642" y="283" class="p">CloakBrowser, RuView, Shadowbroker</text></svg>