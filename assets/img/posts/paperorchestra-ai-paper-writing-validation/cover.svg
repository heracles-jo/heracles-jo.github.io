    <path d="M780 345l55-48 45 28 74-56" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="780" cy="345" r="7" fill="#38bdf8"/><circle cx="835" cy="297" r="7" fill="#38bdf8"/><circle cx="880" cy="325" r="7" fill="#38bdf8"/><circle cx="954" cy="269" r="7" fill="#38bdf8"/>
