<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PaperOrchestra 근거 중심 아키텍처</title>
  <desc id="desc">원자료에서 개요, 문헌과 그림, LaTeX 원고, 사람 승인으로 이어지는 계층</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="800" fill="#0f172a">PaperOrchestra: 생성 파이프라인과 검증 경계</text>
  <g font-family="sans-serif" font-size="20" text-anchor="middle">
    <rect x="70" y="145" width="220" height="120" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="180" y="190" font-weight="700" fill="#1e3a8a">Immutable Input</text><text x="180" y="224" fill="#334155">아이디어 · 실험 로그</text><text x="180" y="250" fill="#334155">학회 가이드 · 원본 그림</text>
    <rect x="380" y="145" width="220" height="120" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="490" y="190" font-weight="700" fill="#5b21b6">Outline Agent</text><text x="490" y="225" fill="#334155">outline.json</text>
    <rect x="690" y="105" width="220" height="120" rx="18" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
    <text x="800" y="150" font-weight="700" fill="#155e75">Literature Agent</text><text x="800" y="184" fill="#334155">검색 · 서지 확인</text><text x="800" y="210" fill="#334155">citation map · BibTeX</text>
    <rect x="690" y="275" width="220" height="120" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="800" y="320" font-weight="700" fill="#92400e">Plotting Agent</text><text x="800" y="354" fill="#334155">플롯 · 개념도</text><text x="800" y="380" fill="#334155">비평 · 수정</text>
    <rect x="970" y="190" width="180" height="140" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="1060" y="235" font-weight="700" fill="#166534">Section Writer</text><text x="1060" y="270" fill="#334155">LaTeX 초안</text><text x="1060" y="302" fill="#334155">인용·그림 결합</text>
    <rect x="690" y="475" width="220" height="120" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="800" y="520" font-weight="700" fill="#991b1b">Refinement Agent</text><text x="800" y="555" fill="#334155">최대 3회 수정</text><text x="800" y="582" fill="#334155">compile · PDF</text>
    <rect x="380" y="475" width="220" height="120" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="490" y="515" font-weight="700" fill="#0f172a">Deterministic Gates</text><text x="490" y="550" fill="#334155">인용·숫자·그림 대조</text><text x="490" y="578" fill="#334155">compile · secret scan</text>
    <rect x="70" y="475" width="220" height="120" rx="18" fill="#fae8ff" stroke="#d946ef" stroke-width="2"/>
    <text x="180" y="520" font-weight="700" fill="#86198f">Human Approval</text><text x="180" y="555" fill="#334155">claim-evidence review</text><text x="180" y="582" fill="#334155">저자 승인 · 투고 분리</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)">
    <path d="M290 205H380"/><path d="M600 185L690 165"/><path d="M600 225L690 330"/><path d="M910 165L970 225"/><path d="M910 335L970 295"/><path d="M1060 330C1060 440 930 535 910 535"/><path d="M690 535H600"/><path d="M380 535H290"/>
  </g>
  <rect x="70" y="650" width="1080" height="60" rx="14" fill="#0f172a"/>
  <text x="610" y="689" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">PDF는 결과물이다. 재현성의 원본은 입력 해시 · 검색 기록 · citation map · LaTeX diff · 승인 기록이다.</text>
</svg>
