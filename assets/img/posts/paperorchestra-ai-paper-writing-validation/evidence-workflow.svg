<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 논문 원고 승격 워크플로</title>
  <desc id="desc">생성 초안을 근거, 재현성, 보안, 사람 승인 게이트로 검증하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#475569"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="#0f172a"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="800" fill="#f8fafc">AI 논문 초안을 연구 산출물로 승격하는 5개 게이트</text>
  <g font-family="sans-serif">
    <g transform="translate(70 130)"><rect width="200" height="190" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="3"/><circle cx="100" cy="52" r="27" fill="#3b82f6"/><text x="100" y="61" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">1</text><text x="100" y="105" text-anchor="middle" font-size="23" font-weight="700" fill="#dbeafe">입력 고정</text><text x="100" y="140" text-anchor="middle" font-size="18" fill="#bfdbfe">파일 해시·권한</text><text x="100" y="168" text-anchor="middle" font-size="18" fill="#bfdbfe">model·prompt revision</text></g>
    <g transform="translate(285 130)"><rect width="200" height="190" rx="20" fill="#3b0764" stroke="#c084fc" stroke-width="3"/><circle cx="100" cy="52" r="27" fill="#a855f7"/><text x="100" y="61" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">2</text><text x="100" y="105" text-anchor="middle" font-size="23" font-weight="700" fill="#f3e8ff">주장 대조</text><text x="100" y="140" text-anchor="middle" font-size="18" fill="#e9d5ff">실험 로그 연결</text><text x="100" y="168" text-anchor="middle" font-size="18" fill="#e9d5ff">과장·누락 탐지</text></g>
    <g transform="translate(500 130)"><rect width="200" height="190" rx="20" fill="#164e63" stroke="#22d3ee" stroke-width="3"/><circle cx="100" cy="52" r="27" fill="#06b6d4"/><text x="100" y="61" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">3</text><text x="100" y="105" text-anchor="middle" font-size="23" font-weight="700" fill="#cffafe">인용 검증</text><text x="100" y="140" text-anchor="middle" font-size="18" fill="#a5f3fc">서지 실재성</text><text x="100" y="168" text-anchor="middle" font-size="18" fill="#a5f3fc">claim entailment</text></g>
    <g transform="translate(715 130)"><rect width="200" height="190" rx="20" fill="#713f12" stroke="#fbbf24" stroke-width="3"/><circle cx="100" cy="52" r="27" fill="#f59e0b"/><text x="100" y="61" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">4</text><text x="100" y="105" text-anchor="middle" font-size="23" font-weight="700" fill="#fef3c7">수치·그림 재생</text><text x="100" y="140" text-anchor="middle" font-size="18" fill="#fde68a">source data·code</text><text x="100" y="168" text-anchor="middle" font-size="18" fill="#fde68a">축·단위·caption</text></g>
    <g transform="translate(930 130)"><rect width="200" height="190" rx="20" fill="#14532d" stroke="#4ade80" stroke-width="3"/><circle cx="100" cy="52" r="27" fill="#22c55e"/><text x="100" y="61" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">5</text><text x="100" y="105" text-anchor="middle" font-size="23" font-weight="700" fill="#dcfce7">사람 승인</text><text x="100" y="140" text-anchor="middle" font-size="18" fill="#bbf7d0">evidence bundle</text><text x="100" y="168" text-anchor="middle" font-size="18" fill="#bbf7d0">저자 서명·투고 분리</text></g>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"><path d="M270 225H285"/><path d="M485 225H500"/><path d="M700 225H715"/><path d="M915 225H930"/></g>
  <g font-family="sans-serif">
    <rect x="70" y="390" width="1060" height="245" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="105" y="440" font-size="26" font-weight="700" fill="#f8fafc">Fail closed 조건</text>
    <g font-size="20" fill="#cbd5e1"><text x="110" y="485">• 검색 API 실패나 LaTeX compile 오류가 성공 상태로 보고됨</text><text x="110" y="525">• 존재하는 논문이지만 해당 claim을 지지하지 않는 인용</text><text x="110" y="565">• 원자료 없이 생성된 숫자·표·실험 플롯</text><text x="620" y="485">• preview model·prompt·code revision이 기록되지 않음</text><text x="620" y="525">• embargo 자료나 API key가 외부 로그에 남음</text><text x="620" y="565">• 생성 agent가 최종 투고 권한까지 보유함</text></g>
    <rect x="70" y="660" width="1060" height="50" rx="12" fill="#7f1d1d"/><text x="600" y="693" text-anchor="middle" font-size="21" font-weight="700" fill="#fee2e2">자동화의 완료 조건: PDF 생성이 아니라 근거를 다시 확인하고 재현할 수 있는 상태</text>
  </g>
</svg>
