<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">C++ foundation libraries return to GitHub Trending</title>
  <desc id="desc">Abseil, Catch2, yaml-cpp and Asio mapped as foundational C++ libraries for reliability, testing, configuration and networking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#bfdbfe" stroke-width="2">
    <path d="M90 105h1020M90 205h1020M90 305h1020M90 405h1020M90 505h1020"/>
    <path d="M150 70v500M350 70v500M550 70v500M750 70v500M950 70v500"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="140" y="130" width="920" height="355" rx="30" fill="#020617" opacity="0.84" stroke="#60a5fa" stroke-opacity="0.55"/>
    <rect x="195" y="185" width="190" height="95" rx="20" fill="#2563eb"/>
    <rect x="505" y="185" width="190" height="95" rx="20" fill="#0891b2"/>
    <rect x="815" y="185" width="190" height="95" rx="20" fill="#7c3aed"/>
    <rect x="350" y="345" width="190" height="95" rx="20" fill="#16a34a"/>
    <rect x="660" y="345" width="190" height="95" rx="20" fill="#ea580c"/>
    <g stroke="#dbeafe" stroke-width="5" stroke-linecap="round" opacity="0.86">
      <path d="M385 233h120M695 233h120M445 280v65M755 280v65M540 392h120"/>
    </g>
    <g fill="#f8fafc" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" text-anchor="middle">
      <text x="290" y="224" font-size="30" font-weight="800">Abseil</text>
      <text x="290" y="254" font-size="17">common · API discipline</text>
      <text x="600" y="224" font-size="30" font-weight="800">Catch2</text>
      <text x="600" y="254" font-size="17">tests · CI feedback</text>
      <text x="910" y="224" font-size="30" font-weight="800">yaml-cpp</text>
      <text x="910" y="254" font-size="17">config · serialization</text>
      <text x="445" y="384" font-size="30" font-weight="800">Asio</text>
      <text x="445" y="414" font-size="17">async I/O · networking</text>
      <text x="755" y="384" font-size="30" font-weight="800">C++ Stack</text>
      <text x="755" y="414" font-size="17">long-lived systems</text>
    </g>
  </g>
  <text x="74" y="82" fill="#eff6ff" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="32" font-weight="850">GitHub Trending: C++ Foundation Libraries</text>
  <text x="74" y="586" fill="#bfdbfe" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="22">A signal from mature infrastructure: reliability beats novelty in production C++</text>
