  <text x="70" y="565" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#ffffff">GitHub Trending: NGINX</text>
  <text x="70" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#b7f7dc">AI 시대에도 사라지지 않는 웹 인프라의 기준점</text>
