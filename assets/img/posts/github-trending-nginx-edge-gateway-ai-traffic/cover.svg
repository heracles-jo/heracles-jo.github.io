      <stop offset="0.55" stop-color="#102a2b"/>
      <stop offset="1" stop-color="#0f3f2f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d084"/>
      <stop offset="1" stop-color="#00a86b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="210" fill="#00d084" opacity="0.10"/>
  <circle cx="130" cy="560" r="260" fill="#38bdf8" opacity="0.09"/>
  <g stroke="#8be9c9" stroke-width="3" opacity="0.42" fill="none">
    <path d="M128 150 C250 130 326 234 455 212"/>
    <path d="M126 230 C270 252 335 340 462 318"/>
    <path d="M126 310 C266 376 342 456 463 414"/>
    <path d="M735 196 C850 126 968 140 1068 190"/>
    <path d="M735 316 C852 310 965 306 1068 252"/>
    <path d="M735 426 C850 506 958 476 1068 374"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="455" y="120" width="290" height="390" rx="34" fill="#111827" stroke="#00d084" stroke-width="4"/>
    <path d="M600 174 L705 236 V360 L600 422 L495 360 V236 Z" fill="url(#green)" opacity="0.95"/>
    <path d="M600 220 L660 255 V325 L600 360 L540 325 V255 Z" fill="#102a2b" opacity="0.92"/>
    <text x="600" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#eafff7">Edge Gateway Control Plane</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#e5fff6" font-weight="700">
