  <circle cx="140" cy="220" r="14" fill="#22c55e"/><text x="176" y="228" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">탐지 결과의 좌표계와 원본 해상도를 고정한다.</text><circle cx="140" cy="332" r="14" fill="#22c55e"/><text x="176" y="340" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">tracking과 annotation을 분리해서 검증한다.</text><circle cx="140" cy="444" r="14" fill="#22c55e"/><text x="176" y="452" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">샘플 단위 평가와 배치 단위 평가를 나눠 본다.</text><circle cx="140" cy="556" r="14" fill="#22c55e"/><text x="176" y="564" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">Notebook에서만 되지 말고 파이프라인 코드로 옮긴다.</text><circle cx="140" cy="668" r="14" fill="#22c55e"/><text x="176" y="676" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">성공 사례보다 실패 사례를 시각화한다.</text>
