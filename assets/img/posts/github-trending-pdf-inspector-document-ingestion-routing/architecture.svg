<title id="title">Hybrid PDF ingestion architecture</title><desc id="desc">PDF ingestion pipeline separates cheap structural inspection from expensive OCR and document AI stages.</desc>
<rect width="1200" height="620" fill="#f8fafc"/>
<text x="70" y="70" font-family="Arial" font-size="34" font-weight="800" fill="#0f172a">하이브리드 PDF 수집 파이프라인</text>
