  <rect x="995" y="210" width="150" height="110" rx="18" fill="#e2e8f0"/><text x="1025" y="256" fill="#334155">RAG·검색</text><text x="1018" y="288" fill="#334155" font-size="18">인덱싱</text>
</g>
<g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M250 175h80"/><path d="M580 175 C630 175 640 115 690 115"/><path d="M580 175 C635 185 640 265 690 265"/><path d="M580 175 C635 205 640 415 690 415"/><path d="M910 115 C960 145 965 235 995 255"/><path d="M910 265h85"/><path d="M910 415 C960 385 965 300 995 275"/></g>
