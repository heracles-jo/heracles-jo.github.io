  <rect x="70" y="130" width="180" height="90" rx="18" fill="#dbeafe"/><text x="112" y="183" fill="#1e3a8a">PDF 입력</text>
  <rect x="330" y="120" width="250" height="110" rx="18" fill="#ccfbf1"/><text x="365" y="165" fill="#115e59">pdf-inspector</text><text x="365" y="198" fill="#115e59" font-size="18">샘플링·분류·품질 점수</text>
