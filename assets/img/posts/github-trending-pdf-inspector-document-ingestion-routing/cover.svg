<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PDF Inspector document ingestion routing</title>
  <desc id="desc">Rust PDF inspector classifies text PDFs, scanned PDFs, and mixed pages before routing them to extraction or OCR pipelines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#14345c"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="105" r="180" fill="#2dd4bf" opacity="0.14"/>
  <circle cx="160" cy="560" r="220" fill="#60a5fa" opacity="0.13"/>
  <g filter="url(#shadow)">
    <rect x="96" y="92" width="320" height="410" rx="28" fill="#f8fafc"/>
    <path d="M330 92v105h86" fill="#dbeafe"/>
    <text x="140" y="180" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#0f172a">PDF</text>
    <rect x="140" y="235" width="220" height="18" rx="9" fill="#94a3b8"/>
    <rect x="140" y="276" width="160" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="140" y="317" width="225" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="140" y="358" width="130" height="18" rx="9" fill="#cbd5e1"/>
  </g>
  <g stroke="#e0f2fe" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M440 300h120"/><path d="M540 280l25 20-25 20"/>
    <path d="M760 210h105"/><path d="M842 190l25 20-25 20"/>
    <path d="M760 315h105"/><path d="M842 295l25 20-25 20"/>
    <path d="M760 420h105"/><path d="M842 400l25 20-25 20"/>
  </g>
  <rect x="580" y="190" width="190" height="250" rx="28" fill="#0f172a" stroke="#67e8f9" stroke-width="3" filter="url(#shadow)"/>
  <text x="625" y="260" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Rust</text>
  <text x="610" y="310" font-family="Arial, sans-serif" font-size="26" fill="#bae6fd">classify</text>
  <text x="622" y="350" font-family="Arial, sans-serif" font-size="26" fill="#bae6fd">extract</text>
  <text x="632" y="390" font-family="Arial, sans-serif" font-size="26" fill="#bae6fd">route</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="885" y="160" width="220" height="90" rx="22" fill="#ecfeff"/><text x="930" y="215" font-size="28" fill="#0f766e">Text PDF</text>
    <rect x="885" y="270" width="220" height="90" rx="22" fill="#fff7ed"/><text x="940" y="325" font-size="28" fill="#c2410c">OCR</text>
    <rect x="885" y="380" width="220" height="90" rx="22" fill="#eef2ff"/><text x="928" y="435" font-size="28" fill="#4338ca">Mixed</text>
  </g>
  <text x="90" y="575" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">PDF Inspector와 문서 수집 라우팅</text>
</svg>
