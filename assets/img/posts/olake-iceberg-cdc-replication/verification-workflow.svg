<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OLake CDC 도입 검증 워크플로</title>
  <desc id="desc">관찰, 대조, 장애 주입, 업그레이드 검증과 운영 승격 단계를 나타낸 흐름도</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#fffdf8"/>
  <text x="60" y="72" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="800">처리량 데모를 운영 복제로 승격하는 다섯 단계</text>
  <text x="60" y="108" fill="#6b7280" font-family="Arial, sans-serif" font-size="20">각 단계의 증거가 없으면 다음 권한과 데이터 범위를 열지 않는다.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="170" width="190" height="188" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="112" cy="214" r="22" fill="#0284c7"/><text x="112" y="222" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">1</text>
    <text x="150" y="221" fill="#0c4a6e" font-size="22" font-weight="700">관찰</text>
    <text x="94" y="265" fill="#334155" font-size="17">• 합성·비핵심 table</text>
    <text x="94" y="296" fill="#334155" font-size="17">• full load + CDC</text>
    <text x="94" y="327" fill="#334155" font-size="17">• lag·resource 기록</text>

    <rect x="290" y="170" width="190" height="188" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="332" cy="214" r="22" fill="#16a34a"/><text x="332" y="222" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">2</text>
    <text x="370" y="221" fill="#14532d" font-size="22" font-weight="700">대조</text>
    <text x="314" y="265" fill="#334155" font-size="17">• key별 값·삭제</text>
    <text x="314" y="296" fill="#334155" font-size="17">• 타입·null·시간</text>
    <text x="314" y="327" fill="#334155" font-size="17">• snapshot ledger</text>

    <rect x="510" y="170" width="190" height="188" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="552" cy="214" r="22" fill="#d97706"/><text x="552" y="222" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">3</text>
    <text x="590" y="221" fill="#78350f" font-size="22" font-weight="700">장애 주입</text>
    <text x="534" y="265" fill="#334155" font-size="17">• process·network</text>
    <text x="534" y="296" fill="#334155" font-size="17">• catalog·credential</text>
    <text x="534" y="327" fill="#334155" font-size="17">• 중복·누락 판정</text>

    <rect x="730" y="170" width="190" height="188" rx="22" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <circle cx="772" cy="214" r="22" fill="#9333ea"/><text x="772" y="222" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">4</text>
    <text x="810" y="221" fill="#581c87" font-size="22" font-weight="700">업그레이드</text>
    <text x="754" y="265" fill="#334155" font-size="17">• state migration</text>
    <text x="754" y="296" fill="#334155" font-size="17">• schema evolution</text>
    <text x="754" y="327" fill="#334155" font-size="17">• restore rehearsal</text>

    <rect x="950" y="170" width="190" height="188" rx="22" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <circle cx="992" cy="214" r="22" fill="#e11d48"/><text x="992" y="222" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">5</text>
    <text x="1030" y="221" fill="#881337" font-size="22" font-weight="700">제한 승격</text>
    <text x="974" y="265" fill="#334155" font-size="17">• stream별 SLO</text>
    <text x="974" y="296" fill="#334155" font-size="17">• compaction·보안</text>
    <text x="974" y="327" fill="#334155" font-size="17">• rollback evidence</text>
  </g>

  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M260 264H280"/>
    <path d="M480 264H500"/>
    <path d="M700 264H720"/>
    <path d="M920 264H940"/>
  </g>

  <rect x="70" y="420" width="690" height="246" rx="24" fill="#111827"/>
  <text x="104" y="466" fill="#f9fafb" font-family="Arial, sans-serif" font-size="24" font-weight="700">승격 증거</text>
  <g fill="#e5e7eb" font-family="Arial, sans-serif" font-size="18">
    <text x="104" y="510">✓ LSN · state version · snapshot ID가 같은 run으로 연결됨</text>
    <text x="104" y="548">✓ update·delete·decimal·timestamp 대조가 자동화됨</text>
    <text x="104" y="586">✓ 장애 뒤 재처리 범위와 RPO/RTO를 재현함</text>
    <text x="104" y="624">✓ table maintenance와 secret 회전 책임자가 정해짐</text>
  </g>

  <rect x="790" y="420" width="350" height="246" rx="24" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="824" y="466" fill="#881337" font-family="Arial, sans-serif" font-size="24" font-weight="700">즉시 중단</text>
  <g fill="#4c0519" font-family="Arial, sans-serif" font-size="18">
    <text x="824" y="510">• row count만 같고 값이 다름</text>
    <text x="824" y="548">• state와 commit 순서 불명</text>
    <text x="824" y="586">• downgrade 불가를 사후 발견</text>
    <text x="824" y="624">• secret·host key 통제 실패</text>
  </g>

  <rect x="70" y="700" width="1070" height="34" rx="17" fill="#e2e8f0"/>
  <text x="605" y="724" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="18" font-weight="700">성공률보다 불일치를 탐지하고 설명하는 시간을 운영 KPI로 둔다.</text>
</svg>
