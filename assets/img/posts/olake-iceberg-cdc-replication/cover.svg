<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OLake Iceberg CDC 검증 기준</title>
  <desc id="desc">Postgres 변경 로그가 OLake 처리 계층과 Iceberg snapshot으로 이어지는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#123654"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <g opacity=".16" stroke="#7dd3fc">
    <path d="M0 95H1200M0 190H1200M0 285H1200M0 380H1200M0 475H1200M0 570H1200"/>
    <path d="M120 0V630M300 0V630M480 0V630M660 0V630M840 0V630M1020 0V630"/>
  </g>
  <text x="72" y="102" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="24" font-weight="700">DATA ENGINEERING · APACHE ICEBERG</text>
  <text x="72" y="174" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="800">OLake Iceberg CDC</text>
  <text x="72" y="232" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30" font-weight="600">데이터 복제 정확도·복구 검증 기준</text>
  <g filter="url(#shadow)">
    <rect x="72" y="322" width="250" height="154" rx="22" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>
    <text x="197" y="374" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Postgres WAL</text>
    <text x="197" y="414" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20">LSN · CDC · Schema</text>
    <text x="197" y="448" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20">Source truth</text>
    <rect x="475" y="322" width="250" height="154" rx="22" fill="#0f2942" stroke="#2dd4bf" stroke-width="2"/>
    <text x="600" y="374" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">OLake State</text>
    <text x="600" y="414" text-anchor="middle" fill="#99f6e4" font-family="Arial, sans-serif" font-size="20">Checkpoint · Retry</text>
    <text x="600" y="448" text-anchor="middle" fill="#99f6e4" font-family="Arial, sans-serif" font-size="20">Go → gRPC → Java</text>
    <rect x="878" y="322" width="250" height="154" rx="22" fill="#0f2942" stroke="#a78bfa" stroke-width="2"/>
    <text x="1003" y="374" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Iceberg Snapshot</text>
    <text x="1003" y="414" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="20">Data · Delete · Catalog</text>
    <text x="1003" y="448" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="20">Queryable state</text>
  </g>
  <path d="M334 399H449" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M437 382L460 399 437 416" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M737 399H852" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M840 382L863 399 840 416" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="526" width="1056" height="48" rx="24" fill="#082f49"/>
  <text x="600" y="558" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="21" font-weight="700">처리량보다 LSN · durable state · snapshot의 증거 사슬을 검증한다</text>
