<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OLake CDC와 Iceberg writer 아키텍처</title>
  <desc id="desc">source log, state, Go driver, Java writer, object storage와 catalog의 장애 경계를 표현한 다이어그램</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="800">OLake CDC 파이프라인의 다섯 장애 도메인</text>
  <text x="60" y="108" fill="#475569" font-family="Arial, sans-serif" font-size="20">각 계층의 성공을 따로 기록하고 LSN·state·snapshot을 하나의 실행 ID로 연결한다.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="178" width="190" height="168" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="150" y="220" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="22" font-weight="700">1. Source</text>
    <text x="150" y="258" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="18">Postgres WAL</text>
    <text x="150" y="286" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="18">LSN · Slot · Schema</text>
    <text x="150" y="316" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">원본 변경 순서</text>

    <rect x="280" y="178" width="190" height="168" rx="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="375" y="220" text-anchor="middle" fill="#134e4a" font-family="Arial, sans-serif" font-size="22" font-weight="700">2. State</text>
    <text x="375" y="258" text-anchor="middle" fill="#115e59" font-family="Arial, sans-serif" font-size="18">Checkpoint JSON</text>
    <text x="375" y="286" text-anchor="middle" fill="#115e59" font-family="Arial, sans-serif" font-size="18">Chunk · Cursor · Version</text>
    <text x="375" y="316" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">재시작 기준점</text>

    <rect x="505" y="178" width="190" height="168" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="600" y="220" text-anchor="middle" fill="#78350f" font-family="Arial, sans-serif" font-size="22" font-weight="700">3. Go Driver</text>
    <text x="600" y="258" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="18">Discover · Sync</text>
    <text x="600" y="286" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="18">Batch · Retry · Filter</text>
    <text x="600" y="316" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">처리·오류 전파</text>

    <rect x="730" y="178" width="190" height="168" rx="20" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
    <text x="825" y="220" text-anchor="middle" fill="#701a75" font-family="Arial, sans-serif" font-size="22" font-weight="700">4. Java Writer</text>
    <text x="825" y="258" text-anchor="middle" fill="#86198f" font-family="Arial, sans-serif" font-size="18">gRPC · Arrow</text>
    <text x="825" y="286" text-anchor="middle" fill="#86198f" font-family="Arial, sans-serif" font-size="18">Data · Equality Delete</text>
    <text x="825" y="316" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">파일 생성</text>

    <rect x="955" y="178" width="190" height="168" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1050" y="220" text-anchor="middle" fill="#4c1d95" font-family="Arial, sans-serif" font-size="22" font-weight="700">5. Iceberg</text>
    <text x="1050" y="258" text-anchor="middle" fill="#5b21b6" font-family="Arial, sans-serif" font-size="18">S3 · Manifest</text>
    <text x="1050" y="286" text-anchor="middle" fill="#5b21b6" font-family="Arial, sans-serif" font-size="18">Catalog · Snapshot</text>
    <text x="1050" y="316" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">조회 가능한 상태</text>
  </g>

  <g stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M245 262H270"/>
    <path d="M470 262H495"/>
    <path d="M695 262H720"/>
    <path d="M920 262H945"/>
  </g>

  <rect x="70" y="420" width="1060" height="246" rx="24" fill="#0f172a"/>
  <text x="104" y="468" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">복구 계약에 포함할 correlation</text>
  <g font-family="Arial, sans-serif" font-size="19">
    <circle cx="110" cy="516" r="7" fill="#38bdf8"/><text x="132" y="523" fill="#e2e8f0">source transaction ID와 LSN</text>
    <circle cx="110" cy="558" r="7" fill="#2dd4bf"/><text x="132" y="565" fill="#e2e8f0">state version, stream checkpoint와 마지막 durable 저장 시각</text>
    <circle cx="110" cy="600" r="7" fill="#f59e0b"/><text x="132" y="607" fill="#e2e8f0">writer batch ID, child process 상태와 file hash</text>
    <circle cx="610" cy="516" r="7" fill="#e879f9"/><text x="632" y="523" fill="#e2e8f0">data·delete file과 orphan cleanup 결과</text>
    <circle cx="610" cy="558" r="7" fill="#a78bfa"/><text x="632" y="565" fill="#e2e8f0">Iceberg snapshot ID와 catalog commit 결과</text>
    <circle cx="610" cy="600" r="7" fill="#fb7185"/><text x="632" y="607" fill="#e2e8f0">source 대조 결과와 query engine 가시성 시각</text>
  </g>
  <rect x="70" y="690" width="1060" height="34" rx="17" fill="#dbeafe"/>
  <text x="600" y="714" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="18" font-weight="700">어느 계층이 실패했는지 설명할 수 없으면 exactly-once 주장도 검증할 수 없다.</text>
</svg>
