<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Modern Go 코드 변환 위험 지도</title><desc id="desc">버전 불일치, 의미 변경, 공급망 설치, 검증 누락의 위험과 통제 방법</desc>
  <rect width="1200" height="720" rx="28" fill="#111827"/><text x="60" y="72" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="800">‘현대적’이라는 말이 숨기는 네 가지 실패 모드</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(60 130)"><rect width="510" height="210" rx="22" fill="#3f1d2e" stroke="#fb7185" stroke-width="3"/><text x="28" y="48" fill="#fda4af" font-size="23" font-weight="800">01 버전 불일치</text><text x="28" y="90" fill="#ffe4e6" font-size="18">로컬 toolchain은 최신이지만 모듈 언어 버전은 과거</text><text x="28" y="126" fill="#cbd5e1" font-size="17">결과: 컴파일 불가 문법·API 제안</text><rect x="28" y="154" width="454" height="34" rx="9" fill="#881337"/><text x="255" y="177" text-anchor="middle" fill="white" font-size="16">통제: list --file-path + go.mod 확인</text></g>
    <g transform="translate(630 130)"><rect width="510" height="210" rx="22" fill="#422006" stroke="#f59e0b" stroke-width="3"/><text x="28" y="48" fill="#fcd34d" font-size="23" font-weight="800">02 의미 변경</text><text x="28" y="90" fill="#fef3c7" font-size="18">nil·empty·NaN·cleanup 시점이 before와 달라짐</text><text x="28" y="126" fill="#cbd5e1" font-size="17">결과: 컴파일은 되지만 런타임 계약 회귀</text><rect x="28" y="154" width="454" height="34" rx="9" fill="#92400e"/><text x="255" y="177" text-anchor="middle" fill="white" font-size="16">통제: 경계 테스트 + golden test</text></g>
    <g transform="translate(60 390)"><rect width="510" height="210" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="3"/><text x="28" y="48" fill="#93c5fd" font-size="23" font-weight="800">03 설치 공급망</text><text x="28" y="90" fill="#dbeafe" font-size="18">첫 실행 go install과 사용자 캐시 바이너리</text><text x="28" y="126" fill="#cbd5e1" font-size="17">결과: 네트워크·tag·proxy·캐시 신뢰가 추가됨</text><rect x="28" y="154" width="454" height="34" rx="9" fill="#1e40af"/><text x="255" y="177" text-anchor="middle" fill="white" font-size="16">통제: 버전 고정 + 내부 mirror + 승인</text></g>
    <g transform="translate(630 390)"><rect width="510" height="210" rx="22" fill="#13312b" stroke="#34d399" stroke-width="3"/><text x="28" y="48" fill="#6ee7b7" font-size="23" font-weight="800">04 검증 누락</text><text x="28" y="90" fill="#d1fae5" font-size="18">스킬 결과를 컴파일러·분석기처럼 자동 승인</text><text x="28" y="126" fill="#cbd5e1" font-size="17">결과: 장식적 현대화와 리뷰 부채</text><rect x="28" y="154" width="454" height="34" rx="9" fill="#047857"/><text x="255" y="177" text-anchor="middle" fill="white" font-size="16">통제: go fix -diff + test + benchmark</text></g>
  </g>
  <text x="60" y="664" fill="#94a3b8" font-family="Arial,sans-serif" font-size="19">결론: 스킬은 지식 어댑터다. 최종 판정자는 Go toolchain과 실행 증거다.</text>
</svg>
