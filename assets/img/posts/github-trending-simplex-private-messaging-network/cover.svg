<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SimpleX private messaging network analysis</title>
  <desc id="desc">A network diagram showing pairwise queues and no global user identifiers for private messaging architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10243e"/>
      <stop offset="1" stop-color="#0d3b44"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#9ee7ff" stroke-width="1">
    <path d="M90 120 C260 70 380 190 520 130 S830 80 1080 170" fill="none"/>
    <path d="M140 505 C340 390 460 560 660 430 S930 360 1100 480" fill="none"/>
    <path d="M230 80 L910 555"/><path d="M1040 90 L290 560"/>
  </g>
  <text x="72" y="92" fill="#9ee7ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">GitHub Trending Analysis</text>
  <text x="72" y="170" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">SimpleX와</text>
  <text x="72" y="238" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">식별자 없는 메시징</text>
  <text x="75" y="292" fill="#c7d7e8" font-family="Inter,Arial,sans-serif" font-size="24">전역 ID 대신 pairwise queue로 메타데이터 노출면을 줄이는 설계</text>
  <g transform="translate(690 110)" filter="url(#glow)">
    <circle cx="70" cy="70" r="34" fill="#4fd1c5"/><circle cx="295" cy="75" r="34" fill="#60a5fa"/><circle cx="185" cy="250" r="34" fill="#f59e0b"/><circle cx="385" cy="285" r="34" fill="#a78bfa"/>
    <g stroke="#d9fbff" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M104 72 C150 54 205 53 261 72"/><path d="M286 109 C260 157 225 196 196 219"/><path d="M216 263 C267 279 319 284 351 286"/><path d="M83 103 C110 162 141 205 166 229"/>
    </g>
    <g fill="#07111f" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" text-anchor="middle">
      <text x="70" y="78">A</text><text x="295" y="83">B</text><text x="185" y="258">Q</text><text x="385" y="293">R</text>
    </g>
    <rect x="10" y="350" width="470" height="70" rx="18" fill="rgba(255,255,255,0.09)" stroke="#6ee7f9"/>
    <text x="245" y="393" fill="#e8fbff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">No global user identifier</text>
  </g>
  <text x="72" y="548" fill="#91a7bd" font-family="Inter,Arial,sans-serif" font-size="20">Snapshot: 2026-06-29 KST · SimpleX / Signal / Matrix 비교</text>
</svg>
