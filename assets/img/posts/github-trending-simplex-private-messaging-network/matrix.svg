<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Private messaging trade-off matrix</title><desc id="desc">A comparison matrix contrasting Signal, Matrix, Session and SimpleX across identifier model, metadata exposure and operating complexity.</desc>
<rect width="1100" height="520" rx="30" fill="#101827"/>
<text x="56" y="65" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#f8fafc">프라이버시 메시징 도입 판단 매트릭스</text>
<g font-family="Inter,Arial,sans-serif" font-size="18">
<rect x="55" y="105" width="990" height="66" rx="16" fill="#1e293b"/><text x="105" y="146" fill="#cbd5e1" font-weight="800">도구</text><text x="285" y="146" fill="#cbd5e1" font-weight="800">식별자 모델</text><text x="535" y="146" fill="#cbd5e1" font-weight="800">강점</text><text x="785" y="146" fill="#cbd5e1" font-weight="800">운영 부담</text>
<g fill="#0f172a"><rect x="55" y="185" width="990" height="62" rx="14" fill="#e0f2fe"/><rect x="55" y="258" width="990" height="62" rx="14" fill="#dcfce7"/><rect x="55" y="331" width="990" height="62" rx="14" fill="#fef3c7"/><rect x="55" y="404" width="990" height="62" rx="14" fill="#ede9fe"/></g>
<g fill="#0f172a" font-size="17"><text x="105" y="222" font-weight="850">Signal</text><text x="285" y="222">전화번호·계정 기반</text><text x="535" y="222">대중성, UX, E2EE</text><text x="785" y="222">서버 신뢰·계정 정책</text><text x="105" y="295" font-weight="850">Matrix</text><text x="285" y="295">연합 계정·홈서버</text><text x="535" y="295">상호운용, 조직 제어</text><text x="785" y="295">연합 메타데이터·관리 복잡도</text><text x="105" y="368" font-weight="850">Session</text><text x="285" y="368">공개키 ID</text><text x="535" y="368">전화번호 제거, 익명성 지향</text><text x="785" y="368">네트워크 의존성·생태계 규모</text><text x="105" y="441" font-weight="850">SimpleX</text><text x="285" y="441">전역 ID 없음, pairwise queue</text><text x="535" y="441">관계 그래프 노출 최소화</text><text x="785" y="441">초대·복구·라우터 운영 판단</text></g>
</g></svg>