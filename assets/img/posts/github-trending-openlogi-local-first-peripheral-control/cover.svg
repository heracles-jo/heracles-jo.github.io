      <rect x="570" y="318" width="450" height="62" rx="16" fill="#0b1826" opacity="0.62"/>
      <text x="596" y="358">TOML config · CLI · profiles</text>
      <rect x="570" y="398" width="450" height="62" rx="16" fill="#0b1826" opacity="0.62"/>
      <text x="596" y="438">No account · no telemetry · cross-platform</text>
