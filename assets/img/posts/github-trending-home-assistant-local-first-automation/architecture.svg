<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Home Assistant architecture layers</title>
  <desc id="desc">Home Assistant Core connects integrations, event bus, automations, local protocols, dashboards, and optional cloud services.</desc>
  <rect width="1100" height="620" rx="28" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Home Assistant 로컬 우선 아키텍처</text>
  <g font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <rect x="410" y="135" width="280" height="95" rx="20" fill="#0ea5e9"/>
    <text x="550" y="175" fill="white" font-weight="700">Home Assistant Core</text>
    <text x="550" y="205" fill="#e0f2fe" font-size="17">상태 머신 · 이벤트 버스 · 서비스</text>
    <rect x="110" y="310" width="230" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="225" y="348" fill="#14532d" font-weight="700">Integrations</text>
    <text x="225" y="377" fill="#166534" font-size="17">기기·API 어댑터</text>
    <rect x="435" y="310" width="230" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="550" y="348" fill="#3b0764" font-weight="700">Automation</text>
    <text x="550" y="377" fill="#5b21b6" font-size="17">트리거·조건·액션</text>
    <rect x="760" y="310" width="230" height="90" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <text x="875" y="348" fill="#7c2d12" font-weight="700">Dashboard & API</text>
    <text x="875" y="377" fill="#9a3412" font-size="17">운영 UI·외부 연동</text>
    <rect x="120" y="485" width="860" height="70" rx="18" fill="#e2e8f0"/>
    <text x="550" y="529" fill="#334155" font-weight="700">로컬 네트워크: Matter · Zigbee · Z-Wave · MQTT · IP Camera · Energy</text>
  </g>
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
    <path d="M480 230 C400 265 300 285 225 310"/>
    <path d="M550 230 V310"/>
    <path d="M620 230 C700 265 800 285 875 310"/>
    <path d="M225 400 V485"/>
    <path d="M550 400 V485"/>
    <path d="M875 400 V485"/>
