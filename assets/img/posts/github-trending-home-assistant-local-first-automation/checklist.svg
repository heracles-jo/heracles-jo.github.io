<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Adoption checklist matrix</title>
  <desc id="desc">A decision matrix for adopting local-first automation: device coverage, security, reliability, data governance, and operations.</desc>
  <rect width="1100" height="560" rx="28" fill="#0f172a"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">PoC 체크리스트: 로컬 자동화 플랫폼 도입 기준</text>
  <g font-family="Arial, sans-serif" font-size="22">
    <rect x="70" y="120" width="960" height="360" rx="22" fill="#111827" stroke="#334155"/>
    <g fill="#e2e8f0" font-weight="700">
      <text x="110" y="170">평가 축</text><text x="430" y="170">핵심 질문</text><text x="830" y="170">판정</text>
    </g>
    <g stroke="#334155"><path d="M90 195 H1010"/><path d="M90 265 H1010"/><path d="M90 335 H1010"/><path d="M90 405 H1010"/><path d="M360 135 V460"/><path d="M780 135 V460"/></g>
    <g fill="#cbd5e1">
      <text x="110" y="235">기기·프로토콜</text><text x="395" y="235">Matter/Zigbee/MQTT/벤더 API 의존도는?</text><text x="820" y="235" fill="#67e8f9">현장 목록화</text>
      <text x="110" y="305">보안 경계</text><text x="395" y="305">관리자 권한·원격 접속·시크릿 보관은?</text><text x="820" y="305" fill="#fbbf24">분리 필요</text>
      <text x="110" y="375">운영 안정성</text><text x="395" y="375">장애 시 수동 우회와 백업 복구는?</text><text x="820" y="375" fill="#86efac">런북 필수</text>
      <text x="110" y="445">데이터 거버넌스</text><text x="395" y="445">센서·영상·재실 데이터 보존 정책은?</text><text x="820" y="445" fill="#fca5a5">사전 합의</text>
    </g>
  </g>
</svg>
