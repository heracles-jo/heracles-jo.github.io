<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vaultwarden 셀프호스팅 비밀번호 관리</title>
  <desc id="desc">클라이언트 암호화, Vaultwarden 서버, 백업과 운영 책임의 경계를 표현한 커버 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#123a5a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="190" fill="#21a3d8" opacity=".12"/><circle cx="150" cy="580" r="250" fill="#55d6be" opacity=".08"/>
  <text x="80" y="110" fill="#63d8ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">SECURITY · SELF HOSTING</text>
  <text x="80" y="185" fill="#fff" font-family="system-ui,sans-serif" font-size="52" font-weight="800">Vaultwarden 셀프호스팅</text>
  <text x="80" y="245" fill="#d9eff8" font-family="system-ui,sans-serif" font-size="34" font-weight="650">비밀번호 관리의 통제권과 운영 책임</text>
  <g filter="url(#shadow)">
    <rect x="80" y="330" width="280" height="160" rx="24" fill="#102f48" stroke="#63d8ff" stroke-width="2"/>
    <text x="220" y="390" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="27" font-weight="700">클라이언트</text>
    <text x="220" y="432" text-anchor="middle" fill="#a8dff2" font-family="system-ui,sans-serif" font-size="21">암호화 · 복호화</text>
    <rect x="460" y="310" width="280" height="200" rx="28" fill="#0e5b78" stroke="#7de7ff" stroke-width="3"/>
    <path d="M573 383v-22a27 27 0 0 1 54 0v22" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <rect x="560" y="380" width="80" height="70" rx="12" fill="#fff"/>
    <circle cx="600" cy="411" r="9" fill="#0e5b78"/><path d="M600 420v15" stroke="#0e5b78" stroke-width="7"/>
    <text x="600" y="485" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="25" font-weight="750">VAULTWARDEN</text>
    <rect x="840" y="330" width="280" height="160" rx="24" fill="#102f48" stroke="#55d6be" stroke-width="2"/>
    <text x="980" y="390" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="27" font-weight="700">복구 경계</text>
    <text x="980" y="432" text-anchor="middle" fill="#a7e8dc" font-family="system-ui,sans-serif" font-size="21">백업 · 패치 · TLS</text>
  </g>
  <path d="M370 410h75" stroke="#63d8ff" stroke-width="5" stroke-linecap="round"/><path d="m430 395 18 15-18 15" fill="none" stroke="#63d8ff" stroke-width="5"/>
  <path d="M750 410h75" stroke="#55d6be" stroke-width="5" stroke-linecap="round"/><path d="m810 395 18 15-18 15" fill="none" stroke="#55d6be" stroke-width="5"/>
  <text x="80" y="570" fill="#9bc5d5" font-family="system-ui,sans-serif" font-size="22">호환성 · 보안 공지 · 복원 리허설로 판단하는 도입 기준</text>
