<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">모바일 테스트 실행 환경 선택 매트릭스</title><desc id="desc">Xcode Simulator, 실기기 팜, vphone-cli를 재현성, 하드웨어 충실도, 호스트 보안 비용으로 비교한다</desc><rect width="1200" height="700" rx="28" fill="#0b1324"/><text x="60" y="65" fill="white" font-family="system-ui,sans-serif" font-size="34" font-weight="800">모바일 테스트 환경: 하나가 다른 둘을 대체하지 않는다</text><g font-family="system-ui,sans-serif"><text x="260" y="130" text-anchor="middle" fill="#94a3b8" font-size="18">낮음</text><text x="1000" y="130" text-anchor="middle" fill="#94a3b8" font-size="18">높음</text><path d="M260 150H1000" stroke="#475569" stroke-width="3"/><path d="M990 140L1010 150L990 160" fill="#475569"/><text x="630" y="120" text-anchor="middle" fill="#cbd5e1" font-size="19">실제 하드웨어 충실도</text>
<rect x="90" y="190" width="310" height="360" rx="24" fill="#12233e" stroke="#38bdf8" stroke-width="3"/><text x="245" y="240" text-anchor="middle" fill="#bae6fd" font-size="25" font-weight="700">Xcode Simulator</text><text x="125" y="295" fill="#e2e8f0" font-size="18">✓ 공식 개발 경로</text><text x="125" y="335" fill="#e2e8f0" font-size="18">✓ 빠른 생성과 초기화</text><text x="125" y="375" fill="#e2e8f0" font-size="18">✓ PR 회귀 테스트</text><text x="125" y="430" fill="#fca5a5" font-size="18">△ 하드웨어 경로 차이</text><rect x="125" y="470" width="240" height="48" rx="12" fill="#0c4a6e"/><text x="245" y="501" text-anchor="middle" fill="white" font-size="17" font-weight="700">기본 선택</text>
<rect x="445" y="190" width="310" height="360" rx="24" fill="#211b36" stroke="#a78bfa" stroke-width="3"/><text x="600" y="240" text-anchor="middle" fill="#ddd6fe" font-size="25" font-weight="700">vphone-cli</text><text x="480" y="295" fill="#e2e8f0" font-size="18">✓ VM 복제와 재현</text><text x="480" y="335" fill="#e2e8f0" font-size="18">✓ 펌웨어 수준 연구</text><text x="480" y="375" fill="#e2e8f0" font-size="18">✓ 자동 제어 소켓</text><text x="480" y="430" fill="#fca5a5" font-size="18">! SIP·AMFI 완화</text><rect x="480" y="470" width="240" height="48" rx="12" fill="#4c1d95"/><text x="600" y="501" text-anchor="middle" fill="white" font-size="17" font-weight="700">격리된 연구 전용</text>
<rect x="800" y="190" width="310" height="360" rx="24" fill="#123027" stroke="#34d399" stroke-width="3"/><text x="955" y="240" text-anchor="middle" fill="#a7f3d0" font-size="25" font-weight="700">실기기 팜</text><text x="835" y="295" fill="#e2e8f0" font-size="18">✓ 센서·성능·APNs</text><text x="835" y="335" fill="#e2e8f0" font-size="18">✓ 실제 배포 경로</text><text x="835" y="375" fill="#e2e8f0" font-size="18">✓ 출시 최종 게이트</text><text x="835" y="430" fill="#fbbf24" font-size="18">△ 비용과 장비 운영</text><rect x="835" y="470" width="240" height="48" rx="12" fill="#065f46"/><text x="955" y="501" text-anchor="middle" fill="white" font-size="17" font-weight="700">하드웨어 진실 검증</text>
<rect x="90" y="595" width="1020" height="60" rx="15" fill="#1e293b"/><text x="600" y="632" text-anchor="middle" fill="#f8fafc" font-size="20">PR은 Simulator → 특수 연구는 격리된 vphone-cli → 출시는 실기기로 교차 검증</text></g></svg>
