<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Codex Security 스캔과 검증 아키텍처</title>
  <desc id="desc">범위 고정에서 스캔, 검증, 패치, 수정 확인과 CI 판정으로 이어지는 상태 전이</desc>
  <rect width="1200" height="790" rx="24" fill="#081a23"/>
  <style>.h{font:700 30px Arial,sans-serif;fill:#fff}.t{font:700 21px Arial,sans-serif;fill:#edf8ff}.s{font:16px Arial,sans-serif;fill:#afc6d2}.box{fill:#112c3a;stroke:#4b7588;stroke-width:2}.good{fill:#123a34;stroke:#55dcb9;stroke-width:2}.work{fill:#26344d;stroke:#7ba7ff;stroke-width:2}.warn{fill:#3d3022;stroke:#f1b35f;stroke-width:2}.risk{fill:#3c2530;stroke:#f27c98;stroke-width:2}.line{stroke:#79a9ca;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#f1b35f;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#b)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#79a9ca"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f1b35f"/></marker></defs>
  <text x="55" y="58" class="h">Codex Security: 발견·수정·배포 판정을 분리한다</text>
  <rect x="55" y="100" width="270" height="135" rx="18" class="box"/><text x="85" y="148" class="t">1. 범위 고정</text><text x="85" y="181" class="s">repository · paths · diff</text><text x="85" y="211" class="s">base/head SHA · exclusions</text>
  <path d="M325 168h75" class="line"/>
  <rect x="405" y="85" width="345" height="165" rx="18" class="work"/><text x="435" y="132" class="t">2. Standard / Deep Scan</text><text x="435" y="166" class="s">discovery · repeated workers</text><text x="435" y="197" class="s">finding merge · deduplication</text><text x="435" y="228" class="s">cost · time · resume state</text>
  <path d="M750 168h75" class="line"/>
  <rect x="830" y="100" width="315" height="135" rx="18" class="good"/><text x="860" y="148" class="t">3. Validate</text><text x="860" y="181" class="s">source evidence · verdict</text><text x="860" y="211" class="s">coverage limits · severity</text>
  <path d="M987 235v80" class="line"/>
  <rect x="830" y="320" width="315" height="145" rx="18" class="warn"/><text x="860" y="368" class="t">4. Patch</text><text x="860" y="402" class="s">finding 하나에 대한 쓰기 작업</text><text x="860" y="433" class="s">diff · regression test · approval</text>
  <path d="M830 392H690" class="line"/>
  <rect x="370" y="320" width="315" height="145" rx="18" class="good"/><text x="400" y="368" class="t">5. Verify Fix</text><text x="400" y="402" class="s">fixed · still vulnerable</text><text x="400" y="433" class="s">inconclusive + missing evidence</text>
  <path d="M527 465v85" class="line"/>
  <rect x="255" y="555" width="545" height="155" rx="18" class="box"/><text x="285" y="603" class="t">6. CI 판정</text><text x="285" y="637" class="s">scan status + 현재 SHA + scope receipt + SARIF</text><text x="285" y="668" class="s">runtime failure와 stale check는 finding 0건과 다르다</text><text x="285" y="699" class="s">검증된 severity 정책만 merge 차단에 사용</text>
  <rect x="835" y="555" width="310" height="155" rx="18" class="risk"/><text x="865" y="603" class="t">실패 모드</text><text x="865" y="637" class="s">base 변경 후 stale success</text><text x="865" y="668" class="s">refusal을 안전으로 오해</text><text x="865" y="699" class="s">config가 scanner 권한 변경</text>
  <path d="M830 168C700 285 700 570 830 625" class="dash"/>
</svg>
