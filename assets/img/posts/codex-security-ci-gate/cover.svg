<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Codex Security CI 도입 기준</title>
  <desc id="desc">AI 취약점 발견, 검증, 패치 확인과 CI 신선도 게이트를 표현한 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a22"/><stop offset="1" stop-color="#183346"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58e0bd"/><stop offset="1" stop-color="#7ba7ff"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <g opacity=".16" stroke="#8fcbd1" fill="none"><path d="M60 105h1080M60 525h1080"/><path d="M1010 70v490M960 120h100M960 510h100"/></g>
  <g transform="translate(78 82)">
    <rect width="1044" height="466" rx="28" fill="#102735" stroke="#356075" stroke-width="2"/>
    <text x="50" y="68" fill="#a9c9d7" font-family="Arial,sans-serif" font-size="25" font-weight="700">CODEX SECURITY · CI GATE</text>
    <text x="50" y="142" fill="#ffffff" font-family="Arial,sans-serif" font-size="48" font-weight="800">AI 취약점 스캔을</text>
    <text x="50" y="204" fill="url(#accent)" font-family="Arial,sans-serif" font-size="48" font-weight="800">언제 merge 게이트로 쓸 수 있을까</text>
    <g transform="translate(50 264)" font-family="Arial,sans-serif">
      <rect width="205" height="108" rx="18" fill="#173140" stroke="#58e0bd"/><text x="25" y="43" fill="#dffdf5" font-size="22" font-weight="700">Scope</text><text x="25" y="76" fill="#aac3cf" font-size="17">diff · paths · SHA</text>
      <rect x="225" width="205" height="108" rx="18" fill="#173140" stroke="#7ba7ff"/><text x="250" y="43" fill="#e6edff" font-size="22" font-weight="700">Validate</text><text x="250" y="76" fill="#aac3cf" font-size="17">finding · evidence</text>
      <rect x="450" width="205" height="108" rx="18" fill="#173140" stroke="#f2b35f"/><text x="475" y="43" fill="#fff1db" font-size="22" font-weight="700">Verify Fix</text><text x="475" y="76" fill="#aac3cf" font-size="17">fixed · inconclusive</text>
      <rect x="675" width="205" height="108" rx="18" fill="#173140" stroke="#f37d99"/><text x="700" y="43" fill="#ffe7ed" font-size="22" font-weight="700">Freshness</text><text x="700" y="76" fill="#aac3cf" font-size="17">head · base · receipt</text>
    </g>
    <text x="50" y="422" fill="#b7ced8" font-family="Arial,sans-serif" font-size="20">발견 수보다 현재 범위·실패 상태·수정 증거를 먼저 고정한다</text>
  </g>
</svg>
