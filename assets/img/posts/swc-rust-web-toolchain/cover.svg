<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SWC and the Rust web toolchain</title>
  <desc id="desc">A layered diagram showing TypeScript and JavaScript source code flowing into SWC, Rust compiler internals, bundler integration, and production build pipelines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="170" fill="#38bdf8" opacity="0.12"/>
  <circle cx="170" cy="540" r="230" fill="#22c55e" opacity="0.11"/>
  <text x="70" y="96" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="32" fill="#bae6fd" font-weight="700">GitHub Trending Analysis</text>
  <text x="70" y="168" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="64" fill="#f8fafc" font-weight="800">SWC와 Rust 웹 툴체인</text>
  <text x="72" y="220" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="28" fill="#dbeafe">TypeScript/JavaScript 빌드 병목을 재설계하는 실무 관점</text>
  <g filter="url(#shadow)">
    <rect x="90" y="300" width="210" height="120" rx="24" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="195" y="350" text-anchor="middle" font-family="Inter, Arial" font-size="24" fill="#e0f2fe" font-weight="700">TS / JS</text>
    <text x="195" y="386" text-anchor="middle" font-family="Inter, Arial" font-size="18" fill="#93c5fd">parser input</text>
    <path d="M315 360H450" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <rect x="465" y="270" width="270" height="180" rx="28" fill="url(#card)"/>
    <text x="600" y="340" text-anchor="middle" font-family="Inter, Arial" font-size="54" fill="#031926" font-weight="900">SWC</text>
    <text x="600" y="386" text-anchor="middle" font-family="Inter, Arial" font-size="22" fill="#062b2f" font-weight="700">Rust compiler core</text>
    <path d="M750 360H890" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <rect x="905" y="300" width="210" height="120" rx="24" fill="#0f172a" stroke="#86efac" stroke-width="2"/>
    <text x="1010" y="346" text-anchor="middle" font-family="Inter, Arial" font-size="24" fill="#dcfce7" font-weight="700">Build Output</text>
    <text x="1010" y="384" text-anchor="middle" font-family="Inter, Arial" font-size="18" fill="#bbf7d0">bundles · transforms</text>
  </g>
  <g font-family="Inter, Apple SD Gothic Neo, Arial" font-size="20" fill="#cbd5e1">
    <text x="135" y="500">빠른 변환</text><text x="330" y="500">프레임워크 통합</text><text x="565" y="500">보안 범위 문서화</text><text x="850" y="500">CI 비용 최적화</text>
  </g>
</svg>
