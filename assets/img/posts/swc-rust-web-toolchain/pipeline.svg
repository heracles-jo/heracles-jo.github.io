<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">SWC position in a modern frontend build pipeline</title>
  <desc id="desc">A pipeline diagram comparing source parsing, transform, bundler integration, minification, test and CI steps around SWC.</desc>
  <rect width="1100" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" font-family="Inter, Apple SD Gothic Neo, Arial" font-size="34" font-weight="800" fill="#0f172a">현대 프런트엔드 빌드 파이프라인에서 SWC의 위치</text>
  <g font-family="Inter, Apple SD Gothic Neo, Arial" font-size="18" font-weight="700">
    <rect x="60" y="135" width="165" height="92" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text x="142" y="178" text-anchor="middle" fill="#1e3a8a">Source</text>
    <text x="142" y="205" text-anchor="middle" fill="#1e40af" font-size="15">TS · JSX · Flow</text>
    <rect x="277" y="135" width="165" height="92" rx="18" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="360" y="178" text-anchor="middle" fill="#134e4a">SWC Core</text>
    <text x="360" y="205" text-anchor="middle" fill="#115e59" font-size="15">parse · transform</text>
    <rect x="494" y="135" width="165" height="92" rx="18" fill="#dcfce7" stroke="#16a34a"/>
    <text x="576" y="178" text-anchor="middle" fill="#14532d">Framework</text>
    <text x="576" y="205" text-anchor="middle" fill="#166534" font-size="15">Next · Vite · Jest</text>
    <rect x="711" y="135" width="165" height="92" rx="18" fill="#fef3c7" stroke="#d97706"/>
    <text x="794" y="178" text-anchor="middle" fill="#78350f">Bundle</text>
    <text x="794" y="205" text-anchor="middle" fill="#92400e" font-size="15">chunk · minify</text>
    <rect x="928" y="135" width="120" height="92" rx="18" fill="#fee2e2" stroke="#dc2626"/>
    <text x="988" y="178" text-anchor="middle" fill="#7f1d1d">CI/CD</text>
    <text x="988" y="205" text-anchor="middle" fill="#991b1b" font-size="15">cache · ship</text>
  </g>
  <g stroke="#334155" stroke-width="4" stroke-linecap="round"><path d="M230 181H270"/><path d="M447 181H487"/><path d="M664 181H704"/><path d="M881 181H921"/></g>
  <g font-family="Inter, Apple SD Gothic Neo, Arial" font-size="18" fill="#334155">
    <text x="75" y="310">• Babel 대체 변환기로만 보지 말고 parser·transform·minifier·Rust crate 생태계를 함께 본다.</text>
    <text x="75" y="352">• 도입 판단은 로컬 체감 속도보다 CI 시간, 소스맵, 플러그인 호환성, 롤백 경로가 더 중요하다.</text>
    <text x="75" y="394">• esbuild, Oxc, Vite와 경쟁하면서도 프레임워크 내부 구성요소로 공존하는 경우가 많다.</text>
    <text x="75" y="436">• 최신 릴리스와 보안 범위 문서화는 성숙한 툴체인으로 이동하는 신호로 해석할 수 있다.</text>
  </g>
</svg>
