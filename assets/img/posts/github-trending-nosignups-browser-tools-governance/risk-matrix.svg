<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Browser utility risk matrix</title>
  <desc id="desc">A matrix comparing convenience and data sensitivity for browser-based zero-signup tools.</desc>
  <rect width="1100" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="68" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">브라우저 유틸리티 리스크 매트릭스</text>
  <text x="60" y="104" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">무료·무가입 도구라도 업무 데이터 등급에 따라 통제 수준은 달라져야 한다.</text>
  <g transform="translate(150 145)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="360" height="130" fill="#dcfce7" stroke="#94a3b8"/>
    <rect x="360" y="0" width="360" height="130" fill="#fef9c3" stroke="#94a3b8"/>
    <rect x="0" y="130" width="360" height="130" fill="#e0f2fe" stroke="#94a3b8"/>
    <rect x="360" y="130" width="360" height="130" fill="#fee2e2" stroke="#94a3b8"/>
    <text x="32" y="46" font-size="21" font-weight="800" fill="#166534">낮은 민감도 / 높은 편의</text>
    <text x="32" y="82" font-size="16" fill="#166534">색상 변환, 공개 이미지 압축,</text>
    <text x="32" y="106" font-size="16" fill="#166534">샘플 JSON 포맷팅</text>
    <text x="392" y="46" font-size="21" font-weight="800" fill="#854d0e">낮은 민감도 / 낮은 편의</text>
    <text x="392" y="82" font-size="16" fill="#854d0e">내부 표준 도구가 있으면</text>
    <text x="392" y="106" font-size="16" fill="#854d0e">허용할 이유가 약함</text>
    <text x="32" y="176" font-size="21" font-weight="800" fill="#075985">높은 민감도 / 높은 편의</text>
    <text x="32" y="212" font-size="16" fill="#075985">PDF 변환, 문서 요약,</text>
    <text x="32" y="236" font-size="16" fill="#075985">로그·토큰 처리: 별도 검토</text>
    <text x="392" y="176" font-size="21" font-weight="800" fill="#991b1b">높은 민감도 / 낮은 편의</text>
    <text x="392" y="212" font-size="16" fill="#991b1b">차단 또는 내부 호스팅</text>
    <text x="392" y="236" font-size="16" fill="#991b1b">대체재 우선</text>
    <line x1="0" y1="285" x2="720" y2="285" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="-25" y1="260" x2="-25" y2="0" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="285" y="325" font-size="18" fill="#0f172a">업무 편의·반복 빈도 증가</text>
    <text x="-118" y="150" transform="rotate(-90 -118 150)" font-size="18" fill="#0f172a">데이터 민감도 증가</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs>
</svg>
