<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NoSignups and browser-first tools governance</title>
  <desc id="desc">A browser window, privacy shield, and lightweight tool cards illustrating zero-signup web utilities as an operational governance topic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#17324a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="170" fill="#14b8a6" opacity="0.16"/>
  <circle cx="140" cy="520" r="210" fill="#38bdf8" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="150" y="120" width="900" height="390" rx="34" fill="#f8fafc"/>
    <rect x="150" y="120" width="900" height="68" rx="34" fill="#e2e8f0"/>
    <circle cx="198" cy="154" r="11" fill="#ef4444"/>
    <circle cx="234" cy="154" r="11" fill="#f59e0b"/>
    <circle cx="270" cy="154" r="11" fill="#22c55e"/>
    <rect x="335" y="140" width="520" height="28" rx="14" fill="#ffffff"/>
    <text x="595" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">nosignups.net / open-source browser tools</text>
    <g transform="translate(205 235)">
      <rect width="205" height="120" rx="22" fill="#dbeafe"/>
      <text x="26" y="45" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">No account</text>
      <text x="26" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1e40af">즉시 실행</text>
      <path d="M158 78 l22 22 l38 -50" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(498 235)">
      <rect width="205" height="120" rx="22" fill="#ccfbf1"/>
      <text x="26" y="45" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#134e4a">Client-side</text>
      <text x="26" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0f766e">데이터 이동 최소화</text>
      <path d="M162 42 h32 v58 h-32 z M145 64 h32" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(790 235)">
      <rect width="205" height="120" rx="22" fill="#fef3c7"/>
      <text x="26" y="45" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#78350f">Governance</text>
      <text x="26" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#92400e">허용 목록과 감사</text>
      <path d="M172 35 l42 18 v35 c0 32 -24 51 -42 58 c-18 -7 -42 -26 -42 -58 v-35 z" fill="none" stroke="#d97706" stroke-width="7"/>
    </g>
  </g>
  <text x="150" y="570" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">GitHub Trending: NoSignups</text>
  <text x="150" y="604" font-family="Inter, Arial, sans-serif" font-size="21" fill="#cbd5e1">제로 회원가입 브라우저 도구를 실무 도입 체계로 읽는 법</text>
</svg>
