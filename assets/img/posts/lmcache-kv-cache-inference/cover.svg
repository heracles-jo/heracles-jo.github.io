<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LMCache와 LLM KV 캐시 인프라</title>
  <desc id="desc">LLM 추론 서버 앞단에서 KV 캐시 계층이 반복 프리필 비용을 줄이고 vLLM, SGLang, GPU 클러스터를 연결하는 구조를 나타낸 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#bfdbfe" stroke-width="2">
    <path d="M80 510 C260 390 300 160 510 220 S850 470 1120 120" fill="none"/>
    <path d="M30 170 C210 100 330 430 540 340 S830 90 1170 310" fill="none"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="92" y="112" width="250" height="130" rx="28" fill="#eff6ff" opacity="0.96"/>
    <text x="217" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Agent / RAG</text>
    <text x="217" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">긴 컨텍스트 · 반복 질의</text>
    <rect x="475" y="78" width="250" height="164" rx="28" fill="#ccfbf1" opacity="0.97"/>
    <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#115e59">LMCache</text>
    <text x="600" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#134e4a">KV Cache Management Layer</text>
    <text x="600" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#134e4a">reuse · persist · observe</text>
    <rect x="858" y="112" width="250" height="130" rx="28" fill="#fef3c7" opacity="0.97"/>
    <text x="983" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#92400e">vLLM / SGLang</text>
    <text x="983" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#78350f">GPU 추론 엔진</text>
  </g>
  <g stroke="#e0f2fe" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="12 14">
    <path d="M345 176 H465"/>
    <path d="M735 176 H855"/>
  </g>
  <g transform="translate(142 345)">
    <rect width="916" height="132" rx="30" fill="#020617" opacity="0.42"/>
    <text x="458" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">오늘의 GitHub Trending 분석</text>
    <text x="458" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#dbeafe">LLM 추론 비용의 병목이 모델에서 캐시 계층으로 이동한다</text>
  </g>
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">heracles-jo.github.io · GitHub Trending Snapshot</text>
</svg>