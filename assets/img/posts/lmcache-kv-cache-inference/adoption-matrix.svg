<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">LMCache 도입 판단 매트릭스</title>
  <desc id="desc">LLM KV 캐시 도입에 적합한 워크로드와 피해야 할 워크로드를 비용, 반복성, 보안, 운영 복잡도 기준으로 비교하는 매트릭스</desc>
  <rect width="1100" height="520" rx="36" fill="#0f172a"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">LLM KV Cache 도입 판단 매트릭스</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">반복 컨텍스트와 긴 프리필 비용이 충분히 클 때만 캐시 계층은 인프라 투자로 의미가 있다.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="155" width="450" height="285" rx="24" fill="#064e3b"/>
    <text x="100" y="205" font-size="26" font-weight="800" fill="#d1fae5">적합한 경우</text>
    <text x="100" y="250" font-size="19" fill="#ecfdf5">• RAG 문서, 정책, 코드베이스가 반복 사용된다</text>
    <text x="100" y="288" font-size="19" fill="#ecfdf5">• 멀티턴 에이전트의 TTFT가 병목이다</text>
    <text x="100" y="326" font-size="19" fill="#ecfdf5">• vLLM/SGLang 다중 인스턴스를 운영한다</text>
    <text x="100" y="364" font-size="19" fill="#ecfdf5">• 히트율, 토큰 비용, GPU 사용률을 측정한다</text>
    <text x="100" y="402" font-size="19" fill="#ecfdf5">• 캐시 보존 정책과 데이터 분리 기준이 있다</text>
    <rect x="580" y="155" width="450" height="285" rx="24" fill="#7f1d1d"/>
    <text x="610" y="205" font-size="26" font-weight="800" fill="#fee2e2">주의하거나 피할 경우</text>
    <text x="610" y="250" font-size="19" fill="#fff1f2">• 요청마다 컨텍스트가 거의 전부 다르다</text>
    <text x="610" y="288" font-size="19" fill="#fff1f2">• 개인정보·테넌트 경계가 불명확하다</text>
    <text x="610" y="326" font-size="19" fill="#fff1f2">• 단일 소형 모델 실험 단계에 머문다</text>
    <text x="610" y="364" font-size="19" fill="#fff1f2">• 운영팀이 캐시 장애·무효화를 감당하기 어렵다</text>
    <text x="610" y="402" font-size="19" fill="#fff1f2">• 모델/토크나이저 변경이 잦고 검증 체계가 없다</text>
  </g>
  <text x="70" y="482" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">PoC 기준: 캐시 히트율, TTFT p95, GPU prefill utilization, 캐시 메모리 비용, 개인정보 분리 정책을 함께 본다.</text>
</svg>