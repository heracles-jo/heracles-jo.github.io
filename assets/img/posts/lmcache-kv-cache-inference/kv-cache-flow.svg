<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">LLM 추론 경로와 KV 캐시 재사용</title>
  <desc id="desc">사용자 요청, 프리필, KV 캐시 저장소, 디코드 단계가 어떻게 분리되어 반복 컨텍스트의 GPU 연산을 줄이는지 보여주는 흐름도</desc>
  <rect width="1100" height="560" rx="36" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="70" font-size="32" font-weight="800" fill="#0f172a">KV 캐시 계층이 바꾸는 LLM 추론 경로</text>
    <text x="60" y="108" font-size="18" fill="#475569">동일한 문서·대화 컨텍스트를 매번 프리필하지 않고, 재사용 가능한 상태로 분리한다.</text>
  </g>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.15"/></filter></defs>
    <rect x="60" y="180" width="190" height="110" rx="20" fill="#dbeafe"/>
    <text x="155" y="225" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">Request</text>
    <text x="155" y="258" text-anchor="middle" font-size="15" fill="#1e40af">프롬프트·RAG 문서</text>
    <rect x="340" y="180" width="190" height="110" rx="20" fill="#fee2e2"/>
    <text x="435" y="225" text-anchor="middle" font-size="23" font-weight="700" fill="#991b1b">Prefill</text>
    <text x="435" y="258" text-anchor="middle" font-size="15" fill="#7f1d1d">반복될수록 비싼 단계</text>
    <rect x="620" y="162" width="220" height="146" rx="24" fill="#ccfbf1"/>
    <text x="730" y="213" text-anchor="middle" font-size="25" font-weight="800" fill="#0f766e">LMCache</text>
    <text x="730" y="248" text-anchor="middle" font-size="15" fill="#115e59">GPU / CPU / Remote storage</text>
    <text x="730" y="276" text-anchor="middle" font-size="15" fill="#115e59">prefix가 아닌 재사용 텍스트까지</text>
    <rect x="920" y="180" width="130" height="110" rx="20" fill="#ede9fe"/>
    <text x="985" y="225" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">Decode</text>
    <text x="985" y="258" text-anchor="middle" font-size="15" fill="#5b21b6">응답 생성</text>
  </g>
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#a)">
    <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
    <path d="M250 235 H338"/>
    <path d="M530 235 H618"/>
    <path d="M840 235 H918"/>
    <path d="M730 310 C710 380 470 400 435 292" stroke-dasharray="10 10"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#334155">
    <text x="77" y="386">실무 효과</text>
    <text x="77" y="420">• TTFT 절감</text>
    <text x="77" y="450">• GPU 프리필 비용 완화</text>
    <text x="77" y="480">• 다중 엔진 간 캐시 공유</text>
    <text x="610" y="386">운영 과제</text>
    <text x="610" y="420">• 캐시 무효화와 개인정보 통제</text>
    <text x="610" y="450">• 히트율 관측과 용량 계획</text>
    <text x="610" y="480">• vLLM/SGLang 버전 호환성</text>
  </g>
</svg>
