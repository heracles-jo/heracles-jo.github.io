<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">ipatool 도입 리스크 매트릭스</title>
  <desc id="desc">계정 보안, Apple 정책 변경, 다운로드 패키지의 암호화 상태, 보존 정책, 자동화 남용 방지를 기준으로 ipatool 도입 리스크를 평가하는 표</desc>
  <rect width="1100" height="560" fill="#0b1020"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="72" font-size="34" font-weight="800" fill="#f8fafc">PoC 전에 확인할 운영 리스크</text>
    <text x="60" y="110" font-size="19" fill="#cbd5e1">모바일 앱 패키지 수집 자동화는 기술보다 계정, 정책, 증적, 보안 경계가 먼저다.</text>
    <g transform="translate(70 165)" font-size="17">
      <rect width="960" height="58" rx="14" fill="#1e293b"/>
      <text x="28" y="36" fill="#93c5fd" font-weight="700">위험 영역</text>
      <text x="285" y="36" fill="#93c5fd" font-weight="700">질문</text>
      <text x="720" y="36" fill="#93c5fd" font-weight="700">통제 방법</text>
      <g transform="translate(0 76)">
        <rect width="960" height="58" rx="14" fill="#111827" stroke="#334155"/>
        <text x="28" y="36" fill="#fca5a5" font-weight="700">계정 보안</text>
        <text x="285" y="36" fill="#e5e7eb">Apple ID·2FA·키체인 접근을 누가 관리하는가</text>
        <text x="720" y="36" fill="#bbf7d0">전용 계정, 권한 분리</text>
      </g>
      <g transform="translate(0 146)">
        <rect width="960" height="58" rx="14" fill="#111827" stroke="#334155"/>
        <text x="28" y="36" fill="#fde68a" font-weight="700">정책 변경</text>
        <text x="285" y="36" fill="#e5e7eb">비공식 Store 프로토콜 변경 시 복구 계획이 있는가</text>
        <text x="720" y="36" fill="#bbf7d0">릴리스 감시, 수동 우회</text>
      </g>
      <g transform="translate(0 216)">
        <rect width="960" height="58" rx="14" fill="#111827" stroke="#334155"/>
        <text x="28" y="36" fill="#c4b5fd" font-weight="700">분석 한계</text>
        <text x="285" y="36" fill="#e5e7eb">다운로드된 IPA가 복호화·동적 분석에 충분한가</text>
        <text x="720" y="36" fill="#bbf7d0">목적별 도구 조합</text>
      </g>
      <g transform="translate(0 286)">
        <rect width="960" height="58" rx="14" fill="#111827" stroke="#334155"/>
        <text x="28" y="36" fill="#67e8f9" font-weight="700">증적 보존</text>
        <text x="285" y="36" fill="#e5e7eb">해시, 버전, Storefront, 승인 로그가 함께 남는가</text>
        <text x="720" y="36" fill="#bbf7d0">불변 저장소, 감사 로그</text>
      </g>
    </g>
  </g>
</svg>
