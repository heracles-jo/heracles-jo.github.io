<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenSRE 자동 복구 PoC 승격 결정 흐름</title>
  <desc id="desc">관찰, 제안, 제한 실행, 운영 승격을 거치며 증거 부족이나 권한 초과 시 중단하는 과정</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">자동 복구 PoC: 성공률보다 오수정 비용을 먼저 본다</text>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">권한은 단계적으로 넓히고, 증거가 약해지면 즉시 이전 단계로 돌아간다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 190)"><rect width="235" height="190" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="3"/><text x="118" y="48" text-anchor="middle" fill="#bfdbfe" font-size="25" font-weight="800">1. 관찰</text><text x="24" y="92" fill="#dbeafe" font-size="18">읽기 전용 분석</text><text x="24" y="124" fill="#dbeafe" font-size="18">분류 정확도</text><text x="24" y="156" fill="#dbeafe" font-size="18">민감 로그 최소화</text></g>
    <g transform="translate(365 190)"><rect width="235" height="190" rx="22" fill="#312e81" stroke="#a78bfa" stroke-width="3"/><text x="118" y="48" text-anchor="middle" fill="#ddd6fe" font-size="25" font-weight="800">2. 제안</text><text x="24" y="92" fill="#ede9fe" font-size="18">격리 patch 생성</text><text x="24" y="124" fill="#ede9fe" font-size="18">사람 수용률</text><text x="24" y="156" fill="#ede9fe" font-size="18">테스트 약화 탐지</text></g>
    <g transform="translate(660 190)"><rect width="235" height="190" rx="22" fill="#713f12" stroke="#fbbf24" stroke-width="3"/><text x="118" y="48" text-anchor="middle" fill="#fef3c7" font-size="25" font-weight="800">3. 제한 실행</text><text x="24" y="92" fill="#fef3c7" font-size="18">비핵심 PR branch</text><text x="24" y="124" fill="#fef3c7" font-size="18">no force · rollback</text><text x="24" y="156" fill="#fef3c7" font-size="18">정확한 SHA check</text></g>
    <g transform="translate(955 190)"><rect width="175" height="190" rx="22" fill="#14532d" stroke="#4ade80" stroke-width="3"/><text x="88" y="48" text-anchor="middle" fill="#dcfce7" font-size="24" font-weight="800">4. 승격</text><text x="20" y="92" fill="#dcfce7" font-size="17">위험별 승인</text><text x="20" y="124" fill="#dcfce7" font-size="17">bounded loop</text><text x="20" y="156" fill="#dcfce7" font-size="17">red time 감소</text></g>
    <path d="M310 285h47M605 285h47M900 285h47" stroke="#94a3b8" stroke-width="5" marker-end="url(#arr)"/>
    <rect x="205" y="500" width="790" height="130" rx="20" fill="#3f1723" stroke="#fb7185" stroke-width="3"/>
    <text x="600" y="542" text-anchor="middle" fill="#fecdd3" font-size="24" font-weight="800">중단 또는 이전 단계로 복귀</text>
    <text x="600" y="580" text-anchor="middle" fill="#fda4af" font-size="19">증거 없는 원인 확정 · workflow 약화 · protected branch 접근 · 반복 진동 · 민감 데이터 과수집</text>
    <path d="M188 388v104M483 388v104M778 388v104M1043 388v104" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#stop)"/>
  </g>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#94a3b8"/></marker><marker id="stop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#fb7185"/></marker></defs>
</svg>
