<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenSRE CI 자동 복구의 증거와 권한 분리</title>
  <desc id="desc">대상 고정부터 증거 수집, 격리 수정, 제한된 push, 원격 check와 사람 승인까지 여섯 단계</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">CI 자동 복구는 하나의 권한이 아니라 여섯 개의 게이트다</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">읽기·추론·수정·push·검증·승인을 분리해야 실패와 오수정을 추적할 수 있다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 155)"><rect width="330" height="155" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#ef4444"/><text x="42" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="700">1</text><text x="82" y="49" fill="#7f1d1d" font-size="24" font-weight="800">대상 고정</text><text x="28" y="94" fill="#991b1b" font-size="19">PR · head SHA · base SHA</text><text x="28" y="124" fill="#991b1b" font-size="19">실패 check와 run ID 기록</text></g>
    <g transform="translate(435 155)"><rect width="330" height="155" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#3b82f6"/><text x="42" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="700">2</text><text x="82" y="49" fill="#1e3a8a" font-size="24" font-weight="800">증거 수집</text><text x="28" y="94" fill="#1e40af" font-size="19">로그 · 재실행 · branch drift</text><text x="28" y="124" fill="#1e40af" font-size="19">CI 결함과 코드 결함 분류</text></g>
    <g transform="translate(815 155)"><rect width="330" height="155" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#8b5cf6"/><text x="42" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="700">3</text><text x="82" y="49" fill="#4c1d95" font-size="24" font-weight="800">격리 수정</text><text x="28" y="94" fill="#5b21b6" font-size="19">isolated checkout · worktree</text><text x="28" y="124" fill="#5b21b6" font-size="19">테스트와 변경 범위 검증</text></g>
    <path d="M385 232h42M765 232h42" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(55 420)"><rect width="330" height="155" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#f59e0b"/><text x="42" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="700">4</text><text x="82" y="49" fill="#78350f" font-size="24" font-weight="800">제한된 쓰기</text><text x="28" y="94" fill="#92400e" font-size="19">same-repo repair branch</text><text x="28" y="124" fill="#92400e" font-size="19">최소 권한 · force push 금지</text></g>
    <g transform="translate(435 420)"><rect width="330" height="155" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#22c55e"/><text x="42" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="700">5</text><text x="82" y="49" fill="#14532d" font-size="24" font-weight="800">원격 재검증</text><text x="28" y="94" fill="#166534" font-size="19">정확한 pushed SHA의 check</text><text x="28" y="124" fill="#166534" font-size="19">pass · fail · timeout · superseded</text></g>
    <g transform="translate(815 420)"><rect width="330" height="155" rx="18" fill="#cffafe" stroke="#06b6d4" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#06b6d4"/><text x="42" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="700">6</text><text x="82" y="49" fill="#164e63" font-size="24" font-weight="800">사람 승인</text><text x="28" y="94" fill="#155e75" font-size="19">required checks · diff review</text><text x="28" y="124" fill="#155e75" font-size="19">승격 또는 rollback 결정</text></g>
    <path d="M385 497h42M765 497h42" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
    <path d="M980 320v55H220v37" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/>
    <text x="600" y="660" text-anchor="middle" fill="#334155" font-size="22" font-weight="700">성공 = patch 생성이 아니라 정확한 commit의 검증과 승인 완료</text>
    <text x="600" y="700" text-anchor="middle" fill="#64748b" font-size="19">각 단계의 입력·출력·권한·실패 이유를 감사 가능한 증거로 남긴다</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
</svg>
