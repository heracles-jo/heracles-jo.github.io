<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">claude-mem 세션 메모리 아키텍처</title>
  <desc id="desc">에이전트 호스트의 라이프사이클 훅이 로컬 워커, 저장소, 검색을 거쳐 다음 세션 컨텍스트로 연결되는 흐름</desc>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">세션 활동이 다음 컨텍스트가 되기까지</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20" fill="#475569">각 화살표는 정보 손실·지연·권한 경계가 생기는 지점이다</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="160" width="240" height="180" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="180" y="202" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">Agent Host</text>
    <text x="85" y="245" font-size="19" fill="#1e40af">SessionStart</text><text x="85" y="278" font-size="19" fill="#1e40af">UserPromptSubmit</text><text x="85" y="311" font-size="19" fill="#1e40af">PostToolUse · Stop</text>
    <rect x="360" y="160" width="240" height="180" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="480" y="202" text-anchor="middle" font-size="25" font-weight="700" fill="#9a3412">Local Worker</text>
    <text x="385" y="245" font-size="19" fill="#9a3412">durable queue</text><text x="385" y="278" font-size="19" fill="#9a3412">provider summary</text><text x="385" y="311" font-size="19" fill="#9a3412">project identity</text>
    <rect x="660" y="160" width="240" height="180" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="780" y="202" text-anchor="middle" font-size="25" font-weight="700" fill="#5b21b6">Memory Stores</text>
    <text x="685" y="245" font-size="19" fill="#5b21b6">SQLite observations</text><text x="685" y="278" font-size="19" fill="#5b21b6">Chroma embeddings</text><text x="685" y="311" font-size="19" fill="#5b21b6">logs · settings</text>
    <rect x="960" y="160" width="180" height="180" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1050" y="202" text-anchor="middle" font-size="25" font-weight="700" fill="#166534">Recall</text>
    <text x="985" y="245" font-size="19" fill="#166534">search index</text><text x="985" y="278" font-size="19" fill="#166534">timeline</text><text x="985" y="311" font-size="19" fill="#166534">context inject</text>
    <g stroke="#64748b" stroke-width="5" fill="none"><path d="M305 250H350"/><path d="M605 250H650"/><path d="M905 250H950"/><path d="M1050 350V405H180V350" stroke-dasharray="12 9"/></g>
    <g fill="#64748b"><path d="M350 250l-15-10v20z"/><path d="M650 250l-15-10v20z"/><path d="M950 250l-15-10v20z"/><path d="M180 350l-10 15h20z"/></g>
    <rect x="60" y="450" width="1080" height="180" rx="22" fill="#0f172a"/>
    <text x="90" y="495" font-size="23" font-weight="700" fill="#fff">운영자가 연결해야 할 증거</text>
    <g font-size="19"><text x="90" y="540" fill="#93c5fd">캡처</text><text x="160" y="540" fill="#e2e8f0">hook event → queue receipt</text><text x="430" y="540" fill="#fdba74">요약</text><text x="500" y="540" fill="#e2e8f0">원문 → model/version → observation</text><text x="870" y="540" fill="#c4b5fd">검색</text><text x="940" y="540" fill="#e2e8f0">score → 선택 이유</text>
    <text x="90" y="585" fill="#86efac">격리</text><text x="160" y="585" fill="#e2e8f0">project · branch · user scope</text><text x="430" y="585" fill="#fda4af">삭제</text><text x="500" y="585" fill="#e2e8f0">DB · vector · log · backup · sync</text><text x="870" y="585" fill="#fde68a">복구</text><text x="940" y="585" fill="#e2e8f0">loss · duplicate · retry</text></g>
  </g>
</svg>
