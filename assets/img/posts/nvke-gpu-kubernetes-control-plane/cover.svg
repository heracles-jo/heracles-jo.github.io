<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NVKE GPU Kubernetes 관리 평면</title>
  <desc id="desc">베어메탈 GPU 장비를 독립 Kubernetes 클러스터로 공급하는 관리 평면과 검증 경계</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#153b36"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="95" r="210" fill="#76b900" opacity=".12"/>
  <circle cx="105" cy="575" r="250" fill="#38bdf8" opacity=".08"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="76" y="94" fill="#86efac" font-size="24" font-weight="700" letter-spacing="2">PLATFORM ENGINEERING · GPU INFRASTRUCTURE</text>
    <text x="76" y="175" fill="#ffffff" font-size="58" font-weight="800">NVKE GPU Kubernetes</text>
    <text x="76" y="244" fill="#ffffff" font-size="58" font-weight="800">관리 평면 검증 기준</text>
    <text x="78" y="296" fill="#cbd5e1" font-size="25">클러스터 생성보다 먼저 복구·권한·노드 교체를 증명한다</text>
  </g>
  <g filter="url(#shadow)" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <rect x="78" y="374" width="240" height="132" rx="18" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <text x="198" y="416" text-anchor="middle" fill="#7dd3fc" font-size="21" font-weight="700">MANAGEMENT</text>
    <text x="198" y="450" text-anchor="middle" fill="#fff" font-size="18">API · Temporal · CAPI</text>
    <text x="198" y="480" text-anchor="middle" fill="#94a3b8" font-size="16">PostgreSQL · SPIRE</text>
    <path d="M318 440H430" stroke="#86efac" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="430" y="374" width="240" height="132" rx="18" fill="#172033" stroke="#86efac" stroke-width="2"/>
    <text x="550" y="416" text-anchor="middle" fill="#86efac" font-size="21" font-weight="700">BARE METAL</text>
    <text x="550" y="450" text-anchor="middle" fill="#fff" font-size="18">NICo · TPM · Node Image</text>
    <text x="550" y="480" text-anchor="middle" fill="#94a3b8" font-size="16">GPU · Network Fabric</text>
    <path d="M670 440H782" stroke="#86efac" stroke-width="5"/>
    <rect x="782" y="350" width="330" height="180" rx="22" fill="#172033" stroke="#76b900" stroke-width="2"/>
    <text x="947" y="394" text-anchor="middle" fill="#bef264" font-size="21" font-weight="700">WORKLOAD CLUSTERS</text>
    <rect x="816" y="420" width="80" height="70" rx="12" fill="#24324a"/><rect x="907" y="420" width="80" height="70" rx="12" fill="#24324a"/><rect x="998" y="420" width="80" height="70" rx="12" fill="#24324a"/>
    <text x="856" y="462" text-anchor="middle" fill="#fff" font-size="18">A</text><text x="947" y="462" text-anchor="middle" fill="#fff" font-size="18">B</text><text x="1038" y="462" text-anchor="middle" fill="#fff" font-size="18">C</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#86efac"/></marker></defs>
  <text x="78" y="581" fill="#64748b" font-family="Pretendard, sans-serif" font-size="18">heracles-jo.github.io</text>
</svg>
