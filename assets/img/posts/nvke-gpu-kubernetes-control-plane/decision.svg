<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">NVKE 도입 의사결정 게이트</title>
  <desc id="desc">로컬 평가에서 실제 GPU 비프로덕션까지 승격하면서 복구, 보안, 교체, 공급망을 검증하는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#16a34a"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="60" y="64" font-size="34" font-weight="800" fill="#0f172a">NVKE preview를 production처럼 다루지 않는 4단계 게이트</text>
    <text x="60" y="100" font-size="18" fill="#475569">기능 데모가 아니라 실패 주입과 복구 증거로 다음 단계 진입을 결정한다</text>
    <g filter="url(#s)">
      <rect x="55" y="160" width="245" height="300" rx="20" fill="#fff" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="102" cy="208" r="25" fill="#0284c7"/><text x="102" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text>
      <text x="135" y="214" font-size="22" font-weight="800" fill="#075985">LOCAL</text>
      <text x="82" y="258" font-size="18" font-weight="700" fill="#0f172a">simulated NICo</text>
      <text x="82" y="294" font-size="16" fill="#475569">• API와 상태 전이</text><text x="82" y="324" font-size="16" fill="#475569">• Outbox·Temporal 추적</text><text x="82" y="354" font-size="16" fill="#475569">• 실패 계층 분류</text>
      <rect x="78" y="394" width="198" height="42" rx="10" fill="#e0f2fe"/><text x="177" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">GPU 없이 구조 학습</text>
      <rect x="335" y="160" width="245" height="300" rx="20" fill="#fff" stroke="#a3e635" stroke-width="3"/>
      <circle cx="382" cy="208" r="25" fill="#65a30d"/><text x="382" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text>
      <text x="415" y="214" font-size="22" font-weight="800" fill="#4d7c0f">HARDWARE</text>
      <text x="362" y="258" font-size="18" font-weight="700" fill="#0f172a">소규모 실제 장비</text>
      <text x="362" y="294" font-size="16" fill="#475569">• TPM·SPIFFE attestation</text><text x="362" y="324" font-size="16" fill="#475569">• NICo allocation·BGP</text><text x="362" y="354" font-size="16" fill="#475569">• GPU·fabric qualification</text>
      <rect x="358" y="394" width="198" height="42" rx="10" fill="#ecfccb"/><text x="457" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#4d7c0f">장비 provenance 증명</text>
      <rect x="615" y="160" width="245" height="300" rx="20" fill="#fff" stroke="#c084fc" stroke-width="3"/>
      <circle cx="662" cy="208" r="25" fill="#9333ea"/><text x="662" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text>
      <text x="695" y="214" font-size="22" font-weight="800" fill="#7e22ce">FAILURE</text>
      <text x="642" y="258" font-size="18" font-weight="700" fill="#0f172a">장애·보안 주입</text>
      <text x="642" y="294" font-size="16" fill="#475569">• DB·Temporal·SPIRE 중단</text><text x="642" y="324" font-size="16" fill="#475569">• 무토큰·오권한 호출</text><text x="642" y="354" font-size="16" fill="#475569">• GPU node 강제 교체</text>
      <rect x="638" y="394" width="198" height="42" rx="10" fill="#f3e8ff"/><text x="737" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">RTO·RPO와 중단선 기록</text>
      <rect x="895" y="160" width="250" height="300" rx="20" fill="#fff" stroke="#22c55e" stroke-width="3"/>
      <circle cx="942" cy="208" r="25" fill="#16a34a"/><text x="942" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">4</text>
      <text x="975" y="214" font-size="22" font-weight="800" fill="#15803d">LIMITED USE</text>
      <text x="922" y="258" font-size="18" font-weight="700" fill="#0f172a">비프로덕션 승격</text>
      <text x="922" y="294" font-size="16" fill="#475569">• 승인된 artifact만 사용</text><text x="922" y="324" font-size="16" fill="#475569">• 고객 영향 없는 workload</text><text x="922" y="354" font-size="16" fill="#475569">• 운영 공백 지속 추적</text>
      <rect x="918" y="394" width="204" height="42" rx="10" fill="#dcfce7"/><text x="1020" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">preview 범위 유지</text>
    </g>
    <path d="M300 310H327" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><path d="M580 310H607" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><path d="M860 310H887" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
    <rect x="150" y="515" width="900" height="108" rx="18" fill="#0f172a"/>
    <text x="600" y="554" text-anchor="middle" font-size="21" font-weight="800" fill="#fca5a5">즉시 중단 조건</text>
    <text x="600" y="590" text-anchor="middle" font-size="17" fill="#e2e8f0">관리 평면 복구 경로 없음 · API authorization 요구 충족 불가 · node 교체 시 GPU 작업 손실</text>
    <text x="600" y="616" text-anchor="middle" font-size="16" fill="#94a3b8">공식 backup·upgrade 절차가 필요한 production workload에는 현재 preview를 승격하지 않는다.</text>
    <text x="60" y="666" font-size="17" fill="#64748b">성공 기준: “클러스터가 만들어졌다”가 아니라 “실패해도 상태·권한·artifact를 설명하고 제한 시간 안에 복구했다”.</text>
  </g>
</svg>
