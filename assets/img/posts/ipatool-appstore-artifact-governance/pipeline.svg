<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">IPA artifact pipeline</title>
  <desc id="desc">App Store search, purchase, version listing, IPA download, scanning, and archive stages for mobile governance.</desc>
  <rect width="1000" height="420" rx="24" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g>
      <rect x="40" y="130" width="140" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="110" y="176" font-size="19" fill="#1e3a8a">Search</text>
      <text x="110" y="205" font-size="14" fill="#475569">metadata</text>
    </g>
    <g>
      <rect x="225" y="130" width="140" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
      <text x="295" y="176" font-size="19" fill="#075985">Purchase</text>
      <text x="295" y="205" font-size="14" fill="#475569">license</text>
    </g>
    <g>
      <rect x="410" y="130" width="140" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="480" y="176" font-size="19" fill="#166534">Versions</text>
      <text x="480" y="205" font-size="14" fill="#475569">external ID</text>
    </g>
    <g>
      <rect x="595" y="130" width="140" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="665" y="176" font-size="19" fill="#92400e">Download</text>
      <text x="665" y="205" font-size="14" fill="#475569">encrypted IPA</text>
    </g>
    <g>
      <rect x="780" y="130" width="170" height="110" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="865" y="176" font-size="19" fill="#991b1b">Scan &amp; Archive</text>
      <text x="865" y="205" font-size="14" fill="#475569">SBOM / evidence</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M182 185h38"/><path d="M210 173l14 12-14 12"/>
    <path d="M367 185h38"/><path d="M395 173l14 12-14 12"/>
    <path d="M552 185h38"/><path d="M580 173l14 12-14 12"/>
    <path d="M737 185h38"/><path d="M765 173l14 12-14 12"/>
  </g>
  <text x="500" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">App Store IPA 수집을 운영 파이프라인으로 다루는 방식</text>
  <text x="500" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">자동화의 목적은 우회 다운로드가 아니라 버전 증거, 보안 검증, 회귀 재현성을 남기는 것이다.</text>
</svg>
