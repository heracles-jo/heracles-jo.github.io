<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Mobile artifact governance risk matrix</title>
  <desc id="desc">A two-axis matrix comparing operational value and compliance risk for IPA artifact automation scenarios.</desc>
  <rect width="1000" height="520" rx="24" fill="#0f172a"/>
  <line x1="160" y1="420" x2="860" y2="420" stroke="#94a3b8" stroke-width="4"/>
  <line x1="160" y1="420" x2="160" y2="90" stroke="#94a3b8" stroke-width="4"/>
  <path d="M860 420l-18-12v24zM160 90l-12 18h24z" fill="#94a3b8"/>
  <text x="510" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">운영 가치와 재현성</text>
  <text x="70" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1" transform="rotate(-90 70 250)">규정·계정·저작권 리스크</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="220" y="310" width="190" height="72" rx="14" fill="#1e40af" opacity="0.95"/>
    <text x="315" y="342" text-anchor="middle" font-size="17" fill="#fff">수동 다운로드</text>
    <text x="315" y="366" text-anchor="middle" font-size="13" fill="#bfdbfe">낮은 자동화, 낮은 추적성</text>
    <rect x="540" y="275" width="220" height="82" rx="14" fill="#15803d" opacity="0.95"/>
    <text x="650" y="309" text-anchor="middle" font-size="17" fill="#fff">승인된 CI 수집</text>
    <text x="650" y="334" text-anchor="middle" font-size="13" fill="#bbf7d0">감사 로그와 자격증명 분리</text>
    <rect x="595" y="135" width="235" height="86" rx="14" fill="#b45309" opacity="0.98"/>
    <text x="712" y="170" text-anchor="middle" font-size="17" fill="#fff">무통제 대량 수집</text>
    <text x="712" y="195" text-anchor="middle" font-size="13" fill="#fde68a">계정 잠금·약관 위반 가능성</text>
    <rect x="270" y="165" width="210" height="82" rx="14" fill="#be123c" opacity="0.98"/>
    <text x="375" y="199" text-anchor="middle" font-size="17" fill="#fff">개인 Apple ID 공유</text>
    <text x="375" y="224" text-anchor="middle" font-size="13" fill="#fecdd3">책임 경계 불명확</text>
  </g>
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">IPA 자동화는 가치와 리스크를 함께 올린다</text>
</svg>
