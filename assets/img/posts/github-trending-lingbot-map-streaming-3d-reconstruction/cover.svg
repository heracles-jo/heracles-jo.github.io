<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LingBot-Map streaming 3D reconstruction analysis</title>
  <desc id="desc">A technical diagram showing camera frames streaming into a geometric context transformer and producing a persistent 3D map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#dbeafe" stroke-width="1">
    <path d="M0 510 C250 410 430 580 690 430 S960 270 1200 360" fill="none"/>
    <path d="M0 430 C260 340 470 480 720 330 S980 200 1200 260" fill="none"/>
    <path d="M0 350 C250 300 520 370 760 260 S980 160 1200 180" fill="none"/>
  </g>
  <g transform="translate(82 120)">
    <text x="0" y="0" fill="#e0f2fe" font-size="26" font-family="Inter,Arial,sans-serif" letter-spacing="2">GITHUB TRENDING ANALYSIS</text>
    <text x="0" y="62" fill="#ffffff" font-size="58" font-weight="800" font-family="Inter,Arial,sans-serif">LingBot-Map</text>
    <text x="0" y="118" fill="#a7f3d0" font-size="38" font-weight="700" font-family="Inter,Arial,sans-serif">Streaming 3D Reconstruction</text>
    <text x="0" y="170" fill="#cbd5e1" font-size="24" font-family="Inter,Arial,sans-serif">feed-forward 3D foundation model · geometric context transformer · long sequence mapping</text>
  </g>
  <g transform="translate(720 105)" filter="url(#glow)">
    <rect x="0" y="100" width="330" height="210" rx="26" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <text x="42" y="154" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Geometric Context</text>
    <text x="80" y="194" fill="#a7f3d0" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Transformer</text>
    <circle cx="65" cy="250" r="9" fill="#38bdf8"/><circle cx="120" cy="235" r="7" fill="#67e8f9"/><circle cx="185" cy="260" r="8" fill="#a7f3d0"/><circle cx="250" cy="226" r="7" fill="#fef08a"/>
    <path d="M65 250 L120 235 L185 260 L250 226" stroke="#93c5fd" stroke-width="3" fill="none"/>
  </g>
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.9">
    <path d="M155 420 L300 360 L445 420 L300 480 Z"/>
    <path d="M300 360 V480"/>
    <path d="M155 420 H445"/>
    <path d="M520 370 C590 340 650 320 720 310" stroke-dasharray="10 10"/>
  </g>
  <g fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22">
    <text x="128" y="528">camera stream</text>
    <text x="755" y="455">persistent 3D map</text>
  </g>
</svg>
