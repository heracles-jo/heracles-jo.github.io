  <rect width="1200" height="760" rx="24" fill="#f7f9fd"/>
  <text x="60" y="65" fill="#17233b" font-family="Arial, sans-serif" font-size="34" font-weight="800">개인 자료와 외부 공고는 같은 신뢰 등급이 아니다</text>
