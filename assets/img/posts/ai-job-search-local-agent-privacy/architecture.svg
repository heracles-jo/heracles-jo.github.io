    <text x="210" y="253" text-anchor="middle" fill="#7b3f4b" font-size="16" font-weight="700">읽기 최소화 · private remote</text>

    <rect x="840" y="115" width="300" height="165" rx="20" fill="#fff0e8" stroke="#d47a54" stroke-width="3"/>
