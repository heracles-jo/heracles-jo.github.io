    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="190" fill="#06b6d4" opacity=".13"/><circle cx="160" cy="600" r="250" fill="#84cc16" opacity=".09"/>
  <text x="72" y="100" fill="#67e8f9" font-family="Arial, sans-serif" font-size="24" font-weight="700">AGENTIC REVERSE ENGINEERING</text>
