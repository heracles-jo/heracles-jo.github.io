<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 보안 감사 아키텍처</title><desc id="desc">대상 소스가 읽기 전용 샌드박스에서 조사되고 커버리지 원장, hunter, verifier, findings schema와 보고서로 이어지는 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#0369a1"/></linearGradient></defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <rect x="38" y="32" width="1124" height="80" rx="18" fill="url(#head)"/><text x="74" y="82" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="white">발견과 검증을 분리하는 6단계 감사 상태 머신</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="155" width="220" height="190" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="165" y="197" text-anchor="middle" font-size="21" font-weight="800" fill="#9a3412">READ-ONLY TARGET</text><text x="165" y="231" text-anchor="middle" font-size="17" fill="#7c2d12">immutable source ref</text><rect x="82" y="258" width="166" height="58" rx="12" fill="#ffedd5"/><text x="165" y="282" text-anchor="middle" font-size="15" fill="#9a3412">OS sandbox</text><text x="165" y="304" text-anchor="middle" font-size="14" fill="#9a3412">no egress · bounded write</text>
