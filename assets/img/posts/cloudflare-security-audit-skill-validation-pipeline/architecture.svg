    <rect x="340" y="420" width="270" height="205" rx="18" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="475" y="461" text-anchor="middle" font-size="21" font-weight="800" fill="#115e59">6. REPORTING</text><text x="475" y="500" text-anchor="middle" font-size="16" fill="#134e4a">REPORT.md</text><text x="475" y="528" text-anchor="middle" font-size="16" fill="#134e4a">FINDINGS-DETAIL.md</text><text x="475" y="556" text-anchor="middle" font-size="16" fill="#134e4a">NEEDS-VALIDATION.md</text><rect x="374" y="580" width="202" height="27" rx="8" fill="#ccfbf1"/><text x="475" y="599" text-anchor="middle" font-size="13" fill="#115e59">derived from verified records</text>
    <rect x="55" y="420" width="220" height="205" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/><text x="165" y="460" text-anchor="middle" font-size="20" font-weight="800" fill="#991b1b">HARD BOUNDARY</text><text x="165" y="497" text-anchor="middle" font-size="15" fill="#7f1d1d">no sandbox?</text><text x="165" y="524" text-anchor="middle" font-size="15" fill="#7f1d1d">do not execute</text><text x="165" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">keep as</text><text x="165" y="592" text-anchor="middle" font-size="17" font-weight="800" fill="#991b1b">needs_validation</text>
