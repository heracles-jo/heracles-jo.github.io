    <rect x="340" y="145" width="270" height="210" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="475" y="187" text-anchor="middle" font-size="22" font-weight="800" fill="#155e75">1. RECONNAISSANCE</text><text x="475" y="222" text-anchor="middle" font-size="16" fill="#164e63">architecture.md</text><rect x="374" y="247" width="202" height="72" rx="12" fill="#cffafe"/><text x="475" y="275" text-anchor="middle" font-size="17" font-weight="700" fill="#155e75">coverage-ledger.json</text><text x="475" y="299" text-anchor="middle" font-size="14" fill="#155e75">surface × boundary × class</text>
