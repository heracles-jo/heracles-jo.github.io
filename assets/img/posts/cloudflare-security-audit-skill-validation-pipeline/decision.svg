<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 보안 감사 도입 의사결정 게이트</title><desc id="desc">커버리지, 독립 검증, 샌드박스, 재현성, 운영 비용을 통과해야 CI 적용으로 진행하는 체크리스트</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#475569"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/><rect x="36" y="30" width="1128" height="92" rx="20" fill="url(#g)"/><text x="72" y="74" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="white">AI 보안 감사를 merge gate로 올리기 전</text><text x="72" y="103" font-family="Arial, sans-serif" font-size="16" fill="#ccfbf1">발견 건수가 아니라 감사 증거와 실행 경계를 승인한다</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 168)">
      <rect width="195" height="330" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/><circle cx="98" cy="54" r="30" fill="#3b82f6"/><text x="98" y="63" text-anchor="middle" font-size="25" font-weight="800" fill="white">1</text><text x="98" y="111" text-anchor="middle" font-size="19" font-weight="800" fill="#1e3a8a">범위 영수증</text><text x="24" y="153" font-size="14" fill="#1e40af">✓ source ref 고정</text><text x="24" y="181" font-size="14" fill="#1e40af">✓ ledger unit 상태</text><text x="24" y="209" font-size="14" fill="#1e40af">✓ gap 공개</text><rect x="21" y="246" width="153" height="52" rx="10" fill="#dbeafe"/><text x="98" y="268" text-anchor="middle" font-size="13" fill="#1e40af">0 findings ≠</text><text x="98" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">0 vulnerabilities</text>
    </g>
    <path d="M253 333 H282" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(284 168)"><rect width="195" height="330" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><circle cx="98" cy="54" r="30" fill="#8b5cf6"/><text x="98" y="63" text-anchor="middle" font-size="25" font-weight="800" fill="white">2</text><text x="98" y="111" text-anchor="middle" font-size="19" font-weight="800" fill="#4c1d95">독립 반증</text><text x="24" y="153" font-size="14" fill="#5b21b6">✓ fresh verifier</text><text x="24" y="181" font-size="14" fill="#5b21b6">✓ 원본에서 재실행</text><text x="24" y="209" font-size="14" fill="#5b21b6">✓ severity 분리</text><rect x="21" y="246" width="153" height="52" rx="10" fill="#ede9fe"/><text x="98" y="268" text-anchor="middle" font-size="13" fill="#5b21b6">hunter cannot</text><text x="98" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">grade itself</text></g>
    <path d="M479 333 H508" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(510 168)"><rect width="195" height="330" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><circle cx="98" cy="54" r="30" fill="#f97316"/><text x="98" y="63" text-anchor="middle" font-size="25" font-weight="800" fill="white">3</text><text x="98" y="111" text-anchor="middle" font-size="19" font-weight="800" fill="#7c2d12">실행 격리</text><text x="24" y="153" font-size="14" fill="#9a3412">✓ egress 차단</text><text x="24" y="181" font-size="14" fill="#9a3412">✓ read-only target</text><text x="24" y="209" font-size="14" fill="#9a3412">✓ 자원·쓰기 제한</text><rect x="21" y="246" width="153" height="52" rx="10" fill="#ffedd5"/><text x="98" y="268" text-anchor="middle" font-size="13" fill="#9a3412">target code is</text><text x="98" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">untrusted input</text></g>
    <path d="M705 333 H734" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(736 168)"><rect width="195" height="330" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><circle cx="98" cy="54" r="30" fill="#10b981"/><text x="98" y="63" text-anchor="middle" font-size="25" font-weight="800" fill="white">4</text><text x="98" y="111" text-anchor="middle" font-size="19" font-weight="800" fill="#064e3b">증거 재현</text><text x="24" y="153" font-size="14" fill="#065f46">✓ source trace</text><text x="24" y="181" font-size="14" fill="#065f46">✓ bounded result</text><text x="24" y="209" font-size="14" fill="#065f46">✓ 사람 재현 100%</text><rect x="21" y="246" width="153" height="52" rx="10" fill="#d1fae5"/><text x="98" y="268" text-anchor="middle" font-size="13" fill="#065f46">schema supports</text><text x="98" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">review, not truth</text></g>
    <path d="M931 333 H960" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(962 168)"><rect width="180" height="330" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="4"/><circle cx="90" cy="54" r="30" fill="#0f766e"/><path d="M76 54 l10 10 20-23" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="111" text-anchor="middle" font-size="19" font-weight="800" fill="#134e4a">단계적 적용</text><text x="20" y="153" font-size="14" fill="#115e59">1. scheduled</text><text x="20" y="181" font-size="14" fill="#115e59">2. scoped diff</text><text x="20" y="209" font-size="14" fill="#115e59">3. policy gate</text><rect x="18" y="246" width="144" height="52" rx="10" fill="#ccfbf1"/><text x="90" y="268" text-anchor="middle" font-size="13" fill="#115e59">AI severity는</text><text x="90" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#115e59">마지막에 승격</text></g>
    <rect x="58" y="548" width="1084" height="108" rx="18" fill="#0f172a"/><text x="91" y="588" font-size="18" font-weight="700" fill="#f8fafc">중단 조건</text><text x="91" y="622" font-size="16" fill="#fecaca">샌드박스 미강제 · 검증자 미분리 · source ref 누락 · blocked 범위를 성공 처리 · confirmed 결과를 사람이 재현하지 못함</text>
  </g>
