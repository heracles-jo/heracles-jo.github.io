<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Supabase 셀프호스팅 운영 기준</title>
  <desc id="desc">관리형 편의와 셀프호스팅 통제권 사이에서 백업, 보안, 업그레이드 책임을 비교한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a18"/><stop offset="1" stop-color="#102c27"/></linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="220" fill="#34d399" opacity=".08"/>
  <circle cx="110" cy="610" r="260" fill="#0ea5e9" opacity=".06"/>
  <g filter="url(#shadow)">
    <rect x="70" y="86" width="1060" height="458" rx="30" fill="#0b211e" stroke="#2f6659"/>
  </g>
  <g transform="translate(105 126)">
    <path d="M76 0 10 188h118L88 318l178-214H145L210 0Z" fill="url(#bolt)"/>
    <text x="310" y="72" fill="#d1fae5" font-family="system-ui,-apple-system,sans-serif" font-size="31" font-weight="700">SUPABASE SELF-HOSTING</text>
    <text x="310" y="137" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800">통제권보다 먼저</text>
    <text x="310" y="202" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800">운영 책임을 계산하라</text>
    <g transform="translate(310 250)" font-family="system-ui,-apple-system,sans-serif" font-size="21" font-weight="650">
      <rect width="155" height="48" rx="24" fill="#143e36" stroke="#3b8f76"/><text x="77" y="31" text-anchor="middle" fill="#a7f3d0">RLS 보안</text>
      <rect x="170" width="155" height="48" rx="24" fill="#143e36" stroke="#3b8f76"/><text x="247" y="31" text-anchor="middle" fill="#a7f3d0">백업·복원</text>
      <rect x="340" width="155" height="48" rx="24" fill="#143e36" stroke="#3b8f76"/><text x="417" y="31" text-anchor="middle" fill="#a7f3d0">키 회전</text>
      <rect x="510" width="175" height="48" rx="24" fill="#143e36" stroke="#3b8f76"/><text x="597" y="31" text-anchor="middle" fill="#a7f3d0">업그레이드</text>
    </g>
  </g>
  <text x="1090" y="590" text-anchor="end" fill="#75a99b" font-family="system-ui,-apple-system,sans-serif" font-size="18">heracles.jo</text>
</svg>
