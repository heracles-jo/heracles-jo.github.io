<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Memory Architecture</title>
  <desc id="desc">AI 메모리 계층의 수집, 추출, 정규화, 저장, 검색, 컨텍스트 주입, 감사 로그 흐름</desc>
  <rect width="1100" height="620" rx="28" fill="#f8fafc"/>
  <g font-family="Inter, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="60" y="70" font-size="34" font-weight="800" fill="#0f172a">AI 메모리 계층의 기준 아키텍처</text>
    <text x="60" y="105" font-size="18" fill="#475569">장기 기억은 벡터 검색만이 아니라 사실 추출, 충돌 해결, 만료, 권한, 감사가 결합된 운영 계층이다.</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/></marker></defs>
  <g font-family="Inter, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#0f172a">
    <rect x="60" y="170" width="170" height="88" rx="16" fill="#dbeafe" stroke="#3b82f6"/><text x="95" y="205" font-weight="700">Sources</text><text x="82" y="232">chat·docs·email</text>
    <rect x="290" y="145" width="180" height="80" rx="16" fill="#dcfce7" stroke="#22c55e"/><text x="326" y="178" font-weight="700">Extraction</text><text x="318" y="205">facts·entities</text>
    <rect x="290" y="270" width="180" height="80" rx="16" fill="#fef3c7" stroke="#f59e0b"/><text x="318" y="303" font-weight="700">Normalization</text><text x="315" y="330">time·conflicts</text>
    <rect x="535" y="205" width="190" height="100" rx="18" fill="#ede9fe" stroke="#8b5cf6"/><text x="575" y="242" font-weight="700">Memory Store</text><text x="567" y="270">graph + vectors</text>
    <rect x="790" y="145" width="230" height="80" rx="16" fill="#ccfbf1" stroke="#14b8a6"/><text x="840" y="178" font-weight="700">Hybrid Retrieval</text><text x="828" y="205">profile + knowledge</text>
    <rect x="790" y="285" width="230" height="80" rx="16" fill="#fee2e2" stroke="#f43f5e"/><text x="840" y="318" font-weight="700">Policy Layer</text><text x="820" y="345">consent·TTL·audit</text>
    <rect x="385" y="450" width="330" height="78" rx="18" fill="#e0f2fe" stroke="#0284c7"/><text x="445" y="483" font-weight="700">Agent / App Context</text><text x="435" y="508">short prompt, relevant facts, citations</text>
  </g>
  <g stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M230 214h60"/><path d="M380 225v45"/><path d="M470 185c45 10 55 55 65 70"/><path d="M470 310c45-5 55-35 65-55"/>
    <path d="M725 245c35-35 40-54 65-60"/><path d="M725 270c35 45 42 58 65 58"/>
    <path d="M905 225v60"/><path d="M905 365c-65 82-150 110-190 124"/><path d="M630 305c-15 65-35 105-65 145"/>
  </g>
</svg>
