    <rect x="930" y="330" width="210" height="72" rx="16" fill="#fff" stroke="#fb923c" stroke-width="2"/><text x="1035" y="374" text-anchor="middle" fill="#7c2d12" font-family="Arial, sans-serif" font-size="18" font-weight="700">단순성·YAGNI</text>
    <rect x="690" y="425" width="210" height="72" rx="16" fill="#fff" stroke="#fb923c" stroke-width="2"/><text x="795" y="469" text-anchor="middle" fill="#7c2d12" font-family="Arial, sans-serif" font-size="18" font-weight="700">시스템 실패 모드</text>
