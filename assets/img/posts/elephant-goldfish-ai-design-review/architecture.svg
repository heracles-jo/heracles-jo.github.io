  <text x="472" y="423" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="17">concept brief · design doc</text>
  <text x="472" y="452" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="17">근거 · 대안 · 중단 조건</text>
