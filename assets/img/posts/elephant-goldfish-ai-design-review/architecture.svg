<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Elephant-Goldfish Model 설계 리뷰 아키텍처</title>
  <desc id="desc">사람, 깊은 문맥의 설계 단계, 저장된 설계 문서, 독립된 다단계 리뷰와 구현·드리프트 검사를 연결한 흐름</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="60" y="65" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="800">설계 문맥과 리뷰 문맥을 분리하는 데이터 흐름</text>
  <text x="60" y="103" fill="#475569" font-family="Arial, sans-serif" font-size="20">역할 변경이 아니라 별도 실행 문맥과 지속 가능한 artifact가 핵심이다.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="200" height="125" rx="20" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <text x="155" y="202" text-anchor="middle" fill="#0f766e" font-family="Arial, sans-serif" font-size="25" font-weight="700">사람</text>
    <text x="155" y="235" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">목표·제약·승인</text>
    <text x="155" y="261" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">트레이드오프 결정</text>
    <rect x="330" y="145" width="285" height="145" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="472" y="188" text-anchor="middle" fill="#3730a3" font-family="Arial, sans-serif" font-size="24" font-weight="700">Elephant 문맥</text>
    <text x="472" y="222" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="17">코드 · 역사 · 요구사항 · 대화</text>
    <text x="472" y="251" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="17">brainstorm → draft</text>
    <rect x="690" y="145" width="450" height="145" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="915" y="188" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="24" font-weight="700">Goldfish 격리 문맥</text>
    <text x="915" y="222" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="17">설계 문서 + 참조 소스 + 버전 고정 기준</text>
    <text x="915" y="251" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="17">부모 대화는 제외, 읽기 권한은 최소화</text>
  </g>
  <path d="M255 217h70" stroke="#64748b" stroke-width="4"/><path d="m317 207 14 10-14 10" fill="none" stroke="#64748b" stroke-width="4"/>
