  <rect x="825" y="580" width="260" height="72" rx="16" fill="#1e293b" stroke="#38bdf8"/><text x="955" y="611" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="19">코드–문서 드리프트</text><text x="955" y="638" text-anchor="middle" fill="#bae6fd" font-family="Arial, sans-serif" font-size="16">사람이 갱신 방향 판정</text>
