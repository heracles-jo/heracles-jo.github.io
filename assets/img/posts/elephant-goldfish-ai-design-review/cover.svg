<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI 설계 문서 리뷰의 컨텍스트 격리</title>
  <desc id="desc">깊은 문맥을 가진 Elephant 설계자와 독립된 Goldfish 리뷰어 사이에 검증 경계를 둔 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="elephant" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="goldfish" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1015" cy="115" r="150" fill="#1d4ed8" opacity=".16"/><circle cx="190" cy="530" r="180" fill="#7c3aed" opacity=".14"/>
  <text x="76" y="104" fill="#93c5fd" font-family="Arial, sans-serif" font-size="26" font-weight="700">ELEPHANT–GOLDFISH MODEL</text>
  <text x="76" y="171" fill="#f8fafc" font-family="Arial, sans-serif" font-size="50" font-weight="800">AI 설계 문서 리뷰</text>
  <text x="76" y="225" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">기억하는 설계자와 잊는 리뷰어를 분리하라</text>
  <rect x="76" y="298" width="360" height="190" rx="24" fill="#111827" stroke="#818cf8" stroke-width="3"/>
  <circle cx="136" cy="355" r="31" fill="url(#elephant)"/><path d="M119 354c2-19 31-22 38-4 5 13-1 26-13 28v20h-12v-24c-9-4-14-11-13-20z" fill="#eef2ff" opacity=".9"/>
  <text x="188" y="349" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Elephant</text>
  <text x="188" y="383" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="20">프로젝트 문맥 · 요구사항 · 결정</text>
  <text x="108" y="443" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">설계 초안과 근거를 보존</text>
  <path d="M463 392h188" stroke="#60a5fa" stroke-width="5" stroke-dasharray="12 10"/><path d="m641 378 22 14-22 14" fill="none" stroke="#60a5fa" stroke-width="5"/>
  <rect x="687" y="298" width="437" height="190" rx="24" fill="#111827" stroke="#fb923c" stroke-width="3"/>
  <circle cx="749" cy="355" r="31" fill="url(#goldfish)"/><path d="M729 355c17-18 37-16 50 0-13 16-33 18-50 0zm50 0 17-12v24z" fill="#fff7ed" opacity=".95"/>
  <text x="801" y="349" fill="#ffedd5" font-family="Arial, sans-serif" font-size="28" font-weight="700">Goldfish</text>
  <text x="801" y="383" fill="#fdba74" font-family="Arial, sans-serif" font-size="20">이전 대화 없는 독립 검토</text>
  <text x="721" y="443" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">가정 · 누락 · 구현 위험 탐지</text>
  <rect x="76" y="528" width="1048" height="54" rx="15" fill="#0f172a" stroke="#334155"/>
  <text x="600" y="563" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" font-weight="700">컨텍스트 격리 · 증거 기반 finding · 사람의 최종 승인</text>
</svg>
