<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 설계 리뷰 도입 결정 기준</title>
  <desc id="desc">변경 위험, 컨텍스트 격리 증거, finding 품질, 운영 비용을 거쳐 전체 도입 또는 제한 도입을 결정하는 흐름</desc>
  <rect width="1200" height="760" rx="28" fill="#07111f"/>
  <text x="60" y="68" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="800">AI 설계 리뷰를 팀 게이트로 승격하기 전</text>
  <text x="60" y="106" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">리뷰어 수가 아니라 격리·증거·비용을 순서대로 확인한다.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="160" width="250" height="105" rx="19" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="195" y="202" text-anchor="middle" fill="#dbeafe" font-size="22" font-weight="700">1. 변경 위험</text><text x="195" y="236" text-anchor="middle" fill="#93c5fd" font-size="17">국소 수정인가, 구조 변경인가</text>
    <path d="M330 212h80" stroke="#64748b" stroke-width="4"/><path d="m400 201 16 11-16 11" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="425" y="160" width="310" height="105" rx="19" fill="#3b1d52" stroke="#c084fc" stroke-width="3"/>
    <text x="580" y="202" text-anchor="middle" fill="#f3e8ff" font-size="22" font-weight="700">2. 격리 증거</text><text x="580" y="236" text-anchor="middle" fill="#d8b4fe" font-size="17">부모 대화와 호스트 지침을 분리 확인</text>
    <path d="M745 212h80" stroke="#64748b" stroke-width="4"/><path d="m815 201 16 11-16 11" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="840" y="160" width="290" height="105" rx="19" fill="#3f2415" stroke="#fb923c" stroke-width="3"/>
    <text x="985" y="202" text-anchor="middle" fill="#ffedd5" font-size="22" font-weight="700">3. Finding 증거</text><text x="985" y="236" text-anchor="middle" fill="#fdba74" font-size="17">근거·실패 조건·조치가 있는가</text>
    <path d="M985 275v65" stroke="#64748b" stroke-width="4"/><path d="m974 330 11 16 11-16" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="790" y="355" width="340" height="115" rx="19" fill="#13352f" stroke="#34d399" stroke-width="3"/>
    <text x="960" y="399" text-anchor="middle" fill="#d1fae5" font-size="22" font-weight="700">4. 비용과 재작업</text><text x="960" y="433" text-anchor="middle" fill="#a7f3d0" font-size="17">triage·모델 비용까지 포함해 감소했는가</text>
    <path d="M780 413H660" stroke="#64748b" stroke-width="4"/><path d="m670 402-16 11 16 11" fill="none" stroke="#64748b" stroke-width="4"/>
    <polygon points="500,345 650,413 500,481 350,413" fill="#1e293b" stroke="#e2e8f0" stroke-width="3"/>
    <text x="500" y="405" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">고위험 변경에서</text><text x="500" y="434" text-anchor="middle" fill="#cbd5e1" font-size="17">유효 결함을 일찍 찾았는가?</text>
    <path d="M350 413H210" stroke="#ef4444" stroke-width="4"/><path d="m220 402-16 11 16 11" fill="none" stroke="#ef4444" stroke-width="4"/>
    <rect x="70" y="355" width="130" height="115" rx="18" fill="#451a1a" stroke="#f87171" stroke-width="3"/>
    <text x="135" y="400" text-anchor="middle" fill="#fee2e2" font-size="22" font-weight="700">아니오</text><text x="135" y="434" text-anchor="middle" fill="#fecaca" font-size="16">참고 도구로 제한</text>
    <path d="M500 491v80" stroke="#22c55e" stroke-width="4"/><path d="m489 561 11 16 11-16" fill="none" stroke="#22c55e" stroke-width="4"/>
    <rect x="315" y="590" width="370" height="105" rx="20" fill="#052e2b" stroke="#2dd4bf" stroke-width="3"/>
    <text x="500" y="633" text-anchor="middle" fill="#ccfbf1" font-size="23" font-weight="700">위험 기반 설계 게이트로 제한 도입</text><text x="500" y="667" text-anchor="middle" fill="#99f6e4" font-size="17">버전 고정 · 읽기 전용 · 사람 승인 · 지표 추적</text>
    <rect x="735" y="560" width="395" height="135" rx="20" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="765" y="600" fill="#f8fafc" font-size="20" font-weight="700">중단 신호</text>
    <text x="765" y="633" fill="#cbd5e1" font-size="17">• 독립성 검증 불가  • 일반론·중복 finding 증가</text>
    <text x="765" y="663" fill="#cbd5e1" font-size="17">• 구현 재설계 불변  • 문서가 즉시 드리프트</text>
  </g>
</svg>
