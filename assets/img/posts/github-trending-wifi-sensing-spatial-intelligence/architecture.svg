<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">WiFi sensing reference architecture</title>
  <desc id="desc">ESP32 CSI nodes send signals to an edge pipeline and policy layer</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient></defs>
  <rect width="1000" height="560" rx="28" fill="url(#g)"/>
  <text x="60" y="62" font-size="30" font-weight="800" font-family="Arial, sans-serif" fill="#0f172a">WiFi Sensing 운영 아키텍처</text>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="55" y="130" width="180" height="105" rx="18" fill="#0369a1"/><text x="82" y="175" fill="white">ESP32 CSI</text><text x="87" y="205" fill="#bae6fd" font-size="15">다중 노드</text>
    <rect x="295" y="130" width="180" height="105" rx="18" fill="#0891b2"/><text x="319" y="175" fill="white">Signal DSP</text><text x="326" y="205" fill="#cffafe" font-size="15">필터링·동기화</text>
    <rect x="535" y="130" width="180" height="105" rx="18" fill="#0f766e"/><text x="562" y="175" fill="white">Edge Inference</text><text x="570" y="205" fill="#ccfbf1" font-size="15">존재·움직임 추정</text>
    <rect x="775" y="130" width="170" height="105" rx="18" fill="#115e59"/><text x="805" y="175" fill="white">Event API</text><text x="800" y="205" fill="#ccfbf1" font-size="15">업무 시스템 연동</text>
  </g>
  <g stroke="#334155" stroke-width="4" marker-end="url(#a)"><path d="M235 182H295"/><path d="M475 182H535"/><path d="M715 182H775"/></g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#334155"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a">
    <rect x="80" y="330" width="245" height="95" rx="16" fill="#dbeafe"/><text x="110" y="370" font-weight="800">Privacy Gate</text><text x="110" y="398" font-size="15">카메라 대신 이벤트만 저장</text>
    <rect x="380" y="330" width="245" height="95" rx="16" fill="#ccfbf1"/><text x="410" y="370" font-weight="800">Observability</text><text x="410" y="398" font-size="15">오탐·지연·센서 상태 모니터링</text>
    <rect x="680" y="330" width="245" height="95" rx="16" fill="#cffafe"/><text x="710" y="370" font-weight="800">Policy Layer</text><text x="710" y="398" font-size="15">동의·보관·알림 기준 통제</text>
  </g>
</svg>
