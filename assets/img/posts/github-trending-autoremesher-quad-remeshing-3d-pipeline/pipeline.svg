<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">3D 자산 리메싱 운영 파이프라인</title><desc id="desc">입력 메시에서 자동 리메싱, 품질 검수, 수동 보정, 배포까지 이어지는 운영 단계</desc><rect width="1200" height="520" rx="28" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="60" y="72" fill="#f8fafc" font-size="34" font-weight="800">Remeshing Operations Loop</text><text x="60" y="108" fill="#94a3b8" font-size="18">자동화는 시작점이고, 품질 게이트와 예외 처리가 운영 신뢰도를 결정한다.</text></g><g transform="translate(60 170)" font-family="Arial, sans-serif"><g><rect width="180" height="155" rx="22" fill="#1e293b" stroke="#38bdf8"/><text x="24" y="46" fill="#e0f2fe" font-size="22" font-weight="700">1. 입력</text><text x="24" y="82" fill="#cbd5e1" font-size="15">스캔·조각·CAD</text><text x="24" y="110" fill="#cbd5e1" font-size="15">고밀도 삼각형</text></g><g transform="translate(230 0)"><rect width="180" height="155" rx="22" fill="#1e293b" stroke="#2dd4bf"/><text x="24" y="46" fill="#ccfbf1" font-size="22" font-weight="700">2. 자동 리메시</text><text x="24" y="82" fill="#cbd5e1" font-size="15">target quads</text><text x="24" y="110" fill="#cbd5e1" font-size="15">sharp edge·adaptivity</text></g><g transform="translate(460 0)"><rect width="180" height="155" rx="22" fill="#1e293b" stroke="#a78bfa"/><text x="24" y="46" fill="#ede9fe" font-size="22" font-weight="700">3. 검수</text><text x="24" y="82" fill="#cbd5e1" font-size="15">비매니폴드·UV</text><text x="24" y="110" fill="#cbd5e1" font-size="15">폴리곤 예산</text></g><g transform="translate(690 0)"><rect width="180" height="155" rx="22" fill="#1e293b" stroke="#fbbf24"/><text x="24" y="46" fill="#fef3c7" font-size="22" font-weight="700">4. 보정</text><text x="24" y="82" fill="#cbd5e1" font-size="15">리깅·애니메이션</text><text x="24" y="110" fill="#cbd5e1" font-size="15">수동 토폴로지</text></g><g transform="translate(920 0)"><rect width="180" height="155" rx="22" fill="#1e293b" stroke="#86efac"/><text x="24" y="46" fill="#dcfce7" font-size="22" font-weight="700">5. 배포</text><text x="24" y="82" fill="#cbd5e1" font-size="15">Blender·Unreal</text><text x="24" y="110" fill="#cbd5e1" font-size="15">디지털 트윈·AR</text></g><path d="M185 78h35M415 78h35M645 78h35M875 78h35" stroke="#64748b" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(170 392)" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 10"><path d="M840 0C690 70 230 70 80 0"/></g><text x="415" y="455" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">실패 샘플은 파라미터와 입력 정규화 단계로 되돌려 재처리한다</text></svg>