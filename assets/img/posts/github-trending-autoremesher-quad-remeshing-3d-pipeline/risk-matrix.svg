<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">자동 쿼드 리메싱 도입 리스크 매트릭스</title><desc id="desc">품질, 성능, 라이선스, 운영, 보안 관점의 도입 리스크와 대응 방안</desc><rect width="1200" height="500" fill="#fff7ed"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#7c2d12">Auto Remeshing Risk Matrix</text><text x="60" y="105" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">자동화 비율보다 실패를 조기에 발견하는 품질 게이트가 중요하다.</text><g transform="translate(70 150)" font-family="Arial, sans-serif"><g fill="#fed7aa" stroke="#fb923c"><rect width="205" height="210" rx="24"/><rect x="225" width="205" height="210" rx="24"/><rect x="450" width="205" height="210" rx="24"/><rect x="675" width="205" height="210" rx="24"/><rect x="900" width="205" height="210" rx="24"/></g><g fill="#431407"><text x="28" y="48" font-size="24" font-weight="700">품질</text><text x="28" y="88" font-size="15">엣지 흐름·홀·UV</text><text x="28" y="116" font-size="15">체크섬보다 시각 검수</text><text x="28" y="158" font-size="16" font-weight="700">대응: 샘플셋 회귀</text><text x="253" y="48" font-size="24" font-weight="700">성능</text><text x="253" y="88" font-size="15">대형 메시 메모리</text><text x="253" y="116" font-size="15">배치 처리 시간</text><text x="253" y="158" font-size="16" font-weight="700">대응: 폴리곤 예산</text><text x="478" y="48" font-size="24" font-weight="700">라이선스</text><text x="478" y="88" font-size="15">MIT 전환과 번들</text><text x="478" y="116" font-size="15">서드파티 고지</text><text x="478" y="158" font-size="16" font-weight="700">대응: SBOM 검토</text><text x="703" y="48" font-size="24" font-weight="700">운영</text><text x="703" y="88" font-size="15">CLI·GUI 버전 차이</text><text x="703" y="116" font-size="15">파라미터 표준화</text><text x="703" y="158" font-size="16" font-weight="700">대응: 프리셋 관리</text><text x="928" y="48" font-size="24" font-weight="700">보안</text><text x="928" y="88" font-size="15">외부 OBJ/PLY 입력</text><text x="928" y="116" font-size="15">CI 샌드박스 처리</text><text x="928" y="158" font-size="16" font-weight="700">대응: 격리 실행</text></g></g><path d="M70 410h1060" stroke="#fdba74" stroke-width="2"/><text x="70" y="448" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">권장 KPI: 자동 통과율, 수동 보정 시간, 엔진 임포트 실패율, 렌더링/애니메이션 결함 수</text></svg>