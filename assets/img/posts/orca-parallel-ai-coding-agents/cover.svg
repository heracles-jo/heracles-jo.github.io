<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">병렬 AI 코딩 에이전트 운영</title>
  <desc id="desc">하나의 기준 브랜치에서 여러 Git worktree와 AI 코딩 에이전트가 분기되고 검증 후 하나의 변경으로 합쳐지는 모습</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#173d5e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="100" r="190" fill="#38bdf8" opacity=".08"/><circle cx="115" cy="560" r="240" fill="#2dd4bf" opacity=".08"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" fill="#f8fafc">
    <text x="70" y="105" font-size="25" fill="#67e8f9" font-weight="700">ORCA · GIT WORKTREE · REVIEW GATES</text>
    <text x="70" y="177" font-size="52" font-weight="800">병렬 AI 코딩 에이전트 운영</text>
    <text x="70" y="224" font-size="25" fill="#cbd5e1">속도보다 중요한 것은 격리, 비교, 검증, 병합 규칙이다</text>
  </g>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" text-anchor="middle">
    <rect x="70" y="325" width="205" height="92" rx="18" fill="#0f766e"/><text x="172" y="362" fill="white" font-size="18" font-weight="700">기준 브랜치</text><text x="172" y="389" fill="#ccfbf1" font-size="15">tests + constraints</text>
    <path d="M275 371H350M350 371L390 305M350 371H390M350 371L390 437" stroke="#67e8f9" stroke-width="5" fill="none"/>
    <g fill="#1e40af"><rect x="390" y="265" width="210" height="78" rx="15"/><rect x="390" y="358" width="210" height="78" rx="15"/><rect x="390" y="451" width="210" height="78" rx="15"/></g>
    <g fill="white" font-size="17" font-weight="700"><text x="495" y="300">worktree A · Agent</text><text x="495" y="393">worktree B · Agent</text><text x="495" y="486">worktree C · Agent</text></g>
    <g fill="#bfdbfe" font-size="14"><text x="495" y="323">independent diff</text><text x="495" y="416">independent diff</text><text x="495" y="509">independent diff</text></g>
    <path d="M600 304L700 370M600 397L700 370M600 490L700 370" stroke="#93c5fd" stroke-width="4" fill="none"/>
    <rect x="700" y="315" width="205" height="112" rx="18" fill="#7c3aed"/><text x="802" y="355" fill="white" font-size="18" font-weight="700">검증·비교 게이트</text><text x="802" y="384" fill="#ede9fe" font-size="14">tests · diff · risk</text><text x="802" y="407" fill="#ede9fe" font-size="14">human review</text>
    <path d="M905 371H960" stroke="#c4b5fd" stroke-width="5"/>
    <rect x="960" y="325" width="170" height="92" rx="18" fill="#be123c"/><text x="1045" y="362" fill="white" font-size="18" font-weight="700">선택적 병합</text><text x="1045" y="389" fill="#ffe4e6" font-size="14">one coherent change</text>
  </g>
</svg>
