<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">병렬 AI 코딩 도입 의사결정</title><desc id="desc">작업 독립성, 검증 비용, 충돌 가능성, 보안 경계를 기준으로 직렬 실행과 병렬 worktree 실행을 선택하는 표</desc><rect width="1200" height="720" rx="24" fill="#0b1220"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif"><text x="60" y="70" fill="#f8fafc" font-size="35" font-weight="800">모든 문제를 다섯 에이전트에게 보내지 말 것</text><text x="60" y="108" fill="#94a3b8" font-size="19">병렬 실행의 이득은 후보 다양성이 검증·병합 비용보다 클 때만 남는다.</text>
<g font-size="18"><rect x="60" y="155" width="1080" height="70" rx="12" fill="#1e293b"/><text x="95" y="199" fill="white" font-weight="700">판단 기준</text><text x="390" y="199" fill="#67e8f9" font-weight="700">직렬 에이전트 1개</text><text x="760" y="199" fill="#c4b5fd" font-weight="700">병렬 worktree</text>
<g fill="#111c2f"><rect x="60" y="238" width="1080" height="78" rx="10"/><rect x="60" y="329" width="1080" height="78" rx="10"/><rect x="60" y="420" width="1080" height="78" rx="10"/><rect x="60" y="511" width="1080" height="78" rx="10"/></g>
<g fill="#e2e8f0"><text x="95" y="284" font-weight="700">작업 관계</text><text x="390" y="274">순차 의존·한 해답</text><text x="760" y="274">독립 가설·여러 대안</text><text x="95" y="375" font-weight="700">검증 방법</text><text x="390" y="365">사람 판단 중심</text><text x="760" y="365">테스트·벤치마크로 비교</text><text x="95" y="466" font-weight="700">변경 표면</text><text x="390" y="456">공유 파일이 많음</text><text x="760" y="456">경계가 작고 분리 가능</text><text x="95" y="557" font-weight="700">비용 구조</text><text x="390" y="547">모델·CI 예산 제한</text><text x="760" y="547">실패 조기 종료·예산 상한</text></g>
<g fill="#94a3b8" font-size="14"><text x="390" y="296">요구사항을 한 번씩 좁혀간다</text><text x="760" y="296">구현 전략 자체를 비교한다</text><text x="390" y="387">후보 수가 늘수록 리뷰 부담 증가</text><text x="760" y="387">동일한 품질 게이트 적용 가능</text><text x="390" y="478">충돌을 대화로 조정하는 편이 빠름</text><text x="760" y="478">worktree별 소유권이 명확함</text><text x="390" y="569">불필요한 중복 실행을 피함</text><text x="760" y="569">추가 비용보다 선택 가치가 큼</text></g></g>
<rect x="60" y="625" width="1080" height="55" rx="12" fill="#0f766e"/><text x="600" y="660" text-anchor="middle" fill="white" font-size="19" font-weight="700">PoC 지표: 채택률 · 검증 통과율 · 충돌 시간 · 리뷰 시간 · 후보당 비용</text></g></svg>
