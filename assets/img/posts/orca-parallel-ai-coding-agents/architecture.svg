<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">병렬 에이전트 worktree 아키텍처</title><desc id="desc">공통 기준점에서 작업별 브랜치와 worktree를 만들고 각 에이전트의 변경을 독립적으로 테스트한 뒤 검토 게이트에서 선택하는 구조</desc>
<rect width="1200" height="760" rx="24" fill="#071827"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif"><text x="60" y="68" fill="#f8fafc" font-size="34" font-weight="800">병렬화의 단위는 “프롬프트”가 아니라 “격리된 변경 후보”다</text><text x="60" y="105" fill="#94a3b8" font-size="19">같은 파일 시스템을 공유하면 속도는 올라가도 결과의 출처와 충돌 경계가 흐려진다.</text>
<g stroke="#38bdf8" stroke-width="4" fill="none"><path d="M210 220V300H375"/><path d="M210 300H825"/><path d="M210 300V540H375"/></g>
<g text-anchor="middle"><rect x="65" y="165" width="290" height="110" rx="16" fill="#0f766e"/><text x="210" y="207" fill="white" font-size="21" font-weight="700">Base commit</text><text x="210" y="239" fill="#ccfbf1" font-size="16">명세 · 테스트 · 금지 경계</text>
<rect x="375" y="145" width="360" height="145" rx="18" fill="#1d4ed8"/><text x="555" y="185" fill="white" font-size="20" font-weight="700">Worktree A · 최소 수정</text><text x="555" y="218" fill="#dbeafe" font-size="15">Agent 1 / branch A</text><text x="555" y="250" fill="#bfdbfe" font-size="15">diff + test evidence</text>
<rect x="375" y="320" width="360" height="145" rx="18" fill="#4338ca"/><text x="555" y="360" fill="white" font-size="20" font-weight="700">Worktree B · 대안 설계</text><text x="555" y="393" fill="#e0e7ff" font-size="15">Agent 2 / branch B</text><text x="555" y="425" fill="#c7d2fe" font-size="15">diff + benchmark</text>
<rect x="375" y="495" width="360" height="145" rx="18" fill="#6d28d9"/><text x="555" y="535" fill="white" font-size="20" font-weight="700">Worktree C · 실패 재현</text><text x="555" y="568" fill="#ede9fe" font-size="15">Agent 3 / branch C</text><text x="555" y="600" fill="#ddd6fe" font-size="15">reproducer + regression test</text>
<g stroke="#a5b4fc" stroke-width="4"><path d="M735 218H825V365"/><path d="M735 392H825"/><path d="M735 568H825V420"/></g>
<rect x="825" y="285" width="310" height="215" rx="20" fill="#9f1239"/><text x="980" y="330" fill="white" font-size="21" font-weight="700">Selection gate</text><text x="980" y="368" fill="#ffe4e6" font-size="16">요구사항 적합성</text><text x="980" y="400" fill="#ffe4e6" font-size="16">테스트 · 보안 · 성능</text><text x="980" y="432" fill="#ffe4e6" font-size="16">변경 크기 · 리뷰 가능성</text><text x="980" y="468" fill="white" font-size="16" font-weight="700">통과한 조각만 재구성·병합</text></g>
<text x="60" y="710" fill="#fbbf24" font-size="18" font-weight="700">핵심 불변식: 한 worktree = 한 소유자 = 한 검증 가능한 변경 후보</text></g></svg>
