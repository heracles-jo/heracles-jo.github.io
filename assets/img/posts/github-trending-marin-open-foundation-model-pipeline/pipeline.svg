<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">오픈 파운데이션 모델 개발 파이프라인</title>
  <desc id="desc">원천 데이터에서 필터링, 토크나이징, 사전학습, 후학습, 평가, 모델 카드와 실험 이슈까지 연결되는 재현 가능한 AI 모델 개발 파이프라인</desc>
  <rect width="1100" height="520" rx="28" fill="#f8fafc"/>
  <text x="54" y="64" fill="#0f172a" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="30" font-weight="800">Marin식 오픈 개발 파이프라인의 관찰 포인트</text>
  <text x="54" y="101" fill="#475569" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="18">모델 파일만 공개하는 것이 아니라, 데이터 혼합·학습 설정·평가·실패 기록을 함께 남기는 구조</text>
  <g transform="translate(54 155)" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif">
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <rect x="0" y="0" width="138" height="110" rx="18"/>
      <rect x="174" y="0" width="138" height="110" rx="18"/>
      <rect x="348" y="0" width="138" height="110" rx="18"/>
      <rect x="522" y="0" width="138" height="110" rx="18"/>
      <rect x="696" y="0" width="138" height="110" rx="18"/>
      <rect x="870" y="0" width="138" height="110" rx="18"/>
    </g>
    <g fill="#334155" font-size="17" font-weight="700" text-anchor="middle">
      <text x="69" y="42">Raw Data</text><text x="69" y="72" font-size="14" font-weight="500">출처·라이선스</text>
      <text x="243" y="42">Curation</text><text x="243" y="72" font-size="14" font-weight="500">정제·혼합</text>
      <text x="417" y="42">Tokenize</text><text x="417" y="72" font-size="14" font-weight="500">재현 가능한 입력</text>
      <text x="591" y="42">Pretrain</text><text x="591" y="72" font-size="14" font-weight="500">스케일링 실험</text>
      <text x="765" y="42">Posttrain</text><text x="765" y="72" font-size="14" font-weight="500">정렬·태스크화</text>
      <text x="939" y="42">Evaluate</text><text x="939" y="72" font-size="14" font-weight="500">벤치마크·카드</text>
    </g>
    <g stroke="#64748b" stroke-width="4" stroke-linecap="round">
      <path d="M146 55h20"/><path d="M320 55h20"/><path d="M494 55h20"/><path d="M668 55h20"/><path d="M842 55h20"/>
    </g>
    <g transform="translate(0 170)">
      <rect x="0" y="0" width="1008" height="128" rx="22" fill="#0f172a"/>
      <text x="32" y="40" fill="#e2e8f0" font-size="20" font-weight="800">운영 기록 계층</text>
      <text x="32" y="75" fill="#cbd5e1" font-size="16">GitHub 이슈·커밋, 실험 설정, WandB/로그 링크, 체크포인트, 모델 카드, 실패 실험 메모</text>
      <text x="32" y="105" fill="#93c5fd" font-size="16">의사결정자에게 중요한 질문: “이 모델을 다시 만들거나 감사할 수 있는가?”</text>
    </g>
  </g>
</svg>
