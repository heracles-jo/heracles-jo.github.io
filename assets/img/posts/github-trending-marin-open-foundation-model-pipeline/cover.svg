<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Marin과 오픈 파운데이션 모델 개발 파이프라인</title>
  <desc id="desc">데이터 큐레이션, 학습, 평가, 운영 기록을 하나의 공개 파이프라인으로 연결하는 오픈 파운데이션 모델 개발 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#133d57"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="210" fill="#67e8f9" opacity="0.12"/>
  <circle cx="135" cy="520" r="180" fill="#22d3ee" opacity="0.14"/>
  <g transform="translate(90 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="1020" height="400" rx="34" fill="#f8fafc" opacity="0.96"/>
    <text x="54" y="72" fill="#0f172a" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="38" font-weight="800">GitHub Trending: Marin</text>
    <text x="54" y="118" fill="#334155" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="23" font-weight="600">오픈 파운데이션 모델 개발이 ‘코드 저장소’에서 ‘운영 기록’으로 확장된다</text>
    <g transform="translate(54 170)">
      <g>
        <rect x="0" y="0" width="170" height="96" rx="20" fill="#dbeafe"/>
        <text x="85" y="42" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Arial" font-size="18" font-weight="700">Data</text>
        <text x="85" y="68" text-anchor="middle" fill="#1e40af" font-family="Inter, Arial" font-size="14">curation</text>
      </g>
      <path d="M182 48h70" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <polygon points="252,48 236,38 236,58" fill="#64748b"/>
      <g transform="translate(265 0)">
        <rect x="0" y="0" width="170" height="96" rx="20" fill="#ccfbf1"/>
        <text x="85" y="42" text-anchor="middle" fill="#115e59" font-family="Inter, Arial" font-size="18" font-weight="700">Train</text>
        <text x="85" y="68" text-anchor="middle" fill="#0f766e" font-family="Inter, Arial" font-size="14">pre/post</text>
      </g>
      <path d="M447 48h70" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <polygon points="517,48 501,38 501,58" fill="#64748b"/>
      <g transform="translate(530 0)">
        <rect x="0" y="0" width="170" height="96" rx="20" fill="#fef3c7"/>
        <text x="85" y="42" text-anchor="middle" fill="#92400e" font-family="Inter, Arial" font-size="18" font-weight="700">Evaluate</text>
        <text x="85" y="68" text-anchor="middle" fill="#b45309" font-family="Inter, Arial" font-size="14">benchmarks</text>
      </g>
      <path d="M712 48h70" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <polygon points="782,48 766,38 766,58" fill="#64748b"/>
      <g transform="translate(795 0)">
        <rect x="0" y="0" width="170" height="96" rx="20" fill="#fee2e2"/>
        <text x="85" y="42" text-anchor="middle" fill="#991b1b" font-family="Inter, Arial" font-size="18" font-weight="700">Record</text>
        <text x="85" y="68" text-anchor="middle" fill="#b91c1c" font-family="Inter, Arial" font-size="14">decisions</text>
      </g>
    </g>
    <text x="54" y="340" fill="#0f172a" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="26" font-weight="800">핵심 논지</text>
    <text x="54" y="374" fill="#334155" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="21">모델 가중치 공개보다 중요한 것은 데이터·실험·실패까지 재현 가능한 개발 체계다.</text>
  </g>
</svg>
