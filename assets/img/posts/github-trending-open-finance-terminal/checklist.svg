<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Adoption Checklist">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#173b4f"/></linearGradient><style>.title{font:700 42px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f7fbff}.subtitle{font:500 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b7c9d8}.check rect{fill:#102033;stroke:#2fe6a6;stroke-width:3}.check text{font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f7fbff}</style></defs>
  <rect width="1100" height="600" fill="url(#bg)"/><circle cx="1010" cy="80" r="120" fill="#2fe6a6" opacity="0.12"/><circle cx="90" cy="540" r="160" fill="#f8d66d" opacity="0.10"/>
  <text x="56" y="72" class="title">Adoption Checklist</text><text x="58" y="108" class="subtitle">오픈소스 금융 터미널 도입 전 점검할 항목</text>
  <g class="check"><rect x="90" y="120" width="430" height="85" rx="18"/><text x="130" y="174">✓ 데이터 라이선스와 사용 범위</text></g><g class="check"><rect x="580" y="120" width="430" height="85" rx="18"/><text x="620" y="174">✓ 계산 로직 테스트와 기준값</text></g><g class="check"><rect x="90" y="245" width="430" height="85" rx="18"/><text x="130" y="299">✓ 리포트 재현성과 감사 로그</text></g><g class="check"><rect x="580" y="245" width="430" height="85" rx="18"/><text x="620" y="299">✓ 권한·보안·취약점 관리</text></g><g class="check"><rect x="210" y="370" width="680" height="85" rx="18"/><text x="260" y="424">✓ 장애 대응, 결측 모니터링, 책임 경계</text></g>
</svg>
