<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Ossie semantic layer architecture</title><desc id="d">Sources and metric owners produce a validated Ossie contract consumed by BI tools and AI agents.</desc><rect width="1200" height="675" fill="#07111f"/><g font-family="system-ui,sans-serif"><text x="60" y="70" fill="#f8fafc" font-size="34" font-weight="750">공통 계약은 실행 엔진이 아니라 의미 교환 경계다</text><text x="60" y="108" fill="#94a3b8" font-size="19">정의 → 검증 → 변환 → 각 도구의 실행, 그리고 결과 비교</text><g fill="#10243d" stroke="#334155"><rect x="60" y="185" width="230" height="92" rx="16"/><rect x="60" y="320" width="230" height="92" rx="16"/><rect x="60" y="455" width="230" height="92" rx="16"/></g><g fill="#dbeafe" font-size="22"><text x="175" y="240" text-anchor="middle">dbt / Warehouse</text><text x="175" y="375" text-anchor="middle">Metric owner</text><text x="175" y="510" text-anchor="middle">기존 BI 모델</text></g><rect x="405" y="235" width="360" height="260" rx="28" fill="#0d3154" stroke="#22d3ee" stroke-width="3"/><text x="585" y="295" text-anchor="middle" fill="#67e8f9" font-size="27" font-weight="700">Apache Ossie Contract</text><text x="585" y="342" text-anchor="middle" fill="#e0f2fe" font-size="20">Dataset · Field · Relationship</text><text x="585" y="378" text-anchor="middle" fill="#e0f2fe" font-size="20">Measure · Metric · Expression</text><rect x="468" y="415" width="234" height="48" rx="12" fill="#164e63"/><text x="585" y="446" text-anchor="middle" fill="#cffafe" font-size="18">Schema + Golden Query Gate</text><g fill="#10243d" stroke="#334155"><rect x="900" y="185" width="240" height="92" rx="16"/><rect x="900" y="320" width="240" height="92" rx="16"/><rect x="900" y="455" width="240" height="92" rx="16"/></g><g fill="#ede9fe" font-size="22"><text x="1020" y="240" text-anchor="middle">BI Platform</text><text x="1020" y="375" text-anchor="middle">AI / Text-to-SQL</text><text x="1020" y="510" text-anchor="middle">Catalog / API</text></g><g stroke="#38bdf8" stroke-width="4" fill="none"><path d="M290 231H405"/><path d="M290 366H405"/><path d="M290 501H405"/><path d="M765 231H900"/><path d="M765 366H900"/><path d="M765 501H900"/></g><text x="60" y="625" fill="#fbbf24" font-size="19">주의: schema validation ≠ semantic equivalence. 결과 집계와 보안 정책은 실행 계층에서 다시 검증한다.</text></g></svg>