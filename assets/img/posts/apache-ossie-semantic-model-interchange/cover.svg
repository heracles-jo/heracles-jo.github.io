<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Apache Ossie semantic model interchange</title><desc id="desc">BI, data and AI tools exchange metric definitions through a common semantic contract.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#17345c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1040" cy="90" r="180" fill="#22d3ee" opacity=".08"/><circle cx="120" cy="610" r="220" fill="#818cf8" opacity=".09"/>
  <text x="72" y="105" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="22" font-weight="700">SEMANTIC CONTRACT</text>
  <text x="72" y="174" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="48" font-weight="800">Apache Ossie</text><text x="72" y="228" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="30">BI와 AI의 지표 의미를 이동시키는 표준</text>
  <g transform="translate(90 330)" font-family="system-ui,sans-serif"><rect width="210" height="110" rx="18" fill="#0f2745" stroke="#38bdf8"/><text x="105" y="64" text-anchor="middle" fill="#e0f2fe" font-size="25">BI 도구</text><rect x="810" width="210" height="110" rx="18" fill="#0f2745" stroke="#a78bfa"/><text x="915" y="64" text-anchor="middle" fill="#ede9fe" font-size="25">AI 에이전트</text><rect x="390" y="-35" width="330" height="180" rx="28" fill="#12355b" stroke="#67e8f9" stroke-width="3" filter="url(#glow)"/><text x="555" y="38" text-anchor="middle" fill="#f8fafc" font-size="27" font-weight="700">OSSIE YAML / JSON</text><text x="555" y="80" text-anchor="middle" fill="#bae6fd" font-size="20">Dataset · Dimension · Metric</text><text x="555" y="113" text-anchor="middle" fill="#bae6fd" font-size="20">Relationship · Expression</text><path d="M300 55H390M720 55H810" stroke="#67e8f9" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#67e8f9"/></marker></defs></g>
  <text x="72" y="610" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="20">Interoperability · Round-trip fidelity · Data governance</text>
</svg>