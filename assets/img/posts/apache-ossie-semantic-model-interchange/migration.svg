<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Ossie round-trip migration workflow</title><desc id="d">A staged workflow validates source metrics, export, import, golden queries and round-trip loss before adoption.</desc><rect width="1200" height="675" fill="#081321"/><g font-family="system-ui,sans-serif"><text x="60" y="72" fill="#f8fafc" font-size="34" font-weight="750">왕복 변환에서 의미 손실을 찾는 6단계</text><text x="60" y="110" fill="#94a3b8" font-size="19">파일 생성 성공보다 golden query 일치율과 metadata 보존률을 측정한다</text><g transform="translate(70 190)"><g fill="#102a46" stroke="#38bdf8"><rect width="150" height="120" rx="18"/><rect x="180" width="150" height="120" rx="18"/><rect x="360" width="150" height="120" rx="18"/><rect x="540" width="150" height="120" rx="18"/><rect x="720" width="150" height="120" rx="18"/><rect x="900" width="150" height="120" rx="18"/></g><g text-anchor="middle"><g fill="#67e8f9" font-size="18" font-weight="700"><text x="75" y="35">01</text><text x="255" y="35">02</text><text x="435" y="35">03</text><text x="615" y="35">04</text><text x="795" y="35">05</text><text x="975" y="35">06</text></g><g fill="#e2e8f0" font-size="18"><text x="75" y="72">핵심 지표</text><text x="75" y="96">선정</text><text x="255" y="72">Ossie</text><text x="255" y="96">Export</text><text x="435" y="72">Schema</text><text x="435" y="96">검증</text><text x="615" y="72">대상 도구</text><text x="615" y="96">Import</text><text x="795" y="72">Golden Query</text><text x="795" y="96">비교</text><text x="975" y="72">Re-export</text><text x="975" y="96">Diff</text></g></g><g stroke="#67e8f9" stroke-width="3"><path d="M150 60h30M330 60h30M510 60h30M690 60h30M870 60h30"/></g></g><rect x="120" y="405" width="960" height="150" rx="24" fill="#0f2035" stroke="#475569"/><text x="160" y="448" fill="#f8fafc" font-size="21" font-weight="700">배포 차단 기준</text><g fill="#cbd5e1" font-size="18"><text x="160" y="486">• 집계 결과 불일치 · 조인 cardinality 손실 · 시간대 의미 변경</text><text x="160" y="520">• 미지원 표현식의 무경고 누락 · 필수 소유자/정책 metadata 손실</text></g><text x="60" y="625" fill="#a5b4fc" font-size="19">PoC 결과: 변환 가능한 파일 수가 아니라 의미 동등성을 자동 판정할 수 있는 범위</text></g></svg>