  <circle cx="140" cy="220" r="14" fill="#22c55e"/><text x="176" y="228" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">편집 규칙을 문장으로 먼저 정리한다.</text><circle cx="140" cy="332" r="14" fill="#22c55e"/><text x="176" y="340" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">원본/중간/최종 산출물의 폴더 구조를 고정한다.</text><circle cx="140" cy="444" r="14" fill="#22c55e"/><text x="176" y="452" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">자막 규칙과 오디오 페이드 기준을 합의한다.</text><circle cx="140" cy="556" r="14" fill="#22c55e"/><text x="176" y="564" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">애니메이션 생성이 필요한 구간만 분리한다.</text><circle cx="140" cy="668" r="14" fill="#22c55e"/><text x="176" y="676" fill="#e5e7eb" font-size="24" font-family="Inter, Pretendard, Arial, sans-serif">최종 감수 체크리스트를 별도로 둔다.</text>
