<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Caddy adoption decision gates</title>
  <desc id="desc">Decision workflow covering certificate state, configuration reloads, streaming connections and operational ownership</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Caddy 도입을 결정하는 2주 PoC 게이트</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="125" width="235" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="187" y="168" text-anchor="middle" fill="#075985" font-size="24" font-weight="700">1. 기준선</text>
    <text x="187" y="204" text-anchor="middle" fill="#0369a1" font-size="18">도메인 · upstream · SLO</text>
    <rect x="355" y="125" width="235" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="472" y="168" text-anchor="middle" fill="#92400e" font-size="24" font-weight="700">2. TLS 실패 주입</text>
    <text x="472" y="204" text-anchor="middle" fill="#b45309" font-size="18">DNS · CA · read-only storage</text>
    <rect x="640" y="125" width="235" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="757" y="168" text-anchor="middle" fill="#4c1d95" font-size="24" font-weight="700">3. Reload 경쟁</text>
    <text x="757" y="204" text-anchor="middle" fill="#6d28d9" font-size="18">validate · ETag · rollback</text>
    <rect x="925" y="125" width="235" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1042" y="168" text-anchor="middle" fill="#166534" font-size="24" font-weight="700">4. Stream 검증</text>
    <text x="1042" y="204" text-anchor="middle" fill="#15803d" font-size="18">SSE · WebSocket · gRPC</text>
  </g>
  <path d="M305 185 H335 M590 185 H620 M875 185 H905" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1042 245 V320 H600 V365" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="600,360 790,470 600,580 410,470" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
  <text x="600" y="448" text-anchor="middle" fill="#164e63" font-family="Arial, sans-serif" font-size="25" font-weight="700">상태 전이를 설명하고</text>
  <text x="600" y="482" text-anchor="middle" fill="#164e63" font-family="Arial, sans-serif" font-size="25" font-weight="700">재현할 수 있는가?</text>
  <text x="600" y="520" text-anchor="middle" fill="#0e7490" font-family="Arial, sans-serif" font-size="18">인증서 · active config · 연결 수명 · rollback</text>
  <path d="M410 470 H265" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M790 470 H935" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="65" y="405" width="200" height="130" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="452" text-anchor="middle" fill="#991b1b" font-family="Arial, sans-serif" font-size="24" font-weight="700">중단</text>
  <text x="165" y="490" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="18">관리형 edge 또는</text>
  <text x="165" y="518" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="18">기존 gateway 유지</text>
  <rect x="935" y="405" width="200" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1035" y="452" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700">제한 확대</text>
  <text x="1035" y="490" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="18">canary domain부터</text>
  <text x="1035" y="518" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="18">patch gate 유지</text>
  <rect x="185" y="650" width="830" height="60" rx="16" fill="#0f172a"/>
  <text x="600" y="688" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="21">합격 기준은 짧은 설정이 아니라 실패·복구·업그레이드의 반복 가능성이다</text>
</svg>
