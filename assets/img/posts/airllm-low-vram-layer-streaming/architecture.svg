<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">AirLLM 레이어 스트리밍 추론 경로</title><desc id="d">모델 다운로드와 레이어 분할부터 NVMe, RAM, GPU 계산, 다음 토큰 생성까지의 흐름</desc><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#0f172a}.s{font-size:18px;fill:#334155}.b{font-size:20px;font-weight:700;fill:#fff}.n{font-size:17px;fill:#0f172a}.box{stroke-width:2}</style><text x="60" y="62" class="h">레이어 스트리밍: 용량 제약을 I/O 경로로 이동</text><text x="60" y="96" class="s">최초 준비 경로와 토큰별 반복 경로를 분리해 측정해야 한다</text>
<g transform="translate(60 145)"><rect width="230" height="100" rx="16" fill="#334155"/><text x="115" y="43" text-anchor="middle" class="b">Hugging Face 모델</text><text x="115" y="72" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="16">revision + tokenizer</text></g><path d="M290 195H390" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(400 145)"><rect width="230" height="100" rx="16" fill="#475569"/><text x="115" y="43" text-anchor="middle" class="b">최초 레이어 분할</text><text x="115" y="72" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="16">원본 + shard 공간</text></g><path d="M630 195H730" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(740 145)"><rect width="400" height="100" rx="16" fill="#1d4ed8"/><text x="200" y="43" text-anchor="middle" class="b">NVMe layer shards</text><text x="200" y="72" text-anchor="middle" fill="#dbeafe" font-family="Arial" font-size="16">layer 1 · layer 2 · … · layer N</text></g>
<line x1="60" y1="292" x2="1140" y2="292" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="326" class="s">각 생성 단계에서 반복</text>
<g transform="translate(70 372)"><rect width="210" height="116" rx="16" fill="#2563eb"/><text x="105" y="45" text-anchor="middle" class="b">NVMe read</text><text x="105" y="77" text-anchor="middle" fill="#dbeafe" font-family="Arial" font-size="16">layer k bytes</text></g><path d="M280 430H374" stroke="#0ea5e9" stroke-width="6" marker-end="url(#a)"/>
<g transform="translate(390 372)"><rect width="180" height="116" rx="16" fill="#0891b2"/><text x="90" y="45" text-anchor="middle" class="b">Host RAM</text><text x="90" y="77" text-anchor="middle" fill="#cffafe" font-family="Arial" font-size="16">prefetch buffer</text></g><path d="M570 430H664" stroke="#0ea5e9" stroke-width="6" marker-end="url(#a)"/>
<g transform="translate(680 350)"><rect width="220" height="160" rx="20" fill="#16a34a"/><text x="110" y="48" text-anchor="middle" class="b">Small VRAM</text><rect x="35" y="68" width="150" height="50" rx="8" fill="#bbf7d0"/><text x="110" y="100" text-anchor="middle" class="n" font-weight="700">layer k compute</text><text x="110" y="143" text-anchor="middle" fill="#dcfce7" font-family="Arial" font-size="15">then evict</text></g><path d="M900 430H994" stroke="#f59e0b" stroke-width="6" marker-end="url(#a)"/>
<g transform="translate(1010 372)"><rect width="140" height="116" rx="16" fill="#d97706"/><text x="70" y="44" text-anchor="middle" class="b">Activation</text><text x="70" y="75" text-anchor="middle" fill="#fef3c7" font-family="Arial" font-size="15">next layer</text></g>
<path d="M1080 505 C1080 610 175 610 175 505" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#a)"/><text x="590" y="646" text-anchor="middle" class="s">layer N 완료 후 token 생성 · 다음 token에서도 전체 레이어 경로 반복</text><text x="590" y="680" text-anchor="middle" fill="#b91c1c" font-family="Arial" font-size="18" font-weight="700">병목 후보: disk bandwidth · host-to-device transfer · GPU idle · shard 준비</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#64748b"/></marker></defs></svg>
