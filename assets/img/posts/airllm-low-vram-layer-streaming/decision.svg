<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">저VRAM LLM 추론 PoC 의사결정</title><desc id="d">AirLLM과 양자화 소형 모델 및 API를 비교하는 측정 기준</desc><rect width="1200" height="700" fill="#0b1220"/><style>text{font-family:Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#f8fafc}.s{font-size:18px;fill:#cbd5e1}.th{font-size:21px;font-weight:700;fill:#fff}.n{font-size:17px;fill:#dbeafe}.m{font-size:16px;fill:#cbd5e1}</style><text x="60" y="64" class="h">최대 모델 크기가 아니라 유효 처리량으로 결정</text><text x="60" y="99" class="s">같은 prompt set · 같은 품질 기준 · 같은 운영 시간으로 세 경로를 비교한다</text>
<g transform="translate(55 150)"><rect width="340" height="420" rx="22" fill="#172554" stroke="#3b82f6" stroke-width="2"/><text x="170" y="48" text-anchor="middle" class="th">AirLLM 스트리밍</text><text x="26" y="92" class="n">✓ 매우 작은 VRAM</text><text x="26" y="126" class="n">✓ 거대 모델 호환성 시험</text><text x="26" y="180" class="m">측정</text><text x="26" y="214" class="n">• shard 준비 시간·공간</text><text x="26" y="248" class="n">• NVMe read / GPU idle</text><text x="26" y="282" class="n">• TTFT / inter-token latency</text><text x="26" y="336" class="m">적합</text><text x="26" y="370" class="n">저빈도 배치 · 연구 · smoke test</text></g>
<g transform="translate(430 150)"><rect width="340" height="420" rx="22" fill="#143225" stroke="#22c55e" stroke-width="2"/><text x="170" y="48" text-anchor="middle" class="th">작은 양자화 모델</text><text x="26" y="92" class="n">✓ 상주 가중치와 batching</text><text x="26" y="126" class="n">✓ 대화형 지연에 유리</text><text x="26" y="180" class="m">측정</text><text x="26" y="214" class="n">• task success / 품질 손실</text><text x="26" y="248" class="n">• tokens/sec / 동시성</text><text x="26" y="282" class="n">• kernel·GPU 호환성</text><text x="26" y="336" class="m">적합</text><text x="26" y="370" class="n">반복 호출 · 로컬 API · agent loop</text></g>
<g transform="translate(805 150)"><rect width="340" height="420" rx="22" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="170" y="48" text-anchor="middle" class="th">관리형 모델 API</text><text x="26" y="92" class="n">✓ 서빙 운영 최소화</text><text x="26" y="126" class="n">✓ 탄력적 처리량</text><text x="26" y="180" class="m">측정</text><text x="26" y="214" class="n">• 응답 품질·지연·단가</text><text x="26" y="248" class="n">• 데이터·지역 경계</text><text x="26" y="282" class="n">• rate limit / 종속성</text><text x="26" y="336" class="m">적합</text><text x="26" y="370" class="n">빠른 도입 · 변동 트래픽</text></g>
<rect x="160" y="615" width="880" height="48" rx="24" fill="#1e293b"/><text x="600" y="646" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="19" font-weight="700">합격 = 품질 기준 통과 응답 수 ÷ 총 시간·비용·운영 위험</text></svg>
