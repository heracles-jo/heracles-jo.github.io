<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Meshery cloud native management cover</title>
  <desc id="desc">Kubernetes clusters, policy validation, GitOps design, and performance feedback connected through a cloud native management plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="170" fill="#14b8a6" opacity="0.12"/>
  <circle cx="170" cy="530" r="210" fill="#60a5fa" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="135" y="115" width="930" height="390" rx="34" fill="#0f172a" opacity="0.92" stroke="#5eead4" stroke-opacity="0.55"/>
    <text x="190" y="190" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Meshery와 Cloud Native Manager</text>
    <text x="190" y="235" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24">GitHub Trending으로 읽는 Kubernetes 운영 평면의 재편</text>
    <g transform="translate(190 285)">
      <rect x="0" y="0" width="190" height="92" rx="18" fill="#1e40af"/>
      <text x="95" y="38" text-anchor="middle" fill="#dbeafe" font-family="Inter, Arial" font-size="21" font-weight="700">Design</text>
      <text x="95" y="66" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Arial" font-size="16">Topology · Patterns</text>
      <rect x="236" y="0" width="190" height="92" rx="18" fill="#0f766e"/>
      <text x="331" y="38" text-anchor="middle" fill="#ccfbf1" font-family="Inter, Arial" font-size="21" font-weight="700">Validate</text>
      <text x="331" y="66" text-anchor="middle" fill="#99f6e4" font-family="Inter, Arial" font-size="16">Dry-run · Policy</text>
      <rect x="472" y="0" width="190" height="92" rx="18" fill="#7c3aed"/>
      <text x="567" y="38" text-anchor="middle" fill="#ede9fe" font-family="Inter, Arial" font-size="21" font-weight="700">Operate</text>
      <text x="567" y="66" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Arial" font-size="16">Multi-cluster</text>
      <rect x="708" y="0" width="190" height="92" rx="18" fill="#be123c"/>
      <text x="803" y="38" text-anchor="middle" fill="#ffe4e6" font-family="Inter, Arial" font-size="21" font-weight="700">Measure</text>
      <text x="803" y="66" text-anchor="middle" fill="#fecdd3" font-family="Inter, Arial" font-size="16">Performance</text>
      <path d="M190 46 L236 46 M426 46 L472 46 M662 46 L708 46" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    </g>
    <text x="190" y="445" fill="#94a3b8" font-family="Inter, Arial" font-size="20">Kubernetes · GitOps · OPA without Rego · Prometheus · Grafana · Fortio</text>
  </g>
</svg>
