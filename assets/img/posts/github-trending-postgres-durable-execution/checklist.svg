<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">pg_durable adoption checklist</title>
  <desc id="desc">A practical checklist for evaluating Postgres durable execution in production.</desc>
  <rect width="1100" height="620" rx="24" fill="#0f172a"/>
  <circle cx="930" cy="90" r="140" fill="#38bdf8" opacity="0.12"/>
  <circle cx="160" cy="540" r="180" fill="#22c55e" opacity="0.12"/>
  <text x="70" y="78" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#f8fafc">pg_durable PoC 체크리스트</text>
  <text x="70" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">정상 경로보다 실패·복구·권한·부하 격리를 먼저 검증해야 한다.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">
    <g transform="translate(80 160)">
      <rect width="455" height="78" rx="18" fill="#1e293b" stroke="#38bdf8"/>
      <circle cx="40" cy="39" r="17" fill="#0ea5e9"/><path d="M31 39l7 7 13-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="34" font-weight="800">작업 범위 축소</text><text x="76" y="59" font-size="15" fill="#94a3b8">DB 내부 상태 변경이 대부분인 워크플로부터 선택</text>
    </g>
    <g transform="translate(565 160)">
      <rect width="455" height="78" rx="18" fill="#1e293b" stroke="#22c55e"/>
      <circle cx="40" cy="39" r="17" fill="#22c55e"/><path d="M31 39l7 7 13-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="34" font-weight="800">Idempotency 설계</text><text x="76" y="59" font-size="15" fill="#94a3b8">재실행·중복 처리·부분 실패를 SQL 제약으로 방어</text>
    </g>
    <g transform="translate(80 265)">
      <rect width="455" height="78" rx="18" fill="#1e293b" stroke="#f97316"/>
      <circle cx="40" cy="39" r="17" fill="#f97316"/><path d="M31 39l7 7 13-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="34" font-weight="800">장애 주입 테스트</text><text x="76" y="59" font-size="15" fill="#94a3b8">재시작, rollback, lock timeout, 병렬 branch 실패 검증</text>
    </g>
    <g transform="translate(565 265)">
      <rect width="455" height="78" rx="18" fill="#1e293b" stroke="#a78bfa"/>
      <circle cx="40" cy="39" r="17" fill="#8b5cf6"/><path d="M31 39l7 7 13-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="34" font-weight="800">운영 조회 쿼리</text><text x="76" y="59" font-size="15" fill="#94a3b8">상태, 실패 원인, 오래 걸리는 단계, 재처리 대상 확인</text>
    </g>
    <g transform="translate(80 370)">
      <rect width="455" height="78" rx="18" fill="#1e293b" stroke="#f43f5e"/>
      <circle cx="40" cy="39" r="17" fill="#f43f5e"/><path d="M31 39l7 7 13-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="34" font-weight="800">부하 격리</text><text x="76" y="59" font-size="15" fill="#94a3b8">OLTP 지연, worker 수, statement timeout 기준 수립</text>
    </g>
    <g transform="translate(565 370)">
      <rect width="455" height="78" rx="18" fill="#1e293b" stroke="#eab308"/>
      <circle cx="40" cy="39" r="17" fill="#eab308"/><path d="M31 39l7 7 13-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="34" font-weight="800">권한 모델</text><text x="76" y="59" font-size="15" fill="#94a3b8">확장, 실행, 내부 테이블, 외부 호출 권한 분리</text>
    </g>
  </g>
  <text x="550" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">도입 결론은 “큐 제거”가 아니라 “Postgres로 가져올 책임의 경계”에서 나온다.</text>
</svg>
