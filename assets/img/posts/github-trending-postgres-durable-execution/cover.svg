<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">pg_durable and PostgreSQL durable execution</title>
  <desc id="desc">PostgreSQL database core connected to durable workflow checkpoints and background workers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="150" fill="#38bdf8" opacity="0.12"/>
  <circle cx="150" cy="520" r="210" fill="#14b8a6" opacity="0.14"/>
  <g transform="translate(112 96)" filter="url(#shadow)">
    <rect x="0" y="0" width="976" height="438" rx="34" fill="#f8fafc" opacity="0.98"/>
    <rect x="48" y="54" width="300" height="318" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <ellipse cx="198" cy="112" rx="92" ry="34" fill="#1d4ed8" opacity="0.92"/>
    <path d="M106 112v132c0 19 41 34 92 34s92-15 92-34V112" fill="#2563eb" opacity="0.85"/>
    <ellipse cx="198" cy="244" rx="92" ry="34" fill="#3b82f6"/>
    <text x="198" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">PostgreSQL</text>
    <text x="198" y="358" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">state + checkpoints</text>

    <g font-family="Inter, Arial, sans-serif" font-weight="700" font-size="20" fill="#0f172a">
      <rect x="430" y="66" width="178" height="74" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
      <text x="519" y="111" text-anchor="middle">df.start()</text>
      <rect x="688" y="66" width="194" height="74" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
      <text x="785" y="111" text-anchor="middle">SQL graph</text>
      <rect x="430" y="210" width="178" height="74" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
      <text x="519" y="255" text-anchor="middle">worker</text>
      <rect x="688" y="210" width="194" height="74" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
      <text x="785" y="255" text-anchor="middle">retry/resume</text>
    </g>
    <g stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M348 180 C390 125 395 106 430 103"/>
      <path d="M608 103 H688"/>
      <path d="M785 140 C785 173 785 181 785 210"/>
      <path d="M688 247 H608"/>
      <path d="M430 247 C382 247 375 247 348 247"/>
    </g>
    <text x="48" y="430" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#0f172a">pg_durable</text>
    <text x="292" y="430" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#334155">Postgres 내부로 들어온 Durable Execution</text>
  </g>
</svg>
