<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 튜터 장기 기억 의사결정 게이트</title>
  <desc id="desc">근거, 정정, 격리, 삭제와 학습 효과에 따라 확대와 중단을 결정하는 흐름</desc>
  <rect width="1200" height="720" rx="24" fill="#0b1220"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">개인화 확대 전, 잘못된 기억이 되돌아가는지 먼저 증명한다</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 135)"><rect width="210" height="170" rx="20" fill="#102f46" stroke="#38bdf8" stroke-width="2"/><text x="26" y="42" font-size="24" font-weight="700" fill="#7dd3fc">1. 근거</text><text x="26" y="84" font-size="18" fill="#dbeafe">원본 사건 추적</text><text x="26" y="118" font-size="18" fill="#dbeafe">모델·시각·신뢰도</text><text x="26" y="150" font-size="18" fill="#dbeafe">unsupported 0에 수렴</text></g>
    <g transform="translate(355 135)"><rect width="210" height="170" rx="20" fill="#30255a" stroke="#a78bfa" stroke-width="2"/><text x="26" y="42" font-size="24" font-weight="700" fill="#ddd6fe">2. 정정</text><text x="26" y="84" font-size="18" fill="#ede9fe">반증·supersede</text><text x="26" y="118" font-size="18" fill="#ede9fe">추천 재계산</text><text x="26" y="150" font-size="18" fill="#ede9fe">stale 재주입 차단</text></g>
    <g transform="translate(640 135)"><rect width="210" height="170" rx="20" fill="#193c2a" stroke="#22c55e" stroke-width="2"/><text x="26" y="42" font-size="24" font-weight="700" fill="#bbf7d0">3. 격리</text><text x="26" y="84" font-size="18" fill="#dcfce7">계정·공간·역할</text><text x="26" y="118" font-size="18" fill="#dcfce7">provider 최소 전송</text><text x="26" y="150" font-size="18" fill="#dcfce7">canary 유출 0건</text></g>
    <g transform="translate(925 135)"><rect width="210" height="170" rx="20" fill="#4b2d17" stroke="#f59e0b" stroke-width="2"/><text x="26" y="42" font-size="24" font-weight="700" fill="#fde68a">4. 삭제</text><text x="26" y="84" font-size="18" fill="#ffedd5">DB·vector·cache</text><text x="26" y="118" font-size="18" fill="#ffedd5">export·log·backup</text><text x="26" y="150" font-size="18" fill="#ffedd5">복구 후 재등장 0건</text></g>
    <path d="M280 220 H345 M565 220 H630 M850 220 H915" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(115 410)"><rect width="290" height="175" rx="22" fill="#16351f" stroke="#4ade80" stroke-width="3"/><text x="35" y="48" font-size="28" font-weight="800" fill="#86efac">확대</text><text x="35" y="91" font-size="19" fill="#dcfce7">학습 효과가 baseline 개선</text><text x="35" y="126" font-size="19" fill="#dcfce7">정정·삭제 SLA 충족</text><text x="35" y="157" font-size="19" fill="#dcfce7">교사·학습자 통제 가능</text></g>
    <g transform="translate(455 410)"><rect width="290" height="175" rx="22" fill="#493715" stroke="#facc15" stroke-width="3"/><text x="35" y="48" font-size="28" font-weight="800" fill="#fde047">보류</text><text x="35" y="91" font-size="19" fill="#fef3c7">효과가 불명확하거나 비용 과다</text><text x="35" y="126" font-size="19" fill="#fef3c7">stale 기억 탐지는 가능</text><text x="35" y="157" font-size="19" fill="#fef3c7">좁은 PoC에서 개선</text></g>
    <g transform="translate(795 410)"><rect width="290" height="175" rx="22" fill="#4a1f29" stroke="#fb7185" stroke-width="3"/><text x="35" y="48" font-size="28" font-weight="800" fill="#fda4af">중단</text><text x="35" y="91" font-size="19" fill="#ffe4e6">타 사용자·공간 데이터 유출</text><text x="35" y="126" font-size="19" fill="#ffe4e6">정정 전 판단이 재주입</text><text x="35" y="157" font-size="19" fill="#ffe4e6">근거·삭제 범위 설명 불가</text></g>
  </g>
  <text x="60" y="665" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">핵심 원칙: 더 많이 기억하는 것보다 잘못 기억했을 때 피해를 제한하는 능력이 우선이다.</text>
</svg>
