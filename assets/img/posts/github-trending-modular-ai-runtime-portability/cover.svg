    <text x="130" y="165" fill="#c4b5fd" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="28" font-weight="700">GitHub Trending Analysis</text>
    <text x="130" y="232" fill="#ffffff" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="58" font-weight="800">Modular MAX · Mojo</text>
    <text x="130" y="292" fill="#e5e7eb" font-family="Inter, Apple SD Gothic Neo, Arial, sans-serif" font-size="34" font-weight="600">AI 런타임 이식성의 새 기준</text>
    <g transform="translate(130 352)">
      <rect x="0" y="0" width="210" height="88" rx="18" fill="#1d4ed8"/>
      <text x="105" y="36" text-anchor="middle" fill="#dbeafe" font-size="18" font-weight="700" font-family="Inter, Arial">Python API</text>
      <text x="105" y="62" text-anchor="middle" fill="#bfdbfe" font-size="14" font-family="Inter, Arial">model pipelines</text>
      <path d="M225 44h72" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
      <path d="M287 34l18 10-18 10" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="320" y="0" width="210" height="88" rx="18" fill="#7c3aed"/>
      <text x="425" y="36" text-anchor="middle" fill="#ede9fe" font-size="18" font-weight="700" font-family="Inter, Arial">MAX Graph</text>
      <text x="425" y="62" text-anchor="middle" fill="#ddd6fe" font-size="14" font-family="Inter, Arial">serve · benchmark</text>
      <path d="M545 44h72" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
      <path d="M607 34l18 10-18 10" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="640" y="0" width="210" height="88" rx="18" fill="#0f766e"/>
      <text x="745" y="36" text-anchor="middle" fill="#ccfbf1" font-size="18" font-weight="700" font-family="Inter, Arial">Mojo Kernels</text>
      <text x="745" y="62" text-anchor="middle" fill="#99f6e4" font-size="14" font-family="Inter, Arial">GPU programming</text>
    </g>
