<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Modular MAX와 Mojo가 제시하는 AI 런타임 이식성</title>
  <desc id="desc">Python 모델 코드에서 MAX 그래프, Mojo 커널, NVIDIA·AMD·Apple GPU로 이어지는 멀티 하드웨어 AI 런타임 계층을 표현한 커버 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="48%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="105" r="170" fill="#67e8f9" opacity="0.12"/>
  <circle cx="170" cy="520" r="210" fill="#f97316" opacity="0.12"/>
  <g filter="url(#shadow)">
