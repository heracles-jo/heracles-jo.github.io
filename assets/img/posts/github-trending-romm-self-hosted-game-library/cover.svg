<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RomM self-hosted game library architecture</title>
  <desc id="desc">ROM files flow through scan, metadata enrichment, catalog, browser play and controlled sharing in a self-hosted game library stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="180" fill="#22d3ee" opacity="0.12"/>
  <circle cx="130" cy="540" r="210" fill="#a78bfa" opacity="0.14"/>
  <g filter="url(#shadow)">
    <rect x="80" y="72" width="1040" height="486" rx="34" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22"/>
  </g>
  <text x="118" y="145" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="28" fill="#93c5fd" font-weight="700">GitHub Trending Analysis</text>
  <text x="118" y="208" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="58" fill="#ffffff" font-weight="800">RomM과 셀프호스팅</text>
  <text x="118" y="272" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="58" fill="#ffffff" font-weight="800">게임 라이브러리 운영</text>
  <text x="120" y="326" font-family="Inter, Apple SD Gothic Neo, Pretendard, Arial, sans-serif" font-size="23" fill="#dbeafe">ROM 스캔 · 메타데이터 보강 · 브라우저 실행 · 권한 공유</text>
  <g transform="translate(132 382)">
