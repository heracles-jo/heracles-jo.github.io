    <circle cx="140" cy="75" r="6" fill="#0f172a"/>
    <text x="115" y="132" text-anchor="middle" font-family="Inter, Arial" font-size="17" fill="#bfdbfe" font-weight="700">Digital Preservation</text>
  </g>
</svg>
