    <text x="582" y="60" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#a7f3d0">IGDB / Art</text>
    <path d="M678 41 H738" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/>
    <path d="M738 41 l-14 -9 v18 z" fill="#bfdbfe"/>
    <rect x="750" y="0" width="165" height="82" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.75"/>
    <text x="832" y="36" text-anchor="middle" font-family="Inter, Arial" font-size="18" fill="#fffbeb" font-weight="700">Browser Play</text>
    <text x="832" y="60" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#fde68a">EmulatorJS</text>
