    <text x="82" y="60" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#93c5fd">NAS / Storage</text>
    <path d="M178 41 H238" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/>
    <path d="M238 41 l-14 -9 v18 z" fill="#bfdbfe"/>
    <rect x="250" y="0" width="165" height="82" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.75"/>
    <text x="332" y="36" text-anchor="middle" font-family="Inter, Arial" font-size="18" fill="#f5f3ff" font-weight="700">RomM</text>
    <text x="332" y="60" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#c4b5fd">Scan & Catalog</text>
    <path d="M428 41 H488" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/>
    <path d="M488 41 l-14 -9 v18 z" fill="#bfdbfe"/>
    <rect x="500" y="0" width="165" height="82" rx="18" fill="#0f172a" stroke="#34d399" stroke-opacity="0.75"/>
