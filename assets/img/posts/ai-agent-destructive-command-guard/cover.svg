<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트 위험 명령 차단</title>
  <desc id="desc">AI 에이전트와 셸 사이의 dcg가 위험 명령을 차단하는 커버 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#18253d"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="80" r="180" fill="#2563eb" opacity=".12"/><circle cx="80" cy="590" r="210" fill="#ef4444" opacity=".09"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <text x="76" y="110" fill="#7dd3fc" font-size="24" font-weight="700" letter-spacing="2">AGENT EXECUTION SAFETY</text>
    <text x="76" y="183" fill="#f8fafc" font-size="52" font-weight="800">AI 에이전트 위험 명령 차단</text>
    <text x="76" y="232" fill="#cbd5e1" font-size="26">프롬프트가 아니라 실행 직전의 강제 통제점</text>
    <g transform="translate(76 300)" filter="url(#shadow)">
      <rect width="690" height="210" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <circle cx="30" cy="30" r="7" fill="#ef4444"/><circle cx="54" cy="30" r="7" fill="#f59e0b"/><circle cx="78" cy="30" r="7" fill="#22c55e"/>
      <text x="30" y="88" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="25">agent $ git reset --hard HEAD~5</text>
      <rect x="28" y="116" width="634" height="64" rx="10" fill="#3f1017" stroke="#ef4444"/>
      <text x="52" y="157" fill="#fca5a5" font-size="27" font-weight="800">BLOCKED</text>
      <text x="215" y="157" fill="#fecaca" font-size="23">복구 불가능한 변경을 감지했습니다</text>
    </g>
    <g transform="translate(850 282)" filter="url(#shadow)">
      <path d="M130 0 250 42v103c0 105-72 164-120 185C82 309 10 250 10 145V42Z" fill="url(#shield)"/>
      <path d="m73 153 37 38 80-91" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="275" text-anchor="middle" fill="#dbeafe" font-size="34" font-weight="900">dcg</text>
    </g>
