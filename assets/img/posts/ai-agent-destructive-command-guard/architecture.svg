<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">에이전트 명령 차단 계층</title><desc id="desc">스킬 검사, 실행 전 명령 훅, 샌드박스, 최소 권한이 겹쳐 위험을 줄이는 구조</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081525"/><stop offset="1" stop-color="#172033"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <text x="60" y="72" fill="#f8fafc" font-size="38" font-weight="800">한 가지 방어선으로는 충분하지 않다</text>
    <text x="60" y="112" fill="#94a3b8" font-size="21">신뢰 대상 · 현재 실행 · 영향 범위를 서로 다른 계층에서 통제한다</text>
    <g transform="translate(55 175)">
      <rect width="230" height="250" rx="18" fill="#15223a" stroke="#8b5cf6" stroke-width="3"/>
      <circle cx="115" cy="67" r="34" fill="#8b5cf6" opacity=".2"/><text x="115" y="79" text-anchor="middle" fill="#c4b5fd" font-size="35">1</text>
      <text x="115" y="137" text-anchor="middle" fill="#f8fafc" font-size="27" font-weight="800">스킬 검사</text>
      <text x="115" y="178" text-anchor="middle" fill="#cbd5e1" font-size="19">무엇을 신뢰할까?</text>
      <text x="115" y="213" text-anchor="middle" fill="#a78bfa" font-size="17">공급망 · 프롬프트</text>
    </g>
    <path d="M300 300H365" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(380 155)">
      <rect width="260" height="290" rx="20" fill="#102c3d" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="130" cy="72" r="38" fill="#38bdf8" opacity=".22"/><text x="130" y="85" text-anchor="middle" fill="#7dd3fc" font-size="39">2</text>
      <text x="130" y="151" text-anchor="middle" fill="#f8fafc" font-size="29" font-weight="900">명령 훅 · dcg</text>
      <text x="130" y="195" text-anchor="middle" fill="#dbeafe" font-size="19">지금 실행해도 될까?</text>
      <rect x="34" y="226" width="192" height="40" rx="20" fill="#ef4444" opacity=".9"/><text x="130" y="253" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">실행 직전 차단</text>
    </g>
    <path d="M655 300H720" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(735 175)">
      <rect width="230" height="250" rx="18" fill="#15223a" stroke="#22c55e" stroke-width="3"/>
      <circle cx="115" cy="67" r="34" fill="#22c55e" opacity=".2"/><text x="115" y="79" text-anchor="middle" fill="#86efac" font-size="35">3</text>
      <text x="115" y="137" text-anchor="middle" fill="#f8fafc" font-size="27" font-weight="800">샌드박스</text>
      <text x="115" y="178" text-anchor="middle" fill="#cbd5e1" font-size="19">어디까지 미칠까?</text>
      <text x="115" y="213" text-anchor="middle" fill="#86efac" font-size="17">격리 · egress · 자원</text>
    </g>
    <path d="M980 300H1040" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1015 205)"><rect width="140" height="190" rx="18" fill="#33221a" stroke="#f59e0b" stroke-width="3"/><text x="70" y="65" text-anchor="middle" fill="#fcd34d" font-size="25" font-weight="800">IAM</text><text x="70" y="105" text-anchor="middle" fill="#fde68a" font-size="17">최소 권한</text><text x="70" y="140" text-anchor="middle" fill="#fde68a" font-size="17">최종 경계</text></g>
    <g transform="translate(60 515)">
      <rect width="1080" height="130" rx="18" fill="#0f172a" stroke="#334155"/>
      <text x="35" y="45" fill="#f8fafc" font-size="22" font-weight="800">핵심 원칙</text>
      <text x="35" y="82" fill="#cbd5e1" font-size="20">dcg는 우발적 파괴를 줄이는 안전벨트다. 적대적 코드 격리나 클라우드 권한 검증을 대신하지 않는다.</text>
      <text x="35" y="111" fill="#7dd3fc" font-size="18">Skill scan + pre-execution hook + sandbox + least privilege</text>
    </g>
  </g>
</svg>
